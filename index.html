<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditory Differentiation & Speech Trainer</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#141923">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --label-color: #555555;
            --input-bg: #ffffff;
            --input-border: #cccccc;
            --word-box-bg: #e9ecef;
            --option-btn-bg: #ffffff;
            --option-btn-text: #007bff;
            --option-btn-border: #007bff;
            --option-btn-hover: #e7f1ff;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --label-color: #aaaaaa;
            --input-bg: #2d2d2d;
            --input-border: #444444;
            --word-box-bg: #2a2a2a;
            --option-btn-bg: #2d2d2d;
            --option-btn-text: #4da3ff;
            --option-btn-border: #4da3ff;
            --option-btn-hover: #384756;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px var(--shadow);
            text-align: center;
            box-sizing: border-box;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }
        h1 {
            color: var(--text-color);
            font-size: 18px;
            margin: 0;
            text-align: left;
            flex-grow: 1;
        }
        .header-btns {
            display: flex;
            gap: 8px;
        }
        .settings-toggle-btn {
            background: var(--option-btn-bg);
            border: 1px solid var(--option-btn-border);
            color: var(--option-btn-text);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            width: auto;
        }
        .controls {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .settings-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: var(--word-box-bg);
            padding: 15px;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .settings-panel.hidden {
            display: none;
        }
        .control-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        label {
            font-weight: bold;
            color: var(--label-color);
            font-size: 14px;
            margin-bottom: 4px;
        }
        select, input[type="range"], button {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            width: 100%;
            box-sizing: border-box;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .slider-container span {
            font-weight: bold;
            color: var(--text-color);
            min-width: 45px;
        }
        .card {
            margin: 15px 0;
            padding: 20px;
            background-color: var(--word-box-bg);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: background-color 0.3s;
        }
        .speak-main-btn {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            padding: 15px;
        }
        .speak-main-btn:hover {
            background-color: #218838;
        }
        .record-btn {
            background-color: #17a2b8;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            padding: 10px;
        }
        .record-btn.recording {
            background-color: #dc3545;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        .speech-result-box {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            box-sizing: border-box;
            margin-top: 5px;
            display: none;
            word-break: break-word;
        }
        .speech-result-box.correct {
            display: block;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .speech-result-box.incorrect {
            display: block;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .speech-result-box.info {
            display: block;
            background-color: #e2e3e5;
            color: #383d41;
            border: 1px solid #d6d8db;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: 15px;
        }
        .option-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .option-btn {
            flex-grow: 1;
            background-color: var(--option-btn-bg);
            border: 2px solid var(--option-btn-border);
            color: var(--option-btn-text);
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            padding: 12px;
            text-align: center;
        }
        .option-btn:hover {
            background-color: var(--option-btn-hover);
        }
        .option-btn.correct {
            background-color: #28a745 !important;
            color: white !important;
            border-color: #28a745 !important;
        }
        .option-btn.wrong {
            background-color: #dc3545 !important;
            color: white !important;
            border-color: #dc3545 !important;
        }
        .audio-btn {
            width: 50px;
            flex-shrink: 0;
            background-color: #17a2b8;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .audio-btn:hover {
            background-color: #138496;
        }
        .next-btn {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
        .stats-row {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }
        .stat-box {
            flex: 1;
            background-color: var(--word-box-bg);
            border-radius: 8px;
            padding: 10px;
            font-weight: bold;
            font-size: 15px;
        }
        .stat-box.correct-stat {
            color: #28a745;
        }
        .stat-box.total-stat {
            color: var(--option-btn-text);
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: var(--label-color);
            font-size: 14px;
            cursor: pointer;
        }
        .checkbox-label input[type="checkbox"] {
            width: auto;
            padding: 0;
        }
        .timer-inputs {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .timer-inputs > div {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .timer-inputs label {
            margin-bottom: 2px;
            font-size: 12px;
        }
        .timer-status-row {
            display: flex;
            gap: 10px;
            width: 100%;
            align-items: center;
        }
        .timer-display {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            background-color: var(--word-box-bg);
            font-weight: bold;
            text-align: center;
            font-size: 15px;
            transition: background-color 0.3s, color 0.3s;
        }
        .timer-display.resting {
            background-color: #ffc107;
            color: #333333;
        }
        .timer-pause-btn {
            width: auto;
            flex-shrink: 0;
            background-color: var(--option-btn-bg);
            color: var(--option-btn-text);
            border: 2px solid var(--option-btn-border);
            font-weight: bold;
            padding: 10px 14px;
        }
        .container.resting-blocked {
            pointer-events: none;
            opacity: 0.5;
        }
        .rest-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }
        .rest-overlay.hidden {
            display: none;
        }
        .rest-overlay-content {
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        .rest-overlay-content .rest-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .rest-overlay-content h2 {
            margin: 0 0 10px 0;
            color: var(--text-color);
        }
        .rest-overlay-content p {
            font-size: 18px;
            margin: 10px 0 20px 0;
        }
        .rest-overlay-content button {
            background-color: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .spell-builder-card {
            margin-top: 15px;
            padding: 15px;
            background-color: var(--word-box-bg);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .spell-builder-card.hidden {
            display: none;
        }
        .letters-pool, .letters-target {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            min-height: 45px;
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
        }
        .letters-target {
            border: 2px dashed var(--option-btn-border);
            border-radius: 8px;
            background: var(--card-bg);
        }
        .letter-tile {
            background-color: var(--option-btn-bg);
            border: 2px solid var(--option-btn-border);
            color: var(--option-btn-text);
            font-weight: bold;
            font-size: 22px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }
        .syllable-display {
            font-size: 20px;
            font-weight: bold;
            color: #28a745;
            margin-top: 5px;
            letter-spacing: 1px;
        }
        .accent-char {
            color: #ff9800;
            text-decoration: underline;
            font-weight: bold;
        }

        /* ---- Помощь при афазии: подсказки, эмодзи, мягкий режим ---- */
        .assist-row { display: flex; gap: 8px; width: 100%; }
        .assist-btn {
            flex: 1;
            background-color: #6f42c1;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            padding: 10px;
        }
        .assist-btn.hint { background-color: #fd7e14; }
        .hint-box, .feedback-msg {
            width: 100%;
            box-sizing: border-box;
            border-radius: 6px;
            padding: 10px;
            font-size: 18px;
            font-weight: bold;
            display: none;
            word-break: break-word;
        }
        .hint-box { background-color: #fff3cd; color: #664d03; border: 1px solid #ffe69c; }
        .feedback-msg.praise { display: block; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .feedback-msg.retry { display: block; background-color: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }
        .opt-emoji {
            font-size: 30px;
            min-width: 44px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .word-emoji-big { font-size: 64px; line-height: 1.1; text-align: center; }
        .option-btn.eliminated { opacity: 0.25; pointer-events: none; }
        .option-btn.hint-glow { box-shadow: 0 0 0 4px #ffc107; }
        body.gentle-mode .stat-box.total-stat { display: none; }
    </style>
</head>
<body>

<div id="restOverlay" class="rest-overlay hidden">
    <div class="rest-overlay-content">
        <div class="rest-icon">☕</div>
        <h2 id="restTitle">Rest Time</h2>
        <p><span id="restLeftLabel">Remaining:</span> <span id="restTimeLeft">10:00</span></p>
        <button id="skipRestBtn" onclick="skipRest()">Resume Game Now</button>
    </div>
</div>

<div class="container">
    <div class="header-row">
        <h1 id="appTitle">Auditory Differentiation</h1>
        <div class="header-btns">
            <button class="settings-toggle-btn" id="settingsBtn" onclick="toggleSettingsPanel()">⚙️ Settings</button>
        </div>
    </div>

    <!-- Panel Settings -->
    <div class="settings-panel hidden" id="settingsPanel">
        <div class="control-group">
            <label id="labelLang">Language / Мова / Язык:</label>
            <button class="lang-toggle-btn" id="langBtn" onclick="toggleLanguage()">🌐 EN</button>
        </div>

        <div class="control-group">
            <label id="labelTheme">Theme:</label>
            <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()">☀️ Light</button>
        </div>

        <div class="control-group">
            <label for="optionsCountSelect" id="labelOptionsCount">Number of Answer Options:</label>
            <select id="optionsCountSelect" onchange="onOptionsCountChange()">
                <option value="2" selected id="optEasy">2 options (Easy)</option>
                <option value="3" id="optMedium">3 options (Medium)</option>
                <option value="4" id="optHard">4 options (Hard)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="voiceSelect" id="labelVoice">Voice / Голос:</label>
            <select id="voiceSelect" onchange="saveSettings()">
                <!-- Populated dynamically based on device voices -->
            </select>
        </div>

        <div class="control-group">
            <label for="rateRange" id="labelRate">Speech Speed:</label>
            <div class="slider-container">
                <input type="range" id="rateRange" min="0.5" max="1.5" step="0.1" value="0.7" oninput="updateRateLabel(this.value)" onchange="saveSettings()">
                <span id="rateValue">0.7x</span>
            </div>
        </div>

        <div class="control-group">
            <label class="checkbox-label" for="gentleMode">
                <input type="checkbox" id="gentleMode" checked onchange="onAssistSettingChange()">
                <span id="labelGentle">Gentle mode</span>
            </label>
        </div>

        <div class="control-group">
            <label class="checkbox-label" for="emojiEnabled">
                <input type="checkbox" id="emojiEnabled" checked onchange="onAssistSettingChange()">
                <span id="labelEmoji">Show pictures (emoji)</span>
            </label>
        </div>

        <div class="control-group">
            <label class="checkbox-label" for="autoSpeak">
                <input type="checkbox" id="autoSpeak" checked onchange="onAssistSettingChange()">
                <span id="labelAutoSpeak">Speak new word automatically</span>
            </label>
        </div>

        <div class="control-group">
            <label class="checkbox-label" for="timerEnabled">
                <input type="checkbox" id="timerEnabled" checked onchange="toggleTimerFeature()">
                <span id="labelTimerEnable">Use "Play / Rest" timer</span>
            </label>
        </div>

        <div class="control-group" id="timerSettingsGroup">
            <label id="labelTimerDuration">Duration (minutes):</label>
            <div class="timer-inputs">
                <div>
                    <label for="playMinutes" id="labelPlayMin">🎮 Play</label>
                    <input type="number" id="playMinutes" min="1" max="60" value="5" onchange="updateTimerSettings()">
                </div>
                <div>
                    <label for="restMinutes" id="labelRestMin">☕ Rest</label>
                    <input type="number" id="restMinutes" min="1" max="60" value="10" onchange="updateTimerSettings()">
                </div>
            </div>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-box correct-stat"><span id="statCorrectLabel">✅ Correct:</span> <span id="correctCount">0</span></div>
        <div class="stat-box total-stat"><span id="statTotalLabel">📝 Total:</span> <span id="totalCount">0</span></div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="categorySelect" id="labelCategory">Select Category:</label>
            <select id="categorySelect" onchange="changeCategory()">
                <!-- Categories -->
            </select>
        </div>

        <div class="control-group">
            <div class="timer-status-row">
                <div class="timer-display" id="timerDisplay">🎮 Play: 05:00</div>
                <button class="timer-pause-btn" id="timerPauseBtn" onclick="toggleTimerPause()">⏸ Pause</button>
            </div>
        </div>
    </div>

    <div class="card">
        <button class="speak-main-btn" id="speakMainBtn" onclick="speakWord(targetWordSyllables)">🔊 Listen to the target word</button>
        <button class="record-btn" id="recordBtn" onclick="toggleRecording()">🎙 Pronounce and check yourself</button>
        <div class="assist-row">
            <button class="assist-btn" id="syllablesBtn" onclick="speakSyllables(targetWordSyllables)">🐢 By syllables</button>
            <button class="assist-btn hint" id="hintBtn" onclick="showHint()">💡 Hint</button>
        </div>
        <div id="hintBox" class="hint-box"></div>
        <div id="feedbackMsg" class="feedback-msg"></div>
        <div id="speechResultBox" class="speech-result-box"></div>
    </div>

    <label id="labelInstruction">Select the word you heard (all options are real words):</label>
    <div class="options-grid" id="optionsContainer">
        <!-- Answer options -->
    </div>

    <div class="spell-builder-card hidden" id="spellBuilderCard">
        <div class="word-emoji-big" id="wordEmojiBig"></div>
        <label id="labelSpellTask">Assemble the word from letters (for speech training):</label>
        <div class="letters-target" id="lettersTarget"></div>
        <div class="letters-pool" id="lettersPool"></div>
        <div class="syllable-display" id="syllableDisplay"></div>
    </div>

    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next word ➔</button>
</div>

<script>
    function getDefaultLanguage() {
        const savedLang = localStorage.getItem('app_lang');
        if (savedLang && ['uk', 'ru', 'en'].includes(savedLang)) {
            return savedLang;
        }
        const sysLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
        if (sysLang.startsWith('uk')) {
            return 'uk';
        } else if (sysLang.startsWith('ru')) {
            return 'ru';
        } else {
            return 'en';
        }
    }

    // На Android голоса (`speechSynthesis.getVoices()`) часто не
    // загружаются вовсе, пока движок TTS не будет «разбужен» реальным
    // вызовом speak() после жеста пользователя, а событие onvoiceschanged
    // может вообще ни разу не сработать. Поэтому при первом же клике/тапе
    // по странице делаем один беззвучный вызов speak(), который на
    // большинстве Android-браузеров запускает движок и заставляет его
    // отдать полный список голосов (включая мужские и женские) при
    // последующих вызовах getVoices().
    function warmupSpeechSynthesis() {
        if (speechWarmedUp) return;
        if (!('speechSynthesis' in window)) return;
        speechWarmedUp = true;

        try {
            const warm = new SpeechSynthesisUtterance(' ');
            warm.volume = 0;
            window.speechSynthesis.speak(warm);
            window.speechSynthesis.cancel();
        } catch (e) {
            console.warn('Speech warmup failed:', e);
        }

        // Список голосов на Android нередко заполняется с задержкой уже
        // после «пробуждения» движка, поэтому пробуем перечитать его
        // несколько раз в течение нескольких секунд.
        [300, 800, 1500, 3000, 5000].forEach(delay => {
            setTimeout(() => populateVoiceList(), delay);
        });
    }

    document.addEventListener('click', warmupSpeechSynthesis, { once: true, passive: true });

    // Эвристическое определение пола голоса по его имени. Единого
    // стандарта тут нет: разные производители (Google, Samsung, Microsoft,
    // eSpeak и др.) называют голоса по-разному, поэтому распознаём как
    // явные слова ("Male"/"Female", "мужской"/"женский" и т.п.), так и
    // самые распространённые собственные имена голосов.
    function detectVoiceGender(voice) {
        const name = (voice.name || '').toLowerCase();

        const femaleMarkers = [
            'female', 'женск', 'жіноч', '#female', 'x-female',
            'zira', 'susan', 'samantha', 'victoria', 'karen', 'moira',
            'tessa', 'fiona', 'anna', 'elena', 'milena', 'catherine',
            'salli', 'joanna', 'kimberly', 'ivy', 'kendra', 'olga',
            'milena', 'ekaterina', 'irina', 'oksana', 'lesya', 'natalia'
        ];
        const maleMarkers = [
            'male', 'мужск', 'чоловіч', '#male', 'x-male',
            'david', 'mark', 'daniel', 'george', 'fred', 'alex',
            'yuri', 'pavel', 'dmitri', 'dmytro', 'matthew', 'joey',
            'justin', 'ravi', 'oleg', 'ostap', 'mykyta'
        ];

        if (femaleMarkers.some(m => name.includes(m))) return 'female';
        if (maleMarkers.some(m => name.includes(m))) return 'male';
        return null;
    }

    function populateVoiceList(attemptsLeft) {
        if (!('speechSynthesis' in window)) return;
        if (attemptsLeft === undefined) attemptsLeft = 30;

        const voiceSelect = document.getElementById('voiceSelect');
        const savedVoiceURI = localStorage.getItem('app_voice');
        const voices = window.speechSynthesis.getVoices();

        // На многих мобильных браузерах (особенно на Android) голоса
        // подгружаются с задержкой, а событие onvoiceschanged не всегда
        // срабатывает. Поэтому вместо того, чтобы полагаться только на
        // это событие, повторяем попытку ещё несколько раз с небольшой
        // паузой (в сумме до ~9 секунд).
        if (voices.length === 0 && attemptsLeft > 0) {
            clearTimeout(voiceListRetryTimer);
            voiceListRetryTimer = setTimeout(() => populateVoiceList(attemptsLeft - 1), 300);
            return;
        }

        const previousValue = voiceSelect.value;
        voiceSelect.innerHTML = '';

        let langVoices = voices.filter(v => {
            const vLang = v.lang.toLowerCase().replace('_', '-');
            return vLang.startsWith(currentLang);
        });

        if (langVoices.length === 0) {
            langVoices = voices;
        }

        if (langVoices.length === 0) {
            const opt = document.createElement('option');
            opt.value = "";
            opt.innerText = "Default System Voice";
            voiceSelect.appendChild(opt);
            return;
        }

        const t = i18n[currentLang];
        const genderLabels = {
            female: t.voiceGenderFemale,
            male: t.voiceGenderMale,
            other: t.voiceGenderOther
        };

        const groups = { female: [], male: [], other: [] };
        langVoices.forEach(v => {
            const gender = detectVoiceGender(v) || 'other';
            groups[gender].push(v);
        });

        // Группируем по полу (Женские / Мужские / Другие) только тогда,
        // когда удалось определить хотя бы один мужской или женский голос
        // — иначе просто выводим плоский список, как раньше.
        const hasGenderInfo = groups.female.length > 0 || groups.male.length > 0;

        const appendOption = (container, v) => {
            const opt = document.createElement('option');
            opt.value = v.voiceURI;
            opt.innerText = `${v.name} (${v.lang})`;
            container.appendChild(opt);
        };

        if (hasGenderInfo) {
            ['female', 'male', 'other'].forEach(gender => {
                if (groups[gender].length === 0) return;
                const optgroup = document.createElement('optgroup');
                optgroup.label = genderLabels[gender];
                groups[gender].forEach(v => appendOption(optgroup, v));
                voiceSelect.appendChild(optgroup);
            });
        } else {
            langVoices.forEach(v => appendOption(voiceSelect, v));
        }

        if (savedVoiceURI && Array.from(voiceSelect.options).some(o => o.value === savedVoiceURI)) {
            voiceSelect.value = savedVoiceURI;
        } else if (previousValue && Array.from(voiceSelect.options).some(o => o.value === previousValue)) {
            voiceSelect.value = previousValue;
        } else {
            voiceSelect.value = langVoices[0].voiceURI;
        }
    }

    function generateOptions(targetSyllables) {
        const targetClean = cleanWord(targetSyllables);
        const options = [targetSyllables];
        const allPool = getAllWordsFromDictionary();
        const activePairs = getActiveRealWordPairs();

        if (activePairs[targetClean]) {
            const pairs = activePairs[targetClean];
            const shuffledPairs = [...pairs].sort(() => 0.5 - Math.random());
            for (let w of shuffledPairs) {
                if (options.length >= optionsCount) break;
                if (!options.some(o => cleanWord(o).toLowerCase() === cleanWord(w).toLowerCase())) {
                    options.push(w);
                }
            }
        }

        let attempts = 0;
        while (options.length < optionsCount && attempts < 100) {
            attempts++;
            const randomSyllables = allPool[Math.floor(Math.random() * allPool.length)];
            const randomClean = cleanWord(randomSyllables);
            
            if (!options.some(o => cleanWord(o).toLowerCase() === randomClean.toLowerCase())) {
                options.push(randomSyllables);
            }
        }

        return options.sort(() => 0.5 - Math.random());
    }

    // Индекс ключей таблицы ударений без пробелов: блок со слогами убирает
    // пробелы из слова, поэтому многословные записи ("thank you",
    // "будь ласка") иначе не находились.
    const accentKeyIndex = {};

    function getPhoneticRepresentation(wordClean) {
        const key = wordClean.toLowerCase();
        const table = accentFixes[currentLang];
        if (!table) return null;
        if (table[key]) return table[key];

        if (!accentKeyIndex[currentLang]) {
            const idx = {};
            Object.keys(table).forEach(k => { idx[k.replace(/\s+/g, '')] = k; });
            accentKeyIndex[currentLang] = idx;
        }
        const realKey = accentKeyIndex[currentLang][key.replace(/\s+/g, '')];
        return realKey ? table[realKey] : null;
    }

    const wordEmoji = {};
    Object.keys(emojiData).forEach(l => {
        wordEmoji[l] = {};
        emojiData[l].split(';').forEach(pair => {
            const i = pair.indexOf('=');
            if (i > 0) wordEmoji[l][pair.slice(0, i).trim()] = pair.slice(i + 1).trim();
        });
    });

    function isChecked(id) {
        const el = document.getElementById(id);
        return !!(el && el.checked);
    }

    function getWordEmoji(word) {
        if (!isChecked('emojiEnabled')) return '';
        const table = wordEmoji[currentLang] || {};
        return table[cleanWord(word).toLowerCase()] || '';
    }

    function applyAssistSettings() {
        document.body.classList.toggle('gentle-mode', isChecked('gentleMode'));
    }

    function onAssistSettingChange() {
        applyAssistSettings();
        saveSettings();
        // Перерисовать варианты, чтобы эмодзи сразу появились/исчезли.
        if (targetWordSyllables && !isAnswered) {
            const cur = Array.from(document.querySelectorAll('.option-row .option-btn')).map(b => b.innerText);
            const words = getAllWordsFromDictionary();
            const restored = cur.map(txt => words.find(w => cleanWord(w).toLowerCase() === txt.toLowerCase()) || txt);
            renderOptions(restored);
        }
    }

    // Общая настройка голоса/скорости для дополнительных фраз (слоги).
    function makeUtterance(text, rateMul) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = currentLang === 'uk' ? 'uk-UA' : (currentLang === 'ru' ? 'ru-RU' : 'en-US');
        const baseRate = parseFloat(document.getElementById('rateRange').value) || 0.7;
        u.rate = Math.max(0.3, Math.min(2, baseRate * (rateMul || 1)));
        const voices = window.speechSynthesis.getVoices();
        if (voices.length > 0) {
            const uri = document.getElementById('voiceSelect').value;
            let v = voices.find(x => x.voiceURI === uri);
            if (!v) v = voices.find(x => x.lang.toLowerCase().replace('_', '-').startsWith(currentLang));
            if (v) u.voice = v;
        }
        return u;
    }

    let syllableSpeechToken = 0;

    // Произносит слово по слогам с паузами, затем целиком. На Android событие
    // onend срабатывает не всегда, поэтому есть запасной таймер.
    function speakSyllables(syllableWord) {
        if (!('speechSynthesis' in window) || !syllableWord) return;
        warmupSpeechSynthesis();
        window.speechSynthesis.cancel();
        const token = ++syllableSpeechToken;

        const parts = syllableWord.split('-').map(x => x.trim()).filter(Boolean);
        const clean = cleanWord(syllableWord);
        const whole = getPhoneticRepresentation(clean) || clean;
        const queue = parts.map(x => ({ text: x.toLowerCase(), mul: 0.8, pause: 350 }));
        queue.push({ text: whole, mul: 0.9, pause: 0 });

        const next = (i) => {
            if (token !== syllableSpeechToken || i >= queue.length) return;
            const item = queue[i];
            const u = makeUtterance(item.text, item.mul);
            let done = false;
            const go = () => {
                if (done) return;
                done = true;
                setTimeout(() => next(i + 1), item.pause);
            };
            u.onend = go;
            u.onerror = go;
            window.speechSynthesis.speak(u);
            setTimeout(go, Math.max(1200, item.text.length * 450));
        };
        next(0);
    }

        hintLevel = 0;
        const box = document.getElementById('hintBox');
        if (box) { box.style.display = 'none'; box.innerHTML = ''; }
        document.querySelectorAll('.option-btn.hint-glow').forEach(b => b.classList.remove('hint-glow'));
    }

    // Подсказки по нарастающей: 1) первый слог, 2) слово по слогам, 3) правильный вариант.
    function showHint() {
        if (!targetWordSyllables) return;
        const t = i18n[currentLang];
        const box = document.getElementById('hintBox');
        const parts = targetWordSyllables.split('-');
        hintLevel = Math.min(hintLevel + 1, 3);
        box.style.display = 'block';

        if (hintLevel === 1) {
            box.innerText = t.hintStarts + parts[0] + '…';
            warmupSpeechSynthesis();
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(makeUtterance(parts[0].toLowerCase(), 0.8));
        } else if (hintLevel === 2) {
            box.innerHTML = t.hintSyllables + formatWordWithAccents(parts.join(' • '));
            speakSyllables(targetWordSyllables);
        } else {
            box.innerText = t.hintAnswer;
            const targetClean = cleanWord(targetWordSyllables).toLowerCase();
            document.querySelectorAll('.option-btn').forEach(b => {
                if (b.innerText.toLowerCase() === targetClean) b.classList.add('hint-glow');
            });
            speakWord(targetWordSyllables);
        }
    }

    function showFeedback(kind) {
        const el = document.getElementById('feedbackMsg');
        const t = i18n[currentLang];
        if (kind === 'praise') {
            const list = t.praiseMsgs;
            el.innerText = list[Math.floor(Math.random() * list.length)];
        } else {
            el.innerText = t.retryMsg;
        }
        el.className = 'feedback-msg ' + kind;
    }

    function clearFeedback() {
        const el = document.getElementById('feedbackMsg');
        if (el) { el.className = 'feedback-msg'; el.innerText = ''; }
    }

    function vibrateShort(ms) {
        try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
    }

    function updateStatsUI() {
        document.getElementById('correctCount').innerText = correctCount;
        document.getElementById('totalCount').innerText = totalCount;
    }

    // Мягкий режим: без красных «ошибок». Неверный вариант просто гаснет,
    // слово озвучивается снова, пока человек не найдёт правильный ответ.
    function checkAnswerGentle(selectedSyllables, btnElement) {
        const selectedClean = cleanWord(selectedSyllables).toLowerCase();
        const targetClean = cleanWord(targetWordSyllables).toLowerCase();

        if (selectedClean === targetClean) {
            isAnswered = true;
            totalCount++;
            correctCount++;
            btnElement.classList.add('correct');
            btnElement.classList.remove('hint-glow');
            showFeedback('praise');
            vibrateShort(60);
            updateStatsUI();
            setupSpellBuilder(targetWordSyllables);
        } else {
            btnElement.classList.add('eliminated');
            btnElement.disabled = true;
            showFeedback('retry');
            speakWord(targetWordSyllables);
        }
    }

    function speakWord(syllableWord) {
        if (!('speechSynthesis' in window)) {
            alert("TTS is not supported in this browser.");
            return;
        }

        warmupSpeechSynthesis();
        window.speechSynthesis.cancel();

        const wordClean = cleanWord(syllableWord);
        const phoneticText = getPhoneticRepresentation(wordClean) || wordClean;
        const utterance = new SpeechSynthesisUtterance(phoneticText);

        if (currentLang === 'uk') utterance.lang = 'uk-UA';
        else if (currentLang === 'ru') utterance.lang = 'ru-RU';
        else utterance.lang = 'en-US';

        const rate = parseFloat(document.getElementById('rateRange').value) || 0.9;
        utterance.rate = rate;

        const selectedVoiceURI = document.getElementById('voiceSelect').value;
        const voices = window.speechSynthesis.getVoices();
        
        if (voices.length > 0) {
            let targetVoice = voices.find(v => v.voiceURI === selectedVoiceURI);
            if (!targetVoice) {
                targetVoice = voices.find(v => v.lang.toLowerCase().replace('_', '-').startsWith(currentLang));
            }
            if (targetVoice) utterance.voice = targetVoice;
        }

        window.speechSynthesis.speak(utterance);
    }

    function formatWordWithAccents(syllableWord) {
        const wordClean = syllableWord
            .replace(/-/g, '')
            .replace(/\s*•\s*/g, '')
            .replace(/\s+/g, '')
            .trim();

        const phonetic = getPhoneticRepresentation(wordClean);

        if (!phonetic) {
            return syllableWord;
        }

        let accentIdx = -1;
        let letterIdx = 0;

        for (let i = 0; i < phonetic.length; i++) {
            const char = phonetic[i];
            if (char === '\u0301') {
                accentIdx = Math.max(0, letterIdx - 1);
                break;
            }

            if (/[\p{L}\p{N}]/u.test(char)) {
                if (accentIdx === -1 && char === char.toUpperCase() && char.toLowerCase() !== char.toUpperCase()) {
                    accentIdx = letterIdx;
                }
                letterIdx++;
            }
        }

        if (accentIdx === -1) {
            return syllableWord;
        }

        let resultHTML = "";
        let cleanCounter = 0;

        for (let i = 0; i < syllableWord.length; i++) {
            const char = syllableWord[i];
            if (/[\p{L}\p{N}]/u.test(char)) {
                if (cleanCounter === accentIdx) {
                    resultHTML += `<span class="accent-char">${char}</span>`;
                } else {
                    resultHTML += char;
                }
                cleanCounter++;
            } else {
                resultHTML += char;
            }
        }

        return resultHTML;
    }

    function renderOptions(options) {
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';

        options.forEach(optSyllables => {
            const row = document.createElement('div');
            row.className = 'option-row';

            const emoji = getWordEmoji(optSyllables);
            if (emoji) {
                const emojiSpan = document.createElement('span');
                emojiSpan.className = 'opt-emoji';
                emojiSpan.innerText = emoji;
                row.appendChild(emojiSpan);
            }

            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = cleanWord(optSyllables);
            btn.onclick = () => checkAnswer(optSyllables, btn);

            const audioBtn = document.createElement('button');
            audioBtn.className = 'audio-btn';
            audioBtn.innerHTML = '🔊';
            audioBtn.title = 'Listen option';
            audioBtn.onclick = (e) => {
                e.stopPropagation();
                speakWord(optSyllables);
            };

            row.appendChild(btn);
            row.appendChild(audioBtn);
            container.appendChild(row);
        });
    }

    function checkAnswer(selectedSyllables, btnElement) {
        if (isAnswered) return;
        if (isChecked('gentleMode')) {
            checkAnswerGentle(selectedSyllables, btnElement);
            return;
        }
        isAnswered = true;

        totalCount++;
        const selectedClean = cleanWord(selectedSyllables).toLowerCase();
        const targetClean = cleanWord(targetWordSyllables).toLowerCase();

        if (selectedClean === targetClean) {
            correctCount++;
            btnElement.classList.add('correct');
        } else {
            btnElement.classList.add('wrong');
            const rows = document.querySelectorAll('.option-row');
            rows.forEach(r => {
                const b = r.querySelector('.option-btn');
                if (b && b.innerText.toLowerCase() === targetClean) {
                    b.classList.add('correct');
                }
            });
        }

        document.getElementById('correctCount').innerText = correctCount;
        document.getElementById('totalCount').innerText = totalCount;

        setupSpellBuilder(targetWordSyllables);
    }

    function setupSpellBuilder(syllableWord) {
        const card = document.getElementById('spellBuilderCard');
        card.classList.remove('hidden');

        const syllablesArr = syllableWord.split('-');
        const t = i18n[currentLang];
        const formattedSyllables = syllablesArr.join(' • ');
        document.getElementById('syllableDisplay').innerHTML = t.syllablePrefix + formatWordWithAccents(formattedSyllables);
        document.getElementById('wordEmojiBig').innerText = getWordEmoji(syllableWord);

        const clean = cleanWord(syllableWord);
        const letters = clean.split('');
        const shuffledLetters = [...letters].sort(() => 0.5 - Math.random());

        selectedLetters = [];
        renderSpellTiles(shuffledLetters);
    }

    function renderSpellTiles(poolLetters) {
        const poolContainer = document.getElementById('lettersPool');
        const targetContainer = document.getElementById('lettersTarget');

        poolContainer.innerHTML = '';
        targetContainer.innerHTML = '';

        selectedLetters.forEach((char, index) => {
            const tile = document.createElement('div');
            tile.className = 'letter-tile';
            tile.innerText = char;
            tile.onclick = () => {
                const removedChar = selectedLetters.splice(index, 1)[0];
                poolLetters.push(removedChar);
                renderSpellTiles(poolLetters);
            };
            targetContainer.appendChild(tile);
        });

        poolLetters.forEach((char, index) => {
            const tile = document.createElement('div');
            tile.className = 'letter-tile';
            tile.innerText = char;
            tile.onclick = () => {
                selectedLetters.push(char);
                poolLetters.splice(index, 1);
                renderSpellTiles(poolLetters);
                checkSpellResult();
            };
            poolContainer.appendChild(tile);
        });
    }

    function checkSpellResult() {
        const assembled = selectedLetters.join('');
        if (assembled.toLowerCase() === targetWordClean.toLowerCase()) {
            speakWord(targetWordSyllables);
        }
    }

    function nextQuestion() {
        isAnswered = false;
        resetHint();
        clearFeedback();
        document.getElementById('speechResultBox').className = 'speech-result-box';
        document.getElementById('speechResultBox').innerText = '';
        document.getElementById('spellBuilderCard').classList.add('hidden');

        targetWordSyllables = getRandomWord();
        targetWordClean = cleanWord(targetWordSyllables);

        const options = generateOptions(targetWordSyllables);
        renderOptions(options);

        if (isChecked('autoSpeak')) {
            setTimeout(() => {
                speakWord(targetWordSyllables);
            }, 300);
        }
    }

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            const box = document.getElementById('speechResultBox');
            box.className = 'speech-result-box info';
            box.innerText = "Speech Recognition API is not supported in this browser.";
            return;
        }

        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            isRecording = true;
            const btn = document.getElementById('recordBtn');
            btn.classList.add('recording');
            btn.innerText = i18n[currentLang].recordBtnStop;
        };

        recognition.onend = () => {
            isRecording = false;
            const btn = document.getElementById('recordBtn');
            btn.classList.remove('recording');
            btn.innerText = i18n[currentLang].recordBtnStart;
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.trim().toLowerCase();
            const targetClean = targetWordClean.toLowerCase();
            const box = document.getElementById('speechResultBox');
            const t = i18n[currentLang];

            if (transcript === targetClean || transcript.includes(targetClean) || targetClean.includes(transcript)) {
                box.className = 'speech-result-box correct';
                box.innerText = t.speechYouSaid + `"${transcript}". ` + t.speechCorrect;
            } else {
                box.className = 'speech-result-box incorrect';
                box.innerText = t.speechYouSaid + `"${transcript}". ` + t.speechIncorrect;
            }
        };

        recognition.onerror = (event) => {
            console.warn("Speech recognition error:", event.error);
            isRecording = false;
            const btn = document.getElementById('recordBtn');
            btn.classList.remove('recording');
            btn.innerText = i18n[currentLang].recordBtnStart;
        };
    }

    function toggleRecording() {
        if (!recognition) {
            initSpeechRecognition();
        }
        if (!recognition) return;

        if (isRecording) {
            recognition.stop();
        } else {
            if (currentLang === 'uk') recognition.lang = 'uk-UA';
            else if (currentLang === 'ru') recognition.lang = 'ru-RU';
            else recognition.lang = 'en-US';

            recognition.start();
        }
    }

    function toggleTimerFeature() {
        const enabled = document.getElementById('timerEnabled').checked;
        const settingsGroup = document.getElementById('timerSettingsGroup');
        const statusRow = document.querySelector('.timer-status-row');

        if (enabled) {
            settingsGroup.style.display = 'flex';
            statusRow.style.display = 'flex';
            startTimer();
        } else {
            settingsGroup.style.display = 'none';
            statusRow.style.display = 'none';
            stopTimer();
        }
        saveSettings();
    }

    function updateTimerSettings() {
        saveSettings();
        resetTimer();
    }

    function resetTimer() {
        stopTimer();
        timerMode = 'play';
        const playMins = parseInt(document.getElementById('playMinutes').value, 10) || 5;
        timerSecondsLeft = playMins * 60;
        updateTimerDisplayUI();
        if (document.getElementById('timerEnabled').checked) {
            startTimer();
        }
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        isTimerRunning = true;
        isTimerPaused = false;
        updateTimerPauseBtnUI();

        timerInterval = setInterval(() => {
            if (isTimerPaused) return;

            timerSecondsLeft--;
            if (timerSecondsLeft <= 0) {
                switchTimerMode();
            }
            updateTimerDisplayUI();
        }, 1000);
    }

    function stopTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = null;
        isTimerRunning = false;
    }

    function toggleTimerPause() {
        isTimerPaused = !isTimerPaused;
        updateTimerPauseBtnUI();
    }

    function updateTimerPauseBtnUI() {
        const btn = document.getElementById('timerPauseBtn');
        const t = i18n[currentLang];
        btn.innerText = isTimerPaused ? t.timerResume : t.timerPause;
    }

    function switchTimerMode() {
        const playMins = parseInt(document.getElementById('playMinutes').value, 10) || 5;
        const restMins = parseInt(document.getElementById('restMinutes').value, 10) || 10;

        if (timerMode === 'play') {
            timerMode = 'rest';
            timerSecondsLeft = restMins * 60;
            showRestOverlay(true);
        } else {
            timerMode = 'play';
            timerSecondsLeft = playMins * 60;
            showRestOverlay(false);
        }
    }

    function skipRest() {
        const playMins = parseInt(document.getElementById('playMinutes').value, 10) || 5;
        timerMode = 'play';
        timerSecondsLeft = playMins * 60;
        showRestOverlay(false);
        updateTimerDisplayUI();
    }

    function showRestOverlay(show) {
        const overlay = document.getElementById('restOverlay');
        const container = document.querySelector('.container');
        if (show) {
            overlay.classList.remove('hidden');
            container.classList.add('resting-blocked');
        } else {
            overlay.classList.add('hidden');
            container.classList.remove('resting-blocked');
        }
    }

    function updateTimerDisplayUI() {
        const display = document.getElementById('timerDisplay');
        const overlayLeft = document.getElementById('restTimeLeft');
        const t = i18n[currentLang];

        const mins = Math.floor(timerSecondsLeft / 60).toString().padStart(2, '0');
        const secs = (timerSecondsLeft % 60).toString().padStart(2, '0');
        const timeStr = `${mins}:${secs}`;

        if (timerMode === 'play') {
            display.innerText = t.timerPlayPrefix + timeStr;
            display.classList.remove('resting');
        } else {
            display.innerText = t.timerRestPrefix + timeStr;
            display.classList.add('resting');
            if (overlayLeft) overlayLeft.innerText = timeStr;
        }
    }

    function saveSettings() {
        localStorage.setItem('app_lang', currentLang);
        const theme = document.documentElement.getAttribute('data-theme') || 'dark';
        localStorage.setItem('app_theme', theme);
        localStorage.setItem('app_options_count', optionsCount);
        localStorage.setItem('app_voice', document.getElementById('voiceSelect').value);
        localStorage.setItem('app_rate', document.getElementById('rateRange').value);
        localStorage.setItem('app_timer_enabled', document.getElementById('timerEnabled').checked);
        localStorage.setItem('app_play_mins', document.getElementById('playMinutes').value);
        localStorage.setItem('app_rest_mins', document.getElementById('restMinutes').value);
        localStorage.setItem('app_category', document.getElementById('categorySelect').value);
        localStorage.setItem('app_gentle', document.getElementById('gentleMode').checked);
        localStorage.setItem('app_emoji', document.getElementById('emojiEnabled').checked);
        localStorage.setItem('app_autospeak', document.getElementById('autoSpeak').checked);
    }

    function loadSettings() {
        const savedTheme = localStorage.getItem('app_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        const savedOptionsCount = localStorage.getItem('app_options_count');
        if (savedOptionsCount) {
            optionsCount = parseInt(savedOptionsCount, 10);
            document.getElementById('optionsCountSelect').value = optionsCount;
        }

        const savedRate = localStorage.getItem('app_rate');
        if (savedRate) {
            document.getElementById('rateRange').value = savedRate;
            updateRateLabel(savedRate);
        }

        const savedTimerEnabled = localStorage.getItem('app_timer_enabled');
        if (savedTimerEnabled !== null) {
            document.getElementById('timerEnabled').checked = (savedTimerEnabled === 'true');
        }

        const savedPlayMins = localStorage.getItem('app_play_mins');
        if (savedPlayMins) document.getElementById('playMinutes').value = savedPlayMins;

        const savedRestMins = localStorage.getItem('app_rest_mins');
        if (savedRestMins) document.getElementById('restMinutes').value = savedRestMins;

        [['app_gentle', 'gentleMode'], ['app_emoji', 'emojiEnabled'], ['app_autospeak', 'autoSpeak']].forEach(([key, id]) => {
            const v = localStorage.getItem(key);
            if (v !== null) document.getElementById(id).checked = (v === 'true');
        });
        applyAssistSettings();
    }

    // Пере-синхронізація мови/словника з localStorage при поверненні до
    // сторінки. На смартфонах повторне «відкриття» гри часто є не повним
    // перезавантаженням, а відновленням замороженої вкладки (bfcache) або
    // поверненням із фону — window.onload при цьому вдруге не спрацьовує,
    // і сторінка може показувати застарілий стан, що не відповідає тому,
    // що реально збережено в налаштуваннях.
    function resyncLanguageAndUI() {
        const storedLang = localStorage.getItem('app_lang');
        if (storedLang && ['uk', 'ru', 'en'].includes(storedLang) && storedLang !== currentLang) {
            currentLang = storedLang;
            updateI18nUI();
            initCategorySelect();
            nextQuestion();
        }
    }

    window.addEventListener('pageshow', (event) => {
        if (event.persisted) {
            resyncLanguageAndUI();
        }
    });

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            resyncLanguageAndUI();
        }
    });

    window.onload = async () => {
        // Запитуємо стійке (persistent) сховище, щоб зменшити ризик того,
        // що мобільна ОС/браузер очистить localStorage із налаштуваннями
        // мови/голосу при нестачі місця чи довгій відсутності активності.
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().catch(() => {});
        }

        loadSettings();
        updateI18nUI();
        initCategorySelect();

        const savedCategory = localStorage.getItem('app_category');
        if (savedCategory) {
            const select = document.getElementById('categorySelect');
            if (Array.from(select.options).some(o => o.value === savedCategory)) {
                select.value = savedCategory;
            }
        }

        toggleTimerFeature();
        nextQuestion();
    };
</script>
</body>
</html>
