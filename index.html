<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Слухова диференціація та Речевий тренажер</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#141923">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --label-color: #555555;
            --input-bg: #ffffff;
            --input-border: #cccccc;
            --word-box-bg: #e9ecef;
            --option-btn-bg: #ffffff;
            --option-btn-text: #007bff;
            --option-btn-border: #007bff;
            --option-btn-hover: #e7f1ff;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --label-color: #aaaaaa;
            --input-bg: #2d2d2d;
            --input-border: #444444;
            --word-box-bg: #2a2a2a;
            --option-btn-bg: #2d2d2d;
            --option-btn-text: #4da3ff;
            --option-btn-border: #4da3ff;
            --option-btn-hover: #384756;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px var(--shadow);
            text-align: center;
            box-sizing: border-box;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }
        h1 {
            color: var(--text-color);
            font-size: 18px;
            margin: 0;
            text-align: left;
            flex-grow: 1;
        }
        .header-btns {
            display: flex;
            gap: 8px;
        }
        .settings-toggle-btn {
            background: var(--option-btn-bg);
            border: 1px solid var(--option-btn-border);
            color: var(--option-btn-text);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            width: auto;
        }
        .controls {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .settings-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: var(--word-box-bg);
            padding: 15px;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .settings-panel.hidden {
            display: none;
        }
        .control-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        label {
            font-weight: bold;
            color: var(--label-color);
            font-size: 14px;
            margin-bottom: 4px;
        }
        select, input[type="range"], button {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            width: 100%;
            box-sizing: border-box;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .slider-container span {
            font-weight: bold;
            color: var(--text-color);
            min-width: 45px;
        }
        .card {
            margin: 15px 0;
            padding: 20px;
            background-color: var(--word-box-bg);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: background-color 0.3s;
        }
        .speak-main-btn {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            padding: 15px;
        }
        .speak-main-btn:hover {
            background-color: #218838;
        }
        .record-btn {
            background-color: #17a2b8;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            padding: 10px;
        }
        .record-btn.recording {
            background-color: #dc3545;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        .speech-result-box {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            box-sizing: border-box;
            margin-top: 5px;
            display: none;
            word-break: break-word;
        }
        .speech-result-box.correct {
            display: block;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .speech-result-box.incorrect {
            display: block;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .speech-result-box.info {
            display: block;
            background-color: #e2e3e5;
            color: #383d41;
            border: 1px solid #d6d8db;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: 15px;
        }
        .option-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .option-btn {
            flex-grow: 1;
            background-color: var(--option-btn-bg);
            border: 2px solid var(--option-btn-border);
            color: var(--option-btn-text);
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            padding: 12px;
            text-align: center;
        }
        .option-btn:hover {
            background-color: var(--option-btn-hover);
        }
        .option-btn.correct {
            background-color: #28a745 !important;
            color: white !important;
            border-color: #28a745 !important;
        }
        .option-btn.wrong {
            background-color: #dc3545 !important;
            color: white !important;
            border-color: #dc3545 !important;
        }
        .audio-btn {
            width: 50px;
            flex-shrink: 0;
            background-color: #17a2b8;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .audio-btn:hover {
            background-color: #138496;
        }
        .next-btn {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
        .stats-row {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }
        .stat-box {
            flex: 1;
            background-color: var(--word-box-bg);
            border-radius: 8px;
            padding: 10px;
            font-weight: bold;
            font-size: 15px;
        }
        .stat-box.correct-stat {
            color: #28a745;
        }
        .stat-box.total-stat {
            color: var(--option-btn-text);
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: var(--label-color);
            font-size: 14px;
            cursor: pointer;
        }
        .checkbox-label input[type="checkbox"] {
            width: auto;
            padding: 0;
        }
        .timer-inputs {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .timer-inputs > div {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .timer-inputs label {
            margin-bottom: 2px;
            font-size: 12px;
        }
        .timer-status-row {
            display: flex;
            gap: 10px;
            width: 100%;
            align-items: center;
        }
        .timer-display {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            background-color: var(--word-box-bg);
            font-weight: bold;
            text-align: center;
            font-size: 15px;
            transition: background-color 0.3s, color 0.3s;
        }
        .timer-display.resting {
            background-color: #ffc107;
            color: #333333;
        }
        .timer-pause-btn {
            width: auto;
            flex-shrink: 0;
            background-color: var(--option-btn-bg);
            color: var(--option-btn-text);
            border: 2px solid var(--option-btn-border);
            font-weight: bold;
            padding: 10px 14px;
        }
        .container.resting-blocked {
            pointer-events: none;
            opacity: 0.5;
        }
        .rest-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }
        .rest-overlay.hidden {
            display: none;
        }
        .rest-overlay-content {
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        .rest-overlay-content .rest-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .rest-overlay-content h2 {
            margin: 0 0 10px 0;
            color: var(--text-color);
        }
        .rest-overlay-content p {
            font-size: 18px;
            margin: 10px 0 20px 0;
        }
        .rest-overlay-content button {
            background-color: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .spell-builder-card {
            margin-top: 15px;
            padding: 15px;
            background-color: var(--word-box-bg);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .spell-builder-card.hidden {
            display: none;
        }
        .letters-pool, .letters-target {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            min-height: 45px;
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
        }
        .letters-target {
            border: 2px dashed var(--option-btn-border);
            border-radius: 8px;
            background: var(--card-bg);
        }
        .letter-tile {
            background-color: var(--option-btn-bg);
            border: 2px solid var(--option-btn-border);
            color: var(--option-btn-text);
            font-weight: bold;
            font-size: 22px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }
        .syllable-display {
            font-size: 20px;
            font-weight: bold;
            color: #28a745;
            margin-top: 5px;
            letter-spacing: 1px;
        }
        .accent-char {
            color: #ff9800;
            text-decoration: underline;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="restOverlay" class="rest-overlay hidden">
    <div class="rest-overlay-content">
        <div class="rest-icon">☕</div>
        <h2 id="restTitle">Час відпочинку</h2>
        <p><span id="restLeftLabel">Залишилося:</span> <span id="restTimeLeft">10:00</span></p>
        <button id="skipRestBtn" onclick="skipRest()">Продовжити гру зараз</button>
    </div>
</div>

<div class="container">
    <div class="header-row">
        <h1 id="appTitle">Слухова диференціація</h1>
        <div class="header-btns">
            <button class="settings-toggle-btn" id="settingsBtn" onclick="toggleSettingsPanel()">⚙️ Налаштування</button>
        </div>
    </div>

    <!-- Панель налаштувань -->
    <div class="settings-panel hidden" id="settingsPanel">
        <div class="control-group">
            <label id="labelLang">Мова інтерфейсу / Язык:</label>
            <button class="lang-toggle-btn" id="langBtn" onclick="toggleLanguage()">🌐 UA / RU</button>
        </div>

        <div class="control-group">
            <label id="labelTheme">Тема оформлення / Тема:</label>
            <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()">☀️ Світла</button>
        </div>

        <div class="control-group">
            <label for="optionsCountSelect" id="labelOptionsCount">Кількість варіантів відповідей:</label>
            <select id="optionsCountSelect" onchange="onOptionsCountChange()">
                <option value="2" selected id="optEasy">2 варіанти (Легко)</option>
                <option value="3" id="optMedium">3 варіанти (Середньо)</option>
                <option value="4" id="optHard">4 варіанти (Складно)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="voiceSelect" id="labelVoice">Стать голосу:</label>
            <select id="voiceSelect" onchange="saveSettings()">
                <option value="male" selected id="optVoiceMale">👨 Чоловічий</option>
                <option value="female" id="optVoiceFemale">👩 Жіночий</option>
            </select>
        </div>

        <div class="control-group">
            <label for="rateRange" id="labelRate">Швидкість мовлення:</label>
            <div class="slider-container">
                <input type="range" id="rateRange" min="0.5" max="1.5" step="0.1" value="0.9" oninput="updateRateLabel(this.value)" onchange="saveSettings()">
                <span id="rateValue">0.9x</span>
            </div>
        </div>

        <div class="control-group">
            <label class="checkbox-label" for="timerEnabled">
                <input type="checkbox" id="timerEnabled" checked onchange="toggleTimerFeature()">
                <span id="labelTimerEnable">Використовувати таймер «гра / відпочинок»</span>
            </label>
        </div>

        <div class="control-group" id="timerSettingsGroup">
            <label id="labelTimerDuration">Тривалість (хвилини):</label>
            <div class="timer-inputs">
                <div>
                    <label for="playMinutes" id="labelPlayMin">🎮 Гра</label>
                    <input type="number" id="playMinutes" min="1" max="60" value="5" onchange="updateTimerSettings()">
                </div>
                <div>
                    <label for="restMinutes" id="labelRestMin">☕ Відпочинок</label>
                    <input type="number" id="restMinutes" min="1" max="60" value="10" onchange="updateTimerSettings()">
                </div>
            </div>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-box correct-stat"><span id="statCorrectLabel">✅ Правильно:</span> <span id="correctCount">0</span></div>
        <div class="stat-box total-stat"><span id="statTotalLabel">📝 Всього:</span> <span id="totalCount">0</span></div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="categorySelect" id="labelCategory">Оберіть категорію:</label>
            <select id="categorySelect" onchange="changeCategory()">
                <!-- Категорії -->
            </select>
        </div>

        <div class="control-group">
            <div class="timer-status-row">
                <div class="timer-display" id="timerDisplay">🎮 Гра: 05:00</div>
                <button class="timer-pause-btn" id="timerPauseBtn" onclick="toggleTimerPause()">⏸ Пауза</button>
            </div>
        </div>
    </div>

    <div class="card">
        <button class="speak-main-btn" id="speakMainBtn" onclick="speakWord(targetWordSyllables)">🔊 Прослухати загадане слово</button>
        <button class="record-btn" id="recordBtn" onclick="toggleRecording()">🎙 Проговорити і перевірити себе</button>
        <div id="speechResultBox" class="speech-result-box"></div>
    </div>

    <label id="labelInstruction">Оберіть слово, яке ви почули (усі варіанти — реальні слова):</label>
    <div class="options-grid" id="optionsContainer">
        <!-- Варіанти відповідей -->
    </div>

    <div class="spell-builder-card hidden" id="spellBuilderCard">
        <label id="labelSpellTask">Зберіть слово з букв (для тренування мовлення):</label>
        <div class="letters-target" id="lettersTarget"></div>
        <div class="letters-pool" id="lettersPool"></div>
        <div class="syllable-display" id="syllableDisplay"></div>
    </div>

    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Наступне слово ➔</button>
</div>

    async function loadAccents() {
        try {
            const response = await fetch('accents.json');
            if (response.ok) {
                accentFixes = await response.json();
            }
        } catch (e) {
            console.warn("Не вдалося завантажити accents.json", e);
        }

    function getRealDistractors(wordSyllables, currentCategory) {
        const countSelect = document.getElementById('optionsCountSelect');
        const reqCount = countSelect ? parseInt(countSelect.value) - 1 : 1;

        const pairs = getCurrentRealPairs();
        if (pairs[wordSyllables]) {
            let pool = [...pairs[wordSyllables]];
            pool.sort(() => Math.random() - 0.5);
            return pool.slice(0, reqCount);
        }

        let allWords = [];
        const dict = getCurrentDict();
        for (let cat in dict) {
            allWords.push(...dict[cat]);
        }

        let cleanWord = stripHyphens(wordSyllables);
        let candidates = allWords.filter(w => {
            let cleanCandidate = stripHyphens(w);
            return cleanCandidate !== cleanWord && 
                   Math.abs(cleanCandidate.length - cleanWord.length) <= 2 &&
                   cleanCandidate.charAt(0).toLowerCase() === cleanWord.charAt(0).toLowerCase();
        });

        if (candidates.length < reqCount) {
            candidates = allWords.filter(w => stripHyphens(w) !== cleanWord && Math.abs(stripHyphens(w).length - cleanWord.length) <= 2);
        }

        candidates.sort(() => Math.random() - 0.5);
        return candidates.slice(0, reqCount);
    }

    const maleVoiceHints = ['pavel', 'dmitry', 'alexander', 'ivan', 'boris', 'vladimir', 'nikolai', 'yuri', 'maxim', 'artem', 'sergey', 'male', 'чоловік', 'муж'];
    const femaleVoiceHints = ['milena', 'elena', 'irina', 'ekaterina', 'katya', 'anna', 'olga', 'tatiana', 'victoria', 'lesya', 'female', 'жінка', 'жен'];

    function classifyVoiceGender(voice) {
        const name = voice.name.toLowerCase();
        if (maleVoiceHints.some(hint => name.includes(hint))) return 'male';
        if (femaleVoiceHints.some(hint => name.includes(hint))) return 'female';
        return 'unknown';
    }

    function populateVoiceList() {
        if (!('speechSynthesis' in window)) return;
        const allVoices = speechSynthesis.getVoices();
        if (!allVoices || allVoices.length === 0) return;
        voices = allVoices;

        const langPrefix = currentLang === 'uk' ? 'uk' : 'ru';
        let targetVoices = voices.filter(v => v.lang.toLowerCase().replace('_', '-').startsWith(langPrefix));
        if (targetVoices.length === 0) targetVoices = voices;

        const male = [], female = [], unknown = [];
        targetVoices.forEach(voice => {
            const gender = classifyVoiceGender(voice);
            if (gender === 'male') male.push(voice);
            else if (gender === 'female') female.push(voice);
            else unknown.push(voice);
        });

        maleVoices = male.length ? male : (unknown.length ? [unknown[0]] : targetVoices.slice(0, 1));
        femaleVoices = female.length ? female : (unknown.length ? [unknown[unknown.length - 1]] : targetVoices.slice(0, 1));
    }

    populateVoiceList();
    if ('speechSynthesis' in window) {
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }
    }

    function speakWord(textToSpeak) {
        if (!textToSpeak || !('speechSynthesis' in window)) return;
        speechSynthesis.cancel();

        let cleanText = stripHyphens(textToSpeak);
        const lowerKey = cleanText.toLowerCase();

        if (accentFixes[currentLang] && accentFixes[currentLang][lowerKey]) {
            cleanText = accentFixes[currentLang][lowerKey];
        }

        populateVoiceList();

        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = currentLang === 'uk' ? 'uk-UA' : 'ru-RU';

        const voiceSelect = document.getElementById('voiceSelect');
        const gender = voiceSelect ? voiceSelect.value : 'male';
        const voicePool = gender === 'female' ? femaleVoices : maleVoices;

        if (voicePool && voicePool.length > 0) {
            utterance.voice = voicePool[0];
        }

        utterance.pitch = gender === 'female' ? 1.25 : 0.85;
        const rateRange = document.getElementById('rateRange');
        utterance.rate = parseFloat(rateRange.value) || 0.9;

        speechSynthesis.speak(utterance);
    }

    // ИСПРАВЛЕННАЯ ФУНКЦИЯ ЗАПИСИ / РАСПОЗНАВАНИЯ ГОЛОСА
    // Важно: распознавание речи и запись через MediaRecorder НЕ запускаются
    // одновременно — на многих устройствах (особенно Android) микрофон может
    // использоваться только одной audio-сессией за раз, и одновременный запуск
    // обеих ломает распознавание. Поэтому сначала пробуем только распознавание;
    // запись+воспроизведение включаются лишь если оно правда не сработало —
    // после того как распознавание полностью освободило микрофон.
    let usingFallback = false;

    async function toggleRecording() {
        if (!isRecording) {
            const resultBox = document.getElementById('speechResultBox');
            resultBox.style.display = 'none';
            resultBox.className = 'speech-result-box';
            usingFallback = false;
            startRecognitionAttempt();
        } else {
            stopEverything();
        }
    }

    function startRecognitionAttempt() {
        const btn = document.getElementById('recordBtn');
        const t = i18n[currentLang];
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            startFallbackAudioRecording();
            return;
        }

        try {
            recognition = new SpeechRecognition();
            recognition.lang = currentLang === 'uk' ? 'uk-UA' : 'ru-RU';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isRecording = true;
                btn.textContent = t.recordBtnStop;
                btn.classList.add('recording');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.trim();
                showRecognizedText(transcript);
            };

            recognition.onerror = (event) => {
                console.warn('Speech recognition error:', event.error);
                lastRecognitionError = event.error;
                usingFallback = true;
                recognition = null;
                // Небольшая пауза перед повторным запросом микрофона — даём
                // браузеру/ОС время полностью освободить устройство записи.
                setTimeout(startFallbackAudioRecording, 250);
            };

            recognition.onend = () => {
                recognition = null;
                if (usingFallback) return; // управление уже перешло к резервной записи
                stopRecordingUI();
            };

            recognition.start();
        } catch (e) {
            console.warn("SpeechRecognition не удалось запустить:", e);
            usingFallback = true;
            startFallbackAudioRecording();
        }
    }

    function showRecognizedText(transcript) {
        const resultBox = document.getElementById('speechResultBox');
        const t = i18n[currentLang];

        const cleanSpoken = transcript.toLowerCase().replace(/[^a-zA-Zа-яА-ЯіІїЇєЄґҐ0-9]/g, '');
        const cleanTarget = (targetWordClean || '').toLowerCase().replace(/[^a-zA-Zа-яА-ЯіІїЇєЄґҐ0-9]/g, '');
        const isMatch = cleanSpoken.length > 0 && cleanSpoken === cleanTarget;

        resultBox.className = 'speech-result-box ' + (isMatch ? 'correct' : 'incorrect');
        resultBox.innerHTML = `<div>${t.speechYouSaid}<strong>"${transcript}"</strong></div><div style="margin-top:4px; font-size:13px;">${isMatch ? t.speechCorrect : t.speechIncorrect}</div>`;
    }

    // Резервная запись через микрофон с авто-воспроизведением —
    // включается только если распознавание речи недоступно/не сработало.
    async function startFallbackAudioRecording() {
        const btn = document.getElementById('recordBtn');
        const resultBox = document.getElementById('speechResultBox');
        const t = i18n[currentLang];

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert(currentLang === 'uk' ? "Ваш браузер не підтримує запис аудіо." : "Ваш браузер не поддерживает запись аудио.");
            stopRecordingUI();
            return;
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const supportedType = (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm'))
                ? 'audio/webm' : '';
            mediaRecorder = supportedType ? new MediaRecorder(stream, { mimeType: supportedType }) : new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                stream.getTracks().forEach(track => track.stop()); // закрываем поток микрофона

                if (audioChunks.length > 0) {
                    const blobType = mediaRecorder.mimeType || 'audio/webm';
                    const audioBlob = new Blob(audioChunks, { type: blobType });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);
                    audio.play().catch(e => console.warn('Playback error:', e));

                    const debugSuffix = lastRecognitionError
                        ? ` <span style="opacity:0.6; font-size:11px;">(${lastRecognitionError})</span>`
                        : '';
                    resultBox.className = 'speech-result-box info';
                    resultBox.innerHTML = `<div>${t.speechRecordedPlay}${debugSuffix}</div>`;
                }
                stopRecordingUI();
            };

            mediaRecorder.start();
            isRecording = true;
            btn.textContent = t.recordBtnStop;
            btn.classList.add('recording');
        } catch (err) {
            console.error("Microphone access error:", err);
            alert(currentLang === 'uk' ? "Помилка доступу до мікрофона. Перевірте дозволи в браузері." : "Ошибка доступа к микрофону. Проверьте разрешения в браузере.");
            stopRecordingUI();
        }
    }

    function stopEverything() {
        if (recognition) {
            try { recognition.stop(); } catch(e){}
        }
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
        }
        if (!recognition && !(mediaRecorder && mediaRecorder.state === "recording")) {
            stopRecordingUI();
        }
    }

    function stopRecordingUI() {
        const btn = document.getElementById('recordBtn');
        const t = i18n[currentLang];
        isRecording = false;
        btn.textContent = t.recordBtnStart;
        btn.classList.remove('recording');
    }

    function updateStatsDisplay() {
        document.getElementById('correctCount').textContent = correctCount;
        document.getElementById('totalCount').textContent = totalCount;
    }

    function formatTime(totalSec) {
        const safeSec = Math.max(0, Math.round(totalSec));
        const m = Math.floor(safeSec / 60).toString().padStart(2, '0');
        const s = Math.floor(safeSec % 60).toString().padStart(2, '0');
        return m + ':' + s;
    }

    function setGameInteractionEnabled(enabled) {
        const container = document.querySelector('.container');
        if (container) container.classList.toggle('resting-blocked', !enabled);
    }

    function updateTimerDisplay() {
        const display = document.getElementById('timerDisplay');
        const t = i18n[currentLang];

        if (display) {
            if (timerMode === 'rest') {
                display.textContent = t.timerRestPrefix + formatTime(remainingSeconds);
                display.classList.add('resting');
            } else {
                display.textContent = t.timerPlayPrefix + formatTime(remainingSeconds);
                display.classList.remove('resting');
            }
        }
        const restTimeLeftEl = document.getElementById('restTimeLeft');
        if (restTimeLeftEl) restTimeLeftEl.textContent = formatTime(remainingSeconds);
    }

    function enterRestMode() {
        timerMode = 'rest';
        remainingSeconds = restSeconds;
        if ('speechSynthesis' in window) speechSynthesis.cancel();
        setGameInteractionEnabled(false);
        document.getElementById('restOverlay').classList.remove('hidden');
        updateTimerDisplay();
    }

    function exitRestMode() {
        timerMode = 'play';
        remainingSeconds = playSeconds;
        setGameInteractionEnabled(true);
        document.getElementById('restOverlay').classList.add('hidden');
        updateTimerDisplay();
        nextQuestion();
    }

    function skipRest() {
        if (timerMode === 'rest') exitRestMode();
    }

    function toggleTimerPause() {
        timerPaused = !timerPaused;
        const t = i18n[currentLang];
        document.getElementById('timerPauseBtn').textContent = timerPaused ? t.timerResume : t.timerPause;
    }

    function toggleTimerFeature() {
        const checkbox = document.getElementById('timerEnabled');
        timerEnabled = checkbox ? checkbox.checked : true;
        document.getElementById('timerSettingsGroup').style.opacity = timerEnabled ? '1' : '0.5';
        document.getElementById('timerPauseBtn').disabled = !timerEnabled;

        if (!timerEnabled && timerMode === 'rest') exitRestMode();
        else { timerMode = 'play'; remainingSeconds = playSeconds; }
        updateTimerDisplay();
        saveSettings();
    }

    function updateTimerSettings() {
        const playMin = parseFloat(document.getElementById('playMinutes').value) || 5;
        const restMin = parseFloat(document.getElementById('restMinutes').value) || 10;
        playSeconds = Math.max(1, playMin) * 60;
        restSeconds = Math.max(1, restMin) * 60;
        remainingSeconds = timerMode === 'rest' ? restSeconds : playSeconds;
        updateTimerDisplay();
        saveSettings();
    }

    function startMasterTimer() {
        updateTimerDisplay();
        setInterval(() => {
            if (!timerEnabled || timerPaused) return;
            remainingSeconds--;
            if (remainingSeconds <= 0) {
                if (timerMode === 'play') enterRestMode();
                else exitRestMode();
            } else {
                updateTimerDisplay();
            }
        }, 1000);
    }

    function initCategories() {
        const categorySelect = document.getElementById('categorySelect');
        categorySelect.innerHTML = '';
        const dict = getCurrentDict();
        const t = i18n[currentLang];

        const allOption = document.createElement('option');
        allOption.value = 'ALL';
        allOption.textContent = t.allCategories;
        categorySelect.appendChild(allOption);

        for (let category in dict) {
            const option = document.createElement('option');
            option.value = category;
            option.textContent = category;
            categorySelect.appendChild(option);
        }

        const savedSettings = localStorage.getItem('aphasiaGameSettings');
        if (savedSettings) {
            const parsed = JSON.parse(savedSettings);
            if (parsed.category && (parsed.category === 'ALL' || dict[parsed.category])) {
                categorySelect.value = parsed.category;
            } else {
                categorySelect.value = 'ALL';
            }
        } else {
            categorySelect.value = 'ALL';
        }

        nextQuestion();
    }

    function changeCategory() {
        saveSettings();
        nextQuestion();
    }

    function onOptionsCountChange() {
        saveSettings();
        nextQuestion();
    }

    function nextQuestion() {
        isAnswered = false;
        document.getElementById('spellBuilderCard').classList.add('hidden');
        const resultBox = document.getElementById('speechResultBox');
        resultBox.style.display = 'none';
        resultBox.className = 'speech-result-box';

        const categorySelect = document.getElementById('categorySelect');
        const selectedCategory = categorySelect.value;
        const dict = getCurrentDict();

        let words;
        if (selectedCategory === 'ALL') {
            const combinedWords = [];
            for (let cat in dict) combinedWords.push(...dict[cat]);
            words = [...new Set(combinedWords)];
        } else {
            words = dict[selectedCategory];
        }

        if (!words || words.length === 0) return;

        targetWordSyllables = words[Math.floor(Math.random() * words.length)];
        targetWordClean = stripHyphens(targetWordSyllables);

        const wrongOptionsSyllables = getRealDistractors(targetWordSyllables, selectedCategory);

        let optionsSyllables = [targetWordSyllables, ...wrongOptionsSyllables];
        optionsSyllables.sort(() => Math.random() - 0.5);

        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';

        optionsSyllables.forEach(syllableText => {
            const cleanText = stripHyphens(syllableText);
            const row = document.createElement('div');
            row.className = 'option-row';

            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = cleanText;
            btn.onclick = () => checkAnswer(btn, cleanText);

            const audioBtn = document.createElement('button');
            audioBtn.className = 'audio-btn';
            audioBtn.innerHTML = '🔊';
            audioBtn.title = currentLang === 'uk' ? 'Прослухати варіант' : 'Прослушать вариант';
            audioBtn.onclick = (e) => {
                e.stopPropagation();
                speakWord(cleanText);
            };

            row.appendChild(btn);
            row.appendChild(audioBtn);
            container.appendChild(row);
        });

        setTimeout(() => speakWord(targetWordClean), 300);
    }

    function checkAnswer(selectedBtn, selectedCleanText) {
        if (isAnswered) return;
        isAnswered = true;

        speakWord(selectedCleanText);
        totalCount++;
        const isCorrect = selectedCleanText === targetWordClean;
        if (isCorrect) correctCount++;
        updateStatsDisplay();

        const allButtons = document.querySelectorAll('.option-btn');
        if (isCorrect) {
            selectedBtn.classList.add('correct');
            setupSpellBuilder(targetWordSyllables);
        } else {
            selectedBtn.classList.add('wrong');
            allButtons.forEach(btn => {
                if (btn.textContent === targetWordClean) {
                    btn.classList.add('correct');
                }
            });
        }
    }

    function formatSyllablesWithAccent(wordSyllables) {
        const cleanWord = stripHyphens(wordSyllables).toLowerCase();
        let accentedSpeak = accentFixes[currentLang] ? accentFixes[currentLang][cleanWord] : null;

        let upperChars = "";
        if (accentedSpeak) {
            upperChars = accentedSpeak.replace(/[^A-ZА-ЯЁІЇЄҐ]/g, '');
        }

        let targetAccentChar = upperChars.length > 0 ? upperChars[0].toUpperCase() : null;
        let syllablesArr = wordSyllables.split('-');
        let accentApplied = false;

        let resultSyllables = syllablesArr.map(syllable => {
            let upperSyllable = syllable.toUpperCase();

            if (targetAccentChar && !accentApplied) {
                let charIndex = upperSyllable.indexOf(targetAccentChar);
                if (charIndex !== -1) {
                    accentApplied = true;
                    return upperSyllable.slice(0, charIndex) + 
                           `<span class="accent-char">${targetAccentChar}́</span>` + 
                           upperSyllable.slice(charIndex + 1);
                }
            }

            if (!targetAccentChar && !accentApplied) {
                const vowels = 'АЕЄИІЇОУЮЯЫЭЁ';
                for (let i = 0; i < upperSyllable.length; i++) {
                    if (vowels.includes(upperSyllable[i])) {
                        accentApplied = true;
                        return upperSyllable.slice(0, i) + 
                               `<span class="accent-char">${upperSyllable[i]}́</span>` + 
                               upperSyllable.slice(i + 1);
                    }
                }
            }

            return upperSyllable;
        });

        return resultSyllables.join('-');
    }

    function setupSpellBuilder(wordSyllables) {
        const card = document.getElementById('spellBuilderCard');
        const pool = document.getElementById('lettersPool');
        const target = document.getElementById('lettersTarget');
        const syllableDisplay = document.getElementById('syllableDisplay');

        pool.innerHTML = '';
        target.innerHTML = '';
        syllableDisplay.innerHTML = '';
        card.classList.remove('hidden');

        let cleanWord = stripHyphens(wordSyllables);
        let letters = cleanWord.toUpperCase().split('');
        let shuffled = [...letters].sort(() => Math.random() - 0.5);

        shuffled.forEach((char) => {
            const tile = document.createElement('div');
            tile.className = 'letter-tile';
            tile.textContent = char;
            tile.onclick = () => {
                if (tile.parentElement === pool) {
                    target.appendChild(tile);
                } else {
                    pool.appendChild(tile);
                }
                checkBuiltWord(wordSyllables);
            };
            pool.appendChild(tile);
        });
    }

    function checkBuiltWord(wordSyllables) {
        const target = document.getElementById('lettersTarget');
        const syllableDisplay = document.getElementById('syllableDisplay');
        const t = i18n[currentLang];
        let cleanWord = stripHyphens(wordSyllables);

        const built = Array.from(target.children).map(c => c.textContent).join('');
        if (built.toLowerCase() === cleanWord.toLowerCase()) {
            target.style.borderColor = '#28a745';
            
            const formattedSyllables = formatSyllablesWithAccent(wordSyllables);
            syllableDisplay.innerHTML = t.syllablePrefix + formattedSyllables;
            
            speakWord(cleanWord);
        } else {
            target.style.borderColor = 'var(--option-btn-border)';
            syllableDisplay.innerHTML = '';
        }
    }

    window.onload = async function() {
        await loadAccents();
        loadSettings();
        updateUI();
        initCategories();
        startMasterTimer();
    };
</script>
