    // ----- деление на слоги (приблизительное, результат можно исправить вручную) -----
    function syllabifyToken(word, lang) {
        const V = lang === 'en' ? 'aeiouy' : (lang === 'uk' ? 'аеєиіїоуюя' : 'аеёиоуыэюя');
        const chars = [...word.toLowerCase()];
        const isV = c => V.includes(c);
        // ядра слогов: в английском подряд идущие гласные считаются одним ядром
        const nuclei = [];
        for (let i = 0; i < chars.length; i++) {
            if (!isV(chars[i])) continue;
            if (lang === 'en' && nuclei.length && nuclei[nuclei.length - 1][1] === i - 1) nuclei[nuclei.length - 1][1] = i;
            else nuclei.push([i, i]);
        }
        // английское «немое e» на конце не образует слог
        if (lang === 'en' && nuclei.length > 1) {
            const last = nuclei[nuclei.length - 1];
            const n = chars.length;
            if (last[0] === n - 1 && chars[n - 1] === 'e' && !isV(chars[n - 2]) && !(chars[n - 2] === 'l' && n > 3 && !isV(chars[n - 3]))) nuclei.pop();
        }
        if (nuclei.length < 2) return chars.join('');
        const cuts = [];
        for (let k = 0; k < nuclei.length - 1; k++) {
            const e = nuclei[k][1], s = nuclei[k + 1][0];
            const gap = s - e - 1;
            let cut;
            if (gap === 0) cut = s;
            else if (gap === 1) cut = (chars[e + 1] === 'й') ? e + 2 : e + 1;
            else cut = e + 2;
            while (cut < s && ['ь', 'ъ', "'"].includes(chars[cut])) cut++;
            cuts.push(cut);
        }
        let out = '', prev = 0;
        cuts.forEach(c => { out += chars.slice(prev, c).join('') + '-'; prev = c; });
        out += chars.slice(prev).join('');
        return out;
    }

    function syllabifyPhrase(text, lang) {
        return text.trim().split(/\s+/).map(t => syllabifyToken(t, lang || currentLang)).join(' ');
    }

    function normalizeDictWord(s) {
        return String(s || '').toLowerCase()
            .replace(/[’ʼʻ`´]/g, "'")
            .replace(/-/g, '')
            .replace(/[^\p{L}\p{N}' ]+/gu, '')
            .replace(/\s+/g, ' ')
            .trim();
    }

    // Ударение задаётся заглавной гласной буквой, остальные буквы строчные: стра-нИ-ца.
    function vowelSetFor(lang) {
        return lang === 'en' ? 'aeiouy' : (lang === 'uk' ? 'аеєиіїоуюя' : 'аеёиоуыэюя');
    }

    // Возвращает { syl: строчные слоги, accent: слово без дефисов с одной заглавной гласной или null, error }.
    function parseStress(raw, lang) {
        const chars = [...raw];
        const up = [];
        chars.forEach((c, i) => { if (c !== c.toLowerCase() && c.toLowerCase() !== c.toUpperCase()) up.push(i); });
        const syl = raw.toLowerCase();
        if (up.length === 0) return { syl, accent: null };
        if (up.length > 1) return { syl, accent: null, error: 'many' };
        const i = up[0];
        if (!vowelSetFor(lang).includes(chars[i].toLowerCase())) return { syl, accent: null, error: 'notVowel' };
        let pos = 0;
        for (let k = 0; k < i; k++) if (chars[k] !== '-') pos++;
        const plain = [...syl.replace(/-/g, '')];
        if (pos >= plain.length) return { syl, accent: null };
        plain[pos] = plain[pos].toUpperCase();
        return { syl, accent: plain.join('') };
    }

    function accentKeyOf(syl) { return String(syl).toLowerCase().replace(/[-\s]/g, ''); }

    // Возвращает слоги с заглавной ударной гласной (для экспорта).
    function applyStressToSyl(syl, accent) {
        if (!accent) return syl;
        const idx = [...accent].findIndex(c => c !== c.toLowerCase());
        if (idx < 0) return syl;
        const chars = [...syl];
        let pos = 0;
        for (let k = 0; k < chars.length; k++) {
            if (chars[k] === '-') continue;
            if (pos === idx) { chars[k] = chars[k].toUpperCase(); break; }
            pos++;
        }
        return chars.join('');
    }

    function cleanKey(w) { return cleanWord(w).toLowerCase().replace(/\s+/g, ' ').trim(); }

    // ----- хранилище «Мои слова» -----
    const USER_WORDS_KEY = 'app_user_words_v1';
    let userWords = (function () {
        try {
            const o = JSON.parse(localStorage.getItem(USER_WORDS_KEY) || '{}');
            const r = { ru: [], uk: [], en: [] };
            ['ru', 'uk', 'en'].forEach(l => { if (o && Array.isArray(o[l])) r[l] = o[l].filter(x => typeof x === 'string'); });
            return r;
        } catch (e) { return { ru: [], uk: [], en: [] }; }
    })();

    function saveUserWords() {
        try { localStorage.setItem(USER_WORDS_KEY, JSON.stringify(userWords)); } catch (e) {}
    }

    // Ударения своих слов: { ru: { 'страница': 'странИца' }, ... }
    const USER_ACCENTS_KEY = 'app_user_accents_v1';
    let userAccents = (function () {
        const r = { ru: {}, uk: {}, en: {} };
        try {
            const o = JSON.parse(localStorage.getItem(USER_ACCENTS_KEY) || '{}');
            ['ru', 'uk', 'en'].forEach(l => {
                if (o && o[l] && typeof o[l] === 'object') {
                    Object.keys(o[l]).forEach(k => { if (typeof o[l][k] === 'string') r[l][k] = o[l][k]; });
                }
            });
        } catch (e) {}
        return r;
    })();

    function saveUserAccents() {
        try { localStorage.setItem(USER_ACCENTS_KEY, JSON.stringify(userAccents)); } catch (e) {}
    }

    // Ударение из «Моих слов» и extra-dict.json (используется и для подсветки, и для озвучивания).
    function getCustomAccent(key) {
        const k = String(key).replace(/\s+/g, '');
        const u = userAccents[currentLang];
        if (u && u[k]) return u[k];
        const e = extraDictData && extraDictData.accents && extraDictData.accents[currentLang];
        if (e && e[k]) return e[k];
        return null;
    }

    // ----- дополнительный словарь extra-dict.json -----
    const EXTRA_KEY = 'app_extra_dict_v1';
    let extraDictData = { ru: {}, uk: {}, en: {}, pairs: { ru: {}, uk: {}, en: {} }, accents: { ru: {}, uk: {}, en: {} } };
    let extraSource = 'none';   // 'online' | 'saved' | 'none'

    function normalizeExtra(raw) {
        const out = { ru: {}, uk: {}, en: {}, pairs: { ru: {}, uk: {}, en: {} }, accents: { ru: {}, uk: {}, en: {} } };
        const fixWord = (w, lang) => {
            if (typeof w !== 'string') return null;
            const s = w.replace(/[’ʼʻ`´]/g, "'").replace(/[^\p{L}\p{N}' \-]+/gu, '').replace(/\s+/g, ' ').trim();
            if (!s || s.length > 40) return null;
            const st = parseStress(s, lang);
            if (st.accent) out.accents[lang][accentKeyOf(st.accent)] = st.accent;
            return st.syl.includes('-') ? st.syl : syllabifyPhrase(st.syl, lang);
        };
        ['ru', 'uk', 'en'].forEach(lang => {
            const cats = raw && raw[lang];
            if (cats && typeof cats === 'object' && !Array.isArray(cats)) {
                Object.keys(cats).slice(0, 100).forEach(cat => {
                    if (!Array.isArray(cats[cat])) return;
                    const list = cats[cat].slice(0, 5000).map(w => fixWord(w, lang)).filter(Boolean);
                    if (list.length) out[lang][String(cat).slice(0, 60)] = list;
                });
            }
            const pairs = raw && raw.pairs && raw.pairs[lang];
            if (pairs && typeof pairs === 'object' && !Array.isArray(pairs)) {
                Object.keys(pairs).slice(0, 5000).forEach(k => {
                    if (!Array.isArray(pairs[k])) return;
                    const list = pairs[k].slice(0, 20).map(w => fixWord(w, lang)).filter(Boolean);
                    const key = normalizeDictWord(k);
                    if (key && list.length) out.pairs[lang][key] = list;
                });
            }
        });
        return out;
    }

    function countExtraWords() {
        let n = 0;
        ['ru', 'uk', 'en'].forEach(l => Object.values(extraDictData[l] || {}).forEach(a => { n += a.length; }));
        return n;
    }

    (function loadExtraFromStorage() {
        try {
            const txt = localStorage.getItem(EXTRA_KEY);
            if (!txt) return;
            extraDictData = normalizeExtra(JSON.parse(txt));
            extraSource = 'saved';
        } catch (e) {}
    })();

    // Загрузка файла с сайта. При ошибке (нет интернета, нет файла) остаётся сохранённая копия.
    async function fetchExtraDictionary() {
        try {
            const res = await fetch('extra-dict.json?ts=' + Date.now(), { cache: 'no-store' });
            if (!res.ok) throw new Error('http ' + res.status);
            const raw = JSON.parse(await res.text());
            if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('bad format');
            extraDictData = normalizeExtra(raw);
            extraSource = 'online';
            try { localStorage.setItem(EXTRA_KEY, JSON.stringify(raw)); } catch (e) {}
            invalidateDictionaries();
            return true;
        } catch (e) {
            console.log('extra-dict.json not loaded:', e && e.message);
            return false;
        }
    }

    // ----- объединённые словари (базовые + extra-dict.json + «Мои слова») -----
    const mergedDictCache = {}, mergedPairsCache = {};

    function invalidateDictionaries() {
        Object.keys(mergedDictCache).forEach(k => delete mergedDictCache[k]);
        Object.keys(mergedPairsCache).forEach(k => delete mergedPairsCache[k]);
    }

    function getMergedDictionary(lang) {
        if (mergedDictCache[lang]) return mergedDictCache[lang];
        const base = baseDictionaryFor(lang);
        const out = {};
        const seen = new Set();
        Object.keys(base).forEach(c => {
            out[c] = base[c];
            base[c].forEach(w => seen.add(cleanKey(w)));
        });
        const addTo = (cat, words) => {
            const fresh = [];
            words.forEach(w => {
                const k = cleanKey(w);
                if (!seen.has(k)) { seen.add(k); fresh.push(w); }
            });
            if (fresh.length) out[cat] = (out[cat] || []).concat(fresh);
        };
        const extra = extraDictData[lang] || {};
        Object.keys(extra).forEach(cat => addTo(cat, extra[cat]));
        if (userWords[lang] && userWords[lang].length) addTo((dictI18n[lang] || dictI18n.ru).catName, userWords[lang]);
        mergedDictCache[lang] = out;
        return out;
    }

    function getMergedPairs(lang) {
        if (mergedPairsCache[lang]) return mergedPairsCache[lang];
        const base = basePairsFor(lang);
        const extra = (extraDictData.pairs && extraDictData.pairs[lang]) || {};
        const keys = Object.keys(extra);
        if (!keys.length) { mergedPairsCache[lang] = base; return base; }
        const out = Object.assign({}, base);
        keys.forEach(k => { out[k] = (out[k] || []).concat(extra[k]); });
        mergedPairsCache[lang] = out;
        return out;
    }

    // ----- окно «Мои слова» -----
    let dictRec = null, dictSylTouched = false;

    }

    function renderDictList() {
        const x = dx();
        const box = document.getElementById('dictList');
        const list = userWords[currentLang] || [];
        box.innerHTML = '';
        if (!list.length) {
            const d = document.createElement('div');
            d.className = 'dict-empty';
            d.innerText = x.empty;
            box.appendChild(d);
            return;
        }
        list.forEach((w, i) => {
            const row = document.createElement('div');
            row.className = 'dict-item';
            const span = document.createElement('span');
            const acc = (userAccents[currentLang] || {})[accentKeyOf(w)];
            const accIdx = acc ? [...acc].findIndex(c => c !== c.toLowerCase()) : -1;
            let pos = 0;
            [...w].forEach(ch => {
                if (ch === '-') { span.appendChild(document.createTextNode(' • ')); return; }
                if (pos === accIdx) {
                    const a = document.createElement('span');
                    a.className = 'accent-char';
                    a.textContent = ch;
                    span.appendChild(a);
                } else {
                    span.appendChild(document.createTextNode(ch));
                }
                pos++;
            });
            const btn = document.createElement('button');
            btn.innerText = '🗑';
            btn.title = x.del;
            btn.setAttribute('aria-label', x.del);
            btn.onclick = () => dictDelete(i);
            row.appendChild(span);
            row.appendChild(btn);
            box.appendChild(row);
        });
    }

    function renderDictOnline() {
        const x = dx();
        const n = countExtraWords();
        let msg = x.onlineNone;
        if (extraSource === 'online') msg = x.onlineOnline + n;
        else if (extraSource === 'saved') msg = x.onlineSaved + n;
        document.getElementById('dictOnline').innerText = msg;
    }

        document.getElementById('dictOverlay').classList.add('hidden');

    function onDictOverlayClick(e) {

    function onDictWordInput() {
        if (!dictSylTouched) {
            const w = normalizeDictWord(document.getElementById('dictWordInput').value);
            document.getElementById('dictSylInput').value = w ? syllabifyPhrase(w) : '';
        }

    function setDictWord(word) {
        document.getElementById('dictWordInput').value = word;
        dictSylTouched = false;
        onDictWordInput();
    }

    function stopDictListening() {
        try { if (dictRec) dictRec.stop(); } catch (e) {}
    }

    // Добавление слова проговариванием: распознанное слово подставляется в поле,
    // его можно проверить, выбрать другой вариант и добавить кнопкой «Добавить».
    function dictListen() {
        const x = dx();
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { setDictStatus(x.noSupport, true); return; }
        if (dictRec) { stopDictListening(); return; }
        try { if (isRecording && recognition) recognition.stop(); } catch (e) {}
        try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
        const r = new SR();
        dictRec = r;
        r.lang = currentLang === 'uk' ? 'uk-UA' : (currentLang === 'ru' ? 'ru-RU' : 'en-US');
        r.interimResults = false;
        r.continuous = false;
        r.maxAlternatives = 3;
        r.onstart = () => { setDictStatus(''); renderDictTexts(); };
        r.onresult = e => {
            const alts = Array.from(e.results[0] || []).map(a => normalizeDictWord(a.transcript)).filter(Boolean);
            const uniq = alts.filter((a, i) => alts.indexOf(a) === i);
            if (!uniq.length) return;
            setDictWord(uniq[0]);
            const box = document.getElementById('dictAlts');
            box.innerHTML = '';
            uniq.slice(1).forEach(a => {
                const b = document.createElement('button');
                b.className = 'dict-chip';
                b.innerText = a;
                b.onclick = () => setDictWord(a);
                box.appendChild(b);
            });
            setDictStatus(dx().heard);
        };
        r.onerror = e => {
            if (e.error !== 'aborted') setDictStatus(recErrorText(e.error), true);
        };
        r.onend = () => { dictRec = null; renderDictTexts(); };
        try { r.start(); } catch (e) { dictRec = null; setDictStatus(x.errPrefix + (e && e.message), true); }
    }

    function dictHear() {
        let w = normalizeDictWord(document.getElementById('dictWordInput').value);
        if (!w || !('speechSynthesis' in window)) return;
        // Если в поле слогов отмечено ударение, оно учитывается при прослушивании.
        const raw = document.getElementById('dictSylInput').value.replace(/[’ʼʻ`´]/g, "'").replace(/\s+/g, ' ').trim();
        if (raw) {
            const st = parseStress(raw, currentLang);
            if (st.accent && accentKeyOf(st.accent) === w.replace(/\s/g, '')) w = st.accent;
        }
        warmupSpeechSynthesis();
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(makeUtterance(w, 1));
    }

    function refreshAfterDictChange() {
        invalidateDictionaries();
        initCategorySelect();
        syncModeCategorySelect();
        renderDictList();
        renderDictOnline();
    }

    function dictAdd() {
        const x = dx();
        const word = normalizeDictWord(document.getElementById('dictWordInput').value);
        if (!word) { setDictStatus(x.needWord, true); return; }
        const raw = document.getElementById('dictSylInput').value.replace(/[’ʼʻ`´]/g, "'").replace(/\s*-\s*/g, '-').replace(/\s+/g, ' ').trim();
        let syl, accent = null;
        if (!raw) {
            syl = syllabifyPhrase(word);
        } else {
            const st = parseStress(raw, currentLang);
            if (st.error === 'many') { setDictStatus(x.stressMany, true); return; }
            if (st.error === 'notVowel') { setDictStatus(x.stressNotVowel, true); return; }
            syl = st.syl;
            accent = st.accent;
        }
        if (syl.replace(/[-\s]/g, '') !== word.replace(/\s/g, '')) { setDictStatus(x.sylMismatch, true); return; }
        const key = cleanKey(syl);
        const exists = Object.values(getMergedDictionary(currentLang)).some(arr => arr.some(w => cleanKey(w) === key));
        if (exists) { setDictStatus(x.exists, true); return; }
        userWords[currentLang].push(syl);
        saveUserWords();
        if (accent) {
            userAccents[currentLang][accentKeyOf(syl)] = accent;
            saveUserAccents();
        }
        refreshAfterDictChange();
        document.getElementById('dictWordInput').value = '';
        document.getElementById('dictSylInput').value = '';
        document.getElementById('dictAlts').innerHTML = '';
        dictSylTouched = false;
        setDictStatus(x.added);
    }

    function dictDelete(i) {
        const removed = userWords[currentLang].splice(i, 1)[0];
        saveUserWords();
        if (removed && userAccents[currentLang][accentKeyOf(removed)]) {
            delete userAccents[currentLang][accentKeyOf(removed)];
            saveUserAccents();
        }
        refreshAfterDictChange();
    }

    // Экспорт в формате, совпадающем с extra-dict.json: файл можно положить на сайт.
    function dictExport() {
        const out = {};
        ['ru', 'uk', 'en'].forEach(l => {
            if (userWords[l].length) out[l] = { [dictI18n[l].catName]: userWords[l].map(w => applyStressToSyl(w, userAccents[l][accentKeyOf(w)])) };
        });
        const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'my-words.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        setDictStatus(dx().exported);
    }

    function dictImport(ev) {
        const file = ev.target.files && ev.target.files[0];
        ev.target.value = '';
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            try {
                const norm = normalizeExtra(JSON.parse(reader.result));
                let added = 0;
                ['ru', 'uk', 'en'].forEach(l => {
                    const seen = new Set(Object.values(getMergedDictionary(l)).flat().map(cleanKey));
                    Object.values(norm[l]).forEach(arr => arr.forEach(w => {
                        const k = cleanKey(w);
                        if (!seen.has(k)) {
                            seen.add(k);
                            userWords[l].push(w);
                            const acc = norm.accents[l][accentKeyOf(w)];
                            if (acc) userAccents[l][accentKeyOf(w)] = acc;
                            added++;
                        }
                    }));
                });
                saveUserWords();
                saveUserAccents();
                refreshAfterDictChange();
                setDictStatus(dx().imported + added);
            } catch (e) {
                setDictStatus(dx().importBad, true);
            }
        };
        reader.onerror = () => setDictStatus(dx().importBad, true);
        reader.readAsText(file);
    }

        setDictStatus(dx().refreshing);

    // ----- Системная кнопка «Назад» (Android) и жест назад -----
    // Пока открыто окно или режим, в истории браузера лежит одна «защитная» запись. «Назад» снимает её,
    // приложение делает один шаг назад и, если ещё есть куда возвращаться, кладёт запись снова.
    // На стартовом экране без окон записи нет, и «Назад» закрывает приложение.
    let navSkip = false;
    const NAV_OVERLAYS = ['dictOverlay', 'helpOverlay', 'statsOverlay', 'settingsOverlay'];
    function overlayOpen(id) { const e = document.getElementById(id); return !!(e && !e.classList.contains('hidden')); }
    function navDepth() { return screenName !== 'select' || NAV_OVERLAYS.some(overlayOpen); }
    function navSync() {
        try {
            const d = navDepth(), st = !!(history.state && history.state.sr);
            if (d && !st) history.pushState({ sr: 1 }, '');
            else if (!d && st) { navSkip = true; history.back(); }
        } catch (e) {}
    }
    function appBack() {
        if (overlayOpen('dictOverlay')) { closeDict(); return; }
        if (overlayOpen('helpOverlay')) { closeHelp(); return; }
        if (overlayOpen('statsOverlay')) { closeStats(); return; }
        if (overlayOpen('settingsOverlay')) { closeSettings(); return; }
        if (overlayOpen('restOverlay')) return;
        if (screenName === 'phr' && phr.view === 'do') {
            if (phr.from === 'hear' && phr.tmp) { showScreen('hear'); HP.open(false); }
            else if (phr.from === 'abc' && phr.tmp) phrBackAbc();
            else phrOpen();
            return;
        }
        if (screenName === 'ser' && (ser.form || ser.view === 'do')) {
            serStop();
            if (ser.form) { ser.form = false; ser.msg = ''; serRender(); } else serOpen();
            return;
        }
        if (screenName === 'hear' && HP.hasBack()) { showScreen('phr'); phrOpen(); return; }
        if (screenName === 'abc' && (abcState.prefix || abcState.typed)) {
            abcState.prefix = ''; abcState.typed = ''; abcState.kbOff = false; abcRender(); return;
        }
        if (screenName !== 'select') goHome();
    }
    window.addEventListener('popstate', () => {
        if (navSkip) { navSkip = false; return; }
        appBack();
        navSync();
    });

            showScreen('listen');
            listenNewWord();
        } else if (m === 'abc') {
            showScreen('abc');
            abcOpen();
        } else if (m === 'ser') {
            showScreen('ser');
            serOpen();
        } else if (m === 'hear') {
            showScreen('hear');
            HP.open(true, !!(opt && opt.back));
        } else if (m === 'wr') {
            showScreen('wr');
            wrOpen();
        } else if (m === 'phr') {
            showScreen('phr');
            phrOpen();
        } else {
            showScreen('quiz');
            renderQuizSetup();
        }
    }

        r.interimResults = false;
        r.continuous = false;
        r.maxAlternatives = 3;
        let finished = false;
        const finish = res => { if (finished) return; finished = true; if (modeRec === r) modeRec = null; onDone(res); };
        r._cancel = () => finish({ error: 'aborted' });
        r.onstart = () => { if (onStart) onStart(); };
        r.onresult = e => {
            const alts = Array.from(e.results[0] || []).map(a => a.transcript.trim().toLowerCase());
            finish({ transcript: alts[0] || '', alts });
        };
        r.onerror = e => { if (e.error !== 'aborted') finish({ error: e.error }); };
        r.onend = () => { if (!r._aborted) finish({ error: 'no-speech' }); };
        try { r.start(); } catch (e) { finish({ error: 'start' }); }
    }

    function shuffleArray(a) {
        const arr = a.slice();
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function recErrorText(code) {
        const t = mt();
        if (code === 'aborted') return '';
        if (code === 'no-speech') return t.noSpeech;
        if (code === 'unsupported') return t.noRecSupport;
        if (code === 'not-allowed' || code === 'service-not-allowed' || code === 'audio-capture') return t.noMic;
        if (code === 'network' || code === 'language-not-supported') return t.needNet;
        return t.recFail;
    }

    // ----- Тренировка слуха -----
    const train = {
        word: '', clean: '', letters: [], tiles: [], placed: [], step: 1,
        attempts: 0, passed: false, heard: null, heardOk: null, lastErr: null, built: null, builtOk: null
    };

    function trainReset(word) {
        train.word = word;
        train.clean = cleanWord(word).toLowerCase();
        train.letters = [...train.clean.replace(/\s+/g, '')];
        let order = shuffleArray(train.letters);
        for (let k = 0; k < 8 && train.letters.length > 1 && order.join('') === train.letters.join(''); k++) order = shuffleArray(train.letters);
        train.tiles = order.map(ch => ({ ch, used: false }));
        train.placed = [];
        train.step = 1;
        train.attempts = 0;
        train.passed = false;
        train.heard = null;
        train.heardOk = null;
        train.lastErr = null;
        train.built = null;
        train.builtOk = null;
        train.selfOk = false;
        train.buildRec = false;
    }

    function listenNewWord() {
        const pool = getWordsFromCurrentCategory();
        if (!pool || !pool.length) { document.getElementById('listenScreen').innerHTML = '<div class="step-note">' + escHtml(mt().noWords) + '</div>'; return; }
        let w = getRandomWord();
        for (let i = 0; i < 6 && w === train.word && pool.length > 1; i++) w = getRandomWord();
        trainReset(w);
        renderListenStep(1);
    }

    function trainRepeatWord() {
        trainReset(train.word);
        renderListenStep(1);
    }

    function trainSpeak() { speakWord(train.word); }
    function trainSyllables() { speakSyllables(train.word); }

    function trainNextLocked() {
        return isChecked('requireSpeech') && speechRecognitionAvailable() && !train.passed && train.attempts < MAX_SPEECH_ATTEMPTS;
    }

    function renderListenStep(step) {
        stopModeSpeech();
        train.step = step;
        const t = mt();
        const el = document.getElementById('listenScreen');
        let h = '';
        if (step <= 3) h += '<div class="step-progress">' + escHtml(t.stepOf.replace('{i}', step)) + '</div>';
        if (step === 1) {
            h += '<div class="step-title">' + escHtml(t.s1) + '</div>' +
                 '<div class="step-box"><button class="assist-btn" onclick="trainSpeak()">' + escHtml(t.listen) + '</button>' +
                 '<button class="assist-btn" onclick="trainSyllables()">' + escHtml(t.slow) + '</button></div>' +
                 '<button class="primary-btn" onclick="renderListenStep(2)">' + escHtml(t.next) + '</button>';
        } else if (step === 2) {
            h += '<div class="step-title">' + escHtml(t.s2) + '</div>' +
                 '<div class="step-box"><button class="assist-btn" onclick="trainSpeak()">' + escHtml(t.listen) + '</button>' +
                 '<button class="assist-btn" id="trainMicBtn" onclick="trainMic()">' + escHtml(train.attempts ? t.again : t.say) + '</button></div>' +
                 '<div class="step-box" id="trainSayResult" style="display:none"></div>' +
                 '<div class="step-note" id="trainNote"></div>' +
                 '<button class="primary-btn" id="trainNext2" onclick="renderListenStep(3)">' + escHtml(t.next) + '</button>';
        } else if (step === 3) {
            h += '<div class="step-title">' + escHtml(t.s3) + '</div>' +
                 '<div class="step-box"><button class="assist-btn" onclick="trainSpeak()">' + escHtml(t.listen) + '</button>' +
                 '<button class="assist-btn" onclick="trainSyllables()">' + escHtml(t.slow) + '</button></div>' +
                 (isChecked('spellSyllableHint') ? '<div class="step-note"><b>' + escHtml(train.word.replace(/-/g, ' • ')) + '</b></div>' : '') +
                 '<div class="letter-slots" id="trainSlots"></div>' +
                 '<div class="letter-tiles" id="trainTiles"></div>' +
                 '<div class="step-box"><button class="assist-btn" onclick="trainUndo()">' + escHtml(t.buildBack) + '</button>' +
                 '<button class="assist-btn" onclick="trainClear()">' + escHtml(t.buildClear) + '</button></div>' +
                 '<div class="step-note" id="trainBuildMsg"></div>' +
                 '<button class="primary-btn" id="trainNext3" onclick="renderListenStep(4)">' + escHtml(t.next) + '</button>';
        } else {
            if (train.built !== null && !train.buildRec) { train.buildRec = true; recordResult('build', train.clean, train.built, train.builtOk); }
            h += renderTrainSummary();
        }
        el.innerHTML = h;
        window.scrollTo(0, 0);
        if (step === 1) setTimeout(() => { if (screenName === 'listen' && train.step === 1) trainSpeak(); }, 250);
        if (step === 2) updateTrainSayUI();
        if (step === 3) renderBuildArea();
    }

    function trainMic() {
        const t = mt();
        const btn = document.getElementById('trainMicBtn');
        if (!btn || btn.disabled) return;
        btn.disabled = true;
        btn.textContent = t.listening;
        btn.classList.add('rec');
        recognizeOnce(null, res => {
            const b = document.getElementById('trainMicBtn');
            if (b) { b.disabled = false; b.textContent = mt().again; b.classList.remove('rec'); }
            if (res.error === 'aborted') {
                train.lastErr = null;
            } else if (res.error) {
                train.lastErr = res.error;
                if (res.error !== 'unsupported') train.attempts++;
            } else {
                const m = speechMatchAlts(res, train.clean, isChecked('strictSpeech'));
                const ok = m.ok;
                train.heard = m.heard;
                train.heardOk = ok;
                train.selfOk = false;
                train.lastErr = null;
                train.attempts++;
                if (ok) train.passed = true;
                recordResult('speech', train.clean, m.heard, ok);
                speakSpeechFeedback(ok, m.heard, train.clean);
                flushSpeechFeedback();
            }
            if (train.step === 2) updateTrainSayUI();
        });
    }

    function updateTrainSayUI() {
        const t = mt();
        const box = document.getElementById('trainSayResult');
        if (!box) return;
        let h = '';
        if (train.lastErr) h += '<div class="res-bad">' + escHtml(recErrorText(train.lastErr)) + '</div>';
        if (train.heard !== null) {
            h += '<div>' + escHtml(t.heardLbl) + ' <b>' + escHtml(train.heard) + '</b> ' +
                 (train.heardOk ? '<span class="res-ok">✔</span>' : '<span class="res-bad">✘</span>') + '</div>';
            if (!train.heardOk) {
                h += buildDiffHtml(train.clean, train.heard);
                h += '<div style="width:100%"><button class="assist-btn" onclick="trainCountOk()">' + escHtml(t.countOk) + '</button></div>';
            }
            if (train.selfOk) h += '<div class="res-ok" style="width:100%">' + escHtml(t.countedOk) + '</div>';
        }
        box.innerHTML = h;
        box.style.display = h ? '' : 'none';
        const locked = trainNextLocked();
        document.getElementById('trainNext2').disabled = locked;
        document.getElementById('trainNote').innerText = locked ? t.requireNote : '';
    }

    // Распознавание ошиблось, а человек сказал верно (решает сам человек или помощник)
    function trainCountOk() {
        if (train.heard === null || train.heardOk) return;
        train.heardOk = true; train.passed = true; train.selfOk = true;
        recordResult('fix', train.clean, '', true);
        updateTrainSayUI();
    }

    function renderBuildArea() {
        const t = mt();
        const total = train.letters.length;
        let slots = '';
        for (let i = 0; i < total; i++) {
            if (train.placed[i] !== undefined) {
                slots += '<button class="letter-tile" onclick="trainRemove(' + i + ')">' + escHtml(train.tiles[train.placed[i]].ch) + '</button>';
            } else {
                slots += '<span class="letter-slot"></span>';
            }
        }
        document.getElementById('trainSlots').innerHTML = slots;
        document.getElementById('trainTiles').innerHTML = train.tiles.map((tl, idx) =>
            '<button class="letter-tile' + (tl.used ? ' used' : '') + '" onclick="trainPlace(' + idx + ')">' + escHtml(tl.ch) + '</button>').join('');
        const complete = train.placed.length === total;
        let msg = '';
        if (complete) {
            train.built = train.placed.map(i => train.tiles[i].ch).join('');
            train.builtOk = train.built === train.letters.join('');
            msg = train.builtOk ? '<span class="res-ok">' + escHtml(t.builtOk) + '</span>' : '<span class="res-bad">' + escHtml(t.builtBad) + '</span>';
        } else {
            train.built = null;
            train.builtOk = null;
        }
        document.getElementById('trainBuildMsg').innerHTML = msg;
        document.getElementById('trainNext3').disabled = !complete;
    }

    function trainPlace(idx) {
        if (train.tiles[idx].used || train.placed.length >= train.letters.length) return;
        train.tiles[idx].used = true;
        train.placed.push(idx);
        renderBuildArea();
    }

    function trainRemove(pos) {
        const idx = train.placed[pos];
        if (idx === undefined) return;
        train.tiles[idx].used = false;
        train.placed.splice(pos, 1);
        renderBuildArea();
    }

    function trainUndo() {
        if (train.placed.length) trainRemove(train.placed.length - 1);
    }

    function trainClear() {
        train.tiles.forEach(tl => { tl.used = false; });
        train.placed = [];
        renderBuildArea();
    }

    function renderTrainSummary() {
        const t = mt();
        const target = train.letters.join('');
        let h = '<div class="step-title">' + escHtml(t.summary) + '</div>';
        h += '<div class="result-row"><div class="res-label">' + escHtml(t.srcWord) + '</div><b>' + escHtml(train.word.replace(/-/g, ' • ')) + '</b></div>';
        h += '<div class="result-row"><div class="res-label">' + escHtml(t.saidWord) + '</div>';
        if (train.heard === null) {
            h += '<span>' + escHtml(t.notSaid) + '</span>';
        } else {
            h += '<b>' + escHtml(train.heard) + '</b> ' + (train.heardOk ? '<span class="res-ok">✔</span>' : '<span class="res-bad">✘</span>');
            if (!train.heardOk) h += buildDiffHtml(train.clean, train.heard);
        }
        h += '</div>';
        h += '<div class="result-row"><div class="res-label">' + escHtml(t.builtWord) + '</div>';
        if (train.built === null) {
            h += '<span>—</span>';
        } else {
            h += '<b>' + escHtml(train.built) + '</b> ' + (train.builtOk ? '<span class="res-ok">✔</span>' : '<span class="res-bad">✘</span>');
            if (!train.builtOk) h += buildDiffHtml(target, train.built);
        }
        h += '</div>';
        h += '<button class="primary-btn" onclick="trainRepeatWord()">' + escHtml(t.repeatWord) + '</button>' +
             '<button class="primary-btn" onclick="listenNewWord()">' + escHtml(t.nextWord) + '</button>' +
             '<button class="assist-btn" onclick="goHome()">' + escHtml(t.toModes) + '</button>';
        return h;
    }

    // ----- Тест -----
    function renderQuizSetup() {
        stopModeSpeech();
        quiz.active = false;
        const t = mt();
        const pool = getWordsFromCurrentCategory() || [];
        let saved = parseInt(localStorage.getItem('app_quiz_count') || '10', 10);
        if (!(saved >= 10 && saved <= 30)) saved = 10;
        document.getElementById('quizScreen').innerHTML =
            '<div class="step-title">' + escHtml(t.quizSetup) + '</div>' +
            '<div class="step-note">' + escHtml(t.quizPool.replace('{n}', pool.length)) + '</div>' +
            '<div class="control-group"><label for="quizCount">' + escHtml(t.quizCountLabel) + '</label>' +
            '<input type="number" id="quizCount" class="dict-input" min="10" max="30" value="' + saved + '"></div>' +
            '<div class="step-note" id="quizSetupNote"></div>' +
            '<button class="primary-btn" onclick="startQuizFromSetup()">' + escHtml(t.quizStart) + '</button>' +
            '<button class="assist-btn" onclick="goHome()">' + escHtml(t.toModes) + '</button>';
        window.scrollTo(0, 0);
    }

    function startQuizFromSetup() {
        const t = mt();
        const pool = getWordsFromCurrentCategory() || [];
        if (!pool.length) { document.getElementById('quizSetupNote').innerText = t.noWords; return; }
        let n = parseInt(document.getElementById('quizCount').value, 10);
        if (!(n >= 10)) n = 10;
        if (n > 30) n = 30;
        try { localStorage.setItem('app_quiz_count', String(n)); } catch (e) {}
        warmupSpeechSynthesis();
        startQuiz(shuffleArray(pool).slice(0, n));
    }

    function startQuiz(words) {
        quiz.words = words;
        quiz.i = 0;
        quiz.results = [];
        quiz.active = true;
        renderQuizWord();
    }

    function renderQuizWord() {
        stopModeSpeech();
        const t = mt();
        const w = quiz.words[quiz.i];
        if (!quiz.cur || quiz.cur.word !== w || quiz.cur.i !== quiz.i) quiz.replayed = false;
        quiz.cur = { word: w, clean: cleanWord(w).toLowerCase(), i: quiz.i };
        quiz.answered = false;
        document.getElementById('quizScreen').innerHTML =
            '<div class="step-progress">' + escHtml(t.quizProgress.replace('{i}', quiz.i + 1).replace('{n}', quiz.words.length)) + '</div>' +
            '<div class="step-title">' + escHtml(quizReplayOn() ? t.quizListenHint1 : t.quizListenHint) + '</div>' +
            '<div class="step-box" id="quizActions">' +
            (quizReplayOn() && !quiz.replayed ? '<button class="assist-btn" id="quizReplayBtn" onclick="quizReplay()">' + escHtml(t.listen) + '</button>' : '') +
            '<button class="assist-btn" id="quizMicBtn" onclick="quizMic()">' + escHtml(t.say) + '</button>' +
            '<button class="assist-btn" id="quizSkipBtn" onclick="quizSkip()">' + escHtml(t.quizSkip) + '</button></div>' +
            '<div class="step-note" id="quizStatus"></div>' +
            '<button class="primary-btn" id="quizNextBtn" style="display:none" onclick="quizAdvance()">' +
            escHtml(quiz.i + 1 >= quiz.words.length ? t.quizFinish : t.quizNext) + '</button>';
        window.scrollTo(0, 0);
        setTimeout(() => {
            if (screenName === 'quiz' && quiz.active && quiz.cur && quiz.cur.word === w && !quiz.answered) speakWord(w);
        }, 250);
    }

    function quizMic() {
        const t = mt();
        const btn = document.getElementById('quizMicBtn');
        if (!btn || btn.disabled || quiz.answered) return;
        btn.disabled = true;
        btn.textContent = t.listening;
        btn.classList.add('rec');
        document.getElementById('quizStatus').innerText = '';
        recognizeOnce(null, res => {
            if (screenName !== 'quiz' || !quiz.active) return;
            const b = document.getElementById('quizMicBtn');
            if (b) b.classList.remove('rec');
            if (res.error) {
                if (b) { b.disabled = false; b.textContent = mt().again; }
                document.getElementById('quizStatus').innerText = recErrorText(res.error);
                return;
            }
            const m = speechMatchAlts(res, quiz.cur.clean, isChecked('strictSpeech'));
            const ok = m.ok;
            quiz.answered = true;
            quiz.results.push({ word: quiz.cur.word, clean: quiz.cur.clean, heard: m.heard, ok, skipped: false });
            recordResult('speech', quiz.cur.clean, m.heard, ok);
            document.getElementById('quizActions').style.display = 'none';
            document.getElementById('quizStatus').innerText = mt().quizAnswered;
            document.getElementById('quizNextBtn').style.display = '';
        });
    }

    // Один повтор слова (если разрешён в настройках)
    function quizReplay() {
        if (quiz.replayed || quiz.answered || !quiz.cur || micBusy()) return;
        quiz.replayed = true;
        const b = document.getElementById('quizReplayBtn');
        if (b) b.remove();
        speakWord(quiz.cur.word);
    }

    function quizSkip() {
        if (quiz.answered) return;
        stopModeSpeech();
        quiz.answered = true;
        quiz.results.push({ word: quiz.cur.word, clean: quiz.cur.clean, heard: null, ok: false, skipped: true });
        quizAdvance();
    }

    function quizAdvance() {
        quiz.i++;
        if (quiz.i >= quiz.words.length) {
            quiz.active = false;
            renderQuizResult();
        } else {
            renderQuizWord();
        }
    }

    function renderQuizResult() {
        stopModeSpeech();
        const t = mt();
        const n = quiz.results.length;
        const k = quiz.results.filter(r => r.ok).length;
        const p = n ? Math.round(k * 100 / n) : 0;
        let h = '<div class="step-title">' + escHtml(t.quizResultTitle) + '</div>' +
                '<div class="step-box"><b>' + escHtml(t.quizScore.replace('{k}', k).replace('{n}', n).replace('{p}', p)) + '</b></div>';
        quiz.results.forEach(r => {
            const right = r.skipped ? escHtml(t.quizMissed) : escHtml(t.quizHeard) + ': ' + escHtml(r.heard || '');
            h += '<div class="quiz-row"><span>' + (r.ok ? '<span class="res-ok">✔</span>' : '<span class="res-bad">✘</span>') + ' <b>' + escHtml(r.word.replace(/-/g, ' • ')) + '</b></span><span>' + right + '</span></div>';
        });
        if (k < n) h += '<button class="primary-btn" onclick="quizRepeatErrors()">' + escHtml(t.quizRepeatErrors) + '</button>';
        h += '<button class="primary-btn" onclick="renderQuizSetup()">' + escHtml(t.quizNew) + '</button>' +
             '<button class="assist-btn" onclick="goHome()">' + escHtml(t.toModes) + '</button>';
        document.getElementById('quizScreen').innerHTML = h;
        window.scrollTo(0, 0);
    }

    function quizRepeatErrors() {
        const wrong = quiz.results.filter(r => !r.ok).map(r => r.word);
        if (wrong.length) startQuiz(shuffleArray(wrong));
    }

            hint: 'Tap the first letter of the word', words: 'Matching words — tap to add:',
            more: 'Words found: {n}. Tap the next letter to narrow the list.',
            none: 'No words for these letters', type: 'Type the word the way you imagine it (mistakes are fine):',
            fit: 'Matching letters', free: 'Free typing', show: 'Show letters', hide: 'Hide letters', say: 'Say it',
            online: "Find words online", onlineRes: "Words from the internet — tap to choose:", onlineNone: "No matching words were found online.", searching: "Looking for options…", err: "Could not reach the dictionary service. Check the internet.", autoHide: "ABC: collapse the letter panel after each letter you tap, to leave more room for words. Bring it back with the “Show letters” button.", setOnline: "ABC and “Suggestions from what was said”: look up words online (Wiktionary; for English also Datamuse). Free, no key needed. The typed letters are sent to these services. Chosen words are remembered on the device."
        }
    };

    function abcT() { return abcI18n[currentLang] || abcI18n.ru; }

    const ABC_ALPHA = {
        ru: 'абвгдежзийклмнопрстуфхцчшщэюя',
        uk: 'абвгґдеєжзиіїйклмнопрстуфхцчшщюя',
        en: 'abcdefghijklmnopqrstuvwxyz'
    };
    // Полная азбука для свободного набора (включая буквы, которых нет в начале слов)
    const ABC_ALPHA_FULL = {
        ru: 'абвгдеёжзийклмнопрстуфхцчшщъыьэюя',
        uk: "абвгґдеєжзиіїйклмнопрстуфхцчшщьюя'",
        en: "abcdefghijklmnopqrstuvwxyz'"
    };
    // Буквы, которые часто путают в речи и при письме: замена такой пары стоит полцены
    const ABC_CONF = new Set('бп пб вф фв гк кг дт тд жш шж зс сз ао оа еи ие яи ия еэ эе уы ыу иі ії bp pb dt td kg gk sz zs fv vf'.split(' '));
    const abcState = { mode: 'prefix', prefix: '', typed: '', line: [], dict: [], keys: [], src: null, kbOff: false, fn: false };
    // Короткие слова для фразы: местоимения, предлоги, частицы (их обычно нет в словаре категорий)
    const ABC_FN = {
        ru: 'я мне меня ты тебе мы нам он она они мой моя моё мои в на не и с у к за по из от до для без о про очень уже ещё тоже да нет',
        uk: 'я мені мене ти тобі ми нам він вона вони мій моя моє мої в у на не і з до за по від для без про дуже вже ще теж так ні',
        en: 'I me my you we us he she they it to in on at with for from of the a not and very too yes no please'
    };
    // Кнопка, у которой нажатие говорит слово, а удержание добавляет его (настройка «нажатие — сказать»)
    // Размер кнопок с буквами (общий для «Азбуки» и «Письма»): обычный или уменьшенный
    function kbSmallOn() { try { return localStorage.getItem('sr.kb.small') === 'true'; } catch (e) { return false; } }
    function kbSizeBtn(rerender) {
        const t = abcT(), sm = kbSmallOn();
        const b = abcMk('button', 'abc-kbt kb-size', sm ? t.kbBig : t.kbSmall, () => {
            try { localStorage.setItem('sr.kb.small', String(!kbSmallOn())); } catch (e) {}
            rerender();
        });
        b.setAttribute('aria-pressed', sm ? 'true' : 'false');
        return b;
    }
    function abcTapOn() { try { return localStorage.getItem('sr.hear.tap') === 'true'; } catch (e) { return false; } }
    function tapHoldBtn(cls, label, onAdd, onSay) {
        const b = abcMk('button', cls, label);
        let t = null, long = false;
        b.style.userSelect = 'none'; b.style.webkitTouchCallout = 'none';
        b.addEventListener('contextmenu', e => e.preventDefault());
        b.addEventListener('pointerdown', () => { long = false; clearTimeout(t); t = setTimeout(() => { long = true; b.classList.add('armed'); }, 500); });
        const off = () => { clearTimeout(t); long = false; b.classList.remove('armed'); };
        b.addEventListener('pointercancel', off);
        b.addEventListener('pointerleave', off);
        b.addEventListener('pointerup', () => { clearTimeout(t); if (long) { long = false; b._skip = true; b.classList.remove('armed'); onAdd(); } });
        b.addEventListener('click', () => { if (b._skip) { b._skip = false; return; } onSay(); });
        return b;
    }

    // Ключ для поиска: без регистра, «ё» как «е», без пробелов и дефисов
    function abcKey(s) {
        return String(s).toLowerCase().replace(/ё/g, 'е').replace(/[’ʼ`]/g, "'")
            .replace(/[^\p{L}\p{N}'\s-]/gu, ' ').replace(/[\s-]+/g, '');
    }

    // Словарь «Азбуки» — все слова текущего языка из всех категорий, включая «Мои слова» и дополнительный словарь
    function abcBuildDict() {
        const src = getActiveDictionary();
        const seen = new Set(), items = [];
        Object.keys(src).forEach(cat => (src[cat] || []).forEach(raw => {
            const w = cleanWord(String(raw)).replace(/[•\u0301]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
            const k = abcKey(w);
            if (!w || !k || seen.has(w)) return;
            seen.add(w);
            items.push({ w, k });
        }));
        abcLearned(currentLang).concat((ABC_FN[currentLang] || '').split(' ')).forEach(raw => {
            const w = String(raw).toLowerCase(), k = abcKey(w);
            if (w && k && !seen.has(w)) { seen.add(w); items.push({ w, k }); }
        });
        const col = new Intl.Collator(currentLang);
        items.sort((a, b) => col.compare(a.w, b.w));
        abcState.dict = items.map(x => x.w);
        abcState.keys = items.map(x => x.k);
        abcState.src = src;
    }

    function abcLev(a, b, max) {
        const n = a.length, m = b.length, lim = max || 99;
        if (Math.abs(n - m) > lim) return 99;
        let prev = Array.from({ length: m + 1 }, (_, j) => j);
        for (let i = 1; i <= n; i++) {
            const cur = [i];
            let rowMin = i;
            for (let j = 1; j <= m; j++) {
                const ca = a[i - 1], cb = b[j - 1];
                const sub = ca === cb ? 0 : (ABC_CONF.has(ca + cb) ? 0.5 : 1);
                const v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + sub);
                cur.push(v);
                if (v < rowMin) rowMin = v;
            }
            if (rowMin > lim) return 99;
            prev = cur;
        }
        return prev[m];
    }

    // Слова словаря, похожие на набранное (даже с ошибками): точное, начало слова, начало с опечаткой, слово с опечаткой
    function abcFuzzy(typed) {
        const q = abcKey(typed);
        if (!q) return [];
        const L = q.length, keys = abcState.keys, out = [];
        for (let i = 0; i < keys.length; i++) {
            const w = keys[i];
            let cat = 9, d = 0;
            if (w === q) cat = 0;
            else if (w.startsWith(q)) cat = 1;
            else if (L >= 3 && w.length >= L - 1) {
                const lim = L <= 3 ? 0.5 : 1;
                const dp = abcLev(q, w.slice(0, L), lim);
                if (dp <= lim) { cat = 2; d = dp; }
                else if (L >= 4 && Math.abs(w.length - L) <= 2) {
                    const maxd = L <= 4 ? 1 : L <= 6 ? 1.5 : 2;
                    const df = abcLev(q, w, maxd);
                    if (df <= maxd) { cat = 3; d = df; }
                }
            }
            if (cat < 9) out.push([cat, d, i]);
        }
        out.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
        return out.slice(0, 20).map(x => abcState.dict[x[2]]);
    }

    function abcMk(tag, cls, text, onclick) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        if (tag === 'button') e.type = 'button';
        if (onclick) e.onclick = onclick;
        return e;
    }

    // Озвучивает слова с учётом таблицы ударений; всю строку — как одну фразу
    function abcSpeak(words) {
        if (!words || !words.length) return;
        if (!('speechSynthesis' in window)) { alert(ex().ttsNo); return; }
        warmupSpeechSynthesis();
        window.speechSynthesis.cancel();
        const text = words.map(w => getPhoneticRepresentation(w) || w).join(' ');
        window.speechSynthesis.speak(makeUtterance(text, 1));
    }

    function abcPick(w) {
        abcState.line.push(w);
        abcOnl = { key: '', st: undefined };
        abcState.kbOff = false;   // после выбора слова панель букв возвращается
        abcState.prefix = '';
        abcState.typed = '';
        if (isChecked('autoSpeak')) abcSpeak([w]);
        abcRender();
    }

    function abcToggleMode() {
        const free = abcState.mode === 'free', pre = abcState.prefix;
        abcState.mode = free ? 'prefix' : 'free';
        abcState.prefix = '';
        abcState.typed = free ? '' : pre;   // уже набранное начало переносится в свободный набор
        try { localStorage.setItem('app_abc_mode', abcState.mode); } catch (e) {}
        abcRender();
    }

    function abcWordGrid(words) {
        const g = abcMk('div', 'abc-words');
        words.forEach(w => {
            const em = getWordEmoji(w);
            const label = (em ? em + ' ' : '') + w;
            g.append(abcTapOn() ? tapHoldBtn('abc-word', label, () => abcPick(w), () => abcSpeak([w])) : abcMk('button', 'abc-word', label, () => abcPick(w)));
        });
        return g;
    }

    // Клавиатура закреплена внизу экрана, найденные слова — над ней; её можно свернуть, чтобы увидеть больше слов
    function abcKeyboard(free, letters) {
        const t = abcT();
        const kb = abcMk('div', 'abc-kb'), kh = abcMk('div', 'abc-kbh');
        kh.append(
            abcMk('button', 'abc-kbt', abcState.kbOff ? '⌨️ ▴ ' + t.show : '⌨️ ▾ ' + t.hide, () => { abcState.kbOff = !abcState.kbOff; abcRender(); }),
            abcMk('button', 'abc-kbt', (free ? '🔤 ' : '✍️ ') + (free ? t.fit : t.free), abcToggleMode),
            kbSizeBtn(() => abcRender(true))
        );
        kb.append(kh);
        if (kbSmallOn()) kb.classList.add('kb-small');
        if (abcState.kbOff) return kb;
        const g = abcMk('div', 'abc-letters');
        letters.forEach(ch => g.append(abcMk('button', 'abc-letter', ch === "'" ? '’' : ch.toUpperCase(), () => {
            if (free) abcState.typed += ch; else abcState.prefix += ch;
            if (abcAutoHideOn()) abcState.kbOff = true;   // панель вернётся по кнопке «Показать буквы»
            abcRender();
        })));
        kb.append(g);
        return kb;
    }

    function abcRender(keepScroll) {
        const t = abcT();
        if (abcState.src !== getActiveDictionary()) abcBuildDict();   // словарь изменился («Мои слова»)
        const el = document.getElementById('abcScreen');
        el.innerHTML = '';
        const free = abcState.mode === 'free';

        // Собранная фраза: слова — кнопки, нажатие убирает слово (как в «Подсказке по сказанному»)
        const built = abcMk('div', 'abc-built');
        if (abcState.line.length) {
            const cw = abcMk('div', 'ph-chips abc-line');
            abcState.line.forEach((w, i) => {
                const c = abcMk('button', 'ph-chip', w + ' ✕', () => { abcState.line.splice(i, 1); abcRender(true); });
                c.setAttribute('aria-label', t.rmWord + ': ' + w);

            built.append(cw, abcMk('div', 'step-note abc-lhint', t.lineHint));

        el.append(built);
        if (abcState.line.length) {
            const r = abcMk('div', 'abc-row');
            r.append(
                abcMk('button', 'assist-btn abc-say', '🔊 ' + t.say, () => { abcSpeak(abcState.line); restAfterSpeech(); }),
                abcMk('button', 'assist-btn abc-del', '⌫', () => { abcState.line.pop(); abcState.kbOff = false; abcRender(true); })
            );
            el.append(r);
            const r2 = abcMk('div', 'abc-row');
            r2.append(
                abcMk('button', 'assist-btn abc-say', t.train, () => phrTrainFromHear(abcState.line.join(' '), 'abc')),
                abcMk('button', 'assist-btn abc-say abc-clr', '✖ ' + t.clear, () => { abcState.line = []; abcRender(true); })
            );
            el.append(r2);
        }

        // Короткие слова (я, в, на, не…): сворачиваемый блок сразу над строкой набора; нажатие добавляет слово во фразу
        const fnb = abcMk('button', 'abc-online abc-fnbtn', null, () => { abcState.fn = !abcState.fn; abcRender(true); });
        fnb.append(abcMk('span', 'abc-fnarr', abcState.fn ? '▼' : '▶'), abcMk('span', null, t.fnBtn));
        fnb.setAttribute('aria-expanded', abcState.fn ? 'true' : 'false');
        el.append(fnb);
        if (abcState.fn) {
            const fw = abcMk('div', 'abc-letters abc-fnk');
            (ABC_FN[currentLang] || '').split(' ').forEach(w => fw.append(abcMk('button', 'abc-letter abc-fnw', w, () => {
                abcState.line.push(w);
                abcState.fn = false; // короткие слова подряд обычно не идут — блок сворачивается
                if (isChecked('autoSpeak')) abcSpeak([w]);
                abcRender(true);
            })));
            el.append(fw);
        }

        let letters;
        if (free) {
            // Свободный набор: любые буквы, как человек себе представляет слово; приложение предлагает похожие слова
            const r = abcMk('div', 'abc-row');
            r.append(
                abcMk('div', 'abc-prefix', abcState.typed ? abcState.typed.toUpperCase() + '|' : '|'),
                abcMk('button', 'assist-btn abc-del', '⌫', () => { abcState.typed = abcState.typed.slice(0, -1); abcState.kbOff = false; abcRender(); })
            );
            if (abcState.typed) r.append(abcMk('button', 'assist-btn abc-del', '✖', () => { abcState.typed = ''; abcState.kbOff = false; abcRender(); }));
            el.append(r);
            const words = abcFuzzy(abcState.typed);
            if (words.length) {
                el.append(abcMk('div', 'abc-sec', t.words), abcWordGrid(words));
            } else if (abcKey(abcState.typed).length >= 3) {
                el.append(abcMk('div', 'abc-sec', t.none));
            } else if (!abcState.typed) {
                el.append(abcMk('div', 'abc-sec', t.type));
            }
            abcOnlineBlock(el, 't:' + abcState.typed, abcState.typed);
            letters = ABC_ALPHA_FULL[currentLang].split('');
        } else {
            const pre = abcState.prefix;
            if (!pre) {
                el.append(abcMk('div', 'abc-sec', t.hint));
                letters = ABC_ALPHA[currentLang].split('');
            } else {
                const r = abcMk('div', 'abc-row');
                r.append(
                    abcMk('div', 'abc-prefix', pre.toUpperCase() + '…'),
                    abcMk('button', 'assist-btn abc-del', '⌫', () => { abcState.prefix = pre.slice(0, -1); abcState.kbOff = false; abcRender(); })
                );
                el.append(r);
                const idx = [];
                abcState.keys.forEach((k, i) => { if (k.startsWith(pre)) idx.push(i); });
                if (!idx.length) {
                    el.append(abcMk('div', 'abc-sec', t.none));
                } else {
                    el.append(abcMk('div', 'abc-sec', t.words), abcWordGrid(idx.slice(0, 60).map(i => abcState.dict[i])));
                    if (idx.length > 60) el.append(abcMk('div', 'step-note', t.more.replace('{n}', idx.length)));
                }
                abcOnlineBlock(el, 'p:' + pre, pre);
                letters = [...new Set(idx.filter(i => abcState.keys[i].length > pre.length).map(i => abcState.keys[i][pre.length]))]
                    .filter(ch => /\p{L}/u.test(ch)).sort((a, b) => a.localeCompare(b, currentLang));
            }
        }
        el.append(abcKeyboard(free, letters));
        if (!keepScroll) window.scrollTo(0, 0);
    }

    function abcOpen() {
        let m = 'prefix';
        try { if (localStorage.getItem('app_abc_mode') === 'free') m = 'free'; } catch (e) {}
        Object.assign(abcState, { mode: m, prefix: '', typed: '', line: [], kbOff: false, fn: false });
        abcOnl = { key: '', st: undefined };
        abcBuildDict();
        abcRender();
    }

    // ----- Азбука: онлайн-поиск слов (бесплатно, без ключа): Викисловарь, для английского ещё Datamuse -----
    const ABC_WIKI = {
        ru: 'https://ru.wiktionary.org/w/api.php',
        uk: 'https://uk.wiktionary.org/w/api.php',
        en: 'https://en.wiktionary.org/w/api.php'
    };
    const ABC_RE = {
        ru: /^[а-я]+(?:-[а-я]+)?$/,
        uk: /^[а-щьюяєіїґ]+(?:['’ʼ-][а-щьюяєіїґ]+)?$/,
        en: /^[a-z]+(?:'[a-z]+)?$/
    };
    // Простая фильтрация нецензурной лексики (не исчерпывающая)
    const ABC_BAD = {
        ru: /хуй|хуе|хуи|хуя|пизд|бляд|бляц|блят|залуп|муда[кч]|пидор|пидар|гандон|шлюх|дерьм|говн|^(?:за|вы|по|на|съ|от|у|до|об|раз|рас|при)?еб|^жоп|^сук[аиуе]$/,
        uk: /хуй|хуї|хує|пизд|бляд|курв|гівн|мудак|підор|підар|шлюх|^жоп|^сук[аиуе]$|^(?:за|ви|по|на|від|у|до|об|роз|при)?їб/,
        en: /fuck|shit|cunt|bitch|asshole|pussy|whore|slut|bastard|nigg|^dick$|^cock$|^fag/
    };
    let abcOnl = { key: '', st: undefined };   // undefined | 'loading' | массив слов | { err }

    // Автосворачивание панели букв после каждого нажатия (настройка «Азбуки»)
    function abcAutoHideOn() {
        try { return localStorage.getItem('app_abc_autohide') === 'true'; } catch (e) { return false; }
    }

    function abcAutoHideChanged() {
        const on = document.getElementById('abcAutoHideChk').checked;
        try { localStorage.setItem('app_abc_autohide', on ? 'true' : 'false'); } catch (e) {}
    }

    function abcOnlineOn() {
        try { return localStorage.getItem('app_abc_online') === 'true'; } catch (e) { return false; }
    }

    function abcOnlineChanged() {
        const on = document.getElementById('abcOnlineChk').checked;
        try { localStorage.setItem('app_abc_online', on ? 'true' : 'false'); } catch (e) {}
        abcOnl = { key: '', st: undefined };
        if (screenName === 'abc') abcRender(true);
    }

    function abcOkWord(w, l) {
        w = String(w || '').toLowerCase().replace(/ё/g, 'е');
        return w.length >= 2 && w.length <= 24 && ABC_RE[l].test(w) && !ABC_BAD[l].test(w) ? w : null;
    }

    // Слова, выбранные из онлайн-результатов, запоминаются на устройстве и входят в словарь «Азбуки»
    function abcLearned(l) {
        try { return JSON.parse(localStorage.getItem('app_abc_learned_' + l)) || []; } catch (e) { return []; }
    }

    function abcLearn(w) {
        w = abcOkWord(w, currentLang);
        if (!w) return null;
        const a = abcLearned(currentLang).filter(x => x !== w);
        a.unshift(w);
        try { localStorage.setItem('app_abc_learned_' + currentLang, JSON.stringify(a.slice(0, 3000))); } catch (e) {}
        return w;
    }

    async function abcJget(url, ms) {
        const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), ms || 10000);
        try {
            const r = await fetch(url, { signal: ctl.signal });
            if (!r.ok) throw new Error('http');
            return await r.json();
        } finally { clearTimeout(tm); }
    }

    async function abcOnlineWords(query) {
        const q = abcKey(query);
        if (q.length < 2) return [];
        const enc = encodeURIComponent, base = ABC_WIKI[currentLang], l = currentLang, out = [];
        const add = w => { w = abcOkWord(w, l); if (w && !out.includes(w)) out.push(w); };
        const near = t => { t = abcOkWord(t, l); return t && (t.startsWith(q) || abcLev(q, t, 2) <= 2); };
        const tasks = [
            // продолжения слова
            abcJget(base + '?action=query&list=prefixsearch&pssearch=' + enc(q) + '&pslimit=10&format=json&origin=*')
                .then(j => ((j.query && j.query.prefixsearch) || []).forEach(x => add(x.title))),
            // «возможно, вы имели в виду» и похожие названия статей
            abcJget(base + '?action=query&list=search&srsearch=' + enc(q) + '&srnamespace=0&srlimit=8&srinfo=suggestion&srprop=&format=json&origin=*')
                .then(j => {
                    const s = j.query && j.query.searchinfo && j.query.searchinfo.suggestion;
                    if (s) String(s).split(/\s+/).forEach(add);
                    ((j.query && j.query.search) || []).forEach(x => { if (near(x.title)) add(x.title); });
                })
        ];
        if (l === 'en') tasks.push(abcJget('https://api.datamuse.com/sug?s=' + enc(q) + '&max=10').then(a => (a || []).forEach(x => add(x.word))));
        const res = await Promise.allSettled(tasks);
        if (res.every(r => r.status === 'rejected')) throw res[0].reason;
        out.sort((a, b) => (b === q) - (a === q) || (b.startsWith(q)) - (a.startsWith(q)) || abcLev(q, a, 3) - abcLev(q, b, 3));
        return out.slice(0, 10);
    }

    function abcOnlineBlock(box, key, query) {
        if (!abcOnlineOn() || !query || abcKey(query).length < 2) return;
        const t = abcT();
        if (abcOnl.key !== key) abcOnl = { key, st: undefined };

    const phr = { view: 'list', list: [], idx: -1, res: null, listening: false, msg: '', loadedLang: null, tmp: null, reveal: false, from: null };
    function phrCur() { return phr.idx >= 0 ? phr.list[phr.idx] : phr.tmp; }

    function phrLoad() {
        phr.loadedLang = currentLang;
        let a = [];

        phr.list = (Array.isArray(a) ? a : []).filter(x => x && typeof x.t === 'string' && x.t.trim())

    function phrAddText(raw) {
        const t = String(raw || '').replace(/\s+/g, ' ').trim().slice(0, 200);
        if (!t || phr.list.length >= 300) return false;
        if (phr.list.some(x => x.t.toLowerCase() === t.toLowerCase())) return false;
        phr.list.push({ t, n: 0, k: 0, l: 0 });
        return true;
    }

    // ----- сравнение по словам -----
    function phrWords(s) {
        return String(s).replace(/[“”«»"„]/g, ' ').split(/\s+/)
            .map(w => w.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '')).filter(Boolean);
    }
    function phrNorm(w) { return w.toLowerCase().replace(/ё/g, 'е').replace(/[’ʼ`]/g, "'"); }
    function phrSim(a, b) {
        if (a === b) return 1;
        const m = Math.max(a.length, b.length);
        return m ? Math.max(0, 1 - abcLev(a, b, m) / m) : 0;
    }
    // Выравнивание слов нужной фразы T и услышанной H (массивы нормализованных слов)
    function phrAlign(T, H) {
        const n = T.length, m = H.length, GAP = 0.8;
        const D = [], B = [];
        for (let i = 0; i <= n; i++) { D.push(new Array(m + 1).fill(0)); B.push(new Array(m + 1).fill(0)); }
        for (let i = 1; i <= n; i++) { D[i][0] = i * GAP; B[i][0] = 2; }
        for (let j = 1; j <= m; j++) { D[0][j] = j * GAP; B[0][j] = 3; }
        for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) {
            const s = phrSim(T[i - 1], H[j - 1]);
            const sub = D[i - 1][j - 1] + (s === 1 ? 0 : (s >= 0.5 ? 1 - s : 1));
            const del = D[i - 1][j] + GAP, ins = D[i][j - 1] + GAP;
            if (sub <= del && sub <= ins) { D[i][j] = sub; B[i][j] = 1; }
            else if (del <= ins) { D[i][j] = del; B[i][j] = 2; }
            else { D[i][j] = ins; B[i][j] = 3; }
        }
        const rows = [];
        let i = n, j = m;
        while (i > 0 || j > 0) {
            const b = B[i][j];
            if (b === 1) {
                const s = phrSim(T[i - 1], H[j - 1]);
                rows.push({ ti: i - 1, hi: j - 1, st: s === 1 ? 'ok' : (s >= 0.5 ? 'near' : 'bad') });
                i--; j--;
            } else if (b === 2) { rows.push({ ti: i - 1, hi: -1, st: 'miss' }); i--; }
            else { rows.push({ ti: -1, hi: j - 1, st: 'extra' }); j--; }
        }
        rows.reverse();
        return { rows, cost: D[n][m], ok: rows.filter(r => r.st === 'ok').length };
    }

    // Лучший из вариантов распознавания (браузер даёт до трёх)
    function phrCompare(target, alts) {
        const TW = phrWords(target), T = TW.map(phrNorm);
        let best = null, bestH = null;
        (alts.length ? alts : ['']).forEach(a => {
            const HW = phrWords(a), H = HW.map(phrNorm);
            const al = phrAlign(T, H);
            if (!best || al.ok > best.ok || (al.ok === best.ok && al.cost < best.cost)) { best = al; bestH = { HW, text: a }; }
        });
        const rows = best.rows.map(r => ({
            st: r.st,
            t: r.ti >= 0 ? TW[r.ti] : '',
            h: r.hi >= 0 ? bestH.HW[r.hi] : '',
            fixed: r.st === 'ok'
        }));
        return { rows, heard: bestH.text, nT: TW.length, k: best.ok, counted: false, spoken: false, pick: -1 };
    }

    // Варианты для слова: правильное + похожие по звучанию из словаря и слова этой же фразы
    function phrOptions(word, phraseWords) {
        const w = word.toLowerCase(), k = abcKey(w);
        if (abcState.src !== getActiveDictionary()) abcBuildDict();
        const near = [];
        for (let i = 0; i < abcState.keys.length; i++) {
            const kk = abcState.keys[i], dw = abcState.dict[i];
            if (kk === k || dw.indexOf(' ') >= 0 || kk.length < 2) continue;
            if (Math.abs(kk.length - k.length) > 2) continue;
            const d = abcLev(k, kk, 2);
            if (d <= 2) near.push([d, dw]);
        }
        near.sort((a, b) => a[0] - b[0]);
        const out = [w], seen = new Set([k]);
        const add = x => { const kx = abcKey(x); if (x && !seen.has(kx) && out.length < 5) { seen.add(kx); out.push(x.toLowerCase()); } };
        near.slice(0, 6).sort(() => Math.random() - 0.5).slice(0, 2).forEach(x => add(x[1]));
        phraseWords.filter(x => abcKey(x) !== k).sort(() => Math.random() - 0.5).slice(0, 1).forEach(add);
        // если вариантов мало, добавляем случайные слова близкой длины
        for (let g = 0; g < 40 && out.length < 4 && abcState.dict.length; g++) {
            const dw = abcState.dict[Math.floor(Math.random() * abcState.dict.length)];
            if (dw.indexOf(' ') < 0 && Math.abs(abcKey(dw).length - k.length) <= 2) add(dw);
        }
        return shuffleArray(out);
    }

    function phrSpeakText(text, slow) {
        if (micBusy()) return;
        if (!('speechSynthesis' in window)) { alert(ex().ttsNo); return; }
        warmupSpeechSynthesis();
        window.speechSynthesis.cancel();
        const words = phrWords(text);
        if (!words.length) return;
        if (slow) {
            words.forEach(w => window.speechSynthesis.speak(makeUtterance(getPhoneticRepresentation(w.toLowerCase()) || w, 0.7)));
        } else {
            window.speechSynthesis.speak(makeUtterance(words.map(w => getPhoneticRepresentation(w.toLowerCase()) || w).join(' '), 1));
        }
    }

            res.counted = allOk;
            phr.res = res;
            phrMark(allOk);
            phrRender(true);
            phrVoice(allOk ? 'ok' : (res.k > 0 ? 'part' : 'none'));
        });
    }
    function phrPick(rowIdx, word) {
        const row = phr.res.rows[rowIdx];

        }

    }

    // Голосом говорить, правильно ли сказано — общая настройка всех режимов (раньше отдельно у фраз и перечислений)

    function phrAddTmp() {
        const p = phr.tmp; if (!p) return;
        const ex = phr.list.findIndex(x => x.t.toLowerCase() === p.t.toLowerCase());
        if (ex >= 0) { phr.list[ex].n += p.n; phr.list[ex].k += p.k; phr.idx = ex; }

    function phrExport() {
        const data = { app: 'speechrehab-phrases', v: 1, lang: currentLang, phrases: phr.list.map(p => ({ t: p.t })) };

    function phrImport(file) {
        const rd = new FileReader();
        rd.onload = () => {
            let items = null;
            const txt = String(rd.result || '');
            try {
                const j = JSON.parse(txt);
                const arr = Array.isArray(j) ? j : (j && Array.isArray(j.phrases) ? j.phrases : null);
                if (arr) items = arr.map(x => typeof x === 'string' ? x : (x && x.t)).filter(x => typeof x === 'string');
            } catch (e) { /* не JSON: считаем обычным текстом */ }
            if (!items) items = txt.split(/\r?\n/);
            let n = 0;
            items.forEach(x => { if (phrAddText(x)) n++; });
            phrSave();
            phr.msg = n || items.some(x => String(x).trim()) ? phT().impOk.replace('{n}', n) : phT().impBad;
            phrRender(true);
        };
        rd.onerror = () => { phr.msg = phT().impBad; phrRender(true); };
        rd.readAsText(file);

    function wT() { return WR_T[currentLang] || WR_T.ru; }
    // Сколько первых букв подставлять подсказкой на уровне «Картинка» (0–3, по умолчанию 1)
    function wrGivenN() { try { const v = parseInt(localStorage.getItem('sr.wr.given'), 10); return [0, 1, 2, 3].includes(v) ? v : 1; } catch (e) { return 1; } }
    function wrAutoHideOn() { try { return localStorage.getItem('sr.wr.autohide') === 'true'; } catch (e) { return false; } }
    const wr = { level: 1, word: '', target: '', typed: '', given: 0, res: null, solved: false, recorded: false, shown: false, msg: '', noPhr: false, kbOff: false };

    function wrPic(w) { return (wordEmoji[currentLang] || {})[cleanWord(String(w)).toLowerCase()] || ''; }
    // Сравнение без учёта регистра, «ё/е», знаков препинания и дефисов; лишние пробелы не важны
    function wrNorm(x) {
        return String(x).toLowerCase().replace(/ё/g, 'е').replace(/[’ʼ`´]/g, "'").replace(/-/g, '')
            .replace(/[^\p{L}\p{N}' ]+/gu, ' ').replace(/\s+/g, ' ').trim();
    }
    function wrOpen() {
        let l = 1;
        try { l = parseInt(localStorage.getItem('sr.wr.level'), 10) || 1; } catch (e) {}
        wr.level = [1, 2, 3].includes(l) ? l : 1;
        wr.word = '';
        wrNew();

    function wrSetLevel(l) {
        wr.level = l;

    function wrNew(same) {
        if (!same) {
            const prev = wr.word;
            if (wr.level === 3) {
                if (phr.loadedLang !== currentLang) phrLoad();
                let list = phr.list.map(p => p.t);
                wr.noPhr = !list.length;
                if (!list.length) list = PHR_EXAMPLES[currentLang] || PHR_EXAMPLES.ru;
                let w = list[Math.floor(Math.random() * list.length)];
                for (let i = 0; i < 6 && w === prev && list.length > 1; i++) w = list[Math.floor(Math.random() * list.length)];
                wr.word = w;
            } else {
                let pool = getWordsFromCurrentCategory() || [];
                if (wr.level === 1) { const pics = pool.filter(wrPic); if (pics.length) pool = pics; }
                if (!pool.length) { wr.word = ''; wrRender(); return; }
                let w = pickProblemWord(pool);
                for (let i = 0; i < 6 && (!w || w === prev) ; i++) w = pool[Math.floor(Math.random() * pool.length)];
                wr.word = w;
            }
        }
        wr.target = wr.level === 3 ? String(wr.word).replace(/\s+/g, ' ').trim() : cleanWord(wr.word).replace(/\s+/g, ' ').trim();
        const tn = wrNorm(wr.target);
        wr.typed = tn.slice(0, Math.max(0, Math.min(wrGivenN(), tn.length - 1)));   // подсказка первых букв — на всех уровнях

    // Выравнивание написанного Y по нужному T: клетки в порядке написанного.
    // ok — верная буква; bad — неверная или лишняя (её можно заменить или убрать ⌫); miss — пропущенная (пустая рамка)
    function wrAlign(T, Y) {
        const n = T.length, m = Y.length, D = [];
        for (let i = 0; i <= n; i++) { D.push(new Array(m + 1).fill(0)); D[i][0] = i; }
        for (let j = 0; j <= m; j++) D[0][j] = j;
        for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++)
            D[i][j] = Math.min(D[i - 1][j] + 1, D[i][j - 1] + 1, D[i - 1][j - 1] + (T[i - 1] === Y[j - 1] ? 0 : 1));
        const cells = [];

  // у каждого услышанного слова: оно само (вес 1) и исправления из большого словаря (вес 0,9)
  const pm=pronMap();
  const groups=tk.map(w=>[[w,1],...(pm.has(w)?[[pm.get(w),1]]:[]),...lexRepairs(w).map(r=>[r,0.9])]);
  // выбранное раньше при похожем произношении: средняя близость слов «как говорил» к услышанному
  const assoc=new Map();
  for(const a of P.a){
    const hw=a.h.split(' ');let sum=0;
    for(const w of hw){let b=0;for(const t of tk)b=Math.max(b,wordSim(t,w));sum+=b}
    const sim=sum/Math.max(hw.length,tk.length);
    if(sim>=0.6){const bonus=sim*Math.min(1,Math.log2(a.n+1)/1.5);assoc.set(a.k,Math.max(assoc.get(a.k)||0,bonus))}
  }
  const res=[],seenK=new Set(),byK=new Map();
  const extra=c=>{
    const k=pkey(c.text),f=fmap.get(k);
    let b=f?0.06*Math.min(3,Math.log2(f.n+1)):0;           // часто выбирали — выше
    if(ctxW.size){let sh=0;c.w.forEach(v=>{if(ctxW.has(v))sh++});b+=Math.min(0.12,0.04*sh)}   // слова из только что сказанного
    b+=0.5*(assoc.get(k)||0);                                // уже было так же искажено и выбрано это
    return {b,f,k};
  };
  for(const c of IDX){
    let m=0;const used=new Set();
    for(const g of groups){
      let best=0,bi=-1;
      c.w.forEach((v,i)=>{if(used.has(i))return;for(const [w,f] of g){const sm=wordSim(w,v)*f;if(sm>best){best=sm;bi=i}}});
      if(bi>=0&&best>=0.5){used.add(bi);m+=best}
    }
    const x=extra(c);
    if(m<0.7&&!(m>=0.5&&x.f)&&!assoc.has(x.k))continue;
    seenK.add(x.k);
    const ent={c:x.f?{...c,pk:x.f.n}:c,score:2*m/(groups.length+c.w.length)+0.05*m+x.b};
    byK.set(x.k,ent);res.push(ent);
  }
  // Выравнивание по порядку и количеству слов: незнакомые слова становятся «дырками», опорой служат близкие к реальным слова
  const Hn=all.map(w=>applyPronTok(w,pm));
  if(Hn.length){
    const corp=corpus();
    IDX.forEach((c,ci)=>{
      const P=corp.full[ci];if(!P)return;
      let near=false;for(const w of Hn){if(!isStopW(w)){for(const v of P)if(sm(w,v)>=0.7){near=true;break}}if(near)break}
      if(!near)return;
      const al=alignPhrase(Hn,P);if(al.anchors<1||al.score<0.5)return;
      const x=extra(c),sc=al.score+x.b,old=byK.get(x.k);
      if(old){if(sc>old.score)old.score=sc}
      else{const ent={c:x.f?{...c,pk:x.f.n}:c,score:sc};byK.set(x.k,ent);seenK.add(x.k);res.push(ent)}
    });
  }
  // выбранные раньше фразы, которых нет в словаре (например, найденные онлайн), но связь с услышанным есть
  for(const [k,b] of assoc){
    if(seenK.has(k))continue;
    const f=fmap.get(k)||P.a.find(a=>a.k===k);if(!f)continue;
    res.push({c:{text:f.s,e:f.e,crit:false,w:toks(f.s),pk:(fmap.get(k)||{}).n||1},score:0.5*b+0.3});
  }
  res.sort((a,b)=>b.score-a.score||a.c.text.length-b.c.text.length);
  return res.slice(0,6).map(x=>x.c);
}

    const WIKI={ru:'https://ru.wiktionary.org/w/api.php',uk:'https://uk.wiktionary.org/w/api.php',en:'https://en.wiktionary.org/w/api.php'};
async function jget(url,ms){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms||10000);
  try{
    const r=await fetch(url,{signal:ctl.signal});

  }finally{clearTimeout(tm)}
}
const okWord=(w,l)=>{w=String(w||'').toLowerCase().replace(/ё/g,'е');return w.length>=2&&w.length<=24&&LEX_RE[l].test(w)&&!LEX_BAD[l].test(w)?w:null};
// Слова, которые «выучило» приложение (выбранные из онлайн-результатов): хранятся на телефоне и входят в словарь
function getLearned(l){try{return JSON.parse(localStorage.getItem('sr.learn.'+l))||[]}catch(e){return []}}
function learnWord(w){
  w=okWord(w,lang);if(!w)return;
  const a=getLearned(lang).filter(x=>x!==w);a.unshift(w);
  try{localStorage.setItem('sr.learn.'+lang,JSON.stringify(a.slice(0,3000)))}catch(e){}

async function onlineWords(q){
  q=norm(q).replace(/[\s-]+/g,'');
  if(q.length<2)return [];
  const enc=encodeURIComponent,base=WIKI[lang],out=[];
  const add=w=>{w=okWord(w,lang);if(w&&!out.includes(w))out.push(w)};
  const near=t=>{t=okWord(t,lang);return t&&(t.startsWith(q)||levw(q,t,2)<=2)};
  const tasks=[
    // продолжения слова
    jget(base+'?action=query&list=prefixsearch&pssearch='+enc(q)+'&pslimit=10&format=json&origin=*')
      .then(j=>((j.query&&j.query.prefixsearch)||[]).forEach(x=>add(x.title))),
    // «возможно, вы имели в виду» и похожие названия статей
    jget(base+'?action=query&list=search&srsearch='+enc(q)+'&srnamespace=0&srlimit=8&srinfo=suggestion&srprop=&format=json&origin=*')
      .then(j=>{
        const s=j.query&&j.query.searchinfo&&j.query.searchinfo.suggestion;
        if(s)String(s).split(/\s+/).forEach(add);
        ((j.query&&j.query.search)||[]).forEach(x=>{if(near(x.title))add(x.title)});
      })
  ];
  if(lang==='en')tasks.push(jget('https://api.datamuse.com/sug?s='+enc(q)+'&max=10').then(a=>(a||[]).forEach(x=>add(x.word))));
  const res=await Promise.allSettled(tasks);
  if(res.every(r=>r.status==='rejected'))throw res[0].reason;
  out.sort((a,b)=>(b===q)-(a===q)||(b.startsWith(q))-(a.startsWith(q))||levw(q,a,3)-levw(q,b,3));
  return out.slice(0,10);
}
