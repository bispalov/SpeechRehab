<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Слуховая дифференциация: 1000+ Слов</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#141923">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --label-color: #555555;
            --input-bg: #ffffff;
            --input-border: #cccccc;
            --word-box-bg: #e9ecef;
            --option-btn-bg: #ffffff;
            --option-btn-text: #007bff;
            --option-btn-border: #007bff;
            --option-btn-hover: #e7f1ff;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --label-color: #aaaaaa;
            --input-bg: #2d2d2d;
            --input-border: #444444;
            --word-box-bg: #2a2a2a;
            --option-btn-bg: #2d2d2d;
            --option-btn-text: #4da3ff;
            --option-btn-border: #4da3ff;
            --option-btn-hover: #384756;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px var(--shadow);
            text-align: center;
            box-sizing: border-box;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        h1 {
            color: var(--text-color);
            font-size: 20px;
            margin: 0;
        }
        .theme-toggle-btn {
            background: none;
            border: 1px solid var(--input-border);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            width: auto;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .control-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        label {
            font-weight: bold;
            color: var(--label-color);
            font-size: 14px;
            margin-bottom: 4px;
        }
        select, input[type="range"], button {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            width: 100%;
            box-sizing: border-box;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .slider-container span {
            font-weight: bold;
            color: var(--text-color);
            min-width: 45px;
        }
        .card {
            margin: 15px 0;
            padding: 20px;
            background-color: var(--word-box-bg);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s;
        }
        .speak-main-btn {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            padding: 15px;
        }
        .speak-main-btn:hover {
            background-color: #218838;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: 15px;
        }
        .option-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .option-btn {
            flex-grow: 1;
            background-color: var(--option-btn-bg);
            border: 2px solid var(--option-btn-border);
            color: var(--option-btn-text);
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            padding: 12px;
            text-align: center;
        }
        .option-btn:hover {
            background-color: var(--option-btn-hover);
        }
        .option-btn.correct {
            background-color: #28a745 !important;
            color: white !important;
            border-color: #28a745 !important;
        }
        .option-btn.wrong {
            background-color: #dc3545 !important;
            color: white !important;
            border-color: #dc3545 !important;
        }
        .audio-btn {
            width: 50px;
            flex-shrink: 0;
            background-color: #17a2b8;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .audio-btn:hover {
            background-color: #138496;
        }
        .next-btn {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
        .stats-row {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }
        .stat-box {
            flex: 1;
            background-color: var(--word-box-bg);
            border-radius: 8px;
            padding: 10px;
            font-weight: bold;
            font-size: 15px;
        }
        .stat-box.correct-stat {
            color: #28a745;
        }
        .stat-box.total-stat {
            color: var(--option-btn-text);
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: var(--label-color);
            font-size: 14px;
            cursor: pointer;
        }
        .checkbox-label input[type="checkbox"] {
            width: auto;
            padding: 0;
        }
        .timer-inputs {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .timer-inputs > div {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .timer-inputs label {
            margin-bottom: 2px;
            font-size: 12px;
        }
        .timer-status-row {
            display: flex;
            gap: 10px;
            width: 100%;
            align-items: center;
        }
        .timer-display {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            background-color: var(--word-box-bg);
            font-weight: bold;
            text-align: center;
            font-size: 15px;
            transition: background-color 0.3s, color 0.3s;
        }
        .timer-display.resting {
            background-color: #ffc107;
            color: #333333;
        }
        .timer-pause-btn {
            width: auto;
            flex-shrink: 0;
            background-color: var(--option-btn-bg);
            color: var(--option-btn-text);
            border: 2px solid var(--option-btn-border);
            font-weight: bold;
            padding: 10px 14px;
        }
        .container.resting-blocked {
            pointer-events: none;
            opacity: 0.5;
        }
        .rest-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }
        .rest-overlay.hidden {
            display: none;
        }
        .rest-overlay-content {
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        .rest-overlay-content .rest-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .rest-overlay-content h2 {
            margin: 0 0 10px 0;
            color: var(--text-color);
        }
        .rest-overlay-content p {
            font-size: 18px;
            margin: 10px 0 20px 0;
        }
        .rest-overlay-content button {
            background-color: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="restOverlay" class="rest-overlay hidden">
    <div class="rest-overlay-content">
        <div class="rest-icon">☕</div>
        <h2>Время отдыха</h2>
        <p>Осталось: <span id="restTimeLeft">10:00</span></p>
        <button onclick="skipRest()">Продолжить игру сейчас</button>
    </div>
</div>

<div class="container">
    <div class="header-row">
        <h1>Слуховая дифференциация</h1>
        <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()">☀️ Светлая</button>
    </div>

    <div class="stats-row">
        <div class="stat-box correct-stat">✅ Правильно: <span id="correctCount">0</span></div>
        <div class="stat-box total-stat">📝 Всего: <span id="totalCount">0</span></div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="categorySelect">Выберите категорию:</label>
            <select id="categorySelect" onchange="changeCategory()">
                <!-- Категории загружаются автоматически -->
            </select>
        </div>

        <div class="control-group">
            <label for="voiceSelect">Пол голоса (Русский):</label>
            <select id="voiceSelect">
                <option value="male" selected>👨 Мужской</option>
                <option value="female">👩 Женский</option>
            </select>
        </div>

        <div class="control-group">
            <label for="rateRange">Скорость речи:</label>
            <div class="slider-container">
                <input type="range" id="rateRange" min="0.5" max="1.5" step="0.1" value="0.9" oninput="updateRateLabel(this.value)">
                <span id="rateValue">0.9x</span>
            </div>
        </div>

        <div class="control-group">
            <label class="checkbox-label" for="timerEnabled">
                <input type="checkbox" id="timerEnabled" checked onchange="toggleTimerFeature()">
                Использовать таймер «игра / отдых»
            </label>
        </div>

        <div class="control-group" id="timerSettingsGroup">
            <label>Длительность (минуты):</label>
            <div class="timer-inputs">
                <div>
                    <label for="playMinutes">🎮 Игра</label>
                    <input type="number" id="playMinutes" min="1" max="60" value="5" onchange="updateTimerSettings()">
                </div>
                <div>
                    <label for="restMinutes">☕ Отдых</label>
                    <input type="number" id="restMinutes" min="1" max="60" value="10" onchange="updateTimerSettings()">
                </div>
            </div>
        </div>

        <div class="control-group">
            <div class="timer-status-row">
                <div class="timer-display" id="timerDisplay">🎮 Игра: 05:00</div>
                <button class="timer-pause-btn" id="timerPauseBtn" onclick="toggleTimerPause()">⏸ Пауза</button>
            </div>
        </div>
    </div>

    <div class="card">
        <button class="speak-main-btn" onclick="speakWord(targetWord)">🔊 Прослушать загаданное слово</button>
    </div>

    <label>Выберите слово, которое вы услышали (все варианты — реальные слова):</label>
    <div class="options-grid" id="optionsContainer">
        <!-- Варианты ответов загружаются автоматически -->
    </div>

    <button class="next-btn" onclick="nextQuestion()">Следующее слово ➔</button>
</div>

        "Дочь": ["Ночь", "Печь", "Дичь", "Дрожь"],
        "Брат": ["Брад", "Брак", "Враг", "Град"],
        "Бык": ["Бок", "Бак", "Бук", "Рык"],
        "Рыба": ["Липа", "Лапа", "Рыбачка", "Роба"],
        "Лук": ["Люк", "Сук", "Бук", "Жук"],
        "Мак": ["Рак", "Бак", "Лак", "Так"],
        "Книга": ["Фига", "Лига", "Миг", "Крик"],
        "Песня": ["Пеня", "Перст", "Перья", "Печь"],
        "Мыло": ["Шило", "Мило", "Мел", "Муло"],
        "Сад": ["Суд", "Зад", "Град", "Лад"],
        "Цветы": ["Кусты", "Листы", "Мосты", "Черты"]
    };

    let targetWord = "";
    let voices = [];
    let maleVoices = [];
    let femaleVoices = [];
    let isAnswered = false;

    let correctCount = 0;
    let totalCount = 0;

    // --- Таймер "игра / отдых" ---
    let timerEnabled = true;
    let playSeconds = 5 * 60;
    let restSeconds = 10 * 60;
    let remainingSeconds = playSeconds;
    let timerMode = 'play'; // 'play' | 'rest'
    let timerPaused = false;

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const themeBtn = document.getElementById('themeBtn');

        if (currentTheme === 'dark') {
            document.documentElement.removeAttribute('data-theme');
            themeBtn.innerHTML = '🌙 Темная';
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeBtn.innerHTML = '☀️ Светлая';
        }
    }

    function getRealDistractors(word, currentCategory) {
        if (realWordPairs[word]) {
            let pool = [...realWordPairs[word]];
            pool.sort(() => Math.random() - 0.5);
            return pool.slice(0, 3);
        }

        let allWords = [];
        for (let cat in dictionary) {
            allWords.push(...dictionary[cat]);
        }

        let candidates = allWords.filter(w => 
            w !== word && 
            Math.abs(w.length - word.length) <= 2 &&
            w.charAt(0).toLowerCase() === word.charAt(0).toLowerCase()
        );

        if (candidates.length < 3) {
            candidates = allWords.filter(w => w !== word && Math.abs(w.length - word.length) <= 2);
        }

        candidates.sort(() => Math.random() - 0.5);
        return candidates.slice(0, 3);
    }

    function updateRateLabel(val) {
        document.getElementById('rateValue').textContent = val + 'x';
    }

    // Ключевые слова для распознавания пола голоса в его системном имени.
    // Список расширен именами, которые встречаются в голосах Android (Google TTS),
    // Windows и iOS.
    const maleVoiceHints = [
        'pavel', 'dmitry', 'dmitri', 'alexander', 'aleksandr', 'ivan', 'boris',
        'vladimir', 'nikolai', 'nikolay', 'yuri', 'yuriy', 'maxim', 'artemiy',
        'artem', 'sergey', 'sergei', 'egor', 'anton', 'male', 'муж', 'мужской',
        'dfc', 'rud'
    ];
    const femaleVoiceHints = [
        'milena', 'elena', 'irina', 'ekaterina', 'katya', 'anna', 'olga',
        'tatiana', 'tatyana', 'anastasia', 'victoria', 'svetlana', 'maria',
        'mariya', 'natasha', 'natalia', 'female', 'жен', 'женский'
    ];

    function classifyVoiceGender(voice) {
        const name = voice.name.toLowerCase();
        if (maleVoiceHints.some(hint => name.includes(hint))) return 'male';
        if (femaleVoiceHints.some(hint => name.includes(hint))) return 'female';
        return 'unknown';
    }

    function populateVoiceList() {
        if (!('speechSynthesis' in window)) return;

        const allVoices = speechSynthesis.getVoices();
        if (!allVoices || allVoices.length === 0) return;
        voices = allVoices;

        // Строгая фильтрация ТОЛЬКО по русскоязычным голосам
        const ruVoices = voices.filter(voice => {
            const lang = voice.lang.toLowerCase().replace('_', '-');
            return lang.startsWith('ru');
        });

        const male = [];
        const female = [];
        const unknown = [];

        ruVoices.forEach(voice => {
            const gender = classifyVoiceGender(voice);
            if (gender === 'male') male.push(voice);
            else if (gender === 'female') female.push(voice);
            else unknown.push(voice);
        });

        // На многих Android-устройствах доступен только один системный
        // русскоязычный голос без указания пола в названии. В этом случае
        // используем его для обеих ролей — слышимая разница всё равно
        // достигается изменением тембра (pitch) в speakWord().
        maleVoices = male.length ? male : (unknown.length ? [unknown[0]] : ruVoices.slice(0, 1));
        femaleVoices = female.length ? female : (unknown.length ? [unknown[unknown.length - 1]] : ruVoices.slice(0, 1));
    }

    populateVoiceList();
    if ('speechSynthesis' in window) {
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }

        // На части Android-браузеров/WebView событие onvoiceschanged не
        // срабатывает вовремя (или вообще), поэтому дополнительно опрашиваем
        // список голосов в течение первых нескольких секунд после загрузки.
        let voiceCheckAttempts = 0;
        const voiceCheckInterval = setInterval(() => {
            voiceCheckAttempts++;
            const currentVoices = speechSynthesis.getVoices();
            if (currentVoices.length > 0) {
                populateVoiceList();
            }
            if (currentVoices.length > 0 || voiceCheckAttempts >= 10) {
                clearInterval(voiceCheckInterval);
            }
        }, 300);
    }

    function speakWord(textToSpeak) {
        if (!textToSpeak || !('speechSynthesis' in window)) return;

        // Явный cancel перед новой репликой нужен и на Android, иначе
        // очередь озвучки может "зависнуть" после нескольких нажатий подряд.
        speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(textToSpeak);

        // Обязательно фиксируем язык для Android TTS
        utterance.lang = 'ru-RU';

        const voiceSelect = document.getElementById('voiceSelect');
        const gender = voiceSelect ? voiceSelect.value : 'male';
        const voicePool = gender === 'female' ? femaleVoices : maleVoices;

        if (voicePool && voicePool.length > 0) {
            utterance.voice = voicePool[0];
        }

        // Подстройка тембра гарантирует слышимую разницу между мужским и
        // женским вариантом даже тогда, когда на устройстве физически
        // доступен только один русский системный голос (частый случай на
        // Android).
        utterance.pitch = gender === 'female' ? 1.25 : 0.85;

        const rateRange = document.getElementById('rateRange');
        utterance.rate = parseFloat(rateRange.value) || 0.9;

        speechSynthesis.speak(utterance);
    }

    function updateStatsDisplay() {
        const correctEl = document.getElementById('correctCount');
        const totalEl = document.getElementById('totalCount');
        if (correctEl) correctEl.textContent = correctCount;
        if (totalEl) totalEl.textContent = totalCount;
    }

    function formatTime(totalSec) {
        const safeSec = Math.max(0, Math.round(totalSec));
        const m = Math.floor(safeSec / 60).toString().padStart(2, '0');
        const s = Math.floor(safeSec % 60).toString().padStart(2, '0');
        return m + ':' + s;
    }

    function setGameInteractionEnabled(enabled) {
        const container = document.querySelector('.container');
        if (container) {
            container.classList.toggle('resting-blocked', !enabled);
        }
    }

    function updateTimerDisplay() {
        const display = document.getElementById('timerDisplay');
        if (display) {
            if (timerMode === 'rest') {
                display.textContent = '☕ Отдых: ' + formatTime(remainingSeconds);
                display.classList.add('resting');
            } else {
                display.textContent = '🎮 Игра: ' + formatTime(remainingSeconds);
                display.classList.remove('resting');
            }
        }

        const restTimeLeftEl = document.getElementById('restTimeLeft');
        if (restTimeLeftEl) {
            restTimeLeftEl.textContent = formatTime(remainingSeconds);
        }
    }

    function enterRestMode() {
        timerMode = 'rest';
        remainingSeconds = restSeconds;

        if ('speechSynthesis' in window) {
            speechSynthesis.cancel();
        }

        setGameInteractionEnabled(false);
        const overlay = document.getElementById('restOverlay');
        if (overlay) overlay.classList.remove('hidden');

        updateTimerDisplay();
    }

    function exitRestMode() {
        timerMode = 'play';
        remainingSeconds = playSeconds;

        setGameInteractionEnabled(true);
        const overlay = document.getElementById('restOverlay');
        if (overlay) overlay.classList.add('hidden');

        updateTimerDisplay();

        // После перерыва даём свежее слово, чтобы игра продолжилась заново
        nextQuestion();
    }

    function skipRest() {
        if (timerMode === 'rest') {
            exitRestMode();
        }
    }

    function toggleTimerPause() {
        timerPaused = !timerPaused;
        const btn = document.getElementById('timerPauseBtn');
        if (btn) btn.textContent = timerPaused ? '▶ Продолжить' : '⏸ Пауза';
    }

    function toggleTimerFeature() {
        const checkbox = document.getElementById('timerEnabled');
        timerEnabled = checkbox ? checkbox.checked : true;

        const settingsGroup = document.getElementById('timerSettingsGroup');
        if (settingsGroup) {
            settingsGroup.style.opacity = timerEnabled ? '1' : '0.5';
        }

        const pauseBtn = document.getElementById('timerPauseBtn');
        if (pauseBtn) pauseBtn.disabled = !timerEnabled;

        if (!timerEnabled) {
            // Выключаем принудительные перерывы, но не трогаем счёт игры
            if (timerMode === 'rest') {
                exitRestMode();
            }
        } else {
            timerMode = 'play';
            remainingSeconds = playSeconds;
        }

        updateTimerDisplay();
    }

    function updateTimerSettings() {
        const playInput = document.getElementById('playMinutes');
        const restInput = document.getElementById('restMinutes');

        const playMin = playInput ? parseFloat(playInput.value) : 5;
        const restMin = restInput ? parseFloat(restInput.value) : 10;

        playSeconds = Math.max(1, playMin || 5) * 60;
        restSeconds = Math.max(1, restMin || 10) * 60;

        // Применяем новую длительность к активному сейчас режиму сразу,
        // чтобы изменения были понятны без ожидания следующего цикла.
        remainingSeconds = timerMode === 'rest' ? restSeconds : playSeconds;
        updateTimerDisplay();
    }

    function startMasterTimer() {
        updateTimerDisplay();
        setInterval(() => {
            if (!timerEnabled || timerPaused) return;

            remainingSeconds--;

            if (remainingSeconds <= 0) {
                if (timerMode === 'play') {
                    enterRestMode();
                } else {
                    exitRestMode();
                }
            } else {
                updateTimerDisplay();
            }
        }, 1000);
    }

    function initCategories() {
        const categorySelect = document.getElementById('categorySelect');
        categorySelect.innerHTML = '';

        const allOption = document.createElement('option');
        allOption.value = 'ALL';
        allOption.textContent = '📚 Все категории (весь словарь)';
        categorySelect.appendChild(allOption);

        for (let category in dictionary) {
            const option = document.createElement('option');
            option.value = category;
            option.textContent = category;
            categorySelect.appendChild(option);
        }

        categorySelect.value = 'ALL';
        nextQuestion();
    }

    function changeCategory() {
        nextQuestion();
    }

    function nextQuestion() {
        isAnswered = false;
        const categorySelect = document.getElementById('categorySelect');
        const selectedCategory = categorySelect.value;

        let words;
        if (selectedCategory === 'ALL') {
            const combinedWords = [];
            for (let cat in dictionary) {
                combinedWords.push(...dictionary[cat]);
            }
            // Убираем дубликаты (некоторые слова встречаются в нескольких категориях)
            words = [...new Set(combinedWords)];
        } else {
            words = dictionary[selectedCategory];
        }

        if (!words || words.length === 0) return;

        const randomIndex = Math.floor(Math.random() * words.length);
        targetWord = words[randomIndex];

        const wrongOptions = getRealDistractors(targetWord, selectedCategory);

        let options = [targetWord, ...wrongOptions];
        options.sort(() => Math.random() - 0.5);

        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';

        options.forEach(optionText => {
            const row = document.createElement('div');
            row.className = 'option-row';

            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = optionText;
            btn.onclick = () => checkAnswer(btn, optionText);

            const audioBtn = document.createElement('button');
            audioBtn.className = 'audio-btn';
            audioBtn.innerHTML = '🔊';
            audioBtn.title = 'Прослушать вариант';
            audioBtn.onclick = (e) => {
                e.stopPropagation();
                speakWord(optionText);
            };

            row.appendChild(btn);
            row.appendChild(audioBtn);
            container.appendChild(row);
        });

        setTimeout(() => speakWord(targetWord), 300);
    }

    function checkAnswer(selectedBtn, selectedText) {
        if (isAnswered) return;
        isAnswered = true;

        totalCount++;
        const isCorrect = selectedText === targetWord;
        if (isCorrect) {
            correctCount++;
        }
        updateStatsDisplay();

        const allButtons = document.querySelectorAll('.option-btn');

        if (isCorrect) {
            selectedBtn.classList.add('correct');
        } else {
            selectedBtn.classList.add('wrong');
            allButtons.forEach(btn => {
                if (btn.textContent === targetWord) {
                    btn.classList.add('correct');
                }
            });
        }
    }

    window.onload = function() {
        initCategories();
        startMasterTimer();
    };
</script>
