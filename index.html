<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditory Differentiation & Speech Trainer</title>
    <link rel="manifest" href="/SpeechRehab/manifest.json">
    <meta name="theme-color" content="#141923">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --label-color: #555555;
            --input-bg: #ffffff;
            --input-border: #cccccc;
            --word-box-bg: #e9ecef;
            --option-btn-bg: #ffffff;
            --option-btn-text: #007bff;
            --option-btn-border: #007bff;
            --option-btn-hover: #e7f1ff;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --label-color: #aaaaaa;
            --input-bg: #2d2d2d;
            --input-border: #444444;
            --word-box-bg: #2a2a2a;
            --option-btn-bg: #2d2d2d;
            --option-btn-text: #4da3ff;
            --option-btn-border: #4da3ff;
            --option-btn-hover: #384756;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px var(--shadow);
            text-align: center;
            box-sizing: border-box;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }
        h1 {
            color: var(--text-color);
            font-size: 18px;
            margin: 0;
            text-align: left;
            flex-grow: 1;
        }
        .app-title {
            font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
            font-size: 1.5em;
            font-weight: 700;
            font-style: italic;
            letter-spacing: 0.4px;
            line-height: 1.2;
            text-align: center;
            flex-grow: 0;
            margin: 0 0 14px;
            color: #4a90e2;
            background: linear-gradient(90deg, #4a90e2, #8e5bd8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .home-btn {
            width: auto;
            flex: 0 0 auto;
            margin: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 22px;
            padding: 9px 18px;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(74, 144, 226, 0.45);
        }
        .header-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-left: auto;
        }
        .header-btns .settings-toggle-btn { white-space: nowrap; }
        @media (max-width: 440px) {
            .header-btns { gap: 6px; }
            .header-btns .settings-toggle-btn { padding: 6px 9px; font-size: 0.85em; }
        }
        .settings-toggle-btn {
            background: var(--option-btn-bg);
            border: 1px solid var(--option-btn-border);
            color: var(--option-btn-text);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            width: auto;
        }
        .controls {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .settings-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: var(--word-box-bg);
            padding: 15px;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .settings-panel.hidden {
            display: none;
        }
        .control-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        label {
            font-weight: bold;
            color: var(--label-color);
            font-size: 14px;
            margin-bottom: 4px;
        }
        select, input[type="range"], button {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            width: 100%;
            box-sizing: border-box;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .slider-container span {
            font-weight: bold;
            color: var(--text-color);
            min-width: 45px;
        }
        .card {
            margin: 15px 0;
            padding: 20px;
            background-color: var(--word-box-bg);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: background-color 0.3s;
        }
        .speak-main-btn {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            padding: 15px;
        }
        .speak-main-btn:hover {
            background-color: #218838;
        }
        .record-btn {
            background-color: #17a2b8;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            padding: 10px;
        }
        .record-btn.recording {
            background-color: #dc3545;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        .speech-result-box {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            box-sizing: border-box;
            margin-top: 5px;
            display: none;
            word-break: break-word;
        }
        .speech-result-box.correct {
            display: block;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .speech-result-box.incorrect {
            display: block;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .speech-result-box.info {
            display: block;
            background-color: #e2e3e5;
            color: #383d41;
            border: 1px solid #d6d8db;
        }
        .extra-panel {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border-radius: 6px;
            background: var(--word-box-bg);
            color: var(--text-color);
            font-size: 14px;
            margin-top: 5px;
        }
        .extra-panel.hidden { display: none; }
        mark.diff-bad {
            background: #ffd54f;
            color: #000;
            border-radius: 3px;
            padding: 0 2px;
        }
        .diff-row { margin-top: 6px; font-weight: bold; letter-spacing: 1px; }
        .stats-table { width: 100%; border-collapse: collapse; margin: 4px 0 8px; }
        .stats-table td { padding: 3px 4px; border-bottom: 1px solid var(--input-border); }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: 15px;
        }
        .option-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .option-btn {
            flex-grow: 1;
            background-color: var(--option-btn-bg);
            border: 2px solid var(--option-btn-border);
            color: var(--option-btn-text);
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            padding: 12px;
            text-align: center;
        }
        .option-btn:hover {
            background-color: var(--option-btn-hover);
        }
        .option-btn.correct {
            background-color: #28a745 !important;
            color: white !important;
            border-color: #28a745 !important;
        }
        .option-btn.wrong {
            background-color: #dc3545 !important;
            color: white !important;
            border-color: #dc3545 !important;
        }
        .audio-btn {
            width: 50px;
            flex-shrink: 0;
            background-color: #17a2b8;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .audio-btn:hover {
            background-color: #138496;
        }
        .next-btn {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
        .stats-row {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }
        .stat-box {
            flex: 1;
            background-color: var(--word-box-bg);
            border-radius: 8px;
            padding: 10px;
            font-weight: bold;
            font-size: 15px;
        }
        .stat-box.correct-stat {
            color: #28a745;
        }
        .stat-box.total-stat {
            color: var(--option-btn-text);
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: var(--label-color);
            font-size: 14px;
            cursor: pointer;
        }
        .checkbox-label input[type="checkbox"] {
            width: auto;
            padding: 0;
        }
        .timer-inputs {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .timer-inputs > div {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .timer-inputs label {
            margin-bottom: 2px;
            font-size: 12px;
        }
        .timer-status-row {
            display: flex;
            gap: 10px;
            width: 100%;
            align-items: center;
        }
        .timer-display {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            background-color: var(--word-box-bg);
            font-weight: bold;
            text-align: center;
            font-size: 15px;
            transition: background-color 0.3s, color 0.3s;
        }
        .timer-display.resting {
            background-color: #ffc107;
            color: #333333;
        }
        .timer-pause-btn {
            width: auto;
            flex-shrink: 0;
            background-color: var(--option-btn-bg);
            color: var(--option-btn-text);
            border: 2px solid var(--option-btn-border);
            font-weight: bold;
            padding: 10px 14px;
        }
        .container.resting-blocked {
            pointer-events: none;
            opacity: 0.5;
        }
        .help-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 900;
            padding: 16px;
            box-sizing: border-box;
        }
        .help-overlay.hidden { display: none; }
        .screen { width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
        .screen.hidden { display: none; }
        .mode-card {
            text-align: left;
            background: var(--option-btn-bg);
            color: var(--text-color);
            border: 1px solid var(--option-btn-border);
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            font-size: 1em;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .mode-title { font-weight: bold; font-size: 1.1em; }
        .mode-desc { opacity: 0.8; font-size: 0.9em; }
        .step-title { font-weight: bold; font-size: 1.15em; text-align: center; }
        .step-progress { text-align: center; opacity: 0.75; font-size: 0.9em; }
        .step-box {
            background: var(--word-box-bg);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .step-note { text-align: center; font-size: 0.9em; opacity: 0.8; min-height: 1.2em; }
        .primary-btn {
            background: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1.05em;
            font-weight: bold;
            cursor: pointer;
        }
        .primary-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .letter-slots, .letter-tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .letter-tile {
            box-sizing: border-box;
            padding: 0 8px;
            min-width: 46px;
            height: 50px;
            font-size: 1.3em;
            border-radius: 8px;
            border: 1px solid var(--option-btn-border);
            background: var(--option-btn-bg);
            color: var(--text-color);
            cursor: pointer;
        }
        .letter-tile.used { opacity: 0.2; pointer-events: none; }
        .letter-slot {
            box-sizing: border-box;
            min-width: 46px;
            height: 50px;
            border: 2px dashed var(--input-border);
            border-radius: 8px;
            display: inline-block;
        }
        .result-row { padding: 8px 0; border-bottom: 1px solid var(--input-border); }
        .result-row .res-label { font-size: 0.85em; opacity: 0.75; }
        .res-ok { color: #2e9e4f; font-weight: bold; }
        .res-bad { color: #d9534f; font-weight: bold; }
        .quiz-row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--input-border); }
        #dictOverlay { z-index: 910; }
        .help-body .settings-panel {
            background: transparent;
            padding: 8px 0 0;
            margin: 0;
        }
        .help-panel {
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 12px;
            width: 100%;
            max-width: 560px;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }
        .help-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--input-border);
        }
        .help-head h2 { margin: 0; font-size: 1.2em; }
        .help-close {
            width: auto;
            flex: 0 0 auto;
            margin: 0;
            background: var(--word-box-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 1.1em;
            padding: 4px 12px;
            cursor: pointer;
        }
        .help-body {
            padding: 6px 16px 16px;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            font-size: 0.95em;
            line-height: 1.45;
        }
        .help-body h3 { margin: 14px 0 4px; font-size: 1.02em; }
        .help-body code { background: var(--word-box-bg); padding: 1px 5px; border-radius: 4px; }
        .dict-row { display: flex; gap: 8px; align-items: center; }
        .dict-input {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 10px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 1em;
            margin: 4px 0;
        }
        .dict-alts { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
        .dict-chip {
            background: var(--word-box-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
            border-radius: 14px;
            padding: 3px 10px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .dict-status { min-height: 1.3em; margin-top: 6px; font-weight: bold; }
        .dict-list { max-height: 180px; overflow-y: auto; border: 1px solid var(--input-border); border-radius: 8px; }
        .dict-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 8px; border-bottom: 1px solid var(--input-border); }
        .dict-item:last-child { border-bottom: none; }
        .dict-item button { background: none; border: none; cursor: pointer; font-size: 1.1em; color: var(--text-color); }
        .dict-empty { padding: 8px; opacity: 0.7; }
        .help-body p { margin: 4px 0; }
        .help-body ul { margin: 4px 0; padding-left: 20px; }
        .help-body li { margin: 3px 0; }
        .rest-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }
        .rest-overlay.hidden {
            display: none;
        }
        .rest-overlay-content {
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        .rest-overlay-content .rest-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .rest-overlay-content h2 {
            margin: 0 0 10px 0;
            color: var(--text-color);
        }
        .rest-overlay-content p {
            font-size: 18px;
            margin: 10px 0 20px 0;
        }
        .rest-overlay-content button {
            background-color: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .spell-builder-card {
            margin-top: 15px;
            padding: 15px;
            background-color: var(--word-box-bg);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .spell-builder-card.hidden {
            display: none;
        }
        .letters-pool, .letters-target {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            min-height: 45px;
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
        }
        .letters-target {
            border: 2px dashed var(--option-btn-border);
            border-radius: 8px;
            background: var(--card-bg);
        }
        .letter-tile {
            background-color: var(--option-btn-bg);
            border: 2px solid var(--option-btn-border);
            color: var(--option-btn-text);
            font-weight: bold;
            font-size: 22px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }
        .syllable-display {
            font-size: 20px;
            font-weight: bold;
            color: #28a745;
            margin-top: 5px;
            letter-spacing: 1px;
        }
        .accent-char {
            color: #ff9800;
            text-decoration: underline;
            font-weight: bold;
        }

        /* ---- Помощь при афазии: подсказки, эмодзи, мягкий режим ---- */
        .assist-row { display: flex; gap: 8px; width: 100%; }
        .assist-btn {
            flex: 1;
            background-color: #6f42c1;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            padding: 10px;
        }
        .assist-btn.hint { background-color: #fd7e14; }
        .hint-box, .feedback-msg {
            width: 100%;
            box-sizing: border-box;
            border-radius: 6px;
            padding: 10px;
            font-size: 18px;
            font-weight: bold;
            display: none;
            word-break: break-word;
        }
        .hint-box { background-color: #fff3cd; color: #664d03; border: 1px solid #ffe69c; }
        .feedback-msg.praise { display: block; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .feedback-msg.retry { display: block; background-color: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }
        .opt-emoji {
            font-size: 30px;
            min-width: 44px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .word-emoji-big { font-size: 64px; line-height: 1.1; text-align: center; }
        .option-btn.eliminated { opacity: 0.25; pointer-events: none; }
        .option-btn.hint-glow { box-shadow: 0 0 0 4px #ffc107; }
        body.gentle-mode .stat-box.total-stat { display: none; }
        /* ----- Режим «Азбука» ----- */
        #abcScreen { gap: 8px; }
        .abc-built { background: var(--word-box-bg); border: 2px dashed var(--input-border); border-radius: 10px; padding: 8px 12px; text-align: left; }
        .abc-built-text { font-size: clamp(20px, 5.6vw, 26px); font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
        .abc-row { display: flex; gap: 8px; align-items: center; }
        .abc-row .assist-btn { flex: 0 0 auto; width: auto; min-width: 64px; min-height: 52px; padding: 0 14px; font-size: 22px; border-radius: 10px; }
        .abc-row .assist-btn.abc-say { flex: 1 1 auto; min-width: 0; font-size: 18px; }
        .abc-row .assist-btn.abc-del { background-color: #6c757d; }
        .abc-prefix { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: left; font-size: clamp(30px, 9vw, 40px); font-weight: 800; }
        .abc-sec { text-align: left; font-weight: bold; opacity: 0.8; margin: 4px 2px 0; }
        .abc-words { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
        .abc-word { width: 100%; min-height: 60px; padding: 6px 10px; border-radius: 12px; border: 3px solid var(--option-btn-border); background: var(--option-btn-bg); color: var(--text-color); font-size: clamp(20px, 6vw, 26px); font-weight: 700; cursor: pointer; overflow-wrap: anywhere; }
        .abc-word:hover, .abc-word:active { background: var(--option-btn-hover); }
        .abc-online { width: 100%; min-height: 48px; border-radius: 10px; border: 2px solid var(--option-btn-border); background: var(--option-btn-bg); color: var(--option-btn-text); font-size: 16px; font-weight: bold; cursor: pointer; }
        .abc-kb { position: sticky; bottom: 0; z-index: 3; background: var(--card-bg); border-top: 2px solid var(--input-border); padding: 8px 0 4px; margin-top: 4px; }
        .abc-kbh { display: flex; gap: 6px; margin-bottom: 6px; }
        .abc-kbt { flex: 1; width: auto; min-width: 0; min-height: 40px; border-radius: 10px; background: var(--card-bg); border: 2px solid var(--input-border); color: var(--text-color); font-size: 15px; font-weight: 700; padding: 0 6px; cursor: pointer; }
        .abc-letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 4px; }
        .abc-letter { width: 100%; min-height: 46px; font-size: 22px; font-weight: 800; padding: 0; border-radius: 10px; border: 2px solid var(--option-btn-border); background: var(--option-btn-bg); color: var(--text-color); cursor: pointer; }
        body { overflow-anchor: none; }
    </style>
</head>

    // На Android голоса (`speechSynthesis.getVoices()`) часто не
    // загружаются вовсе, пока движок TTS не будет «разбужен» реальным
    // вызовом speak() после жеста пользователя, а событие onvoiceschanged
    // может вообще ни разу не сработать. Поэтому при первом же клике/тапе
    // по странице делаем один беззвучный вызов speak(), который на
    // большинстве Android-браузеров запускает движок и заставляет его
    // отдать полный список голосов (включая мужские и женские) при
    // последующих вызовах getVoices().
    function warmupSpeechSynthesis() {
        if (speechWarmedUp) return;
        if (!('speechSynthesis' in window)) return;
        speechWarmedUp = true;

        try {
            const warm = new SpeechSynthesisUtterance(' ');
            warm.volume = 0;
            window.speechSynthesis.speak(warm);
            window.speechSynthesis.cancel();
        } catch (e) {
            console.warn('Speech warmup failed:', e);
        }

        // Список голосов на Android нередко заполняется с задержкой уже
        // после «пробуждения» движка, поэтому пробуем перечитать его
        // несколько раз в течение нескольких секунд.
        [300, 800, 1500, 3000, 5000].forEach(delay => {
            setTimeout(() => populateVoiceList(), delay);
        });
    }

    document.addEventListener('click', warmupSpeechSynthesis, { once: true, passive: true });
    document.addEventListener('touchstart', warmupSpeechSynthesis, { once: true, passive: true });

    // Эвристическое определение пола голоса по его имени. Единого
    // стандарта тут нет: разные производители (Google, Samsung, Microsoft,
    // eSpeak и др.) называют голоса по-разному, поэтому распознаём как
    // явные слова ("Male"/"Female", "мужской"/"женский" и т.п.), так и
    // самые распространённые собственные имена голосов.
    function detectVoiceGender(voice) {
        const name = (voice.name || '').toLowerCase();

        const femaleMarkers = [
            'female', 'женск', 'жіноч', '#female', 'x-female',
            'zira', 'susan', 'samantha', 'victoria', 'karen', 'moira',
            'tessa', 'fiona', 'anna', 'elena', 'milena', 'catherine',
            'salli', 'joanna', 'kimberly', 'ivy', 'kendra', 'olga',
            'milena', 'ekaterina', 'irina', 'oksana', 'lesya', 'natalia'
        ];
        const maleMarkers = [
            'male', 'мужск', 'чоловіч', '#male', 'x-male',
            'david', 'mark', 'daniel', 'george', 'fred', 'alex',
            'yuri', 'pavel', 'dmitri', 'dmytro', 'matthew', 'joey',
            'justin', 'ravi', 'oleg', 'ostap', 'mykyta'
        ];

        if (femaleMarkers.some(m => name.includes(m))) return 'female';
        if (maleMarkers.some(m => name.includes(m))) return 'male';
        return null;
    }

    // Приоритет голосов: локальные (работают без интернета) важнее сетевых.
    // У сетевых голосов Chrome/Android localService === false; если поле не
    // определено, голос считаем локальным.
    const isLocalVoice = v => v.localService !== false;

    // Локальные голоса — вперёд, порядок внутри групп сохраняется.
    function sortVoicesLocalFirst(list) {
        return list
            .map((v, i) => ({ v, i }))
            .sort((a, b) => (isLocalVoice(b.v) - isLocalVoice(a.v)) || (a.i - b.i))
            .map(x => x.v);
    }

    // Выбирает голос для озвучки: выбранный в списке; если он сетевой, а
    // интернета нет — локальный голос того же языка (по возможности того же
    // пола); если выбранного нет — лучший локальный голос текущего языка.
    function pickVoice(voices) {
        const langOf = x => x.lang.toLowerCase().replace('_', '-');
        const forLang = sortVoicesLocalFirst(voices.filter(x => langOf(x).startsWith(currentLang)));
        const uri = document.getElementById('voiceSelect').value;
        let v = voices.find(x => x.voiceURI === uri);

        if (v && !isLocalVoice(v) && navigator.onLine === false) {
            const local = forLang.filter(isLocalVoice);
            if (local.length > 0) {
                const gender = detectVoiceGender(v);
                v = (gender && local.find(x => detectVoiceGender(x) === gender)) || local[0];
            }
        }
        if (!v) v = forLang[0];
        return v || null;
    }

    function populateVoiceList(attemptsLeft) {
        if (!('speechSynthesis' in window)) return;
        if (attemptsLeft === undefined) attemptsLeft = 30;

        const voiceSelect = document.getElementById('voiceSelect');
        const savedVoiceURI = localStorage.getItem('app_voice');
        const voices = window.speechSynthesis.getVoices();

        // На многих мобильных браузерах (особенно на Android) голоса
        // подгружаются с задержкой, а событие onvoiceschanged не всегда
        // срабатывает. Поэтому вместо того, чтобы полагаться только на
        // это событие, повторяем попытку ещё несколько раз с небольшой
        // паузой (в сумме до ~9 секунд).
        if (voices.length === 0 && attemptsLeft > 0) {
            clearTimeout(voiceListRetryTimer);
            voiceListRetryTimer = setTimeout(() => populateVoiceList(attemptsLeft - 1), 300);
            return;
        }

        const previousValue = voiceSelect.value;
        voiceSelect.innerHTML = '';

        let langVoices = voices.filter(v => {
            const vLang = v.lang.toLowerCase().replace('_', '-');
            return vLang.startsWith(currentLang);
        });

        if (langVoices.length === 0) {
            langVoices = voices;
        }
        langVoices = sortVoicesLocalFirst(langVoices);

        if (langVoices.length === 0) {
            const opt = document.createElement('option');
            opt.value = "";
            opt.innerText = "Default System Voice";
            voiceSelect.appendChild(opt);
            return;
        }

        const t = i18n[currentLang];
        const genderLabels = {
            female: t.voiceGenderFemale,
            male: t.voiceGenderMale,
            other: t.voiceGenderOther
        };

        const groups = { female: [], male: [], other: [] };
        langVoices.forEach(v => {
            const gender = detectVoiceGender(v) || 'other';
            groups[gender].push(v);
        });

        // Группируем по полу (Женские / Мужские / Другие) только тогда,
        // когда удалось определить хотя бы один мужской или женский голос
        // — иначе просто выводим плоский список, как раньше.
        const hasGenderInfo = groups.female.length > 0 || groups.male.length > 0;

        const appendOption = (container, v) => {
            const opt = document.createElement('option');
            opt.value = v.voiceURI;
            opt.innerText = `${v.name} (${v.lang})` + (isLocalVoice(v) ? '' : ' ☁');
            container.appendChild(opt);
        };

        if (hasGenderInfo) {
            ['female', 'male', 'other'].forEach(gender => {
                if (groups[gender].length === 0) return;
                const optgroup = document.createElement('optgroup');
                optgroup.label = genderLabels[gender];
                groups[gender].forEach(v => appendOption(optgroup, v));
                voiceSelect.appendChild(optgroup);
            });
        } else {
            langVoices.forEach(v => appendOption(voiceSelect, v));
        }

        if (savedVoiceURI && Array.from(voiceSelect.options).some(o => o.value === savedVoiceURI)) {
            voiceSelect.value = savedVoiceURI;
        } else if (previousValue && Array.from(voiceSelect.options).some(o => o.value === previousValue)) {
            voiceSelect.value = previousValue;
        } else {
            voiceSelect.value = langVoices[0].voiceURI;
        }
    }

    function getRandomWord() {
        const pool = getWordsFromCurrentCategory();
        const problemWord = pickProblemWord(pool);
        if (problemWord && problemWord !== targetWordSyllables) return problemWord;
        const randIndex = Math.floor(Math.random() * pool.length);
        return pool[randIndex];
    }

    function generateOptions(targetSyllables) {
        const targetClean = cleanWord(targetSyllables);
        const options = [targetSyllables];
        const allPool = getAllWordsFromDictionary();
        const activePairs = getActiveRealWordPairs();

        if (activePairs[targetClean]) {
            const pairs = activePairs[targetClean];
            const shuffledPairs = [...pairs].sort(() => 0.5 - Math.random());
            for (let w of shuffledPairs) {
                if (options.length >= optionsCount) break;
                if (!options.some(o => cleanWord(o).toLowerCase() === cleanWord(w).toLowerCase())) {
                    options.push(w);
                }
            }
        }

        let attempts = 0;
        while (options.length < optionsCount && attempts < 100) {
            attempts++;
            const randomSyllables = allPool[Math.floor(Math.random() * allPool.length)];
            const randomClean = cleanWord(randomSyllables);
            
            if (!options.some(o => cleanWord(o).toLowerCase() === randomClean.toLowerCase())) {
                options.push(randomSyllables);
            }
        }

        return options.sort(() => 0.5 - Math.random());
    }

    // Индекс ключей таблицы ударений без пробелов: блок со слогами убирает
    // пробелы из слова, поэтому многословные записи ("thank you",
    // "будь ласка") иначе не находились.
    const accentKeyIndex = {};

    function getPhoneticRepresentation(wordClean) {
        const key = wordClean.toLowerCase();
        const custom = getCustomAccent(key);
        if (custom) return custom;
        const table = accentFixes[currentLang];
        if (!table) return null;
        if (table[key]) return table[key];

        if (!accentKeyIndex[currentLang]) {
            const idx = {};
            Object.keys(table).forEach(k => { idx[k.replace(/\s+/g, '')] = k; });
            accentKeyIndex[currentLang] = idx;
        }
        const realKey = accentKeyIndex[currentLang][key.replace(/\s+/g, '')];
        return realKey ? table[realKey] : null;
    }

    function isChecked(id) {
        const el = document.getElementById(id);
        return !!(el && el.checked);
    }

    function getWordEmoji(word) {
        if (!isChecked('emojiEnabled')) return '';
        const table = wordEmoji[currentLang] || {};
        return table[cleanWord(word).toLowerCase()] || '';
    }

    function applyAssistSettings() {
        document.body.classList.toggle('gentle-mode', isChecked('gentleMode'));
    }

    // Блоки игры: «выбор озвученного слова» и «сбор слова из букв».
    // Можно включить любой из них или оба; отключить оба нельзя —
    // последний включённый блок блокируется (disabled).
    function applyModeSettings() {
        const choiceEl = document.getElementById('modeChoice');
        const spellEl = document.getElementById('modeSpell');
        if (!choiceEl.checked && !spellEl.checked) choiceEl.checked = true;

        choiceEl.disabled = choiceEl.checked && !spellEl.checked;
        spellEl.disabled = spellEl.checked && !choiceEl.checked;

        const showChoice = choiceEl.checked;
        document.getElementById('labelInstruction').style.display = showChoice ? '' : 'none';
        document.getElementById('optionsContainer').style.display = showChoice ? '' : 'none';
        if (!spellEl.checked) document.getElementById('spellBuilderCard').classList.add('hidden');

        // Слог-подсказка настраивается только в режиме «только буквы»;
        // при включённом блоке выбора слова переключатель неактивен.
        const hintEl = document.getElementById('spellSyllableHint');
        hintEl.disabled = showChoice;
        hintEl.closest('.control-group').style.opacity = showChoice ? '0.5' : '';
    }

    function onModeSettingChange() {
        applyModeSettings();
        saveSettings();
        nextQuestion();
    }

    function onAssistSettingChange() {
        applyAssistSettings();
        saveSettings();
        // Перерисовать варианты, чтобы эмодзи сразу появились/исчезли.
        if (targetWordSyllables && !isAnswered) {
            const cur = Array.from(document.querySelectorAll('.option-row .option-btn')).map(b => b.innerText);
            const words = getAllWordsFromDictionary();
            const restored = cur.map(txt => words.find(w => cleanWord(w).toLowerCase() === txt.toLowerCase()) || txt);
            renderOptions(restored);
        }
    }

    // Общая настройка голоса/скорости для дополнительных фраз (слоги).
    function makeUtterance(text, rateMul) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = currentLang === 'uk' ? 'uk-UA' : (currentLang === 'ru' ? 'ru-RU' : 'en-US');
        const baseRate = parseFloat(document.getElementById('rateRange').value) || 0.7;
        u.rate = Math.max(0.3, Math.min(2, baseRate * (rateMul || 1)));
        const voices = window.speechSynthesis.getVoices();
        if (voices.length > 0) {
            const v = pickVoice(voices);
            if (v) u.voice = v;
        }
        return u;
    }

    let syllableSpeechToken = 0;

    // Произносит слово по слогам с паузами, затем целиком. На Android событие
    // onend срабатывает не всегда, поэтому есть запасной таймер.
    function speakSyllables(syllableWord) {
        if (screenName === 'select') return;   // на стартовом экране слова не произносятся
        if (!('speechSynthesis' in window) || !syllableWord) return;
        warmupSpeechSynthesis();
        window.speechSynthesis.cancel();
        const token = ++syllableSpeechToken;

        const parts = syllableWord.split('-').map(x => x.trim()).filter(Boolean);
        const clean = cleanWord(syllableWord);
        const whole = getPhoneticRepresentation(clean) || clean;
        const queue = parts.map(x => ({ text: x.toLowerCase(), mul: 0.8, pause: 350 }));
        queue.push({ text: whole, mul: 0.9, pause: 0 });

        const next = (i) => {
            if (token !== syllableSpeechToken || i >= queue.length) return;
            const item = queue[i];
            const u = makeUtterance(item.text, item.mul);
            let done = false;
            const go = () => {
                if (done) return;
                done = true;
                setTimeout(() => next(i + 1), item.pause);
            };
            u.onend = go;
            u.onerror = go;
            window.speechSynthesis.speak(u);
            setTimeout(go, Math.max(1200, item.text.length * 450));
        };
        next(0);
    }

    let hintLevel = 0;

    function resetHint() {
        hintLevel = 0;
        const box = document.getElementById('hintBox');
        if (box) { box.style.display = 'none'; box.innerHTML = ''; }
        document.querySelectorAll('.option-btn.hint-glow').forEach(b => b.classList.remove('hint-glow'));

    // Подсказки по нарастающей: 1) первый слог, 2) слово по слогам, 3) правильный вариант.
    function showHint() {
        if (!targetWordSyllables) return;
        const t = i18n[currentLang];
        const box = document.getElementById('hintBox');
        const parts = targetWordSyllables.split('-');
        hintLevel = Math.min(hintLevel + 1, 3);
        box.style.display = 'block';

        if (hintLevel === 1) {
            box.innerText = t.hintStarts + parts[0] + '…';
            warmupSpeechSynthesis();
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(makeUtterance(parts[0].toLowerCase(), 0.8));
        } else if (hintLevel === 2) {
            box.innerHTML = t.hintSyllables + formatWordWithAccents(parts.join(' • '));
            speakSyllables(targetWordSyllables);
        } else {
            box.innerText = isChecked('modeChoice') ? t.hintAnswer : cleanWord(targetWordSyllables);
            const targetClean = cleanWord(targetWordSyllables).toLowerCase();
            document.querySelectorAll('.option-btn').forEach(b => {
                if (b.innerText.toLowerCase() === targetClean) b.classList.add('hint-glow');
            });
            speakWord(targetWordSyllables);
        }
    }

    function updateStatsUI() {

    // Мягкий режим: без красных «ошибок». Неверный вариант просто гаснет,
    // слово озвучивается снова, пока человек не найдёт правильный ответ.
    // Автопрокрутка: после правильного ответа подводит экран к кнопке
    // «Следующее слово», а при переходе к новому слову возвращает к карточке
    // с заданием. Прокрутка сделана вручную (через requestAnimationFrame), а
    // не через scroll-behavior: 'smooth' — в установленных на Android
    // PWA-приложениях встроенная плавная прокрутка иногда обрывается или не
    // срабатывает. Целевая позиция пересчитывается на каждом кадре, поэтому
    // сдвиги вёрстки (эмодзи, плитки букв) ей не мешают. Если человек сам
    // коснулся экрана или покрутил колесо мыши, автопрокрутка уступает.
    let autoScrollTimer = null;
    let autoScrollRaf = null;

    function currentScrollY() {
        return window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    }

    function visibleViewportHeight() {
        const vv = window.visualViewport;
        const h = Math.min(window.innerHeight || Infinity, (vv && vv.height) ? vv.height : Infinity);
        return isFinite(h) ? h : document.documentElement.clientHeight;
    }

    function cancelAutoScroll() {
        clearTimeout(autoScrollTimer);
        autoScrollTimer = null;
        if (autoScrollRaf) {
            cancelAnimationFrame(autoScrollRaf);
            autoScrollRaf = null;
        }
    }

    ['touchstart', 'wheel', 'keydown', 'mousedown'].forEach(evt => {
        window.addEventListener(evt, cancelAutoScroll, { passive: true });
    });

    function animateScrollTo(getTarget, duration) {
        if (autoScrollRaf) cancelAnimationFrame(autoScrollRaf);
        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const total = reduce ? 0 : duration;
        const startY = currentScrollY();
        const t0 = performance.now();

        const step = (now) => {
            const target = getTarget();
            if (target === null) { autoScrollRaf = null; return; }
            const p = total === 0 ? 1 : Math.min(1, (now - t0) / total);
            const eased = 1 - Math.pow(1 - p, 3);
            window.scrollTo(0, startY + (target - startY) * eased);
            autoScrollRaf = (p < 1) ? requestAnimationFrame(step) : null;
        };
        autoScrollRaf = requestAnimationFrame(step);
    }

    function nextButtonTarget() {
        const btn = document.getElementById('nextBtn');
        if (!btn) return null;
        const bottom = btn.getBoundingClientRect().bottom;
        return Math.max(0, currentScrollY() + bottom - visibleViewportHeight() + 16);
    }

    function scrollToNextButton() {
        cancelAutoScroll();
        autoScrollTimer = setTimeout(() => {
            const t = nextButtonTarget();
            if (t !== null && t > currentScrollY() + 2) animateScrollTo(nextButtonTarget, 450);
            // Проверка: если что-то помешало (вёрстка ещё менялась), пробуем один раз ещё.
            autoScrollTimer = setTimeout(() => {
                const t2 = nextButtonTarget();
                if (t2 !== null && t2 > currentScrollY() + 6) animateScrollTo(nextButtonTarget, 300);
            }, 900);
        }, 350);
    }

    // Цель прокрутки: чтобы блок сбора слова из букв был виден целиком (если он помещается).
    function spellCardTarget() {
        const card = document.getElementById('spellBuilderCard');
        if (!card || card.classList.contains('hidden')) return null;
        const r = card.getBoundingClientRect();
        const vh = visibleViewportHeight();
        if (r.height + 24 > vh) return Math.max(0, currentScrollY() + r.top - 8);
        return Math.max(0, currentScrollY() + r.bottom - vh + 16);
    }

    function scrollToSpellCard() {
        cancelAutoScroll();
        autoScrollTimer = setTimeout(() => {
            const t = spellCardTarget();
            if (t !== null && t > currentScrollY() + 2) animateScrollTo(spellCardTarget, 450);
            autoScrollTimer = setTimeout(() => {
                const t2 = spellCardTarget();
                if (t2 !== null && t2 > currentScrollY() + 6) animateScrollTo(spellCardTarget, 300);
            }, 900);
        }, 350);
    }

    // Прокрутка к блоку «Проговорить и проверить себя» (кнопка и поле результата), если он не виден целиком.
    function scrollToSpeechBlock() {
        cancelAutoScroll();
        autoScrollTimer = setTimeout(() => {
            const btn = document.getElementById('recordBtn');
            const box = document.getElementById('speechResultBox');
            if (!btn || !box) return;
            const top = btn.getBoundingClientRect().top;
            const bottom = box.getBoundingClientRect().bottom;
            if (top >= 0 && bottom <= visibleViewportHeight()) return;
            const target = Math.max(0, currentScrollY() + top - 12);
            if (Math.abs(target - currentScrollY()) > 2) animateScrollTo(() => target, 400);
        }, 60);
    }

    function taskCardTarget() {
        const card = document.querySelector('.card');
        if (!card) return null;
        return Math.max(0, currentScrollY() + card.getBoundingClientRect().top - 8);
    }

    function scrollToTaskCard() {
        cancelAutoScroll();
        const t = taskCardTarget();
        // Только вверх: при первом запуске страницы ничего не двигаем.
        if (t !== null && currentScrollY() > t + 2) animateScrollTo(taskCardTarget, 350);

    function checkAnswerGentle(selectedSyllables, btnElement) {
        const selectedClean = cleanWord(selectedSyllables).toLowerCase();
        const targetClean = cleanWord(targetWordSyllables).toLowerCase();

        if (selectedClean === targetClean) {
            isAnswered = true;
            totalCount++;
            correctCount++;
            recordResult('choice', targetClean, '', true);
            btnElement.classList.add('correct');
            btnElement.classList.remove('hint-glow');
            showFeedback('praise');
            vibrateShort(60);
            updateStatsUI();
            setupSpellBuilder(targetWordSyllables);
            scrollToNextButton();
        } else {
            recordResult('choice', targetClean, selectedClean, false);
            btnElement.classList.add('eliminated');
            btnElement.disabled = true;
            showFeedback('retry');
            speakWord(targetWordSyllables);

    function speakWord(syllableWord) {
        if (screenName === 'select') return;   // на стартовом экране слова не произносятся
        if (!('speechSynthesis' in window)) {
            alert("TTS is not supported in this browser.");
            return;
        }

        warmupSpeechSynthesis();
        window.speechSynthesis.cancel();

        const wordClean = cleanWord(syllableWord);
        const phoneticText = getPhoneticRepresentation(wordClean) || wordClean;
        const utterance = new SpeechSynthesisUtterance(phoneticText);

        if (currentLang === 'uk') utterance.lang = 'uk-UA';
        else if (currentLang === 'ru') utterance.lang = 'ru-RU';
        else utterance.lang = 'en-US';

        const rate = parseFloat(document.getElementById('rateRange').value) || 0.9;
        utterance.rate = rate;

        const voices = window.speechSynthesis.getVoices();

        if (voices.length > 0) {
            const targetVoice = pickVoice(voices);
            if (targetVoice) utterance.voice = targetVoice;
        }

        window.speechSynthesis.speak(utterance);
    }

    function formatWordWithAccents(syllableWord) {
        const wordClean = syllableWord
            .replace(/-/g, '')
            .replace(/\s*•\s*/g, '')
            .replace(/\s+/g, '')
            .trim();

        const phonetic = getPhoneticRepresentation(wordClean);

        if (!phonetic) {
            return syllableWord;
        }

        let accentIdx = -1;
        let letterIdx = 0;

        for (let i = 0; i < phonetic.length; i++) {
            const char = phonetic[i];
            if (char === '\u0301') {
                accentIdx = Math.max(0, letterIdx - 1);
                break;
            }

            if (/[\p{L}\p{N}]/u.test(char)) {
                if (accentIdx === -1 && char === char.toUpperCase() && char.toLowerCase() !== char.toUpperCase()) {
                    accentIdx = letterIdx;
                }
                letterIdx++;
            }
        }

        if (accentIdx === -1) {
            return syllableWord;
        }

        let resultHTML = "";
        let cleanCounter = 0;

        for (let i = 0; i < syllableWord.length; i++) {
            const char = syllableWord[i];
            if (/[\p{L}\p{N}]/u.test(char)) {
                if (cleanCounter === accentIdx) {
                    resultHTML += `<span class="accent-char">${char}</span>`;
                } else {
                    resultHTML += char;
                }
                cleanCounter++;
            } else {
                resultHTML += char;
            }
        }

        return resultHTML;
    }

    function renderOptions(options) {
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';

        options.forEach(optSyllables => {
            const row = document.createElement('div');
            row.className = 'option-row';

            const emoji = getWordEmoji(optSyllables);
            if (emoji) {
                const emojiSpan = document.createElement('span');
                emojiSpan.className = 'opt-emoji';
                emojiSpan.innerText = emoji;
                row.appendChild(emojiSpan);
            }

            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = cleanWord(optSyllables);
            btn.onclick = () => checkAnswer(optSyllables, btn);

            const audioBtn = document.createElement('button');
            audioBtn.className = 'audio-btn';
            audioBtn.innerHTML = '🔊';
            audioBtn.title = 'Listen option';
            audioBtn.onclick = (e) => {
                e.stopPropagation();
                speakWord(optSyllables);
            };

            row.appendChild(btn);
            row.appendChild(audioBtn);
            container.appendChild(row);
        });
    }

    function checkAnswer(selectedSyllables, btnElement) {
        if (isAnswered) return;
        if (isChecked('gentleMode')) {
            checkAnswerGentle(selectedSyllables, btnElement);
            return;
        }
        isAnswered = true;

        totalCount++;
        const selectedClean = cleanWord(selectedSyllables).toLowerCase();
        const targetClean = cleanWord(targetWordSyllables).toLowerCase();

        if (selectedClean === targetClean) {
            correctCount++;
            recordResult('choice', targetClean, '', true);
            btnElement.classList.add('correct');
            scrollToNextButton();
        } else {
            recordResult('choice', targetClean, selectedClean, false);
            btnElement.classList.add('wrong');
            const rows = document.querySelectorAll('.option-row');
            rows.forEach(r => {
                const b = r.querySelector('.option-btn');
                if (b && b.innerText.toLowerCase() === targetClean) {
                    b.classList.add('correct');
                }
            });
        }

        document.getElementById('correctCount').innerText = correctCount;
        document.getElementById('totalCount').innerText = totalCount;

        setupSpellBuilder(targetWordSyllables);
        if (selectedClean !== targetClean) scrollToSpellCard();

    function setupSpellBuilder(syllableWord) {
        if (!isChecked('modeSpell')) return;
        const card = document.getElementById('spellBuilderCard');
        card.classList.remove('hidden');

        const syllablesArr = syllableWord.split('-');
        const t = i18n[currentLang];
        const formattedSyllables = syllablesArr.join(' • ');
        const syllDisplay = document.getElementById('syllableDisplay');
        syllDisplay.innerHTML = t.syllablePrefix + formatWordWithAccents(formattedSyllables);
        // В режиме «только буквы» слоги можно скрыть до завершения сбора.
        syllDisplay.style.display = (!isChecked('modeChoice') && !isChecked('spellSyllableHint')) ? 'none' : '';
        document.getElementById('wordEmojiBig').innerText = getWordEmoji(syllableWord);

        const clean = cleanWord(syllableWord);
        const letters = clean.split('');
        const shuffledLetters = [...letters].sort(() => 0.5 - Math.random());

        selectedLetters = [];
        renderSpellTiles(shuffledLetters);
    }

    function renderSpellTiles(poolLetters) {
        const poolContainer = document.getElementById('lettersPool');
        const targetContainer = document.getElementById('lettersTarget');

        poolContainer.innerHTML = '';
        targetContainer.innerHTML = '';

        selectedLetters.forEach((char, index) => {
            const tile = document.createElement('div');
            tile.className = 'letter-tile';
            tile.innerText = char;
            tile.onclick = () => {
                const removedChar = selectedLetters.splice(index, 1)[0];
                poolLetters.push(removedChar);
                renderSpellTiles(poolLetters);
            };
            targetContainer.appendChild(tile);
        });

        poolLetters.forEach((char, index) => {
            const tile = document.createElement('div');
            tile.className = 'letter-tile';
            tile.innerText = char;
            tile.onclick = () => {
                selectedLetters.push(char);
                poolLetters.splice(index, 1);
                renderSpellTiles(poolLetters);
                checkSpellResult();
            };
            poolContainer.appendChild(tile);
        });
    }

    function checkSpellResult() {
        const assembled = selectedLetters.join('');
        if (assembled.toLowerCase() === targetWordClean.toLowerCase()) {
            speakWord(targetWordSyllables);
            document.getElementById('syllableDisplay').style.display = '';
            // Если блок выбора слова отключён, засчитываем собранное слово.
            if (!isChecked('modeChoice') && !isAnswered) {
                isAnswered = true;
                totalCount++;
                correctCount++;
                updateStatsUI();
                showFeedback('praise');
                vibrateShort(60);
                scrollToNextButton();
            }
        }
    }

    function ex() { return extraI18n[currentLang] || extraI18n.ru; }

    function escHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Посимвольное выравнивание (расстояние Левенштейна): какие буквы отличаются.
    function diffChars(a, b) {
        const n = a.length, m = b.length;
        const d = [];
        for (let i = 0; i <= n; i++) { d[i] = new Array(m + 1).fill(0); d[i][0] = i; }
        for (let j = 0; j <= m; j++) d[0][j] = j;
        for (let i = 1; i <= n; i++) {
            for (let j = 1; j <= m; j++) {
                const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
            }
        }
        const ta = [], tb = [];
        let i = n, j = m;
        while (i > 0 || j > 0) {
            if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)) {
                const bad = a[i - 1] !== b[j - 1];
                ta.unshift({ c: a[i - 1], bad });
                tb.unshift({ c: b[j - 1], bad });
                i--; j--;
            } else if (i > 0 && d[i][j] === d[i - 1][j] + 1) {
                ta.unshift({ c: a[i - 1], bad: true });
                i--;
            } else {
                tb.unshift({ c: b[j - 1], bad: true });
                j--;
            }
        }
        return { ta, tb };
    }

    function renderDiffParts(parts) {
        return parts.map(p => p.bad ? '<mark class="diff-bad">' + escHtml(p.c) + '</mark>' : escHtml(p.c)).join('');
    }

    function buildDiffHtml(target, said) {
        const r = diffChars(target, said);
        const x = ex();
        return '<div class="diff-row">' + escHtml(x.need) + renderDiffParts(r.ta) + '</div>' +
               '<div class="diff-row">' + escHtml(x.said) + renderDiffParts(r.tb) + '</div>';
    }

    // ----- статистика -----
    const STATS_KEY = 'app_stats_v1';

    function loadStats() {
        try {
            const s = JSON.parse(localStorage.getItem(STATS_KEY) || '{}');
            return (s && typeof s === 'object') ? s : {};
        } catch (e) { return {}; }
    }

    function saveStats(s) {
        try { localStorage.setItem(STATS_KEY, JSON.stringify(s)); } catch (e) {}
    }

    function recordResult(kind, target, said, ok) {
        try {
            const tw = (target || '').toLowerCase().trim();
            if (!tw) return;
            const s = loadStats();
            if (!s[currentLang]) s[currentLang] = { words: {}, conf: {} };
            const L = s[currentLang];
            const w = L.words[tw] || (L.words[tw] = { ok: 0, bad: 0 });
            if (ok) w.ok++; else w.bad++;
            if (!ok && said) {
                const sd = String(said).toLowerCase().trim().slice(0, 40);
                if (sd && sd !== tw) {
                    const k = tw + '>' + sd;
                    L.conf[k] = (L.conf[k] || 0) + 1;
                    const keys = Object.keys(L.conf);
                    if (keys.length > 400) {
                        keys.sort((p, q) => L.conf[p] - L.conf[q]).slice(0, 100).forEach(k2 => delete L.conf[k2]);
                    }
                }
            }
            saveStats(s);
        } catch (e) {}
    }

    // Иногда (30%) предлагает слово, в котором раньше чаще ошибались.
    function pickProblemWord(pool) {
        try {
            if (Math.random() > 0.3) return null;
            const L = ((loadStats()[currentLang]) || {}).words || {};
            const cands = [];
            let total = 0;
            pool.forEach(item => {
                const w = L[cleanWord(item).toLowerCase()];
                if (w) {
                    const sc = w.bad - 0.5 * w.ok;
                    if (sc > 0) { cands.push([item, sc]); total += sc; }
                }
            });
            if (!cands.length) return null;
            let r = Math.random() * total;
            for (const [item, sc] of cands) {
                r -= sc;
                if (r <= 0) return item;
            }
            return cands[cands.length - 1][0];
        } catch (e) { return null; }
    }

    function renderStatsPanel() {
        const x = ex();
        const L = (loadStats()[currentLang]) || { words: {}, conf: {} };
        const words = Object.entries(L.words || {});
        const attempts = words.reduce((n, [, v]) => n + v.ok + v.bad, 0);
        const hard = words.filter(([, v]) => v.bad > 0)
            .sort((p, q) => (q[1].bad - 0.5 * q[1].ok) - (p[1].bad - 0.5 * p[1].ok)).slice(0, 8);
        const conf = Object.entries(L.conf || {}).sort((p, q) => q[1] - p[1]).slice(0, 8);

        let h = '<p>' + escHtml(x.statsAttempts) + attempts + '</p>';
        if (!hard.length && !conf.length) {
            h += '<p>' + escHtml(x.statsEmpty) + '</p>';
        } else {
            if (hard.length) {
                h += '<p><b>' + escHtml(x.statsHard) + '</b></p><table class="stats-table">';
                hard.forEach(([k, v]) => {
                    h += '<tr><td>' + escHtml(k) + '</td><td>' + v.bad + ' ' + escHtml(x.statsOf) + ' ' + escHtml(x.statsFrom) + ' ' + (v.ok + v.bad) + '</td></tr>';
                });
                h += '</table>';
            }
            if (conf.length) {

                conf.forEach(([k, n]) => {

    function exportStatsCsv() {
        const s = loadStats();
        const q = v => '"' + String(v).replace(/"/g, '""') + '"';
        const rows = [['lang', 'type', 'word', 'said', 'ok', 'errors', 'count'].join(',')];
        Object.keys(s).forEach(lang => {

                rows.push([q(lang), q('word'), q(w), q(''), v.ok, v.bad, ''].join(','));
            });
            Object.entries(L.conf || {}).forEach(([k, n]) => {

    async function toggleOwnRecording() {
        const x = ex();
        if (ownRecording) { stopOwnRecording(); return; }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
            setOwnMsg(x.ownNoSupport);
            return;
        }
        try { if (isRecording && recognition) recognition.stop(); } catch (e) {}
        try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
        try { if (ownAudio) ownAudio.pause(); } catch (e) {}
        let stream;
        try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
            setOwnMsg(x.ownDenied);
            return;
        }
        const sessionId = ++ownSession;
        ownChunks = [];
        const rec = new MediaRecorder(stream);
        ownRec = rec;
        rec.ondataavailable = e => { if (e.data && e.data.size) ownChunks.push(e.data); };
        rec.onstop = () => {
            try { stream.getTracks().forEach(tr => tr.stop()); } catch (e) {}
            if (sessionId !== ownSession) return;
            ownRecording = false;
            updateOwnBtn();
            const blob = new Blob(ownChunks, { type: rec.mimeType || 'audio/webm' });
            if (blob.size < 800) {
                setOwnMsg(ex().ownFail);
                return;
            }
            if (ownUrl) URL.revokeObjectURL(ownUrl);
            ownUrl = URL.createObjectURL(blob);
            updateOwnPlayRow();
            setOwnMsg(ex().ownDone);
        };
        rec.start();
        ownRecording = true;
        setOwnMsg(x.ownRecording);
        updateOwnBtn();
        ownTimer = setTimeout(stopOwnRecording, 10000);
    }

        if (!ownUrl) return;

        if (!ownUrl) return;

    // ----- деление на слоги (приблизительное, результат можно исправить вручную) -----
    function syllabifyToken(word, lang) {
        const V = lang === 'en' ? 'aeiouy' : (lang === 'uk' ? 'аеєиіїоуюя' : 'аеёиоуыэюя');
        const chars = [...word.toLowerCase()];
        const isV = c => V.includes(c);
        // ядра слогов: в английском подряд идущие гласные считаются одним ядром
        const nuclei = [];
        for (let i = 0; i < chars.length; i++) {
            if (!isV(chars[i])) continue;
            if (lang === 'en' && nuclei.length && nuclei[nuclei.length - 1][1] === i - 1) nuclei[nuclei.length - 1][1] = i;
            else nuclei.push([i, i]);
        }
        // английское «немое e» на конце не образует слог
        if (lang === 'en' && nuclei.length > 1) {
            const last = nuclei[nuclei.length - 1];
            const n = chars.length;
            if (last[0] === n - 1 && chars[n - 1] === 'e' && !isV(chars[n - 2]) && !(chars[n - 2] === 'l' && n > 3 && !isV(chars[n - 3]))) nuclei.pop();
        }
        if (nuclei.length < 2) return chars.join('');
        const cuts = [];
        for (let k = 0; k < nuclei.length - 1; k++) {
            const e = nuclei[k][1], s = nuclei[k + 1][0];
            const gap = s - e - 1;
            let cut;
            if (gap === 0) cut = s;
            else if (gap === 1) cut = (chars[e + 1] === 'й') ? e + 2 : e + 1;
            else cut = e + 2;
            while (cut < s && ['ь', 'ъ', "'"].includes(chars[cut])) cut++;
            cuts.push(cut);
        }
        let out = '', prev = 0;
        cuts.forEach(c => { out += chars.slice(prev, c).join('') + '-'; prev = c; });
        out += chars.slice(prev).join('');
        return out;
    }

    function syllabifyPhrase(text, lang) {
        return text.trim().split(/\s+/).map(t => syllabifyToken(t, lang || currentLang)).join(' ');
    }

    function normalizeDictWord(s) {
        return String(s || '').toLowerCase()
            .replace(/[’ʼʻ`´]/g, "'")
            .replace(/-/g, '')
            .replace(/[^\p{L}\p{N}' ]+/gu, '')
            .replace(/\s+/g, ' ')
            .trim();
    }

    // Ударение задаётся заглавной гласной буквой, остальные буквы строчные: стра-нИ-ца.
    function vowelSetFor(lang) {
        return lang === 'en' ? 'aeiouy' : (lang === 'uk' ? 'аеєиіїоуюя' : 'аеёиоуыэюя');
    }

    // Возвращает { syl: строчные слоги, accent: слово без дефисов с одной заглавной гласной или null, error }.
    function parseStress(raw, lang) {
        const chars = [...raw];
        const up = [];
        chars.forEach((c, i) => { if (c !== c.toLowerCase() && c.toLowerCase() !== c.toUpperCase()) up.push(i); });
        const syl = raw.toLowerCase();
        if (up.length === 0) return { syl, accent: null };
        if (up.length > 1) return { syl, accent: null, error: 'many' };
        const i = up[0];
        if (!vowelSetFor(lang).includes(chars[i].toLowerCase())) return { syl, accent: null, error: 'notVowel' };
        let pos = 0;
        for (let k = 0; k < i; k++) if (chars[k] !== '-') pos++;
        const plain = [...syl.replace(/-/g, '')];
        if (pos >= plain.length) return { syl, accent: null };
        plain[pos] = plain[pos].toUpperCase();
        return { syl, accent: plain.join('') };
    }

    function accentKeyOf(syl) { return String(syl).toLowerCase().replace(/[-\s]/g, ''); }

    // Возвращает слоги с заглавной ударной гласной (для экспорта).
    function applyStressToSyl(syl, accent) {
        if (!accent) return syl;
        const idx = [...accent].findIndex(c => c !== c.toLowerCase());
        if (idx < 0) return syl;
        const chars = [...syl];
        let pos = 0;
        for (let k = 0; k < chars.length; k++) {
            if (chars[k] === '-') continue;
            if (pos === idx) { chars[k] = chars[k].toUpperCase(); break; }
            pos++;
        }
        return chars.join('');
    }

    function cleanKey(w) { return cleanWord(w).toLowerCase().replace(/\s+/g, ' ').trim(); }

    function getCustomAccent(key) {
        const k = String(key).replace(/\s+/g, '');
        const u = userAccents[currentLang];
        if (u && u[k]) return u[k];

    const EXTRA_KEY = 'app_extra_dict_v1';
    let extraDictData = { ru: {}, uk: {}, en: {}, pairs: { ru: {}, uk: {}, en: {} }, accents: { ru: {}, uk: {}, en: {} } };
    let extraSource = 'none';   // 'online' | 'saved' | 'none'

    function normalizeExtra(raw) {
        const out = { ru: {}, uk: {}, en: {}, pairs: { ru: {}, uk: {}, en: {} }, accents: { ru: {}, uk: {}, en: {} } };
        const fixWord = (w, lang) => {
            if (typeof w !== 'string') return null;
            const s = w.replace(/[’ʼʻ`´]/g, "'").replace(/[^\p{L}\p{N}' \-]+/gu, '').replace(/\s+/g, ' ').trim();
            if (!s || s.length > 40) return null;
            const st = parseStress(s, lang);
            if (st.accent) out.accents[lang][accentKeyOf(st.accent)] = st.accent;
            return st.syl.includes('-') ? st.syl : syllabifyPhrase(st.syl, lang);
        };
        ['ru', 'uk', 'en'].forEach(lang => {
            const cats = raw && raw[lang];
            if (cats && typeof cats === 'object' && !Array.isArray(cats)) {
                Object.keys(cats).slice(0, 100).forEach(cat => {
                    if (!Array.isArray(cats[cat])) return;
                    const list = cats[cat].slice(0, 5000).map(w => fixWord(w, lang)).filter(Boolean);
                    if (list.length) out[lang][String(cat).slice(0, 60)] = list;
                });
            }
            const pairs = raw && raw.pairs && raw.pairs[lang];
            if (pairs && typeof pairs === 'object' && !Array.isArray(pairs)) {
                Object.keys(pairs).slice(0, 5000).forEach(k => {
                    if (!Array.isArray(pairs[k])) return;
                    const list = pairs[k].slice(0, 20).map(w => fixWord(w, lang)).filter(Boolean);
                    const key = normalizeDictWord(k);
                    if (key && list.length) out.pairs[lang][key] = list;
                });
            }
        });
        return out;
    }

    function countExtraWords() {
        let n = 0;
        ['ru', 'uk', 'en'].forEach(l => Object.values(extraDictData[l] || {}).forEach(a => { n += a.length; }));
        return n;
    }

    (function loadExtraFromStorage() {
        try {
            const txt = localStorage.getItem(EXTRA_KEY);
            if (!txt) return;
            extraDictData = normalizeExtra(JSON.parse(txt));
            extraSource = 'saved';
        } catch (e) {}
    })();

    // Загрузка файла с сайта. При ошибке (нет интернета, нет файла) остаётся сохранённая копия.
    async function fetchExtraDictionary() {
        try {
            const res = await fetch('extra-dict.json?ts=' + Date.now(), { cache: 'no-store' });
            if (!res.ok) throw new Error('http ' + res.status);
            const raw = JSON.parse(await res.text());
            if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('bad format');
            extraDictData = normalizeExtra(raw);
            extraSource = 'online';
            try { localStorage.setItem(EXTRA_KEY, JSON.stringify(raw)); } catch (e) {}
            invalidateDictionaries();
            return true;
        } catch (e) {
            console.log('extra-dict.json not loaded:', e && e.message);
            return false;
        }
    }

    // ----- объединённые словари (базовые + extra-dict.json + «Мои слова») -----
    const mergedDictCache = {}, mergedPairsCache = {};

    function invalidateDictionaries() {
        Object.keys(mergedDictCache).forEach(k => delete mergedDictCache[k]);
        Object.keys(mergedPairsCache).forEach(k => delete mergedPairsCache[k]);
    }

    function getMergedDictionary(lang) {
        if (mergedDictCache[lang]) return mergedDictCache[lang];
        const base = baseDictionaryFor(lang);
        const out = {};
        const seen = new Set();
        Object.keys(base).forEach(c => {
            out[c] = base[c];
            base[c].forEach(w => seen.add(cleanKey(w)));
        });
        const addTo = (cat, words) => {
            const fresh = [];
            words.forEach(w => {
                const k = cleanKey(w);
                if (!seen.has(k)) { seen.add(k); fresh.push(w); }
            });
            if (fresh.length) out[cat] = (out[cat] || []).concat(fresh);
        };
        const extra = extraDictData[lang] || {};
        Object.keys(extra).forEach(cat => addTo(cat, extra[cat]));
        if (userWords[lang] && userWords[lang].length) addTo((dictI18n[lang] || dictI18n.ru).catName, userWords[lang]);
        mergedDictCache[lang] = out;
        return out;
    }

    function getMergedPairs(lang) {
        if (mergedPairsCache[lang]) return mergedPairsCache[lang];
        const base = basePairsFor(lang);
        const extra = (extraDictData.pairs && extraDictData.pairs[lang]) || {};
        const keys = Object.keys(extra);
        if (!keys.length) { mergedPairsCache[lang] = base; return base; }
        const out = Object.assign({}, base);
        keys.forEach(k => { out[k] = (out[k] || []).concat(extra[k]); });
        mergedPairsCache[lang] = out;
        return out;
    }

    function renderDictList() {
        const x = dx();
        const box = document.getElementById('dictList');
        const list = userWords[currentLang] || [];
        box.innerHTML = '';
        if (!list.length) {
            const d = document.createElement('div');
            d.className = 'dict-empty';
            d.innerText = x.empty;
            box.appendChild(d);
            return;
        }
        list.forEach((w, i) => {
            const row = document.createElement('div');
            row.className = 'dict-item';
            const span = document.createElement('span');
            const acc = (userAccents[currentLang] || {})[accentKeyOf(w)];
            const accIdx = acc ? [...acc].findIndex(c => c !== c.toLowerCase()) : -1;
            let pos = 0;
            [...w].forEach(ch => {
                if (ch === '-') { span.appendChild(document.createTextNode(' • ')); return; }
                if (pos === accIdx) {
                    const a = document.createElement('span');
                    a.className = 'accent-char';
                    a.textContent = ch;
                    span.appendChild(a);
                } else {
                    span.appendChild(document.createTextNode(ch));
                }
                pos++;
            });
            const btn = document.createElement('button');
            btn.innerText = '🗑';
            btn.title = x.del;
            btn.setAttribute('aria-label', x.del);
            btn.onclick = () => dictDelete(i);
            row.appendChild(span);
            row.appendChild(btn);
            box.appendChild(row);
        });
    }

    function renderDictOnline() {
        const x = dx();
        const n = countExtraWords();
        let msg = x.onlineNone;
        if (extraSource === 'online') msg = x.onlineOnline + n;
        else if (extraSource === 'saved') msg = x.onlineSaved + n;
        document.getElementById('dictOnline').innerText = msg;
    }

    function onDictWordInput() {

    function stopDictListening() {
