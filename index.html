// Перетаскивание слов внутри собранной фразы: короткое нажатие убирает слово, перетаскивание меняет порядок
function dragChip(c,cw,onTap){
  // Удержание (около полсекунды) «берёт» слово, затем его можно перетащить; короткое нажатие убирает слово
  let sx=0,sy=0,armed=false,drag=false,id=null,moved=false,t=null;
  c.style.touchAction='pan-y';c.style.userSelect='none';c.style.webkitTouchCallout='none';   // пока слово не «взято» удержанием, вертикальный жест прокручивает блок
  c.addEventListener('touchmove',e=>{if(armed&&e.cancelable)e.preventDefault()},{passive:false});   // взятое слово тянется, а не прокручивает
  c.addEventListener('contextmenu',e=>e.preventDefault());
  c.addEventListener('pointerdown',e=>{
    sx=e.clientX;sy=e.clientY;armed=false;drag=false;moved=false;id=e.pointerId;
    clearTimeout(t);
    t=setTimeout(()=>{armed=true;moved=true;c.classList.add('drag');try{c.setPointerCapture(id)}catch(_){}try{navigator.vibrate&&navigator.vibrate(30)}catch(_){}},450);
  });
  c.addEventListener('pointermove',e=>{
    if(id==null)return;
    if(!armed){if(Math.hypot(e.clientX-sx,e.clientY-sy)>10){clearTimeout(t);id=null}return}   // сдвиг до удержания — это прокрутка, а не перетаскивание
    drag=true;
    for(const o of Array.from(cw.children)){
      if(o===c)continue;
      const r=o.getBoundingClientRect();
      if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)continue;
      const after=!!(c.compareDocumentPosition(o)&Node.DOCUMENT_POSITION_FOLLOWING),mid=r.left+r.width/2;
      if(after&&e.clientX>=mid)cw.insertBefore(c,o.nextSibling);
      else if(!after&&e.clientX<=mid)cw.insertBefore(c,o);
      break;
    }
  });
  const end=()=>{
    clearTimeout(t);
    if(armed){
      armed=false;c.classList.remove('drag');
      if(drag){const order=Array.from(cw.children).map(x=>+x.dataset.i);hearBuild=order.map(k=>hearBuild[k]);hearSlot=-1;refreshHear()}
      drag=false;
    }
    id=null;
  };
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',()=>{end();moved=false});
  c.addEventListener('click',()=>{if(moved){moved=false;return}onTap()});

    rec=null;mic.textContent='🎤 '+u('m_say');mic.classList.remove('rec');
    if(!err){hearStatus(hearTxt?'':u('m_nosp'))}

<p>Тренажёр помогает различать на слух похожие слова, тренировать собственное произношение и письмо. Занятия состоят из коротких заданий: слово озвучивается, а вы выбираете его, собираете из букв и произносите вслух.</p>

<h3>Режимы тренировки</h3>
<ul>
<li><b>🧩 Полный тренажёр</b> — все блоки на одном экране: выбор слова на слух, проверка произношения, сбор из букв.</li>
<li><b>🔢 Перечисления</b> — тренировка называния рядов по порядку: дни недели, месяцы, времена года, части суток, цвета радуги, числа 1–10, 1–20 и десятки до 100. Можно добавить своё перечисление (например, имена родных). Направление, задание и показ названий собраны в сворачиваемый блок «⚙️» над заданием: в свёрнутом виде в нём видно, что выбрано (▶ — свёрнут, ▼ — раскрыт). Выберите ряд, нажмите «Говорить» и назовите всё по порядку, затем «Закончил(а)» (или просто помолчите). Приложение покажет и голосом скажет, что верно, что пропущено и что лишнее; нажатие на слово озвучивает его. Ряд можно сначала послушать (слова подсвечиваются; повторное нажатие «⏹ Остановить» прерывает озвучку), назвать вперёд или назад и выбрать задание «Продолжить»: даются первые слова, остальное называете сами. Если распознавание ошиблось, нажмите «Я сказал(а) верно». Числа, которые браузер записал цифрами, распознаются как слова. В ⚙️ настройках выбираются направление (только вперёд, вперёд и назад, только назад), показ ряда на экране, способ проверки и голосовая оценка. Проверка «По одному слову»: текущее слово подсвечено, слова пронумерованы; нажмите «🎤 Назвать следующее слово» и скажите одно слово. Если названия скрыты, ряд открывается по ходу: названные слова видны, следующее — «▢ ?», остальное не показано. Верное отмечается ✅, и рамка переходит дальше (если отмеченное слово не поместилось на экране, приложение коротко говорит «Да»); ошибка — ❌ с пояснением, что услышано (если названо другое слово ряда — его номер или «это слово идёт позже / уже было») и голосом «Нет. Нужно: …» (при скрытых названиях — «Нет. Ещё раз»), тогда можно «Ещё раз», «Я сказал(а) верно» или «Пропустить». В итоге — сколько слов названо с первой попытки. Названия «После ошибок» открываются после первой ошибки и остаются видны до нового задания. Результаты хранятся только на устройстве, записи голоса не сохраняются. Направление: вперёд, назад или «⇄ туда и обратно» (сначала вперёд, сразу назад). Названия на экран <li><b>👂 Тренировка слуха</b> — одно слово по шагам: 1) послушать, 2) повторить вслух, 3) собрать из букв. В конце итог: исходное слово, что вы проговорили и что собрали, с подсветкой различий. Затем можно повторить это слово или перейти к следующему. Если включена настройка «Обязательно проговаривать слово», к сборке из букв можно перейти только после верного произношения (или трёх попыток). Если распознавание ошиблось, а слово сказано верно, нажмите «Я сказал(а) верно».</li>
<li><b>✍️ Письмо</b> — тренировка правильного написания. Три уровня (выбор вверху экрана): «🖼 Картинка» — показывается картинка и звучит слово; «👂 Диктант» — только звук; «💬 Фраза» — диктант своей фразы из «Моих фраз» (если их нет, берутся примеры). Слово набирается на клавиатуре «Азбуки». «✔ Проверить»: верные буквы зелёные, ошибочные подсвечены, видно, сколько букв верно; их можно исправить и проверить снова. «💡 Ещё буква» оставляет верное начало и добавляет следующую букву, «👁 Показать» показывает слово, пока вы не начнёте писать. Картинка и кнопка 🔊 есть и рядом с полем ввода, над буквами, — они видны, даже когда задание наверху прокручено. Касание поля ввода разворачивает свёрнутые буквы. После проверки нажатая буква сразу исправляет первую отмеченную (она в мигающей рамке), следующая — следующую; пропущенная буква показана пустой рамкой ▢ и встаёт на своё место; ⌫ убирает отмеченную лишнюю букву. Когда все отмеченные буквы исправлены, нажмите «Проверить». Слово можно послушать ещё раз и по слогам. Регистр, буква «ё» и знаки препинания не учитываются. Ошибки попадают в статистику, трудные слова предлагаются чаще. Панель с буквами сворачивается кнопкой «⌨️ ▾ Скрыть буквы» и возвращается кнопкой «⌨️ ▴ Показать буквы»; в настройках (группа «Слова») можно включить автоматическое сворачивание после каждой нажатой буквы. Кнопка «🔡 Мельче» уменьшает кнопки с буквами, чтобы на экране помещалось больше; «🔠 Крупнее» возвращает обычный размер (выбор общий для «Азбуки» и «Письма»). На всех уровнях первые буквы слова или фразы подсказываются: сколько (0–3, 0 — без подсказки) задаётся в настройках, группа «Слова»; подсказанные буквы подчёркнуты.</li>
<li><b>📝 Тест на слух</b> — от 10 до 30 случайных слов подряд. Каждое слово звучит один раз, без повтора; вы проговариваете его или пропускаете. Верно или неверно, видно только в конце: результат, список слов и кнопка «Повторить ошибки». В настройках можно разрешить один повтор каждого слова.</li>
<li><b>🔤 Азбука</b> — подсказка по первой букве, когда слово «вертится на языке». Нажмите первую букву: появятся слова из словаря (включая «Мои слова»), которые с неё начинаются; следующая буква сужает список. Нажатие на слово добавляет его в строку (если включено автоозвучивание, слово сразу произносится), «Сказать так» озвучивает всю строку, ⌫ убирает последнее слово. «Скрыть буквы» освобождает место для слов (в настройках можно включить автосворачивание панели после каждой нажатой буквы; вернуть её — кнопка «Показать буквы»). «🔡 Мельче» уменьшает кнопки с буквами, «🔠 Крупнее» возвращает обычный размер. «Свободный набор» показывает весь алфавит: слово можно набирать так, как вы его себе представляете, даже с ошибками, а приложение предложит похожие слова. Категория слов здесь не учитывается: поиск идёт по всем словам. Если в настройках включён онлайн-поиск, под списком появляется кнопка «Найти слова в интернете»: слова ищутся в Викисловаре (для английского ещё в Datamuse), для этого набранные буквы отправляются в эти сервисы. Выбранное слово запоминается на устройстве. Собранная фраза показана словами-кнопками: нажатие убирает слово, «Очистить» убирает всё. Сворачиваемый блок «▶ Я, ты, в, на, не… — короткие слова» над строкой набора показывает местоимения, предлоги и частицы (стрелка ▼ — блок раскрыт), их можно добавить во фразу одним нажатием, после чего блок сам сворачивается; такие слова находятся и по буквам. «🎯 Тренировать» переносит фразу в тренировку, как в «Подсказке по сказанному»: приложение озвучит её, вы повторите, и фразу можно сохранить в «Мои фразы». Если в настройках включено «нажатие говорит слово, удержание добавляет», слово из списка сначала можно послушать.</li>
<li><b>🎤 Подсказка по сказанному</b> — перенесён из приложения «Говорим вместе» (вкладка «Говорит человек»). Нажмите «Говорить» и скажите фразу как получится. Приложение разберёт её на слова и соберёт в рамку; слова, которых нет в словаре, помечены «?». Нажмите на слово с «?»: появятся варианты (подбираются по звучанию, по соседним словам, по вашим прежним исправлениям; при включённом онлайн-поиске слов ещё и из интернета), можно оставить слово как есть или убрать его. Слова без «?» убираются нажатием, а порядок меняется удержанием и перетаскиванием. Кнопка «Я, в, на, не…» раскрывает служебные слова; после выбора слова блок сам сворачивается. «Очистить» сбрасывает экран. Подсказки берутся из «Мои фразы» и из встроенных бытовых фраз (например, «Я хочу в туалет»): по ним учитывается контекст, поэтому для искажённого слова вроде «толя» после «в» предлагается «туалет». Слова подбираются и по согласным: узнанные «т» и «л» подходят к слову «туалет». Затем нажмите «Сказать» (фраза прозвучит) или «🎯 Тренировать произношение»: приложение озвучит фразу, вы повторите её вслух, читая с экрана, и приложение голосом скажет, верно ли («Молодец!» или «Почти, попробуйте ещё раз»). Неверные слова можно исправить, повторять можно сколько угодно, а готовую фразу кнопкой «Добавить в Мои фразы» сохранить для следующих повторов. Упрощённый вид, поведение нажатия на слово из списка и онлайн-поиск слов включаются в ⚙️ настройках. Слова распознаются как «?» относительно словаря приложения; для более точных подсказок можно положить рядом с index.html частотные списки lex/ru.txt, lex/uk.txt, lex/en.txt (по одному слову в строке, как в «Говорим вместе»). Слово заменяется автоматически, только если одно и то же исправление выбрано дважды подряд. Выученные слова, исправления и частые фразы хранятся только на этом устройстве.</li>
<li><b>🗣 Мои фразы</b> — тренировка собственных фраз. Новую фразу можно сказать в режиме «Подсказка по сказанному» (кнопка «Сказать новую фразу»), а собранную фразу сохранить сюда. Фразу можно также вписать вручную (или добавить примеры, или загрузить список из файла: одна фраза в строке) и открыть её. В ⚙️ настройках можно скрыть текст фразы при повторении (останется только озвучивание), отключить голосовую оценку и автоматическое озвучивание. Нажмите «Сказать фразу» и произнесите её целиком. Приложение сравнит сказанное с нужной фразой по словам: верные слова зелёные, похожие жёлтые, неверные, пропущенные и лишние красные. Сначала показывается, сколько слов получилось верно. Нажмите на жёлтое или красное слово и выберите правильное из нескольких вариантов; когда вся фраза исправлена, приложение произнесёт её, и можно сказать ещё раз. Если распознавание ошиблось, а вы сказали верно, нажмите «Я сказал(а) верно». Распознавание речи в браузере не идеально, особенно при нарушенной речи, поэтому оценка условная; лучше заниматься вместе с логопедом. Фразы и счётчики попыток хранятся только на устройстве; записи голоса не сохраняются. «Сохранить в файл» и «Загрузить из файла» переносят список фраз на другое устройство.</li>
<li>Категория слов выбирается на стартовом экране. Кнопка 🏠 в заголовке возвращает к выбору режима. Системная кнопка «Назад» на Android сначала закрывает открытое окно, затем делает шаг назад внутри режима и возвращает к выбору режима; приложение закрывается только со стартового экрана.</li>
</ul>

<h3>Как заниматься</h3>
<ul>
<li><b>🔊 Послушать слово</b> — озвучить загаданное слово ещё раз.</li>
<li><b>🐢 По слогам</b> — медленное произнесение по слогам.</li>
<li><b>💡 Подсказка</b> — три уровня: первый слог, слово по слогам с ударением, ответ.</li>
<li><b>Выбор слова</b> — выберите услышанное слово среди вариантов. В <i>мягком режиме</i> неверный вариант гаснет, и можно выбрать снова. В обычном режиме попытка одна, правильный ответ подсвечивается.</li>
<li><b>Сбор слова из букв</b> — составьте слово из букв; можно показывать слоги.</li>
<li><b>Следующее слово ➔</b> — переход к новому заданию.</li>
<li>Счётчики над заданием показывают число верных ответов и всего заданий.</li>
</ul>

<h3>Проверка произношения</h3>
<ul>
<li>Нажмите <b>🎤 Проговорить и проверить себя</b>, когда появится «Слушаю», скажите слово.</li>
<li>Приложение озвучит результат: «Правильно» или «Неправильно, вы произнесли … Нужно: …» и покажет, какие буквы отличаются. В мягком режиме вместо «Неправильно» звучит «Почти. Послушайте ещё раз» и правильное слово. Слово засчитывается, если оно есть среди вариантов, которые распознал браузер. Пока микрофон слушает, приложение ничего не озвучивает.</li>
<li>После верного слова страница сама прокручивается к кнопке «Следующее слово».</li>
<li>После неверного слова появляется блок <b>🎧 Записать себя</b>: нажмите, скажите слово, нажмите ещё раз для остановки. Затем сравните на слух: «Эталон», «Моя запись» или «Подряд». Блок скрывается при переходе к следующему слову.</li>
<li>Распознавание речи требует разрешения на микрофон и, как правило, интернета.</li>
</ul>

<h3>📊 Статистика</h3>
<p>Вкладки: «Все», «🧩 Полный тренажёр», «🔢 Перечисления», «👂 Тренировка слуха», «✍️ Письмо». Для каждого режима видно, сколько было попыток и сколько верно сегодня и по дням за последние 7 дней занятий, а также трудные слова и частые путаницы (что было услышано, выбрано, сказано или написано вместо нужного слова). Для перечислений — результаты по каждому ряду и направлению. Вкладка «Все» собирает все режимы, включая «Тест на слух». «Я сказал(а) верно» исправляет последнюю ошибку и не добавляет лишнюю попытку. Слова с ошибками предлагаются чаще. Данные хранятся только на этом устройстве; их можно скачать в виде CSV или сбросить (на вкладке режима — только этот режим). Статистика по режимам ведётся с версии 53, более ранние ответы есть только на вкладке «Все».</p>

<h3>⚙️ Настройки</h3>
<ul>
<li><b>Группы</b> — настройки разделены на группы: основные, слова (🧩 👂 ✍️ 📝), 🔤 Азбука и 🎤 подсказка, 🗣 Мои фразы, 🔢 Перечисления, 💾 данные. Открыта одна группа; если открыть настройки из режима, сразу раскрывается его группа.</li>
<li><b>Голосом говорить, правильно ли сказано</b> — одна настройка для всех режимов. После ошибки приложение называет правильное слово.</li>
<li><b>Язык и тема</b> — русский, украинский, английский; светлая и тёмная тема.</li>
<li><b>Количество вариантов</b> — 2, 3 или 4.</li>
<li><b>Голос и скорость речи</b> — голос устройства и темп озвучивания.</li>
<li><b>Мягкий режим</b> — неверные варианты гаснут, выбирать можно снова.</li>
<li><b>Картинки (эмодзи)</b> — показывать рисунок рядом со словом.</li>
<li><b>Автоозвучивание</b> — новое слово или фраза (в «Моих фразах») произносится само.</li>
<li><b>Блоки заданий</b> — можно включать и отключать «выбор слова» и «сбор из букв»; для режима только из букв можно показывать слоги.</li>
<li><b>Строгая проверка речи</b> — в ответе не должно быть других слов. Слово должно совпасть точно; похожее, но неточное слово не засчитывается.</li>
<li><b>Обязательно проговаривать слово</b> — пока слово не произнесено верно, «Следующее слово» не срабатывает, а страница возвращается к блоку проговаривания. После трёх неудачных попыток переход открывается, чтобы не застрять.</li>
<li><b>Таймер «Игра / Отдых»</b> — после времени игры включается пауза для отдыха; длительность задаётся в минутах. Время игры идёт только внутри режимов тренировки; на стартовом экране и пока открыты настройки, справка или статистика, таймер стоит (в шапке значок ⏸). В «Азбуке» и «Подсказке по сказанному» перерыв не прерывает человека: он начнётся после того, как фраза озвучена, или при выходе из режима (в шапке ☕). Оставшееся время видно в шапке во всех режимах; нажатие на него ставит паузу.</li>
<li><b>🔤 Азбука, 🎤 Подсказка по сказанному и 🗣 Мои фразы</b> — онлайн-поиск слов, сворачивание букв, упрощённый вид подсказки; поведение слова из списка (нажатие говорит, удержание добавляет) общее для «Азбуки» и подсказки; показ текста фразы при повторении в «Моих фразах».</li>
<li><b>📚 Мои слова</b> — окно для добавления своих слов в словарь (описание ниже).</li>
<li><b>💾 Данные: копия и перенос</b> — все настройки, свои слова и фразы, статистика хранятся только на этом устройстве. «💾 Сохранить копию данных» создаёт файл (обычно в папке «Загрузки»), «📂 Загрузить копию данных» возвращает всё из такого файла — на другом телефоне или после переустановки. Перед загрузкой приложение спрашивает подтверждение: текущие данные будут заменены.</li>
<li><b>Открыто внутри Facebook или другого приложения</b> — у встроенного браузера соцсети своё хранилище: там приложение открывается «с нуля», а изменения не попадают в установленное приложение. Сверху появляется жёлтая плашка: «🌐 Открыть в Chrome» (Android) или «📋 Копировать ссылку», чтобы открыть ссылку в обычном браузере. Плашку можно скрыть ✕.</li>
</ul>

<h3>📚 Свой словарь</h3>
<ul>
<li>Откройте <b>⚙️ Настройки → 📚 Мои слова</b>.</li>
<li><b>Добавить слово:</b> нажмите 🎤 и скажите слово. Проверьте распознанный вариант: если он неточный, выберите другой из подсказок под полем или поправьте текст вручную. Слоги подставляются сами, при необходимости исправьте их (слоги через дефис). <b>Чтобы указать ударение</b>, напишите ударную гласную заглавной буквой, остальные оставьте строчными, например: стра-нИ-ца. Ударение подсветится в подсказках и будет учтено при озвучивании; проверить его можно кнопкой «🔊 Прослушать». Нажмите «➕ Добавить».</li>
<li>Свои слова попадают в категорию «Мои слова» и участвуют в заданиях наравне с остальными. Ненужные слова удаляются кнопкой 🗑 в списке.</li>
<li>Слова хранятся на устройстве и работают без интернета. «Экспорт» сохраняет их в файл, «Импорт» добавляет слова из такого файла, например на другом устройстве.</li>
<li><b>Онлайн-словарь:</b> положите на сайт рядом с приложением файл <code>extra-dict.json</code>. При наличии интернета приложение скачает его, сохранит копию на устройстве и будет пользоваться ею без сети. Формат файла такой же, как у экспорта: язык, категория, список слов. Слоги можно не указывать; ударение отмечается так же, заглавной гласной (например, <code>странИца</code>). В разделе <code>pairs</code> можно задать похожие слова для вариантов ответа. Кнопка «🔄 Обновить» загружает файл сразу.</li>
<li>Распознавание речи при добавлении слова, как и при проверке произношения, обычно требует интернета; вводить слова с клавиатуры можно и без него.</li>
</ul>

<h3>Режими тренування</h3>
<ul>
<li><b>🧩 Повний тренажер</b> — усі блоки на одному екрані: вибір слова на слух, перевірка вимови, збирання з літер.</li>
<li><b>🔢 Перелічення</b> — тренування називання рядів по порядку: дні тижня, місяці, пори року, частини доби, кольори веселки, числа 1–10, 1–20 і десятки до 100. Можна додати своє перелічення (наприклад, імена рідних). Напрямок, завдання й показ назв зібрано в згортуваний блок «⚙️» над завданням: у згорнутому вигляді в ньому видно, що вибрано (▶ — згорнуто, ▼ — розгорнуто). Оберіть ряд, натисніть «Говорити» й назвіть усе по порядку, потім «Закінчив(ла)» (або просто помовчіть). Застосунок покаже й голосом скаже, що правильно, що пропущено й що зайве; натискання на слово озвучує його. Ряд можна спершу послухати (слова підсвічуються; повторне натискання «⏹ Зупинити» перериває озвучення), назвати вперед чи назад і обрати завдання «Продовжити»: дають перші слова, решту називаєте самі. Якщо розпізнавання помилилося, натисніть «Я сказав(ла) правильно». Числа, які браузер записав цифрами, розпізнаються як слова. У ⚙️ налаштуваннях обираються напрямок (лише вперед, вперед і назад, лише назад), показ ряду на екрані, спосіб перевірки й голосова оцінка. Перевірка «По одному слову»: поточне слово підсвічено, слова пронумеровано; натисніть «🎤 Назвати наступне слово» і скажіть одне слово. Якщо назви приховано, ряд відкривається по ходу: названі слова видно, наступне — «▢ ?», решту не показано. Правильне позначається ✅, і рамка переходить далі (якщо позначене слово не вмістилося на екрані, застосунок коротко каже «Так»); помилка — ❌ з поясненням, що почуто (якщо назвали інше слово ряду — його номер або «це слово йде пізніше / вже було») і голосом «Ні. Треба: …» (якщо назви приховано — «Ні. Ще раз»), тоді можна «Ще раз», «Я сказав(ла) правильно» або «Пропустити». У підсумку — скільки слів названо з першої спроби. Назви «Після помилок» відкриваються після першої помилки й лишаються видимими до нового завдання. Результати зберігаються лише на пристрої, записи голосу не зберігаються. Напрямок: уперед, назад або «⇄ туди й назад» (спершу уперед, одразу назад). Назви на екрані можна зробити видимими, показувати лише після помилок або приховати зовсім — так завдання поступово ускладнюється.</li>
<li><b>👂 Тренування слуху</b> — одне слово по кроках: 1) послухати, 2) повторити вголос, 3) зібрати з літер. Наприкінці підсумок: вихідне слово, що ви промовили і що зібрали, з підсвічуванням відмінностей. Потім можна повторити це слово або перейти до наступного. Якщо ввімкнено налаштування «Обов’язково промовляти слово», до збирання з літер можна перейти лише після правильної вимови (або трьох спроб). Якщо розпізнавання помилилося, а слово сказано правильно, натисніть «Я сказав(ла) правильно».</li>
<li><b>✍️ Письмо</b> — тренування правильного написання. Три рівні (вибір угорі екрана): «🖼 Картинка» — показується картинка й звучить слово; «👂 Диктант» — лише звук; «💬 Фраза» — диктант власної фрази з «Моїх фраз» (якщо їх немає, беруться приклади). Слово набирається на клавіатурі «Абетки». «✔ Перевірити»: правильні літери зелені, помилкові підсвічено, видно, скільки літер правильно; їх можна виправити й перевірити знову. «💡 Ще літера» залишає правильний початок і додає наступну літеру, «👁 Показати» показує слово, доки ви не почнете писати. Картинка й кнопка 🔊 є й поруч із полем введення, над літерами, — їх видно, навіть коли завдання вгорі прокручено. Дотик до поля введення розгортає згорнуті літери. Після перевірки натиснута літера одразу виправляє першу позначену (вона в блимаючій рамці), наступна — наступну; пропущена літера показана порожньою рамкою ▢ і стає на своє місце; ⌫ прибирає позначену зайву літеру. Коли всі позначені літери виправлено, натисніть «Перевірити». Слово можна послухати ще раз і по складах. Регістр і розділові знаки не враховуються. Помилки потрапляють до статистики, важкі слова пропонуються частіше. Панель з літерами згортається кнопкою «⌨️ ▾ Сховати літери» й повертається кнопкою «⌨️ ▴ Показати літери»; у налаштуваннях (група «Слова») можна ввімкнути автоматичне згортання після кожної натиснутої літери. Кнопка «🔡 Дрібніше» зменшує кнопки з літерами, щоб на екрані вміщалося більше; «🔠 Більше» повертає звичайний розмір (вибір спільний для «Абетки» й «Письма»). На всіх рівнях перші літери слова чи фрази підказуються: скільки (0–3, 0 — без підказки) задається в налаштуваннях, група «Слова»; підказані літери підкреслено.</li>
<li><b>📝 Тест на слух</b> — від 10 до 30 випадкових слів поспіль. Кожне слово звучить один раз, без повтору; ви промовляєте його або пропускаєте. Правильно чи ні, видно лише наприкінці: результат, список слів і кнопка «Повторити помилки». У налаштуваннях можна дозволити один повтор кожного слова.</li>
<li><b>🔤 Абетка</b> — підказка за першою літерою, коли слово «крутиться на язиці». Натисніть першу літеру: з’являться слова зі словника (разом із «Моїми словами»), що з неї починаються; наступна літера звужує список. Натискання на слово додає його до рядка (якщо ввімкнено автоозвучення, слово одразу промовляється), «Сказати так» озвучує весь рядок, ⌫ прибирає останнє слово. «Сховати літери» вивільняє місце для слів (в налаштуваннях можна ввімкнути автозгортання панелі після кожної натиснутої літери; повернути її — кнопка «Показати літери»). «🔡 Дрібніше» зменшує кнопки з літерами, «🔠 Більше» повертає звичайний розмір. «Вільний набір» показує всю абетку: слово можна набирати так, як ви його собі уявляєте, навіть з помилками, а застосунок запропонує схожі слова. Категорія слів тут не враховується: пошук іде по всіх словах. Якщо в налаштуваннях увімкнено онлайн-пошук, під списком з’являється кнопка «Знайти слова в інтернеті»: слова шукаються у Вікісловнику (для англійської ще в Datamuse), для цього набрані літери надсилаються цим сервісам. Обране слово запам’ятовується на пристрої. Зібрана фраза показана словами-кнопками: натискання прибирає слово, «Очистити» прибирає все. Згортуваний блок «▶ Я, ти, в, на, не… — короткі слова» над рядком набору показує займенники, прийменники й частки (стрілка ▼ — блок розгорнуто), їх можна додати до фрази одним натисканням, після чого блок сам згортається; такі слова знаходяться й за літерами. «🎯 Тренувати» переносить фразу в тренування, як у «Підказці за сказаним»: застосунок озвучить її, ви повторите, і фразу можна зберегти в «Мої фрази». Якщо в налаштуваннях увімкнено «натискання говорить слово, утримання додає», слово зі списку спершу можна послухати.</li>
<li><b>🎤 Підказка за сказаним</b> — перенесено із застосунку «Говоримо разом» (вкладка «Говорить людина»). Натисніть «Говорити» й скажіть фразу, як вийде. Застосунок розбере її на слова й збере в рамку; слова, яких немає у словнику, позначено «?». Натисніть на слово з «?»: з’являться варіанти (добираються за звучанням, за сусідніми словами, за вашими попередніми виправленнями; за ввімкненого онлайн-пошуку слів ще й з інтернету), можна залишити слово як є або прибрати. Слова без «?» прибираються натисканням, а порядок змінюється утриманням і перетягуванням. Кнопка «Я, в, на, не…» розкриває службові слова; після вибору слова блок сам згортається. «Очистити» скидає екран. Підказки беруться з «Моїх фраз» і з вбудованих побутових фраз (наприклад, «Я хочу в туалет»): за ними враховується контекст, тому для спотвореного слова на кшталт «толя» після «в» пропонується «туалет». Слова добираються й за приголосними: упізнані «т» і «л» підходять до слова «туалет». Потім натисніть «Сказати» (фраза пролунає) або «🎯 Тренувати вимову»: застосунок озвучить фразу, ви повторите її вголос, читаючи з екрана, і застосунок голосом скаже, чи правильно («Молодець!» або «Майже, спробуйте ще раз»). Неправильні слова можна виправити, повторювати можна скільки завгодно, а готову фразу кнопкою «Додати до Моїх фраз» зберегти для наступних повторів. Спрощений вигляд, поведінка натискання на слово зі списку й онлайн-пошук слів вмикаються в ⚙️ налаштуваннях. Слова розпізнаються як «?» відносно словника застосунку; для точніших підказок можна покласти поруч з index.html частотні списки lex/ru.txt, lex/uk.txt, lex/en.txt (одне слово в рядку, як у «Говоримо разом»). Слово замінюється автоматично, лише якщо те саме виправлення обрано двічі поспіль. Вивчені слова, виправлення й часті фрази зберігаються лише на цьому пристрої.</li>
<li><b>🗣 Мої фрази</b> — тренування власних фраз. Нову фразу можна сказати в режимі «Підказка за сказаним» (кнопка «Сказати нову фразу»), а зібрану фразу зберегти сюди. Фразу можна й вписати вручну (або додати приклади, або завантажити список із файлу: одна фраза в рядку) та відкрити її. У ⚙️ налаштуваннях можна сховати текст фрази під час повторення (залишиться лише озвучення), вимкнути голосову оцінку й автоматичне озвучення. Натисніть «Сказати фразу» й промовте її цілком. Застосунок порівняє сказане з потрібною фразою по словах: правильні слова зелені, схожі жовті, неправильні, пропущені й зайві червоні. Спочатку показується, скільки слів вийшло правильно. Натисніть на жовте або червоне слово й оберіть правильне з кількох варіантів; коли всю фразу виправлено, застосунок промовить її, і можна сказати ще раз. Якщо розпізнавання помилилося, а ви сказали правильно, натисніть «Я сказав(ла) правильно». Розпізнавання мовлення в браузері не ідеальне, особливо при порушеному мовленні, тому оцінка умовна; краще займатися разом із логопедом. Фрази й лічильники спроб зберігаються лише на пристрої; записи голосу не зберігаються. «Зберегти у файл» і «Завантажити з файлу» переносять список фраз на інший пристрій.</li>
<li>Категорія слів обирається на стартовому екрані. Кнопка 🏠 у заголовку повертає до вибору режиму. Системна кнопка «Назад» на Android спершу закриває відкрите вікно, потім робить крок назад усередині режиму й повертає до вибору режиму; застосунок закривається лише зі стартового екрана.</li>
</ul>

<h3>Як займатися</h3>
<ul>
<li><b>🔊 Послухати слово</b> — озвучити загадане слово ще раз.</li>
<li><b>🐢 По складах</b> — повільна вимова по складах.</li>
<li><b>💡 Підказка</b> — три рівні: перший склад, слово по складах з наголосом, відповідь.</li>
<li><b>Вибір слова</b> — виберіть почуте слово серед варіантів. У <i>м’якому режимі</i> неправильний варіант гасне, і можна вибрати знову. У звичайному режимі спроба одна, правильна відповідь підсвічується.</li>
<li><b>Збирання слова з літер</b> — складіть слово з літер; можна показувати склади.</li>
<li><b>Наступне слово ➔</b> — перехід до нового завдання.</li>
<li>Лічильники над завданням показують кількість правильних відповідей і всього завдань.</li>
</ul>

<h3>Перевірка вимови</h3>
<ul>
<li>Натисніть <b>🎤 Промовити і перевірити себе</b>, коли з’явиться «Слухаю», скажіть слово.</li>
<li>Застосунок озвучить результат: «Правильно» або «Неправильно, ви вимовили … Потрібно: …» і покаже, які літери відрізняються. У м’якому режимі замість «Неправильно» звучить «Майже. Послухайте ще раз» і правильне слово. Слово зараховується, якщо воно є серед варіантів, які розпізнав браузер. Поки мікрофон слухає, застосунок нічого не озвучує.</li>
<li>Після правильного слова сторінка сама прокручується до кнопки «Наступне слово».</li>
<li>Після неправильного слова з’являється блок <b>🎧 Записати себе</b>: натисніть, скажіть слово, натисніть ще раз для зупинки. Потім порівняйте на слух: «Еталон», «Мій запис» або «Підряд». Блок ховається при переході до наступного слова.</li>
<li>Розпізнавання мовлення потребує дозволу на мікрофон і, як правило, інтернету.</li>
</ul>

<h3>📊 Статистика</h3>
<p>Вкладки: «Усі», «🧩 Повний тренажер», «🔢 Перелічення», «👂 Тренування слуху», «✍️ Письмо». Для кожного режиму видно, скільки було спроб і скільки правильно сьогодні та по днях за останні 7 днів занять, а також важкі слова й часті плутанини (що було почуто, обрано, сказано чи написано замість потрібного слова). Для перелічень — результати за кожним рядом і напрямком. Вкладка «Усі» збирає всі режими, зокрема «Тест на слух». «Я сказав(ла) правильно» виправляє останню помилку й не додає зайвої спроби. Слова з помилками пропонуються частіше. Дані зберігаються лише на цьому пристрої; їх можна завантажити як CSV або скинути (на вкладці режиму — лише цей режим). Статистика за режимами ведеться з версії 53, раніші відповіді є лише на вкладці «Усі».</p>

<h3>⚙️ Налаштування</h3>
<ul>
<li><b>Групи</b> — налаштування поділено на групи: основні, слова (🧩 👂 ✍️ 📝), 🔤 Абетка й 🎤 підказка, 🗣 Мої фрази, 🔢 Перелічення, 💾 дані. Відкрита одна група; якщо відкрити налаштування з режиму, одразу розкривається його група.</li>
<li><b>Голосом казати, чи правильно сказано</b> — одне налаштування для всіх режимів. Після помилки застосунок називає правильне слово.</li>
<li><b>Мова і тема</b> — російська, українська, англійська; світла й темна тема.</li>
<li><b>Кількість варіантів</b> — 2, 3 або 4.</li>
<li><b>Голос і швидкість мовлення</b> — голос пристрою і темп озвучення.</li>
<li><b>М’який режим</b> — неправильні варіанти гаснуть, вибирати можна знову.</li>
<li><b>Картинки (емодзі)</b> — показувати малюнок поруч зі словом.</li>
<li><b>Автоозвучення</b> — нове слово або фраза (у «Моїх фразах») вимовляється саме.</li>
<li><b>Блоки завдань</b> — можна вмикати й вимикати «вибір слова» та «збирання з літер»; для режиму лише з літер можна показувати склади.</li>
<li><b>Сувора перевірка мовлення</b> — у відповіді не має бути інших слів. Слово має збігтися точно; схоже, але неточне слово не зараховується.</li>
<li><b>Обов’язково промовляти слово</b> — доки слово не вимовлено правильно, «Наступне слово» не спрацьовує, а сторінка повертається до блоку промовляння. Після трьох невдалих спроб перехід відкривається, щоб не застрягти.</li>

        return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    }

    function nextIsLocked() {
        return isChecked('requireSpeech') && speechRecognitionAvailable() &&
               !speechPassed && speechAttempts < MAX_SPEECH_ATTEMPTS;
    }

    function updateNextLock() {
        const btn = document.getElementById('nextBtn');
        if (!btn) return;
        const locked = nextIsLocked();
        btn.style.opacity = locked ? '0.5' : '';
        btn.setAttribute('aria-disabled', locked ? 'true' : 'false');
    }

    function registerSpeechAttempt(ok) {
        if (ok) speechPassed = true; else speechAttempts++;
        updateNextLock();
    }

    function resetSpeechRequirement() {
        speechPassed = false;
        speechAttempts = 0;
        updateNextLock();
    }

    function tryNextQuestion() {
        if (nextIsLocked()) {
            const box = document.getElementById('speechResultBox');
            box.className = 'speech-result-box info';
            box.innerText = ex().requireMsg;
            scrollToSpeechBlock();
            return;
        }
        nextQuestion();
    }

    // Озвучивание результата распознавания речи:
    // верно -> «Правильно»; неверно -> «Неправильно, вы произнесли» + распознанное слово.
    // На Android сразу после распознавания движок синтеза часто молчит (микрофон/аудиофокус
    // ещё заняты), поэтому фраза запоминается и произносится, когда распознавание
    // полностью завершилось (onend) или по запасному таймеру; при неудаче - повтор.
    // Под результатом выводится строка состояния озвучивания (для диагностики).
    let pendingSpeechFeedback = null;
    let feedbackToken = 0;

    function setFeedbackStatus(msg) {
        console.log('[feedback]', msg);
    }

    function speakSpeechFeedback(isCorrect, recognizedWord, target) {
        if (!('speechSynthesis' in window)) {
            setFeedbackStatus('⚠ TTS не поддерживается');
            return;
        }
        if (!verdictOn()) { pendingSpeechFeedback = null; return; }
        const phrases = {
            ru: { ok: 'Правильно', bad: 'Неправильно, вы произнесли', need: 'Нужно:', soft: 'Почти. Послушайте ещё раз:' },
            uk: { ok: 'Правильно', bad: 'Неправильно, ви вимовили', need: 'Потрібно:', soft: 'Майже. Послухайте ще раз:' },
            en: { ok: 'Correct', bad: 'Incorrect, you said', need: 'The word is:', soft: 'Almost. Listen again:' }
        };
        const p = phrases[currentLang] || phrases.ru;
        // После ошибки человек слышит образец — правильное слово (с ударением из таблицы)
        const model = target ? (getPhoneticRepresentation(String(target).toLowerCase()) || target) : '';
        if (isCorrect) pendingSpeechFeedback = p.ok;
        else if (isChecked('gentleMode')) pendingSpeechFeedback = model ? p.soft + ' ' + model : p.soft.replace(/:$/, '.');
        else pendingSpeechFeedback = p.bad + ' ' + recognizedWord + (model ? '. ' + p.need + ' ' + model : '');
        const token = ++feedbackToken;
        setFeedbackStatus('🔊 ожидание озвучивания…');
        // Освобождаем микрофон сразу, чтобы движок синтеза не конфликтовал с ним.
        try { if (recognition) recognition.stop(); } catch (e) {}
        // Запасной вариант, если onend не сработает.
        setTimeout(() => { if (token === feedbackToken) flushSpeechFeedback(); }, 1500);
    }

    function flushSpeechFeedback() {
        const text = pendingSpeechFeedback;
        if (!text) return;
        pendingSpeechFeedback = null;
        const synth = window.speechSynthesis;

        const attempt = (triesLeft) => {
            let started = false;
            try {
                synth.cancel();
                synth.resume();
                const u = makeUtterance(text, 1);
                u.volume = 1;
                u.onstart = () => { started = true; setFeedbackStatus('🔊 звучит'); };
                u.onend = () => { started = true; setFeedbackStatus('🔊 озвучено'); };
                u.onerror = (ev) => { setFeedbackStatus('⚠ ошибка TTS: ' + (ev && ev.error ? ev.error : '?')); };
                setTimeout(() => synth.speak(u), 100);
            } catch (e) {
                console.warn('Feedback speech failed:', e);
                setFeedbackStatus('⚠ исключение TTS: ' + e.message);
            }
            // Если речь не началась - пробуем ещё раз.
            setTimeout(() => {
                if (started) return;
                if (triesLeft > 0) {
                    setFeedbackStatus('🔊 повтор… (голосов: ' + synth.getVoices().length + ')');
                    attempt(triesLeft - 1);
                } else {
                    setFeedbackStatus('⚠ речь не запустилась (голосов: ' + synth.getVoices().length + ')');
                }
            }, 1500);
        };
        setTimeout(() => attempt(2), 800);
    }

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            const box = document.getElementById('speechResultBox');
            box.className = 'speech-result-box info';
            box.innerText = ex().recNo;
            return;
        }

        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.maxAlternatives = 3;

        recognition.onstart = () => {
            isRecording = true;
            const btn = document.getElementById('recordBtn');
            btn.classList.add('recording');
            btn.innerText = i18n[currentLang].recordBtnStop;
        };

        recognition.onend = () => {
            isRecording = false;
            flushSpeechFeedback();
            const btn = document.getElementById('recordBtn');
            btn.classList.remove('recording');
            btn.innerText = i18n[currentLang].recordBtnStart;
        };

        recognition.onresult = (event) => {
            const alts = Array.from(event.results[0] || []).map(a => a.transcript.trim().toLowerCase());
            const targetClean = targetWordClean.toLowerCase();
            const box = document.getElementById('speechResultBox');
            const t = i18n[currentLang];

            const m = speechMatchAlts({ transcript: alts[0] || '', alts }, targetClean, isChecked('strictSpeech'));
            const isCorrect = m.ok;
            const transcript = m.heard;

            recordResult('speech', targetClean, transcript, isCorrect);
            registerSpeechAttempt(isCorrect);

            if (isCorrect) {
                box.className = 'speech-result-box correct';
                box.innerText = t.speechYouSaid + `"${transcript}". ` + t.speechCorrect;
                speakSpeechFeedback(true, transcript, targetClean);
                scrollToNextButton();
            } else {
                const soft = isChecked('gentleMode');
                box.className = 'speech-result-box ' + (soft ? 'info' : 'incorrect');
                box.innerText = t.speechYouSaid + `"${transcript}". ` + (soft ? t.retryMsg : t.speechIncorrect);
                box.insertAdjacentHTML('beforeend', buildDiffHtml(targetClean, transcript));
                showOwnPanel();
                speakSpeechFeedback(false, transcript, targetClean);
            }
        };

        recognition.onerror = (event) => {
            console.warn("Speech recognition error:", event.error);
            if (event.error !== 'aborted') {
                const eb = document.getElementById('speechResultBox');
                eb.className = 'speech-result-box info';
                eb.innerText = recErrorText(event.error);
            }
            if (event.error !== 'aborted') registerSpeechAttempt(false);
            isRecording = false;
            const btn = document.getElementById('recordBtn');
            btn.classList.remove('recording');
            btn.innerText = i18n[currentLang].recordBtnStart;
        };
    }

    function toggleRecording() {
        if (!recognition) {
            initSpeechRecognition();
        }
        if (!recognition) return;

        if (isRecording) {
            recognition.stop();
        } else {
            if (currentLang === 'uk') recognition.lang = 'uk-UA';
            else if (currentLang === 'ru') recognition.lang = 'ru-RU';
            else recognition.lang = 'en-US';

            resetOwnVoicePanel();
            // перед записью останавливаем озвучку и несказанный отзыв, чтобы микрофон их не услышал
            pendingSpeechFeedback = null;
            feedbackToken++;
            try { stopModeRec(); window.speechSynthesis.cancel(); } catch (e) {}
            recognition.start();
        }
    }

    function toggleTimerFeature() {
        const enabled = document.getElementById('timerEnabled').checked;
        const settingsGroup = document.getElementById('timerSettingsGroup');
        const statusRow = document.querySelector('.timer-status-row');

        if (enabled) {
            settingsGroup.style.display = 'flex';
            statusRow.style.display = 'flex';
            startTimer();
        } else {
            settingsGroup.style.display = 'none';
            statusRow.style.display = 'none';
            stopTimer();
            restPending = false;
        }
        saveSettings();
        syncHdrTimer();
    }

    function updateTimerSettings() {
        saveSettings();
        resetTimer();
    }

    function resetTimer() {
        stopTimer();
        restPending = false;
        timerMode = 'play';
        const playMins = parseInt(document.getElementById('playMinutes').value, 10) || 5;
        timerSecondsLeft = playMins * 60;
        updateTimerDisplayUI();
        if (document.getElementById('timerEnabled').checked) {
            startTimer();
        }
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        isTimerRunning = true;
        isTimerPaused = false;
        updateTimerPauseBtnUI();

        timerInterval = setInterval(() => {
            if (isTimerPaused) return;
            // время игры идёт только внутри режима, без открытых окон; перерыв, ожидающий озвучки фразы, не считается
            if (timerMode === 'play' && (restPending || !timerCounts())) { syncHdrTimer(); return; }

            timerSecondsLeft--;
            if (timerSecondsLeft <= 0) {
                switchTimerMode();
            }
            updateTimerDisplayUI();
        }, 1000);
    }

    // Идёт ли время игры: только в режимах тренировки и без открытых окон (настройки, справка, статистика, словарь)
    let restPending = false;
    function timerCounts() {
        try { return screenName !== 'select' && !NAV_OVERLAYS.some(overlayOpen); } catch (e) { return false; }
    }
    // В «Азбуке» и «Подсказке по сказанному» человек может что-то говорить близким: перерыв откладывается
    // до озвучивания фразы или выхода из режима
    const REST_DEFER = { abc: 1, hear: 1 };
    function startRestNow() {
        restPending = false;
        const restMins = parseInt(document.getElementById('restMinutes').value, 10) || 10;
        timerMode = 'rest';
        timerSecondsLeft = restMins * 60;
        showRestOverlay(true);
        updateTimerDisplayUI();
    }
    // Вызывается после озвучивания фразы: перерыв начнётся, когда речь закончится
    function restAfterSpeech() {
        if (!restPending) return;
        let n = 0;
        const tick = () => {
            if (!restPending) return;
            const busy = ('speechSynthesis' in window) && (speechSynthesis.speaking || speechSynthesis.pending);
            if (busy && n++ < 40) { setTimeout(tick, 500); return; }
            setTimeout(() => { if (restPending) startRestNow(); }, 800);
        };
        setTimeout(tick, 600);
    }

    function stopTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = null;
        isTimerRunning = false;
    }

    function toggleTimerPause() {
        isTimerPaused = !isTimerPaused;
        updateTimerPauseBtnUI();
    }

    function updateTimerPauseBtnUI() {
        const btn = document.getElementById('timerPauseBtn');
        const t = i18n[currentLang];
        btn.innerText = isTimerPaused ? t.timerResume : t.timerPause;
        syncHdrTimer();
    }

    function switchTimerMode() {
        const playMins = parseInt(document.getElementById('playMinutes').value, 10) || 5;
        const restMins = parseInt(document.getElementById('restMinutes').value, 10) || 10;

        if (timerMode === 'play') {
            if (REST_DEFER[screenName]) { restPending = true; timerSecondsLeft = 0; syncHdrTimer(); return; }
            timerMode = 'rest';
            timerSecondsLeft = restMins * 60;
            showRestOverlay(true);
        } else {
            timerMode = 'play';
            timerSecondsLeft = playMins * 60;
            showRestOverlay(false);
        }
    }

    function skipRest() {
        restPending = false;
        const playMins = parseInt(document.getElementById('playMinutes').value, 10) || 5;
        timerMode = 'play';
        timerSecondsLeft = playMins * 60;
        showRestOverlay(false);
        updateTimerDisplayUI();
    }

    function showRestOverlay(show) {
        const overlay = document.getElementById('restOverlay');
        const container = document.querySelector('.container');
        if (show) {
            try {
                stopModeSpeech();
                HP.stop();
                if (ser.listening) { serStop(); if (screenName === 'ser') serRender(true); }
                if (isRecording && recognition) recognition.abort();
                stopOwnRecording();
            } catch (e) {}
            overlay.classList.remove('hidden');
            container.classList.add('resting-blocked');
        } else {
            overlay.classList.add('hidden');
            container.classList.remove('resting-blocked');
        }
    }

    function updateTimerDisplayUI() {
        const display = document.getElementById('timerDisplay');
        const overlayLeft = document.getElementById('restTimeLeft');
        const t = i18n[currentLang];

        const mins = Math.floor(timerSecondsLeft / 60).toString().padStart(2, '0');
        const secs = (timerSecondsLeft % 60).toString().padStart(2, '0');
        const timeStr = `${mins}:${secs}`;

        if (timerMode === 'play') {
            display.innerText = t.timerPlayPrefix + timeStr;
            display.classList.remove('resting');
        } else {
            display.innerText = t.timerRestPrefix + timeStr;
            display.classList.add('resting');
            if (overlayLeft) overlayLeft.innerText = timeStr;
        }
        syncHdrTimer();
    }

    // Оставшееся время игры в шапке во всех режимах (в полном тренажёре оно показано на экране); нажатие — пауза
    function syncHdrTimer() {
        const el = document.getElementById('hdrTimer');
        if (!el) return;
        const on = isChecked('timerEnabled') && screenName !== 'full' && timerMode === 'play';
        const was = el.style.display;
        el.style.display = on ? '' : 'none';
        if (was !== el.style.display) fitAppTitle();
        if (!on) return;
        const t = i18n[currentLang];
        const mm = Math.floor(timerSecondsLeft / 60).toString().padStart(2, '0'), ss = (timerSecondsLeft % 60).toString().padStart(2, '0');
        const narrow = (window.innerWidth || 999) <= 400;
        const idle = isTimerPaused || !timerCounts();
        const w0 = el.offsetWidth;
        el.textContent = restPending ? '☕' : (idle ? '⏸ ' : (narrow ? '' : '🎮 ')) + mm + ':' + ss;
        el.classList.toggle('paused', idle && !restPending);
        if (el.offsetWidth !== w0) fitAppTitle();   // ширина таймера изменилась — название подгоняется заново
        const lbl = (isTimerPaused ? t.timerResume : t.timerPause).replace(/^\S+\s*/, '');
        el.title = lbl; el.setAttribute('aria-label', lbl);
    }

    function saveSettings() {
        localStorage.setItem('app_lang', currentLang);
        const theme = document.documentElement.getAttribute('data-theme') || 'dark';
        localStorage.setItem('app_theme', theme);
        localStorage.setItem('app_options_count', optionsCount);
        localStorage.setItem('app_voice', document.getElementById('voiceSelect').value);
        localStorage.setItem('app_rate', document.getElementById('rateRange').value);
        localStorage.setItem('app_timer_enabled', document.getElementById('timerEnabled').checked);
        localStorage.setItem('app_play_mins', document.getElementById('playMinutes').value);
        localStorage.setItem('app_rest_mins', document.getElementById('restMinutes').value);
        localStorage.setItem('app_category', document.getElementById('categorySelect').value);
        localStorage.setItem('app_gentle', document.getElementById('gentleMode').checked);
        localStorage.setItem('app_emoji', document.getElementById('emojiEnabled').checked);
        localStorage.setItem('app_autospeak', document.getElementById('autoSpeak').checked);
        localStorage.setItem('app_mode_choice', document.getElementById('modeChoice').checked);
        localStorage.setItem('app_mode_spell', document.getElementById('modeSpell').checked);
        localStorage.setItem('app_spell_syll_hint', document.getElementById('spellSyllableHint').checked);
        localStorage.setItem('app_strict_speech', document.getElementById('strictSpeech').checked);
        localStorage.setItem('app_require_speech', document.getElementById('requireSpeech').checked);
        updateNextLock();
    }

    function loadSettings() {
        const savedTheme = localStorage.getItem('app_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        const savedOptionsCount = localStorage.getItem('app_options_count');
        if (savedOptionsCount) {
            optionsCount = parseInt(savedOptionsCount, 10);
            document.getElementById('optionsCountSelect').value = optionsCount;
        }

        const savedRate = localStorage.getItem('app_rate');
        if (savedRate) {
            document.getElementById('rateRange').value = savedRate;
            updateRateLabel(savedRate);
        }

        const savedTimerEnabled = localStorage.getItem('app_timer_enabled');
        if (savedTimerEnabled !== null) {
            document.getElementById('timerEnabled').checked = (savedTimerEnabled === 'true');
        }

        const savedPlayMins = localStorage.getItem('app_play_mins');
        if (savedPlayMins) document.getElementById('playMinutes').value = savedPlayMins;

        const savedRestMins = localStorage.getItem('app_rest_mins');
        if (savedRestMins) document.getElementById('restMinutes').value = savedRestMins;

        [['app_gentle', 'gentleMode'], ['app_emoji', 'emojiEnabled'], ['app_autospeak', 'autoSpeak'], ['app_mode_choice', 'modeChoice'], ['app_mode_spell', 'modeSpell'], ['app_spell_syll_hint', 'spellSyllableHint'], ['app_strict_speech', 'strictSpeech'], ['app_require_speech', 'requireSpeech']].forEach(([key, id]) => {
            const v = localStorage.getItem(key);
            if (v !== null) document.getElementById(id).checked = (v === 'true');
        });
        applyAssistSettings();
        applyModeSettings();
    }

    // Пере-синхронізація мови/словника з localStorage при поверненні до
    // сторінки. На смартфонах повторне «відкриття» гри часто є не повним
    // перезавантаженням, а відновленням замороженої вкладки (bfcache) або
    // поверненням із фону — window.onload при цьому вдруге не спрацьовує,
    // і сторінка може показувати застарілий стан, що не відповідає тому,
    // що реально збережено в налаштуваннях.
    function resyncLanguageAndUI() {
        const storedLang = localStorage.getItem('app_lang');
        if (storedLang && ['uk', 'ru', 'en'].includes(storedLang) && storedLang !== currentLang) {
            currentLang = storedLang;
            updateI18nUI();
            initCategorySelect();
            nextQuestion();
        }
    }

    window.addEventListener('pageshow', (event) => {
        if (event.persisted) {
            resyncLanguageAndUI();
        }
    });

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            resyncLanguageAndUI();
        }
    });

    window.onload = async () => {
        // Запитуємо стійке (persistent) сховище, щоб зменшити ризик того,
        // що мобільна ОС/браузер очистить localStorage із налаштуваннями
        // мови/голосу при нестачі місця чи довгій відсутності активності.
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().catch(() => {});
        }

        loadSettings();
        updateI18nUI();
        initCategorySelect();

        const savedCategory = localStorage.getItem('app_category');
        if (savedCategory) {
            const select = document.getElementById('categorySelect');
            if (Array.from(select.options).some(o => o.value === savedCategory)) {
                select.value = savedCategory;
            }
        }

        toggleTimerFeature();
        nextQuestion();
        showScreen('select');
        refreshModeTexts();
    };

    // Оффлайн: регистрация service worker (нужен HTTPS или localhost).
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
        // Пришла новая версия: страница один раз перезагружается сама, чтобы сразу показать обновление
        try {
            const hadController = !!navigator.serviceWorker.controller;
            let swReloaded = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!hadController || swReloaded) return;
                swReloaded = true;
                window.location.reload();
            });
        } catch (e) {}
    }
</script>
</body>
</html>
