    // Добавление слова проговариванием: распознанное слово подставляется в поле,
    // его можно проверить, выбрать другой вариант и добавить кнопкой «Добавить».
    function dictListen() {
        const x = dx();
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { setDictStatus(x.noSupport, true); return; }
        if (dictRec) { stopDictListening(); return; }
        try { if (isRecording && recognition) recognition.stop(); } catch (e) {}
        try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
        const r = new SR();
        dictRec = r;
        r.lang = currentLang === 'uk' ? 'uk-UA' : (currentLang === 'ru' ? 'ru-RU' : 'en-US');
        r.interimResults = false;
        r.continuous = false;
        r.maxAlternatives = 3;
        r.onstart = () => { setDictStatus(''); renderDictTexts(); };
        r.onresult = e => {
            const alts = Array.from(e.results[0] || []).map(a => normalizeDictWord(a.transcript)).filter(Boolean);
            const uniq = alts.filter((a, i) => alts.indexOf(a) === i);
            if (!uniq.length) return;
            setDictWord(uniq[0]);
            const box = document.getElementById('dictAlts');
            box.innerHTML = '';
            uniq.slice(1).forEach(a => {
                const b = document.createElement('button');
                b.className = 'dict-chip';
                b.innerText = a;
                b.onclick = () => setDictWord(a);
                box.appendChild(b);
            });
            setDictStatus(dx().heard);
        };
        r.onerror = e => {
            if (e.error !== 'aborted') setDictStatus(dx().errPrefix + e.error, true);
        };
        r.onend = () => { dictRec = null; renderDictTexts(); };
        try { r.start(); } catch (e) { dictRec = null; setDictStatus(x.errPrefix + (e && e.message), true); }
    }

    function dictHear() {
        let w = normalizeDictWord(document.getElementById('dictWordInput').value);
        if (!w || !('speechSynthesis' in window)) return;
        // Если в поле слогов отмечено ударение, оно учитывается при прослушивании.
        const raw = document.getElementById('dictSylInput').value.replace(/[’ʼʻ`´]/g, "'").replace(/\s+/g, ' ').trim();
        if (raw) {
            const st = parseStress(raw, currentLang);
            if (st.accent && accentKeyOf(st.accent) === w.replace(/\s/g, '')) w = st.accent;
        }
        warmupSpeechSynthesis();
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(makeUtterance(w, 1));
    }

    function refreshAfterDictChange() {
        invalidateDictionaries();
        initCategorySelect();
        syncModeCategorySelect();
        renderDictList();
        renderDictOnline();
    }

    function dictAdd() {
        const x = dx();
        const word = normalizeDictWord(document.getElementById('dictWordInput').value);
        if (!word) { setDictStatus(x.needWord, true); return; }
        const raw = document.getElementById('dictSylInput').value.replace(/[’ʼʻ`´]/g, "'").replace(/\s*-\s*/g, '-').replace(/\s+/g, ' ').trim();
        let syl, accent = null;
        if (!raw) {
            syl = syllabifyPhrase(word);
        } else {
            const st = parseStress(raw, currentLang);
            if (st.error === 'many') { setDictStatus(x.stressMany, true); return; }
            if (st.error === 'notVowel') { setDictStatus(x.stressNotVowel, true); return; }
            syl = st.syl;
            accent = st.accent;
        }
        if (syl.replace(/[-\s]/g, '') !== word.replace(/\s/g, '')) { setDictStatus(x.sylMismatch, true); return; }
        const key = cleanKey(syl);
        const exists = Object.values(getMergedDictionary(currentLang)).some(arr => arr.some(w => cleanKey(w) === key));
        if (exists) { setDictStatus(x.exists, true); return; }
        userWords[currentLang].push(syl);
        saveUserWords();
        if (accent) {
            userAccents[currentLang][accentKeyOf(syl)] = accent;
            saveUserAccents();
        }
        refreshAfterDictChange();
        document.getElementById('dictWordInput').value = '';
        document.getElementById('dictSylInput').value = '';
        document.getElementById('dictAlts').innerHTML = '';
        dictSylTouched = false;
        setDictStatus(x.added);
    }

    function dictDelete(i) {
        const removed = userWords[currentLang].splice(i, 1)[0];
        saveUserWords();
        if (removed && userAccents[currentLang][accentKeyOf(removed)]) {
            delete userAccents[currentLang][accentKeyOf(removed)];
            saveUserAccents();
        }
        refreshAfterDictChange();
    }

    // Экспорт в формате, совпадающем с extra-dict.json: файл можно положить на сайт.
    function dictExport() {
        const out = {};
        ['ru', 'uk', 'en'].forEach(l => {
            if (userWords[l].length) out[l] = { [dictI18n[l].catName]: userWords[l].map(w => applyStressToSyl(w, userAccents[l][accentKeyOf(w)])) };
        });
        const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'my-words.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        setDictStatus(dx().exported);
    }

    function dictImport(ev) {
        const file = ev.target.files && ev.target.files[0];
        ev.target.value = '';
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            try {
                const norm = normalizeExtra(JSON.parse(reader.result));
                let added = 0;
                ['ru', 'uk', 'en'].forEach(l => {
                    const seen = new Set(Object.values(getMergedDictionary(l)).flat().map(cleanKey));
                    Object.values(norm[l]).forEach(arr => arr.forEach(w => {
                        const k = cleanKey(w);
                        if (!seen.has(k)) {
                            seen.add(k);
                            userWords[l].push(w);
                            const acc = norm.accents[l][accentKeyOf(w)];
                            if (acc) userAccents[l][accentKeyOf(w)] = acc;
                            added++;
                        }
                    }));
                });
                saveUserWords();
                saveUserAccents();
                refreshAfterDictChange();
                setDictStatus(dx().imported + added);
            } catch (e) {
                setDictStatus(dx().importBad, true);
            }
        };
        reader.onerror = () => setDictStatus(dx().importBad, true);
        reader.readAsText(file);
    }

    }

    function showScreen(name) {
        stopModeSpeech();
        screenName = name;
        Object.keys(SCREEN_IDS).forEach(k => {
            document.getElementById(SCREEN_IDS[k]).classList.toggle('hidden', k !== name);
        });
        document.getElementById('homeBtn').style.display = name === 'select' ? 'none' : '';
        window.scrollTo(0, 0);
    }

    function startMode(m) {
        warmupSpeechSynthesis();
        modeLang = currentLang;
        if (m === 'full') {
            showScreen('full');
            if (modeCatChanged) { modeCatChanged = false; nextQuestion(); }
            else if (isChecked('autoSpeak')) speakWord(targetWordSyllables);
        } else if (m === 'listen') {
            showScreen('listen');
            listenNewWord();
        } else if (m === 'abc') {
            showScreen('abc');
            abcOpen();
        } else {
            showScreen('quiz');
            renderQuizSetup();
        }
    }

    function goHome() {
        if (screenName === 'quiz' && quiz.active && !confirm(mt().leaveConfirm)) return;
        quiz.active = false;
        showScreen('select');
        refreshModeTexts();
    }

    function syncModeCategorySelect() {
        const src = document.getElementById('categorySelect');
        const dst = document.getElementById('modeCategorySelect');
        if (!src || !dst) return;
        dst.innerHTML = '';
        Array.from(src.options).forEach(o => {
            const n = document.createElement('option');
            n.value = o.value;
            n.textContent = o.textContent;
            dst.appendChild(n);
        });
        dst.value = src.value;
    }

    function onModeCategoryChange() {
        document.getElementById('categorySelect').value = document.getElementById('modeCategorySelect').value;
        saveSettings();
        modeCatChanged = true;
    }

    function refreshModeTexts() {
        const t = mt();
        // смена языка во время тренировки: слова другого языка, поэтому возврат к выбору режима
        if ((screenName === 'listen' || screenName === 'quiz' || screenName === 'abc') && modeLang !== currentLang) {
            quiz.active = false;
            showScreen('select');
        }
        document.getElementById('modeIntro').innerText = t.intro;
        document.getElementById('modeCatLabel').innerText = t.catLabel;
        document.getElementById('modeFullTitle').innerText = t.fullTitle;
        document.getElementById('modeFullDesc').innerText = t.fullDesc;
        document.getElementById('modeListenTitle').innerText = t.listenTitle;
        document.getElementById('modeListenDesc').innerText = t.listenDesc;
        document.getElementById('modeQuizTitle').innerText = t.quizTitle;
        document.getElementById('modeQuizDesc').innerText = t.quizDesc;
        document.getElementById('modeAbcTitle').innerText = abcT().title;
        document.getElementById('modeAbcDesc').innerText = abcT().desc;
        document.getElementById('labelAbcOnline').innerText = abcT().setOnline;
        document.getElementById('abcOnlineChk').checked = abcOnlineOn();
        const hb = document.getElementById('homeBtn');
        hb.title = t.home;
        hb.setAttribute('aria-label', t.home);
        document.getElementById('homeBtnText').innerText = t.homeShort;
        syncModeCategorySelect();
        setTimeout(syncModeCategorySelect, 0);
    }

    // Одно распознавание речи. onDone({transcript, alts}) или onDone({error}).
    function recognizeOnce(onStart, onDone) {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { onDone({ error: 'unsupported' }); return; }
        stopModeRec();
        try { if (isRecording && recognition) recognition.stop(); } catch (e) {}
        try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
        const r = new SR();
        modeRec = r;
        r.lang = currentLang === 'uk' ? 'uk-UA' : (currentLang === 'ru' ? 'ru-RU' : 'en-US');
        r.interimResults = false;
        r.continuous = false;
        r.maxAlternatives = 3;
        let finished = false;
        const finish = res => { if (finished) return; finished = true; if (modeRec === r) modeRec = null; onDone(res); };
        r.onstart = () => { if (onStart) onStart(); };
        r.onresult = e => {
            const alts = Array.from(e.results[0] || []).map(a => a.transcript.trim().toLowerCase());
            finish({ transcript: alts[0] || '', alts });
        };
        r.onerror = e => { if (e.error !== 'aborted') finish({ error: e.error }); };
        r.onend = () => { if (!r._aborted) finish({ error: 'no-speech' }); };
        try { r.start(); } catch (e) { finish({ error: 'start' }); }
    }

    function shuffleArray(a) {
        const arr = a.slice();
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function recErrorText(code) {
        const t = mt();
        if (code === 'no-speech') return t.noSpeech;
        if (code === 'unsupported') return t.noRecSupport;
        return t.errPrefix + code;
    }

    // ----- Тренировка слуха -----
    const train = {
        word: '', clean: '', letters: [], tiles: [], placed: [], step: 1,
        attempts: 0, passed: false, heard: null, heardOk: null, lastErr: null, built: null, builtOk: null
    };

    function trainReset(word) {
        train.word = word;
        train.clean = cleanWord(word).toLowerCase();
        train.letters = [...train.clean.replace(/\s+/g, '')];
        let order = shuffleArray(train.letters);
        for (let k = 0; k < 8 && train.letters.length > 1 && order.join('') === train.letters.join(''); k++) order = shuffleArray(train.letters);
        train.tiles = order.map(ch => ({ ch, used: false }));
        train.placed = [];
        train.step = 1;
        train.attempts = 0;
        train.passed = false;
        train.heard = null;
        train.heardOk = null;
        train.lastErr = null;
        train.built = null;
        train.builtOk = null;
    }

    function listenNewWord() {
        const pool = getWordsFromCurrentCategory();
        if (!pool || !pool.length) { document.getElementById('listenScreen').innerHTML = '<div class="step-note">' + escHtml(mt().noWords) + '</div>'; return; }
        let w = getRandomWord();
        for (let i = 0; i < 6 && w === train.word && pool.length > 1; i++) w = getRandomWord();
        trainReset(w);
        renderListenStep(1);
    }

    function trainRepeatWord() {
        trainReset(train.word);
        renderListenStep(1);
    }

    function trainSpeak() { speakWord(train.word); }
    function trainSyllables() { speakSyllables(train.word); }

    function trainNextLocked() {
        return isChecked('requireSpeech') && speechRecognitionAvailable() && !train.passed && train.attempts < MAX_SPEECH_ATTEMPTS;
    }

    function renderListenStep(step) {
        stopModeSpeech();
        train.step = step;
        const t = mt();
        const el = document.getElementById('listenScreen');
        let h = '';
        if (step <= 3) h += '<div class="step-progress">' + escHtml(t.stepOf.replace('{i}', step)) + '</div>';
        if (step === 1) {
            h += '<div class="step-title">' + escHtml(t.s1) + '</div>' +
                 '<div class="step-box"><button class="assist-btn" onclick="trainSpeak()">' + escHtml(t.listen) + '</button>' +
                 '<button class="assist-btn" onclick="trainSyllables()">' + escHtml(t.slow) + '</button></div>' +
                 '<button class="primary-btn" onclick="renderListenStep(2)">' + escHtml(t.next) + '</button>';
        } else if (step === 2) {
            h += '<div class="step-title">' + escHtml(t.s2) + '</div>' +
                 '<div class="step-box"><button class="assist-btn" onclick="trainSpeak()">' + escHtml(t.listen) + '</button>' +
                 '<button class="assist-btn" id="trainMicBtn" onclick="trainMic()">' + escHtml(train.attempts ? t.again : t.say) + '</button></div>' +
                 '<div class="step-box" id="trainSayResult" style="display:none"></div>' +
                 '<div class="step-note" id="trainNote"></div>' +
                 '<button class="primary-btn" id="trainNext2" onclick="renderListenStep(3)">' + escHtml(t.next) + '</button>';
        } else if (step === 3) {
            h += '<div class="step-title">' + escHtml(t.s3) + '</div>' +
                 '<div class="step-box"><button class="assist-btn" onclick="trainSpeak()">' + escHtml(t.listen) + '</button>' +
                 '<button class="assist-btn" onclick="trainSyllables()">' + escHtml(t.slow) + '</button></div>' +
                 (isChecked('spellSyllableHint') ? '<div class="step-note"><b>' + escHtml(train.word.replace(/-/g, ' • ')) + '</b></div>' : '') +
                 '<div class="letter-slots" id="trainSlots"></div>' +
                 '<div class="letter-tiles" id="trainTiles"></div>' +
                 '<div class="step-box"><button class="assist-btn" onclick="trainUndo()">' + escHtml(t.buildBack) + '</button>' +
                 '<button class="assist-btn" onclick="trainClear()">' + escHtml(t.buildClear) + '</button></div>' +
                 '<div class="step-note" id="trainBuildMsg"></div>' +
                 '<button class="primary-btn" id="trainNext3" onclick="renderListenStep(4)">' + escHtml(t.next) + '</button>';
        } else {
            h += renderTrainSummary();
        }
        el.innerHTML = h;
        window.scrollTo(0, 0);
        if (step === 1) setTimeout(() => { if (screenName === 'listen' && train.step === 1) trainSpeak(); }, 250);
        if (step === 2) updateTrainSayUI();
        if (step === 3) renderBuildArea();
    }

    function trainMic() {
        const t = mt();
        const btn = document.getElementById('trainMicBtn');
        if (!btn || btn.disabled) return;
        btn.disabled = true;
        btn.textContent = t.listening;
        recognizeOnce(null, res => {
            const b = document.getElementById('trainMicBtn');
            if (b) { b.disabled = false; b.textContent = mt().again; }
            if (res.error) {
                train.lastErr = res.error;
                if (res.error !== 'unsupported') train.attempts++;
            } else {
                const ok = isSpeechMatch(res.transcript, train.clean, isChecked('strictSpeech'));
                train.heard = res.transcript;
                train.heardOk = ok;
                train.lastErr = null;
                train.attempts++;
                if (ok) train.passed = true;
                recordResult('speech', train.clean, res.transcript, ok);
                speakSpeechFeedback(ok, res.transcript);
                flushSpeechFeedback();
            }
            if (train.step === 2) updateTrainSayUI();
        });
    }

    function updateTrainSayUI() {
        const t = mt();
        const box = document.getElementById('trainSayResult');
        if (!box) return;
        let h = '';
        if (train.lastErr) h += '<div class="res-bad">' + escHtml(recErrorText(train.lastErr)) + '</div>';
        if (train.heard !== null) {
            h += '<div>' + escHtml(t.heardLbl) + ' <b>' + escHtml(train.heard) + '</b> ' +
                 (train.heardOk ? '<span class="res-ok">✔</span>' : '<span class="res-bad">✘</span>') + '</div>';
            if (!train.heardOk) h += buildDiffHtml(train.clean, train.heard);
        }
        box.innerHTML = h;
        box.style.display = h ? '' : 'none';
        const locked = trainNextLocked();
        document.getElementById('trainNext2').disabled = locked;
        document.getElementById('trainNote').innerText = locked ? t.requireNote : '';
    }

    function renderBuildArea() {
        const t = mt();
        const total = train.letters.length;
        let slots = '';
        for (let i = 0; i < total; i++) {
            if (train.placed[i] !== undefined) {
                slots += '<button class="letter-tile" onclick="trainRemove(' + i + ')">' + escHtml(train.tiles[train.placed[i]].ch) + '</button>';
            } else {
                slots += '<span class="letter-slot"></span>';
            }
        }
        document.getElementById('trainSlots').innerHTML = slots;
        document.getElementById('trainTiles').innerHTML = train.tiles.map((tl, idx) =>
            '<button class="letter-tile' + (tl.used ? ' used' : '') + '" onclick="trainPlace(' + idx + ')">' + escHtml(tl.ch) + '</button>').join('');
        const complete = train.placed.length === total;
        let msg = '';
        if (complete) {
            train.built = train.placed.map(i => train.tiles[i].ch).join('');
            train.builtOk = train.built === train.letters.join('');
            msg = train.builtOk ? '<span class="res-ok">' + escHtml(t.builtOk) + '</span>' : '<span class="res-bad">' + escHtml(t.builtBad) + '</span>';
        } else {
            train.built = null;
            train.builtOk = null;
        }
        document.getElementById('trainBuildMsg').innerHTML = msg;
        document.getElementById('trainNext3').disabled = !complete;
    }

    function trainPlace(idx) {
        if (train.tiles[idx].used || train.placed.length >= train.letters.length) return;
        train.tiles[idx].used = true;
        train.placed.push(idx);
        renderBuildArea();
    }

    function trainRemove(pos) {
        const idx = train.placed[pos];
        if (idx === undefined) return;
        train.tiles[idx].used = false;
        train.placed.splice(pos, 1);
        renderBuildArea();
    }

    function trainUndo() {
        if (train.placed.length) trainRemove(train.placed.length - 1);
    }

    function trainClear() {
        train.tiles.forEach(tl => { tl.used = false; });
        train.placed = [];
        renderBuildArea();
    }

    function renderTrainSummary() {
        const t = mt();
        const target = train.letters.join('');
        let h = '<div class="step-title">' + escHtml(t.summary) + '</div>';
        h += '<div class="result-row"><div class="res-label">' + escHtml(t.srcWord) + '</div><b>' + escHtml(train.word.replace(/-/g, ' • ')) + '</b></div>';
        h += '<div class="result-row"><div class="res-label">' + escHtml(t.saidWord) + '</div>';
        if (train.heard === null) {
            h += '<span>' + escHtml(t.notSaid) + '</span>';
        } else {
            h += '<b>' + escHtml(train.heard) + '</b> ' + (train.heardOk ? '<span class="res-ok">✔</span>' : '<span class="res-bad">✘</span>');
            if (!train.heardOk) h += buildDiffHtml(train.clean, train.heard);
        }
        h += '</div>';
        h += '<div class="result-row"><div class="res-label">' + escHtml(t.builtWord) + '</div>';
        if (train.built === null) {
            h += '<span>—</span>';
        } else {
            h += '<b>' + escHtml(train.built) + '</b> ' + (train.builtOk ? '<span class="res-ok">✔</span>' : '<span class="res-bad">✘</span>');
            if (!train.builtOk) h += buildDiffHtml(target, train.built);
        }
        h += '</div>';
        h += '<button class="primary-btn" onclick="trainRepeatWord()">' + escHtml(t.repeatWord) + '</button>' +
             '<button class="primary-btn" onclick="listenNewWord()">' + escHtml(t.nextWord) + '</button>' +
             '<button class="assist-btn" onclick="goHome()">' + escHtml(t.toModes) + '</button>';
        return h;
    }

    // ----- Тест -----
    function renderQuizSetup() {
        stopModeSpeech();
        quiz.active = false;
        const t = mt();
        const pool = getWordsFromCurrentCategory() || [];
        let saved = parseInt(localStorage.getItem('app_quiz_count') || '10', 10);
        if (!(saved >= 10 && saved <= 30)) saved = 10;
        document.getElementById('quizScreen').innerHTML =
            '<div class="step-title">' + escHtml(t.quizSetup) + '</div>' +
            '<div class="step-note">' + escHtml(t.quizPool.replace('{n}', pool.length)) + '</div>' +
            '<div class="control-group"><label for="quizCount">' + escHtml(t.quizCountLabel) + '</label>' +
            '<input type="number" id="quizCount" class="dict-input" min="10" max="30" value="' + saved + '"></div>' +
            '<div class="step-note" id="quizSetupNote"></div>' +
            '<button class="primary-btn" onclick="startQuizFromSetup()">' + escHtml(t.quizStart) + '</button>' +
            '<button class="assist-btn" onclick="goHome()">' + escHtml(t.toModes) + '</button>';
        window.scrollTo(0, 0);
    }

    function startQuizFromSetup() {
        const t = mt();
        const pool = getWordsFromCurrentCategory() || [];
        if (!pool.length) { document.getElementById('quizSetupNote').innerText = t.noWords; return; }
        let n = parseInt(document.getElementById('quizCount').value, 10);
        if (!(n >= 10)) n = 10;
        if (n > 30) n = 30;
        try { localStorage.setItem('app_quiz_count', String(n)); } catch (e) {}
        warmupSpeechSynthesis();
        startQuiz(shuffleArray(pool).slice(0, n));
    }

    function startQuiz(words) {
        quiz.words = words;
        quiz.i = 0;
        quiz.results = [];
        quiz.active = true;
        renderQuizWord();
    }

    function renderQuizWord() {
        stopModeSpeech();
        const t = mt();
        const w = quiz.words[quiz.i];
        quiz.cur = { word: w, clean: cleanWord(w).toLowerCase() };
        quiz.answered = false;
        document.getElementById('quizScreen').innerHTML =
            '<div class="step-progress">' + escHtml(t.quizProgress.replace('{i}', quiz.i + 1).replace('{n}', quiz.words.length)) + '</div>' +
            '<div class="step-title">' + escHtml(t.quizListenHint) + '</div>' +
            '<div class="step-box" id="quizActions"><button class="assist-btn" id="quizMicBtn" onclick="quizMic()">' + escHtml(t.say) + '</button>' +
            '<button class="assist-btn" id="quizSkipBtn" onclick="quizSkip()">' + escHtml(t.quizSkip) + '</button></div>' +
            '<div class="step-note" id="quizStatus"></div>' +
            '<button class="primary-btn" id="quizNextBtn" style="display:none" onclick="quizAdvance()">' +
            escHtml(quiz.i + 1 >= quiz.words.length ? t.quizFinish : t.quizNext) + '</button>';
        window.scrollTo(0, 0);
        setTimeout(() => {
            if (screenName === 'quiz' && quiz.active && quiz.cur && quiz.cur.word === w && !quiz.answered) speakWord(w);
        }, 250);
    }

    function quizMic() {
        const t = mt();
        const btn = document.getElementById('quizMicBtn');
        if (!btn || btn.disabled || quiz.answered) return;
        btn.disabled = true;
        btn.textContent = t.listening;
        document.getElementById('quizStatus').innerText = '';
        recognizeOnce(null, res => {
            if (screenName !== 'quiz' || !quiz.active) return;
            const b = document.getElementById('quizMicBtn');
            if (res.error) {
                if (b) { b.disabled = false; b.textContent = mt().again; }
                document.getElementById('quizStatus').innerText = recErrorText(res.error);
                return;
            }
            const ok = isSpeechMatch(res.transcript, quiz.cur.clean, isChecked('strictSpeech'));
            quiz.answered = true;
            quiz.results.push({ word: quiz.cur.word, clean: quiz.cur.clean, heard: res.transcript, ok, skipped: false });
            recordResult('speech', quiz.cur.clean, res.transcript, ok);
            document.getElementById('quizActions').style.display = 'none';
            document.getElementById('quizStatus').innerText = mt().quizAnswered;
            document.getElementById('quizNextBtn').style.display = '';
        });
    }

    function quizSkip() {
        if (quiz.answered) return;
        stopModeSpeech();
        quiz.answered = true;
        quiz.results.push({ word: quiz.cur.word, clean: quiz.cur.clean, heard: null, ok: false, skipped: true });
        quizAdvance();
    }

    function quizAdvance() {
        quiz.i++;
        if (quiz.i >= quiz.words.length) {
            quiz.active = false;
            renderQuizResult();
        } else {
            renderQuizWord();
        }
    }

    function renderQuizResult() {
        stopModeSpeech();
        const t = mt();
        const n = quiz.results.length;
        const k = quiz.results.filter(r => r.ok).length;
        const p = n ? Math.round(k * 100 / n) : 0;
        let h = '<div class="step-title">' + escHtml(t.quizResultTitle) + '</div>' +
                '<div class="step-box"><b>' + escHtml(t.quizScore.replace('{k}', k).replace('{n}', n).replace('{p}', p)) + '</b></div>';
        quiz.results.forEach(r => {
            const right = r.skipped ? escHtml(t.quizMissed) : escHtml(t.quizHeard) + ': ' + escHtml(r.heard || '');
            h += '<div class="quiz-row"><span>' + (r.ok ? '<span class="res-ok">✔</span>' : '<span class="res-bad">✘</span>') + ' <b>' + escHtml(r.word.replace(/-/g, ' • ')) + '</b></span><span>' + right + '</span></div>';
        });
        if (k < n) h += '<button class="primary-btn" onclick="quizRepeatErrors()">' + escHtml(t.quizRepeatErrors) + '</button>';
        h += '<button class="primary-btn" onclick="renderQuizSetup()">' + escHtml(t.quizNew) + '</button>' +
             '<button class="assist-btn" onclick="goHome()">' + escHtml(t.toModes) + '</button>';
        document.getElementById('quizScreen').innerHTML = h;
        window.scrollTo(0, 0);
    }

    function quizRepeatErrors() {
        const wrong = quiz.results.filter(r => !r.ok).map(r => r.word);
        if (wrong.length) startQuiz(shuffleArray(wrong));
    }

            desc: 'First-letter help: tap a letter, find the word that is on the tip of your tongue and hear it. Words can be collected into a line.',
            hint: 'Tap the first letter of the word', words: 'Matching words — tap to add:',
            more: 'Words found: {n}. Tap the next letter to narrow the list.',
            none: 'No words for these letters', type: 'Type the word the way you imagine it (mistakes are fine):',
            fit: 'Matching letters', free: 'Free typing', show: 'Show letters', hide: 'Hide letters', say: 'Say it',
            online: "Find words online", onlineRes: "Words from the internet — tap to choose:", onlineNone: "No matching words were found online.", searching: "Looking for options…", err: "Could not reach the dictionary service. Check the internet.", setOnline: "ABC: look up words online (Wiktionary; for English also Datamuse). Free, no key needed. The typed letters are sent to these services. Chosen words are remembered on the device."
        }
    };

    function abcT() { return abcI18n[currentLang] || abcI18n.ru; }

    const ABC_ALPHA = {
        ru: 'абвгдежзийклмнопрстуфхцчшщэюя',
        uk: 'абвгґдеєжзиіїйклмнопрстуфхцчшщюя',
        en: 'abcdefghijklmnopqrstuvwxyz'
    };
    // Полная азбука для свободного набора (включая буквы, которых нет в начале слов)
    const ABC_ALPHA_FULL = {
        ru: 'абвгдеёжзийклмнопрстуфхцчшщъыьэюя',
        uk: "абвгґдеєжзиіїйклмнопрстуфхцчшщьюя'",
        en: "abcdefghijklmnopqrstuvwxyz'"
    };
    // Буквы, которые часто путают в речи и при письме: замена такой пары стоит полцены
    const ABC_CONF = new Set('бп пб вф фв гк кг дт тд жш шж зс сз ао оа еи ие яи ия еэ эе уы ыу иі ії bp pb dt td kg gk sz zs fv vf'.split(' '));
    const abcState = { mode: 'prefix', prefix: '', typed: '', line: [], dict: [], keys: [], src: null, kbOff: false };

    // Ключ для поиска: без регистра, «ё» как «е», без пробелов и дефисов
    function abcKey(s) {
        return String(s).toLowerCase().replace(/ё/g, 'е').replace(/[’ʼ`]/g, "'")
            .replace(/[^\p{L}\p{N}'\s-]/gu, ' ').replace(/[\s-]+/g, '');
    }

    // Словарь «Азбуки» — все слова текущего языка из всех категорий, включая «Мои слова» и дополнительный словарь
    function abcBuildDict() {
        const src = getActiveDictionary();
        const seen = new Set(), items = [];
        Object.keys(src).forEach(cat => (src[cat] || []).forEach(raw => {
            const w = cleanWord(String(raw)).replace(/[•\u0301]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
            const k = abcKey(w);
            if (!w || !k || seen.has(w)) return;
            seen.add(w);
            items.push({ w, k });
        }));
        abcLearned(currentLang).forEach(raw => {
            const w = String(raw).toLowerCase(), k = abcKey(w);
            if (w && k && !seen.has(w)) { seen.add(w); items.push({ w, k }); }
        });
        const col = new Intl.Collator(currentLang);
        items.sort((a, b) => col.compare(a.w, b.w));
        abcState.dict = items.map(x => x.w);
        abcState.keys = items.map(x => x.k);
        abcState.src = src;
    }

    function abcLev(a, b, max) {
        const n = a.length, m = b.length, lim = max || 99;
        if (Math.abs(n - m) > lim) return 99;
        let prev = Array.from({ length: m + 1 }, (_, j) => j);
        for (let i = 1; i <= n; i++) {
            const cur = [i];
            let rowMin = i;
            for (let j = 1; j <= m; j++) {
                const ca = a[i - 1], cb = b[j - 1];
                const sub = ca === cb ? 0 : (ABC_CONF.has(ca + cb) ? 0.5 : 1);
                const v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + sub);
                cur.push(v);
                if (v < rowMin) rowMin = v;
            }
            if (rowMin > lim) return 99;
            prev = cur;
        }
        return prev[m];
    }

    // Слова словаря, похожие на набранное (даже с ошибками): точное, начало слова, начало с опечаткой, слово с опечаткой
    function abcFuzzy(typed) {
        const q = abcKey(typed);
        if (!q) return [];
        const L = q.length, keys = abcState.keys, out = [];
        for (let i = 0; i < keys.length; i++) {
            const w = keys[i];
            let cat = 9, d = 0;
            if (w === q) cat = 0;
            else if (w.startsWith(q)) cat = 1;
            else if (L >= 3 && w.length >= L - 1) {
                const lim = L <= 3 ? 0.5 : 1;
                const dp = abcLev(q, w.slice(0, L), lim);
                if (dp <= lim) { cat = 2; d = dp; }
                else if (L >= 4 && Math.abs(w.length - L) <= 2) {
                    const maxd = L <= 4 ? 1 : L <= 6 ? 1.5 : 2;
                    const df = abcLev(q, w, maxd);
                    if (df <= maxd) { cat = 3; d = df; }
                }
            }
            if (cat < 9) out.push([cat, d, i]);
        }
        out.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
        return out.slice(0, 20).map(x => abcState.dict[x[2]]);
    }

    function abcMk(tag, cls, text, onclick) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        if (tag === 'button') e.type = 'button';
        if (onclick) e.onclick = onclick;
        return e;
    }

    // Озвучивает слова с учётом таблицы ударений; всю строку — как одну фразу
    function abcSpeak(words) {
        if (!words || !words.length) return;
        if (!('speechSynthesis' in window)) { alert('TTS is not supported in this browser.'); return; }
        warmupSpeechSynthesis();
        window.speechSynthesis.cancel();
        const text = words.map(w => getPhoneticRepresentation(w) || w).join(' ');
        window.speechSynthesis.speak(makeUtterance(text, 1));
    }

    function abcPick(w) {
        abcState.line.push(w);
        abcOnl = { key: '', st: undefined };
        abcState.prefix = '';
        abcState.typed = '';
        if (isChecked('autoSpeak')) abcSpeak([w]);
        abcRender();
    }

    function abcToggleMode() {
        const free = abcState.mode === 'free', pre = abcState.prefix;
        abcState.mode = free ? 'prefix' : 'free';
        abcState.prefix = '';
        abcState.typed = free ? '' : pre;   // уже набранное начало переносится в свободный набор
        try { localStorage.setItem('app_abc_mode', abcState.mode); } catch (e) {}
        abcRender();
    }

    function abcWordGrid(words) {
        const g = abcMk('div', 'abc-words');
        words.forEach(w => {
            const em = getWordEmoji(w);
            g.append(abcMk('button', 'abc-word', (em ? em + ' ' : '') + w, () => abcPick(w)));
        });
        return g;
    }

    // Клавиатура закреплена внизу экрана, найденные слова — над ней; её можно свернуть, чтобы увидеть больше слов
    function abcKeyboard(free, letters) {
        const t = abcT();
        const kb = abcMk('div', 'abc-kb'), kh = abcMk('div', 'abc-kbh');
        kh.append(
            abcMk('button', 'abc-kbt', abcState.kbOff ? '⌨️ ▴ ' + t.show : '⌨️ ▾ ' + t.hide, () => { abcState.kbOff = !abcState.kbOff; abcRender(); }),
            abcMk('button', 'abc-kbt', (free ? '🔤 ' : '✍️ ') + (free ? t.fit : t.free), abcToggleMode)
        );
        kb.append(kh);
        if (abcState.kbOff) return kb;
        const g = abcMk('div', 'abc-letters');
        letters.forEach(ch => g.append(abcMk('button', 'abc-letter', ch === "'" ? '’' : ch.toUpperCase(), () => {
            if (free) abcState.typed += ch; else abcState.prefix += ch;
            abcRender();
        })));
        kb.append(g);
        return kb;
    }

    function abcRender(keepScroll) {
        const t = abcT();
        if (abcState.src !== getActiveDictionary()) abcBuildDict();   // словарь изменился («Мои слова»)
        const el = document.getElementById('abcScreen');
        el.innerHTML = '';
        const free = abcState.mode === 'free';

        const built = abcMk('div', 'abc-built');
        built.append(abcMk('div', 'abc-built-text', abcState.line.length ? abcState.line.join(' ') : '…'));
        el.append(built);
        if (abcState.line.length) {
            const r = abcMk('div', 'abc-row');
            r.append(
                abcMk('button', 'assist-btn abc-say', '🔊 ' + t.say, () => abcSpeak(abcState.line)),
                abcMk('button', 'assist-btn abc-del', '⌫', () => { abcState.line.pop(); abcRender(); })
            );
            el.append(r);
        }

        let letters;
        if (free) {
            // Свободный набор: любые буквы, как человек себе представляет слово; приложение предлагает похожие слова
            const r = abcMk('div', 'abc-row');
            r.append(
                abcMk('div', 'abc-prefix', abcState.typed ? abcState.typed.toUpperCase() + '|' : '|'),
                abcMk('button', 'assist-btn abc-del', '⌫', () => { abcState.typed = abcState.typed.slice(0, -1); abcRender(); })
            );
            if (abcState.typed) r.append(abcMk('button', 'assist-btn abc-del', '✖', () => { abcState.typed = ''; abcRender(); }));
            el.append(r);
            const words = abcFuzzy(abcState.typed);
            if (words.length) {
                el.append(abcMk('div', 'abc-sec', t.words), abcWordGrid(words));
            } else if (abcKey(abcState.typed).length >= 3) {
                el.append(abcMk('div', 'abc-sec', t.none));
            } else if (!abcState.typed) {
                el.append(abcMk('div', 'abc-sec', t.type));
            }
            abcOnlineBlock(el, 't:' + abcState.typed, abcState.typed);
            letters = ABC_ALPHA_FULL[currentLang].split('');
        } else {
            const pre = abcState.prefix;
            if (!pre) {
                el.append(abcMk('div', 'abc-sec', t.hint));
                letters = ABC_ALPHA[currentLang].split('');
            } else {
                const r = abcMk('div', 'abc-row');
                r.append(
                    abcMk('div', 'abc-prefix', pre.toUpperCase() + '…'),
                    abcMk('button', 'assist-btn abc-del', '⌫', () => { abcState.prefix = pre.slice(0, -1); abcRender(); })
                );
                el.append(r);
                const idx = [];
                abcState.keys.forEach((k, i) => { if (k.startsWith(pre)) idx.push(i); });
                if (!idx.length) {
                    el.append(abcMk('div', 'abc-sec', t.none));
                } else {
                    el.append(abcMk('div', 'abc-sec', t.words), abcWordGrid(idx.slice(0, 60).map(i => abcState.dict[i])));
                    if (idx.length > 60) el.append(abcMk('div', 'step-note', t.more.replace('{n}', idx.length)));
                }
                abcOnlineBlock(el, 'p:' + pre, pre);
                letters = [...new Set(idx.filter(i => abcState.keys[i].length > pre.length).map(i => abcState.keys[i][pre.length]))]
                    .filter(ch => /\p{L}/u.test(ch)).sort((a, b) => a.localeCompare(b, currentLang));
            }
        }
        el.append(abcKeyboard(free, letters));
        if (!keepScroll) window.scrollTo(0, 0);
    }

    function abcOpen() {
        let m = 'prefix';
        try { if (localStorage.getItem('app_abc_mode') === 'free') m = 'free'; } catch (e) {}
        Object.assign(abcState, { mode: m, prefix: '', typed: '', line: [], kbOff: false });
        abcOnl = { key: '', st: undefined };
        abcBuildDict();
        abcRender();
    }

    // ----- Азбука: онлайн-поиск слов (бесплатно, без ключа): Викисловарь, для английского ещё Datamuse -----
    const ABC_WIKI = {
        ru: 'https://ru.wiktionary.org/w/api.php',
        uk: 'https://uk.wiktionary.org/w/api.php',
        en: 'https://en.wiktionary.org/w/api.php'
    };
    const ABC_RE = {
        ru: /^[а-я]+(?:-[а-я]+)?$/,
        uk: /^[а-щьюяєіїґ]+(?:['’ʼ-][а-щьюяєіїґ]+)?$/,
        en: /^[a-z]+(?:'[a-z]+)?$/
    };
    // Простая фильтрация нецензурной лексики (не исчерпывающая)
    const ABC_BAD = {
        ru: /хуй|хуе|хуи|хуя|пизд|бляд|бляц|блят|залуп|муда[кч]|пидор|пидар|гандон|шлюх|дерьм|говн|^(?:за|вы|по|на|съ|от|у|до|об|раз|рас|при)?еб|^жоп|^сук[аиуе]$/,
        uk: /хуй|хуї|хує|пизд|бляд|курв|гівн|мудак|підор|підар|шлюх|^жоп|^сук[аиуе]$|^(?:за|ви|по|на|від|у|до|об|роз|при)?їб/,
        en: /fuck|shit|cunt|bitch|asshole|pussy|whore|slut|bastard|nigg|^dick$|^cock$|^fag/
    };
    let abcOnl = { key: '', st: undefined };   // undefined | 'loading' | массив слов | { err }

    function abcOnlineOn() {
        try { return localStorage.getItem('app_abc_online') === 'true'; } catch (e) { return false; }
    }

    function abcOnlineChanged() {
        const on = document.getElementById('abcOnlineChk').checked;
        try { localStorage.setItem('app_abc_online', on ? 'true' : 'false'); } catch (e) {}
        abcOnl = { key: '', st: undefined };
        if (screenName === 'abc') abcRender(true);
    }

    function abcOkWord(w, l) {
        w = String(w || '').toLowerCase().replace(/ё/g, 'е');
        return w.length >= 2 && w.length <= 24 && ABC_RE[l].test(w) && !ABC_BAD[l].test(w) ? w : null;
    }

    // Слова, выбранные из онлайн-результатов, запоминаются на устройстве и входят в словарь «Азбуки»
    function abcLearned(l) {
        try { return JSON.parse(localStorage.getItem('app_abc_learned_' + l)) || []; } catch (e) { return []; }
    }

    function abcLearn(w) {
        w = abcOkWord(w, currentLang);
        if (!w) return null;
        const a = abcLearned(currentLang).filter(x => x !== w);
        a.unshift(w);
        try { localStorage.setItem('app_abc_learned_' + currentLang, JSON.stringify(a.slice(0, 3000))); } catch (e) {}
        return w;
    }

    async function abcJget(url, ms) {
        const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), ms || 10000);
        try {
            const r = await fetch(url, { signal: ctl.signal });
            if (!r.ok) throw new Error('http');
            return await r.json();
        } finally { clearTimeout(tm); }
    }

    async function abcOnlineWords(query) {
        const q = abcKey(query);
        if (q.length < 2) return [];
        const enc = encodeURIComponent, base = ABC_WIKI[currentLang], l = currentLang, out = [];
        const add = w => { w = abcOkWord(w, l); if (w && !out.includes(w)) out.push(w); };
        const near = t => { t = abcOkWord(t, l); return t && (t.startsWith(q) || abcLev(q, t, 2) <= 2); };
        const tasks = [
            // продолжения слова
            abcJget(base + '?action=query&list=prefixsearch&pssearch=' + enc(q) + '&pslimit=10&format=json&origin=*')
                .then(j => ((j.query && j.query.prefixsearch) || []).forEach(x => add(x.title))),
            // «возможно, вы имели в виду» и похожие названия статей
            abcJget(base + '?action=query&list=search&srsearch=' + enc(q) + '&srnamespace=0&srlimit=8&srinfo=suggestion&srprop=&format=json&origin=*')
                .then(j => {
                    const s = j.query && j.query.searchinfo && j.query.searchinfo.suggestion;
                    if (s) String(s).split(/\s+/).forEach(add);
                    ((j.query && j.query.search) || []).forEach(x => { if (near(x.title)) add(x.title); });
                })
        ];
        if (l === 'en') tasks.push(abcJget('https://api.datamuse.com/sug?s=' + enc(q) + '&max=10').then(a => (a || []).forEach(x => add(x.word))));
        const res = await Promise.allSettled(tasks);
        if (res.every(r => r.status === 'rejected')) throw res[0].reason;
        out.sort((a, b) => (b === q) - (a === q) || (b.startsWith(q)) - (a.startsWith(q)) || abcLev(q, a, 3) - abcLev(q, b, 3));
        return out.slice(0, 10);
    }

    function abcOnlineBlock(box, key, query) {
        if (!abcOnlineOn() || !query || abcKey(query).length < 2) return;
        const t = abcT();
        if (abcOnl.key !== key) abcOnl = { key, st: undefined };
        if (abcOnl.st === undefined) {
            const b = abcMk('button', 'abc-online', '🌐 ' + t.online, async () => {
                abcOnl = { key, st: 'loading' };
                abcRender(true);
                let st;
                try { st = await abcOnlineWords(query); } catch (e) { st = { err: t.err }; }
                if (abcOnl.key === key && screenName === 'abc') { abcOnl.st = st; abcRender(true); }
            });
            box.append(b);
        } else if (abcOnl.st === 'loading') {
            box.append(abcMk('div', 'step-note', t.searching));
        } else if (abcOnl.st.err) {
            box.append(abcMk('div', 'step-note', abcOnl.st.err));
        } else if (!abcOnl.st.length) {
            box.append(abcMk('div', 'step-note', t.onlineNone));
        } else {
            box.append(abcMk('div', 'abc-sec', t.onlineRes));
            const g = abcMk('div', 'abc-words');
            abcOnl.st.forEach(w => g.append(abcMk('button', 'abc-word', '🌐 ' + w, () => abcPickOnline(w))));
            box.append(g);
        }
    }

    function abcPickOnline(w) {
        const learned = abcLearn(w);
        abcBuildDict();
        abcOnl = { key: '', st: undefined };
        abcPick(learned || w);
    }

    const helpI18n = {
        ru: {
            btn: 'Справка', title: 'Справка', close: 'Закрыть',
            body: `
<p>Тренажёр помогает различать на слух похожие слова и тренировать собственное произношение. Занятия состоят из коротких заданий: слово озвучивается, а вы выбираете его, собираете из букв и произносите вслух.</p>

<h3>Режимы тренировки</h3>
<ul>
<li><b>🧩 Полный тренажёр</b> — все блоки на одном экране: выбор слова на слух, проверка произношения, сбор из букв.</li>
<li><b>👂 Тренировка слуха</b> — одно слово по шагам: 1) послушать, 2) повторить вслух, 3) собрать из букв. В конце итог: исходное слово, что вы проговорили и что собрали, с подсветкой различий. Затем можно повторить это слово или перейти к следующему. Если включена настройка «Обязательно проговаривать слово», к сборке из букв можно перейти только после верного произношения (или трёх попыток).</li>

<li><b>🔤 Азбука</b> — подсказка по первой букве, когда слово «вертится на языке». Нажмите первую букву: появятся слова из словаря (включая «Мои слова»), которые с неё начинаются; следующая буква сужает список. Нажатие на слово добавляет его в строку (если включено автоозвучивание, слово сразу произносится), «Сказать так» озвучивает всю строку, ⌫ убирает последнее слово. «Скрыть буквы» освобождает место для слов. «Свободный набор» показывает весь алфавит: слово можно набирать так, как вы его себе представляете, даже с ошибками, а приложение предложит похожие слова. Категория слов здесь не учитывается: поиск идёт по всем словам. Если в настройках включён онлайн-поиск, под списком появляется кнопка «Найти слова в интернете»: слова ищутся в Викисловаре (для английского ещё в Datamuse), для этого набранные буквы отправляются в эти сервисы. Выбранное слово запоминается на устройстве.</li>
<li>Категория слов выбирается на стартовом экране. Кнопка 🏠 в заголовке возвращает к выбору режима.</li>
</ul>

<h3>Как заниматься</h3>
<ul>
<li><b>🔊 Послушать слово</b> — озвучить загаданное слово ещё раз.</li>
<li><b>🐢 По слогам</b> — медленное произнесение по слогам.</li>
<li><b>💡 Подсказка</b> — три уровня: первый слог, слово по слогам с ударением, ответ.</li>
<li><b>Выбор слова</b> — выберите услышанное слово среди вариантов. В <i>мягком режиме</i> неверный вариант гаснет, и можно выбрать снова. В обычном режиме попытка одна, правильный ответ подсвечивается.</li>
<li><b>Сбор слова из букв</b> — составьте слово из букв; можно показывать слоги.</li>
<li><b>Следующее слово ➔</b> — переход к новому заданию.</li>
<li>Счётчики над заданием показывают число верных ответов и всего заданий.</li>

<h3>Проверка произношения</h3>

<li><b>Online dictionary:</b> put a file named <code>extra-dict.json</code> on the site next to the app. When there is internet the app downloads it, keeps a copy on the device and uses that copy offline. The format is the same as the export: language, category, list of words. Syllables are optional; stress is marked the same way, with a capital vowel (for example <code>banAna</code>). The <code>pairs</code> section can list similar-sounding words for answer options. “🔄 Refresh” loads the file right away.</li>
<li>Speech recognition when adding a word, like when checking pronunciation, usually needs internet; you can always type words by hand.</li>
</ul>

<h3>Offline use and installing</h3>
<p>Open the app in Chrome and choose “Install app” or “Add to home screen”. After the first launch with internet it also works without a network. The exception is speech recognition, which usually needs internet. After an update, close the app and open it again.</p>
<p>If words are not spoken, check the volume and pick another voice in the settings.</p>`
        }
    };

    function renderHelp() {
        const h = helpI18n[currentLang] || helpI18n.ru;
        document.getElementById('helpTitle').innerText = h.title;
        document.getElementById('helpClose').setAttribute('aria-label', h.close);
        document.getElementById('helpBody').innerHTML = h.body;
    }

    function openHelp() {
        renderHelp();
        const overlay = document.getElementById('helpOverlay');
        overlay.classList.remove('hidden');
        document.getElementById('helpBody').scrollTop = 0;
        document.getElementById('helpClose').focus();
    }

    function closeHelp() {
        document.getElementById('helpOverlay').classList.add('hidden');
    }

    // Закрытие по нажатию на затемнённую область за пределами окна справки.
    function onHelpOverlayClick(e) {
        if (isOverlayClick(e, 'helpOverlay')) closeHelp();
    }

    document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        const open = id => !document.getElementById(id).classList.contains('hidden');
        if (open('dictOverlay')) closeDict();
        else if (open('helpOverlay')) closeHelp();
        else if (open('statsOverlay')) closeStats();
        else if (open('settingsOverlay')) closeSettings();
    });

    // ----- проверка произнесённого слова -----
    function normSpeech(s) {
        return String(s).toLowerCase()
            .replace(/ё/g, 'е')
            .replace(/[’ʼʻ`´']/g, '')
            .replace(/[^\p{L}\p{N}]+/gu, ' ')
            .trim();
    }

    // Слово засчитывается только при точном совпадении (пробелы и знаки не важны).
    // Похожее, но неточное слово («стараница» вместо «страница») не засчитывается.
    // Обычный режим допускает другие слова в ответе, если искомое есть среди них целиком.
    function isSpeechMatch(transcript, target, strict) {
        const t = normSpeech(transcript);
        const w = normSpeech(target);
        if (!t || !w) return false;
        if (t.replace(/ /g, '') === w.replace(/ /g, '')) return true;
        if (strict) return false;
        return t.split(' ').includes(w);
    }

    // ----- обязательное проговаривание перед переходом к следующему слову -----
    // Следующее слово доступно после верного произнесения или после MAX_SPEECH_ATTEMPTS неудачных
    // попыток (чтобы не застрять, если распознавание не работает, например без интернета).
    const MAX_SPEECH_ATTEMPTS = 3;
    let speechPassed = false, speechAttempts = 0;

    function speechRecognitionAvailable() {
        return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    }

    function nextIsLocked() {
        return isChecked('requireSpeech') && speechRecognitionAvailable() &&
               !speechPassed && speechAttempts < MAX_SPEECH_ATTEMPTS;
    }

    function updateNextLock() {
        const btn = document.getElementById('nextBtn');
        if (!btn) return;
        const locked = nextIsLocked();
        btn.style.opacity = locked ? '0.5' : '';
        btn.setAttribute('aria-disabled', locked ? 'true' : 'false');
    }

    function registerSpeechAttempt(ok) {
        if (ok) speechPassed = true; else speechAttempts++;
        updateNextLock();
    }

    function resetSpeechRequirement() {
        speechPassed = false;
        speechAttempts = 0;
        updateNextLock();
    }

    function tryNextQuestion() {
        if (nextIsLocked()) {
            const box = document.getElementById('speechResultBox');
            box.className = 'speech-result-box info';
            box.innerText = ex().requireMsg;
            scrollToSpeechBlock();
            return;
        }
        nextQuestion();
    }

    // Озвучивание результата распознавания речи:
    // верно -> «Правильно»; неверно -> «Неправильно, вы произнесли» + распознанное слово.
    // На Android сразу после распознавания движок синтеза часто молчит (микрофон/аудиофокус
    // ещё заняты), поэтому фраза запоминается и произносится, когда распознавание
    // полностью завершилось (onend) или по запасному таймеру; при неудаче - повтор.
    // Под результатом выводится строка состояния озвучивания (для диагностики).
    let pendingSpeechFeedback = null;
    let feedbackToken = 0;

    function setFeedbackStatus(msg) {
        console.log('[feedback]', msg);
    }

    function speakSpeechFeedback(isCorrect, recognizedWord) {
        if (!('speechSynthesis' in window)) {
            setFeedbackStatus('⚠ TTS не поддерживается');
            return;
        }
        const phrases = {
            ru: { ok: 'Правильно', bad: 'Неправильно, вы произнесли' },
            uk: { ok: 'Правильно', bad: 'Неправильно, ви вимовили' },
            en: { ok: 'Correct', bad: 'Incorrect, you said' }
        };
        const p = phrases[currentLang] || phrases.ru;
        pendingSpeechFeedback = isCorrect ? p.ok : (p.bad + ' ' + recognizedWord);
        const token = ++feedbackToken;
        setFeedbackStatus('🔊 ожидание озвучивания…');
        // Освобождаем микрофон сразу, чтобы движок синтеза не конфликтовал с ним.
        try { if (recognition) recognition.stop(); } catch (e) {}
        // Запасной вариант, если onend не сработает.
        setTimeout(() => { if (token === feedbackToken) flushSpeechFeedback(); }, 1500);
    }

    function flushSpeechFeedback() {
        const text = pendingSpeechFeedback;
        if (!text) return;
        pendingSpeechFeedback = null;
        const synth = window.speechSynthesis;

        const attempt = (triesLeft) => {
            let started = false;
            try {
                synth.cancel();
                synth.resume();
                const u = makeUtterance(text, 1);
                u.volume = 1;
                u.onstart = () => { started = true; setFeedbackStatus('🔊 звучит'); };
                u.onend = () => { started = true; setFeedbackStatus('🔊 озвучено'); };
                u.onerror = (ev) => { setFeedbackStatus('⚠ ошибка TTS: ' + (ev && ev.error ? ev.error : '?')); };
                setTimeout(() => synth.speak(u), 100);
            } catch (e) {
                console.warn('Feedback speech failed:', e);
                setFeedbackStatus('⚠ исключение TTS: ' + e.message);
            }
            // Если речь не началась - пробуем ещё раз.
            setTimeout(() => {
                if (started) return;
                if (triesLeft > 0) {
                    setFeedbackStatus('🔊 повтор… (голосов: ' + synth.getVoices().length + ')');
                    attempt(triesLeft - 1);
                } else {
                    setFeedbackStatus('⚠ речь не запустилась (голосов: ' + synth.getVoices().length + ')');
                }
            }, 1500);
        };
        setTimeout(() => attempt(2), 800);
    }

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            const box = document.getElementById('speechResultBox');
            box.className = 'speech-result-box info';
            box.innerText = "Speech Recognition API is not supported in this browser.";
            return;
        }

        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            isRecording = true;
            const btn = document.getElementById('recordBtn');
            btn.classList.add('recording');
            btn.innerText = i18n[currentLang].recordBtnStop;
        };

        recognition.onend = () => {
            isRecording = false;
            flushSpeechFeedback();
            const btn = document.getElementById('recordBtn');
            btn.classList.remove('recording');
            btn.innerText = i18n[currentLang].recordBtnStart;
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.trim().toLowerCase();
            const targetClean = targetWordClean.toLowerCase();
            const box = document.getElementById('speechResultBox');
            const t = i18n[currentLang];

            const isCorrect = isSpeechMatch(transcript, targetClean, isChecked('strictSpeech'));

            recordResult('speech', targetClean, transcript, isCorrect);
            registerSpeechAttempt(isCorrect);

            if (isCorrect) {
                box.className = 'speech-result-box correct';
                box.innerText = t.speechYouSaid + `"${transcript}". ` + t.speechCorrect;
                speakSpeechFeedback(true, transcript);
                scrollToNextButton();
            } else {
                box.className = 'speech-result-box incorrect';
                box.innerText = t.speechYouSaid + `"${transcript}". ` + t.speechIncorrect;
                box.insertAdjacentHTML('beforeend', buildDiffHtml(targetClean, transcript));
                showOwnPanel();
                speakSpeechFeedback(false, transcript);
            }
        };

        recognition.onerror = (event) => {
            console.warn("Speech recognition error:", event.error);
            if (event.error !== 'aborted') registerSpeechAttempt(false);
            isRecording = false;
            const btn = document.getElementById('recordBtn');
            btn.classList.remove('recording');
            btn.innerText = i18n[currentLang].recordBtnStart;
        };
    }

    function toggleRecording() {
        if (!recognition) {
            initSpeechRecognition();
        }
        if (!recognition) return;

        if (isRecording) {
            recognition.stop();
        } else {
            if (currentLang === 'uk') recognition.lang = 'uk-UA';
            else if (currentLang === 'ru') recognition.lang = 'ru-RU';
            else recognition.lang = 'en-US';

            resetOwnVoicePanel();
            recognition.start();
        }
    }

    function toggleTimerFeature() {
        const enabled = document.getElementById('timerEnabled').checked;
        const settingsGroup = document.getElementById('timerSettingsGroup');
        const statusRow = document.querySelector('.timer-status-row');

        if (enabled) {
            settingsGroup.style.display = 'flex';
            statusRow.style.display = 'flex';
            startTimer();
        } else {
            settingsGroup.style.display = 'none';
            statusRow.style.display = 'none';
            stopTimer();
        }
        saveSettings();
    }

    function updateTimerSettings() {
        saveSettings();
        resetTimer();
    }

    function resetTimer() {
        stopTimer();
        timerMode = 'play';
        const playMins = parseInt(document.getElementById('playMinutes').value, 10) || 5;
        timerSecondsLeft = playMins * 60;
        updateTimerDisplayUI();
        if (document.getElementById('timerEnabled').checked) {
            startTimer();
        }
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        isTimerRunning = true;
        isTimerPaused = false;
        updateTimerPauseBtnUI();

        timerInterval = setInterval(() => {
            if (isTimerPaused) return;

            timerSecondsLeft--;
            if (timerSecondsLeft <= 0) {
                switchTimerMode();
            }
            updateTimerDisplayUI();
        }, 1000);
    }

    function stopTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = null;
        isTimerRunning = false;
    }

    function toggleTimerPause() {
        isTimerPaused = !isTimerPaused;
        updateTimerPauseBtnUI();
    }

    function updateTimerPauseBtnUI() {
        const btn = document.getElementById('timerPauseBtn');
        const t = i18n[currentLang];
        btn.innerText = isTimerPaused ? t.timerResume : t.timerPause;
    }

    function switchTimerMode() {
        const playMins = parseInt(document.getElementById('playMinutes').value, 10) || 5;
        const restMins = parseInt(document.getElementById('restMinutes').value, 10) || 10;

        if (timerMode === 'play') {
            timerMode = 'rest';
            timerSecondsLeft = restMins * 60;
            showRestOverlay(true);
        } else {
            timerMode = 'play';
            timerSecondsLeft = playMins * 60;
            showRestOverlay(false);
        }
    }

    function skipRest() {
        const playMins = parseInt(document.getElementById('playMinutes').value, 10) || 5;
        timerMode = 'play';
        timerSecondsLeft = playMins * 60;
        showRestOverlay(false);
        updateTimerDisplayUI();
    }

    function showRestOverlay(show) {
        const overlay = document.getElementById('restOverlay');
        const container = document.querySelector('.container');
        if (show) {
            overlay.classList.remove('hidden');
            container.classList.add('resting-blocked');
        } else {
            overlay.classList.add('hidden');
            container.classList.remove('resting-blocked');
        }
    }

    function updateTimerDisplayUI() {
        const display = document.getElementById('timerDisplay');
        const overlayLeft = document.getElementById('restTimeLeft');
        const t = i18n[currentLang];

        const mins = Math.floor(timerSecondsLeft / 60).toString().padStart(2, '0');
        const secs = (timerSecondsLeft % 60).toString().padStart(2, '0');
        const timeStr = `${mins}:${secs}`;

        if (timerMode === 'play') {
            display.innerText = t.timerPlayPrefix + timeStr;
            display.classList.remove('resting');
        } else {
            display.innerText = t.timerRestPrefix + timeStr;
            display.classList.add('resting');
            if (overlayLeft) overlayLeft.innerText = timeStr;
        }
    }

    function saveSettings() {
        localStorage.setItem('app_lang', currentLang);
        const theme = document.documentElement.getAttribute('data-theme') || 'dark';
        localStorage.setItem('app_theme', theme);
        localStorage.setItem('app_options_count', optionsCount);
        localStorage.setItem('app_voice', document.getElementById('voiceSelect').value);
        localStorage.setItem('app_rate', document.getElementById('rateRange').value);
        localStorage.setItem('app_timer_enabled', document.getElementById('timerEnabled').checked);
        localStorage.setItem('app_play_mins', document.getElementById('playMinutes').value);
        localStorage.setItem('app_rest_mins', document.getElementById('restMinutes').value);
        localStorage.setItem('app_category', document.getElementById('categorySelect').value);
        localStorage.setItem('app_gentle', document.getElementById('gentleMode').checked);
        localStorage.setItem('app_emoji', document.getElementById('emojiEnabled').checked);
        localStorage.setItem('app_autospeak', document.getElementById('autoSpeak').checked);
        localStorage.setItem('app_mode_choice', document.getElementById('modeChoice').checked);
        localStorage.setItem('app_mode_spell', document.getElementById('modeSpell').checked);
        localStorage.setItem('app_spell_syll_hint', document.getElementById('spellSyllableHint').checked);
        localStorage.setItem('app_strict_speech', document.getElementById('strictSpeech').checked);
        localStorage.setItem('app_require_speech', document.getElementById('requireSpeech').checked);
        updateNextLock();
    }

    function loadSettings() {
        const savedTheme = localStorage.getItem('app_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        const savedOptionsCount = localStorage.getItem('app_options_count');
        if (savedOptionsCount) {
            optionsCount = parseInt(savedOptionsCount, 10);
            document.getElementById('optionsCountSelect').value = optionsCount;
        }

        const savedRate = localStorage.getItem('app_rate');
        if (savedRate) {
            document.getElementById('rateRange').value = savedRate;
            updateRateLabel(savedRate);
        }

        const savedTimerEnabled = localStorage.getItem('app_timer_enabled');
        if (savedTimerEnabled !== null) {
            document.getElementById('timerEnabled').checked = (savedTimerEnabled === 'true');
        }

        const savedPlayMins = localStorage.getItem('app_play_mins');
        if (savedPlayMins) document.getElementById('playMinutes').value = savedPlayMins;

        const savedRestMins = localStorage.getItem('app_rest_mins');
        if (savedRestMins) document.getElementById('restMinutes').value = savedRestMins;

        [['app_gentle', 'gentleMode'], ['app_emoji', 'emojiEnabled'], ['app_autospeak', 'autoSpeak'], ['app_mode_choice', 'modeChoice'], ['app_mode_spell', 'modeSpell'], ['app_spell_syll_hint', 'spellSyllableHint'], ['app_strict_speech', 'strictSpeech'], ['app_require_speech', 'requireSpeech']].forEach(([key, id]) => {
            const v = localStorage.getItem(key);
            if (v !== null) document.getElementById(id).checked = (v === 'true');
        });
        applyAssistSettings();
        applyModeSettings();
    }

    // Пере-синхронізація мови/словника з localStorage при поверненні до
    // сторінки. На смартфонах повторне «відкриття» гри часто є не повним
    // перезавантаженням, а відновленням замороженої вкладки (bfcache) або
    // поверненням із фону — window.onload при цьому вдруге не спрацьовує,
    // і сторінка може показувати застарілий стан, що не відповідає тому,
    // що реально збережено в налаштуваннях.
    function resyncLanguageAndUI() {
        const storedLang = localStorage.getItem('app_lang');
        if (storedLang && ['uk', 'ru', 'en'].includes(storedLang) && storedLang !== currentLang) {
            currentLang = storedLang;
            updateI18nUI();
            initCategorySelect();
            nextQuestion();
        }
    }

    window.addEventListener('pageshow', (event) => {
        if (event.persisted) {
            resyncLanguageAndUI();
        }
    });

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            resyncLanguageAndUI();
        }
    });

    window.onload = async () => {
        // Запитуємо стійке (persistent) сховище, щоб зменшити ризик того,
        // що мобільна ОС/браузер очистить localStorage із налаштуваннями
        // мови/голосу при нестачі місця чи довгій відсутності активності.
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist().catch(() => {});
        }

        loadSettings();
        updateI18nUI();
        initCategorySelect();

        const savedCategory = localStorage.getItem('app_category');
        if (savedCategory) {
            const select = document.getElementById('categorySelect');
            if (Array.from(select.options).some(o => o.value === savedCategory)) {
                select.value = savedCategory;
            }
        }

        toggleTimerFeature();
        nextQuestion();
        showScreen('select');
        refreshModeTexts();
    };

    // Оффлайн: регистрация service worker (нужен HTTPS или localhost).
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
    }
</script>
