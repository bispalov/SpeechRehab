<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Знову слова · Words Again</title>
    <link rel="manifest" href="/SpeechRehab/manifest.json">
    <meta name="theme-color" content="#141923">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --label-color: #555555;
            --input-bg: #ffffff;
            --input-border: #cccccc;
            --word-box-bg: #e9ecef;
            --option-btn-bg: #ffffff;
            --option-btn-text: #007bff;
            --option-btn-border: #007bff;
            --option-btn-hover: #e7f1ff;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --label-color: #aaaaaa;
            --input-bg: #2d2d2d;
            --input-border: #444444;
            --word-box-bg: #2a2a2a;
            --option-btn-bg: #2d2d2d;
            --option-btn-text: #4da3ff;
            --option-btn-border: #4da3ff;
            --option-btn-hover: #384756;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px var(--shadow);
            text-align: center;
            box-sizing: border-box;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        h1 {
            color: var(--text-color);
            font-size: 18px;
            margin: 0;
            text-align: left;
            flex-grow: 1;
        }
        /* Шапка в стиле «Говоримо разом»: синяя полоса на всю ширину карточки,
           название сверху, ниже ряд крупных кнопок со значками (подписи — на широком экране) */
        .app-header {
            /* всегда на экране: остальное содержимое прокручивается под шапкой */
            position: sticky;
            top: 0;
            z-index: 100;
            align-self: stretch;
            margin: -15px -15px 15px;
            padding: 6px 10px;
            background: #1e3a8a;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            text-align: left;
        }
        /* компактная шапка: название слева, кнопки справа в одной строке */
        .app-header-in { max-width: 600px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
        .app-title {
            flex: 1 1 auto;
            min-width: 0;
            margin: 0;
            padding: 0 4px;
            font-size: clamp(18px, 5.6vw, 24px);
            white-space: nowrap;
            overflow: hidden;
            font-weight: 800;
            line-height: 1.15;
            text-align: left;
            color: #ffffff;
        }
        .hrow { display: flex; gap: 6px; flex: 0 0 auto; }
        .app-header .hb {
            flex: 0 0 auto;
            width: 46px;
            height: 44px;
            min-width: 0;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 12px;
            background: #ffffff26;
            color: #ffffff;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
        }
        .app-header .hb:hover { background: #ffffff3d; }
        .app-header .hb:focus-visible { outline: 4px solid #f2b705; outline-offset: 2px; }
        .app-header .lbl { display: none; }
        .app-header .hb-timer { flex: 0 0 auto; height: 44px; margin: 0; padding: 0 8px; border: 0; border-radius: 12px; background: #ffffff26; color: #ffffff; font-size: 16px; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; cursor: pointer; width: auto; }
        .app-header .hb-timer.paused { background: #f2b70566; }   /* подписи — только в подсказке и aria-label */
        @media (max-width: 400px) {
            .app-header { padding: 6px 8px; }
            .app-header-in { gap: 6px; }
            .hrow { gap: 4px; }
            .app-header .hb { width: 40px; height: 42px; font-size: 20px; border-radius: 10px; }
            .app-header .hb-timer { height: 42px; padding: 0 6px; font-size: 14px; }
        }

        .controls {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .settings-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: var(--word-box-bg);
            padding: 15px;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .settings-panel.hidden {
            display: none;
        }
        .control-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        label {
            font-weight: bold;
            color: var(--label-color);
            font-size: 14px;
            margin-bottom: 4px;
        }
        select, input[type="range"], button {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            width: 100%;
            box-sizing: border-box;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .slider-container span {
            font-weight: bold;
            color: var(--text-color);
            min-width: 45px;
        }
        .card {
            margin: 15px 0;
            padding: 20px;
            background-color: var(--word-box-bg);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: background-color 0.3s;
        }
        .speak-main-btn {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            padding: 15px;
        }
        .speak-main-btn:hover {
            background-color: #218838;
        }
        .record-btn {
            background-color: #17a2b8;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            padding: 10px;
        }
        .record-btn.recording {
            background-color: #dc3545;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        .speech-result-box {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            box-sizing: border-box;
            margin-top: 5px;
            display: none;
            word-break: break-word;
        }
        .speech-result-box.correct {
            display: block;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .speech-result-box.incorrect {
            display: block;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .speech-result-box.info {
            display: block;
            background-color: #e2e3e5;
            color: #383d41;
            border: 1px solid #d6d8db;
        }
        .extra-panel {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border-radius: 6px;
            background: var(--word-box-bg);
            color: var(--text-color);
            font-size: 14px;
            margin-top: 5px;
        }
        .extra-panel.hidden { display: none; }
        mark.diff-bad {
            background: #ffd54f;
            color: #000;
            border-radius: 3px;
            padding: 0 2px;
        }
        .diff-row { margin-top: 6px; font-weight: bold; letter-spacing: 1px; }
        .stats-table { width: 100%; border-collapse: collapse; margin: 4px 0 8px; }
        .stats-table td { padding: 3px 4px; border-bottom: 1px solid var(--input-border); }
        .stats-tabs { margin: 0 0 8px; }
        .stats-tabs > button { font-size: 0.85em; min-height: 40px; }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: 15px;
        }
        .option-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .option-btn {
            flex-grow: 1;
            background-color: var(--option-btn-bg);
            border: 2px solid var(--option-btn-border);
            color: var(--option-btn-text);
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            padding: 12px;
            text-align: center;
        }
        .option-btn:hover {
            background-color: var(--option-btn-hover);
        }
        .option-btn.correct {
            background-color: #28a745 !important;
            color: white !important;
            border-color: #28a745 !important;
        }
        .option-btn.wrong {
            background-color: #dc3545 !important;
            color: white !important;
            border-color: #dc3545 !important;
        }
        .audio-btn {
            width: 50px;
            flex-shrink: 0;
            background-color: #17a2b8;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .audio-btn:hover {
            background-color: #138496;
        }
        .next-btn {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
        .stats-row {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }
        .stat-box {
            flex: 1;
            background-color: var(--word-box-bg);
            border-radius: 8px;
            padding: 10px;
            font-weight: bold;
            font-size: 15px;
        }
        .stat-box.correct-stat {
            color: #28a745;
        }
        .stat-box.total-stat {
            color: var(--option-btn-text);
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: var(--label-color);
            font-size: 14px;
            cursor: pointer;
        }
        .checkbox-label input[type="checkbox"] {
            width: auto;
            padding: 0;
        }
        .timer-inputs {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .timer-inputs > div {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .timer-inputs label {
            margin-bottom: 2px;
            font-size: 12px;
        }
        .timer-status-row {
            display: flex;
            gap: 10px;
            width: 100%;
            align-items: center;
        }
        .timer-display {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            background-color: var(--word-box-bg);
            font-weight: bold;
            text-align: center;
            font-size: 15px;
            transition: background-color 0.3s, color 0.3s;
        }
        .timer-display.resting {
            background-color: #ffc107;
            color: #333333;
        }
        .timer-pause-btn {
            width: auto;
            flex-shrink: 0;
            background-color: var(--option-btn-bg);
            color: var(--option-btn-text);
            border: 2px solid var(--option-btn-border);
            font-weight: bold;
            padding: 10px 14px;
        }
        .container.resting-blocked {
            pointer-events: none;
            opacity: 0.5;
        }
        .help-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 900;
            padding: 16px;
            box-sizing: border-box;
        }
        .help-overlay.hidden { display: none; }
        .screen { width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
        .screen.hidden { display: none; }
        .mode-card {
            text-align: left;
            background: var(--option-btn-bg);
            color: var(--text-color);
            border: 1px solid var(--option-btn-border);
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            font-size: 1em;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .mode-title { font-weight: bold; font-size: 1.1em; }
        .mode-desc { opacity: 0.8; font-size: 0.9em; }
        .step-title { font-weight: bold; font-size: 1.15em; text-align: center; }
        .step-progress { text-align: center; opacity: 0.75; font-size: 0.9em; }
        .step-box {
            background: var(--word-box-bg);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .step-note { text-align: center; font-size: 0.9em; opacity: 0.8; min-height: 1.2em; }
        .primary-btn {
            background: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1.05em;
            font-weight: bold;
            cursor: pointer;
        }
        .primary-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .letter-slots, .letter-tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .letter-tile {
            box-sizing: border-box;
            padding: 0 8px;
            min-width: 46px;
            height: 50px;
            font-size: 1.3em;
            border-radius: 8px;
            border: 1px solid var(--option-btn-border);
            background: var(--option-btn-bg);
            color: var(--text-color);
            cursor: pointer;
        }
        .letter-tile.used { opacity: 0.2; pointer-events: none; }
        .letter-slot {
            box-sizing: border-box;
            min-width: 46px;
            height: 50px;
            border: 2px dashed var(--input-border);
            border-radius: 8px;
            display: inline-block;
        }
        .result-row { padding: 8px 0; border-bottom: 1px solid var(--input-border); }
        .result-row .res-label { font-size: 0.85em; opacity: 0.75; }
        .res-ok { color: #2e9e4f; font-weight: bold; }
        .res-bad { color: #d9534f; font-weight: bold; }
        .quiz-row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--input-border); }
        #dictOverlay { z-index: 910; }
        .sg { border: 2px solid var(--input-border); border-radius: 10px; overflow: hidden; }
        .sg-h { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; text-align: left; font-weight: bold; font-size: 1.05em; border: 0; border-radius: 0; background: var(--card-bg); color: var(--text-color); cursor: pointer; }
        .sg.open .sg-h { background: var(--option-btn-hover); }

        /* Резервная копия данных */
        .bk-note { margin: 0 0 8px; font-size: 0.95em; line-height: 1.35; }
        .bk-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .bk-row > button { flex: 1 1 0; width: auto; min-width: min-content; min-height: 44px; }
        .bk-status { margin-top: 6px; font-size: 0.95em; min-height: 1.2em; }
        /* Плашка «Открыто внутри Facebook / другого приложения» — над шапкой, не закреплена */
        .iab-bar { align-self: stretch; margin: -15px -15px 0; padding: 8px 10px; background: #fde68a; color: #1f2937; font-size: 15px; line-height: 1.3; border-bottom: 2px solid #d97706; }
        .iab-bar ~ .app-header { margin-top: 0; }
        .iab-in { max-width: 600px; margin: 0 auto; }
        .iab-top { display: flex; align-items: flex-start; gap: 8px; }
        .iab-msg { flex: 1 1 auto; min-width: 0; font-weight: 700; padding-top: 4px; }
        .iab-bar button { font-size: 15px; border-radius: 8px; cursor: pointer; }
        .iab-x { flex: 0 0 auto; width: 44px; min-height: 44px; padding: 0; margin: 0; background: transparent; color: #1f2937; border: 2px solid #b45309; }
        .iab-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
        .iab-row > button { flex: 1 1 0; width: auto; min-width: min-content; min-height: 44px; margin: 0; padding: 6px 10px; background: #1e3a8a; color: #fff; border: 0; font-weight: 700; }
        .iab-hint { margin-top: 6px; font-weight: 700; }
        .app-ver { text-align: center; font-size: 0.9em; opacity: 0.75; padding: 4px 0 2px; }
        .sg-arr { flex: 0 0 auto; width: 1.2em; font-size: 0.9em; }
        .sg-b { display: none; flex-direction: column; gap: 12px; padding: 12px 10px; }
        .sg.open .sg-b { display: flex; }
        .help-body .settings-panel {
            background: transparent;
            padding: 8px 0 0;
            margin: 0;
        }
        .help-panel {
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 12px;
            width: 100%;
            max-width: 560px;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }
        .help-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--input-border);
        }
        .help-head h2 { margin: 0; font-size: 1.2em; }
        .help-close {
            width: auto;
            flex: 0 0 auto;
            margin: 0;
            background: var(--word-box-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 1.1em;
            padding: 4px 12px;
            cursor: pointer;
        }
        .help-body {
            padding: 6px 16px 16px;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            font-size: 0.95em;
            line-height: 1.45;
        }
        .help-body h3 { margin: 14px 0 4px; font-size: 1.02em; }
        .help-body code { background: var(--word-box-bg); padding: 1px 5px; border-radius: 4px; }
        .dict-row { display: flex; gap: 8px; align-items: center; }
        .dict-input {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 10px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 1em;
            margin: 4px 0;
        }
        .dict-alts { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
        .dict-chip {
            background: var(--word-box-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
            border-radius: 14px;
            padding: 3px 10px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .dict-status { min-height: 1.3em; margin-top: 6px; font-weight: bold; }
        .dict-list { max-height: 180px; overflow-y: auto; border: 1px solid var(--input-border); border-radius: 8px; }
        .dict-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 8px; border-bottom: 1px solid var(--input-border); }
        .dict-item:last-child { border-bottom: none; }
        .dict-item button { background: none; border: none; cursor: pointer; font-size: 1.1em; color: var(--text-color); }
        .dict-empty { padding: 8px; opacity: 0.7; }
        .help-body p { margin: 4px 0; }
        .help-body ul { margin: 4px 0; padding-left: 20px; }
        .help-body li { margin: 3px 0; }
        .rest-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }
        .rest-overlay.hidden {
            display: none;
        }
        .rest-overlay-content {
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        .rest-overlay-content .rest-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .rest-overlay-content h2 {
            margin: 0 0 10px 0;
            color: var(--text-color);
        }
        .rest-overlay-content p {
            font-size: 18px;
            margin: 10px 0 20px 0;
        }
        .rest-overlay-content button {
            background-color: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .spell-builder-card {
            margin-top: 15px;
            padding: 15px;
            background-color: var(--word-box-bg);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .spell-builder-card.hidden {
            display: none;
        }
        .letters-pool, .letters-target {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            min-height: 45px;
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
        }
        .letters-target {
            border: 2px dashed var(--option-btn-border);
            border-radius: 8px;
            background: var(--card-bg);
        }
        .letter-tile {
            background-color: var(--option-btn-bg);
            border: 2px solid var(--option-btn-border);
            color: var(--option-btn-text);
            font-weight: bold;
            font-size: 22px;
            min-width: 46px;
            height: 50px;
            padding: 0 8px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }
        .syllable-display {
            font-size: 20px;
            font-weight: bold;
            color: #28a745;

    function getDefaultLanguage() {
        const savedLang = localStorage.getItem('app_lang');
        if (savedLang && ['uk', 'ru', 'en'].includes(savedLang)) {
            return savedLang;
        }
        const sysLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
        if (sysLang.startsWith('uk')) {
            return 'uk';
        } else if (sysLang.startsWith('ru')) {
            return 'ru';
        } else {

    // Базовые словари из файлов dict-*.js; к ним добавляются слова из extra-dict.json и «Мои слова».
    function baseDictionaryFor(lang) {
        if (lang === 'uk') return dictionaryUk;
        if (lang === 'ru') return dictionaryRu;
        return dictionaryEn;
    }

    function basePairsFor(lang) {
        if (lang === 'uk') return realWordPairsUk;
        if (lang === 'ru') return realWordPairsRu;
        return realWordPairsEn;
    }

    function getActiveDictionary() {
        return getMergedDictionary(currentLang);
    }

    function getActiveRealWordPairs() {
        return getMergedPairs(currentLang);
    }

    let targetWordSyllables = "";
    let targetWordClean = "";

    let totalCount = 0;

    let isAnswered = false;

    let isRecording = false;

    let timerSecondsLeft = 300;

    let voiceListRetryTimer = null;
    let speechWarmedUp = false;

    // На Android голоса (`speechSynthesis.getVoices()`) часто не
    // загружаются вовсе, пока движок TTS не будет «разбужен» реальным
    // вызовом speak() после жеста пользователя, а событие onvoiceschanged
    // может вообще ни разу не сработать. Поэтому при первом же клике/тапе
    // по странице делаем один беззвучный вызов speak(), который на
    // большинстве Android-браузеров запускает движок и заставляет его
    // отдать полный список голосов (включая мужские и женские) при
    // последующих вызовах getVoices().
    function warmupSpeechSynthesis() {
        if (speechWarmedUp) return;
        if (!('speechSynthesis' in window)) return;
        speechWarmedUp = true;

        try {
            const warm = new SpeechSynthesisUtterance(' ');
            warm.volume = 0;
            window.speechSynthesis.speak(warm);
            window.speechSynthesis.cancel();
        } catch (e) {
            console.warn('Speech warmup failed:', e);
        }

        // Список голосов на Android нередко заполняется с задержкой уже
        // после «пробуждения» движка, поэтому пробуем перечитать его
        // несколько раз в течение нескольких секунд.
        [300, 800, 1500, 3000, 5000].forEach(delay => {
            setTimeout(() => populateVoiceList(), delay);
        });
    }

    document.addEventListener('click', warmupSpeechSynthesis, { once: true, passive: true });
    document.addEventListener('touchstart', warmupSpeechSynthesis, { once: true, passive: true });

    // Эвристическое определение пола голоса по его имени. Единого
    // стандарта тут нет: разные производители (Google, Samsung, Microsoft,
    // eSpeak и др.) называют голоса по-разному, поэтому распознаём как
    // явные слова ("Male"/"Female", "мужской"/"женский" и т.п.), так и
    // самые распространённые собственные имена голосов.
    function detectVoiceGender(voice) {
        const name = (voice.name || '').toLowerCase();

        const femaleMarkers = [
            'female', 'женск', 'жіноч', '#female', 'x-female',
            'zira', 'susan', 'samantha', 'victoria', 'karen', 'moira',
            'tessa', 'fiona', 'anna', 'elena', 'milena', 'catherine',
            'salli', 'joanna', 'kimberly', 'ivy', 'kendra', 'olga',
            'milena', 'ekaterina', 'irina', 'oksana', 'lesya', 'natalia'
        ];
        const maleMarkers = [
            'male', 'мужск', 'чоловіч', '#male', 'x-male',
            'david', 'mark', 'daniel', 'george', 'fred', 'alex',
            'yuri', 'pavel', 'dmitri', 'dmytro', 'matthew', 'joey',
            'justin', 'ravi', 'oleg', 'ostap', 'mykyta'
        ];

        if (femaleMarkers.some(m => name.includes(m))) return 'female';
        if (maleMarkers.some(m => name.includes(m))) return 'male';
        return null;
    }

    // Приоритет голосов: локальные (работают без интернета) важнее сетевых.
    // У сетевых голосов Chrome/Android localService === false; если поле не
    // определено, голос считаем локальным.
    const isLocalVoice = v => v.localService !== false;

    // Локальные голоса — вперёд, порядок внутри групп сохраняется.
    function sortVoicesLocalFirst(list) {
        return list
            .map((v, i) => ({ v, i }))
            .sort((a, b) => (isLocalVoice(b.v) - isLocalVoice(a.v)) || (a.i - b.i))
            .map(x => x.v);
    }

    // Выбирает голос для озвучки: выбранный в списке; если он сетевой, а
    // интернета нет — локальный голос того же языка (по возможности того же
    // пола); если выбранного нет — лучший локальный голос текущего языка.
    function pickVoice(voices) {
        const langOf = x => x.lang.toLowerCase().replace('_', '-');
        const forLang = sortVoicesLocalFirst(voices.filter(x => langOf(x).startsWith(currentLang)));
        const uri = document.getElementById('voiceSelect').value;
        let v = voices.find(x => x.voiceURI === uri);

        if (v && !isLocalVoice(v) && navigator.onLine === false) {
            const local = forLang.filter(isLocalVoice);
            if (local.length > 0) {
                const gender = detectVoiceGender(v);
                v = (gender && local.find(x => detectVoiceGender(x) === gender)) || local[0];
            }
        }
        if (!v) v = forLang[0];
        return v || null;
    }

    function populateVoiceList(attemptsLeft) {
        if (!('speechSynthesis' in window)) return;
        if (attemptsLeft === undefined) attemptsLeft = 30;

        const voiceSelect = document.getElementById('voiceSelect');
        const savedVoiceURI = localStorage.getItem('app_voice');
        const voices = window.speechSynthesis.getVoices();

        // На многих мобильных браузерах (особенно на Android) голоса
        // подгружаются с задержкой, а событие onvoiceschanged не всегда
        // срабатывает. Поэтому вместо того, чтобы полагаться только на
        // это событие, повторяем попытку ещё несколько раз с небольшой
        // паузой (в сумме до ~9 секунд).
        if (voices.length === 0 && attemptsLeft > 0) {
            clearTimeout(voiceListRetryTimer);
            voiceListRetryTimer = setTimeout(() => populateVoiceList(attemptsLeft - 1), 300);
            return;
        }

        const previousValue = voiceSelect.value;
        voiceSelect.innerHTML = '';

        let langVoices = voices.filter(v => {
            const vLang = v.lang.toLowerCase().replace('_', '-');
            return vLang.startsWith(currentLang);
        });

        if (langVoices.length === 0) {
            langVoices = voices;
        }
        langVoices = sortVoicesLocalFirst(langVoices);

        if (langVoices.length === 0) {
            const opt = document.createElement('option');
            opt.value = "";
            opt.innerText = ex().defVoice;
            voiceSelect.appendChild(opt);
            return;
        }

        const t = i18n[currentLang];
        const genderLabels = {
            female: t.voiceGenderFemale,
            male: t.voiceGenderMale,
            other: t.voiceGenderOther
        };

        const groups = { female: [], male: [], other: [] };
        langVoices.forEach(v => {
            const gender = detectVoiceGender(v) || 'other';
            groups[gender].push(v);
        });

        // Группируем по полу (Женские / Мужские / Другие) только тогда,
        // когда удалось определить хотя бы один мужской или женский голос
        // — иначе просто выводим плоский список, как раньше.
        const hasGenderInfo = groups.female.length > 0 || groups.male.length > 0;

        const appendOption = (container, v) => {
            const opt = document.createElement('option');
            opt.value = v.voiceURI;
            opt.innerText = `${v.name} (${v.lang})` + (isLocalVoice(v) ? '' : ' ☁');
            container.appendChild(opt);
        };

        if (hasGenderInfo) {
            ['female', 'male', 'other'].forEach(gender => {
                if (groups[gender].length === 0) return;
                const optgroup = document.createElement('optgroup');
                optgroup.label = genderLabels[gender];
                groups[gender].forEach(v => appendOption(optgroup, v));
                voiceSelect.appendChild(optgroup);
            });
        } else {
            langVoices.forEach(v => appendOption(voiceSelect, v));
        }

        if (savedVoiceURI && Array.from(voiceSelect.options).some(o => o.value === savedVoiceURI)) {
            voiceSelect.value = savedVoiceURI;
        } else if (previousValue && Array.from(voiceSelect.options).some(o => o.value === previousValue)) {
            voiceSelect.value = previousValue;
        } else {
            voiceSelect.value = langVoices[0].voiceURI;
        }
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
            populateVoiceList();

    // Подпись кнопки шапки: значок остаётся отдельно, текст — в подписи (видна на широком экране) и в подсказке/aria-label
    function setHeaderLabel(id, full) {

    // Название — всегда в одну строку: обычный размер, а если не помещается по ширине — уменьшаем
    function fitAppTitle() {
        const el = document.getElementById('appTitle');
        if (!el) return;
        const box = el.parentElement;
        // уменьшаем шрифт, если название не помещается; возвращает получившийся размер
        const fit = () => {
            el.style.fontSize = '';
            const w = el.clientWidth, cur = parseFloat(getComputedStyle(el).fontSize);
            if (w > 0 && el.scrollWidth > w) {
                let f = Math.max(10, Math.floor(cur * w / el.scrollWidth * 10) / 10 - 0.5);
                el.style.fontSize = f + 'px';
                for (let i = 0; i < 12 && f > 10 && el.scrollWidth > el.clientWidth; i++) { f -= 0.5; el.style.fontSize = f + 'px'; }
                return f;
            }
            return w > 0 ? cur : 0;
        };
        box.classList.remove('hdr2');
        // На узком экране (крупный системный шрифт) название рядом с кнопками стало бы слишком мелким:
        // тогда шапка в две строки — название сверху на всю ширину, таймер и кнопки под ним
        if (fit() < 16) { box.classList.add('hdr2'); fit(); }
    }

    let settCur = 'main';

    function updateRateLabel(val) {

    }

    function initCategorySelect() {
        const select = document.getElementById('categorySelect');
        const currentVal = select.value;
        select.innerHTML = '';

        const t = i18n[currentLang];
        const dict = getActiveDictionary();

        const optAll = document.createElement('option');
        optAll.value = "ALL";
        optAll.innerText = t.allCategories;
        select.appendChild(optAll);

        Object.keys(dict).forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat;
            opt.innerText = cat;
            select.appendChild(opt);
        });

        if (currentVal && Array.from(select.options).some(o => o.value === currentVal)) {
            select.value = currentVal;
        } else {
            select.value = "ALL";
        }
    }

    function changeCategory() {
        saveSettings();
        nextQuestion();
    }

    function onOptionsCountChange() {
        optionsCount = parseInt(document.getElementById('optionsCountSelect').value, 10);
        saveSettings();
        nextQuestion();
    }

    function cleanWord(word) {
        return word.replace(/-/g, '').trim();
    }

    function getAllWordsFromDictionary() {
        const dict = getActiveDictionary();
        let list = [];
        Object.values(dict).forEach(arr => {
            list = list.concat(arr);
        });
        return list;
    }

    function getWordsFromCurrentCategory() {
        const cat = document.getElementById('categorySelect').value;
        const dict = getActiveDictionary();
        if (cat === "ALL" || !dict[cat]) {
            return getAllWordsFromDictionary();
        }
        return dict[cat];
    }

    function getRandomWord() {
        const pool = getWordsFromCurrentCategory();
        const problemWord = pickProblemWord(pool);
        if (problemWord && problemWord !== targetWordSyllables) return problemWord;
        const randIndex = Math.floor(Math.random() * pool.length);
        return pool[randIndex];
    }

    function generateOptions(targetSyllables) {
        const targetClean = cleanWord(targetSyllables);
        const options = [targetSyllables];
        const allPool = getAllWordsFromDictionary();
        const activePairs = getActiveRealWordPairs();

        if (activePairs[targetClean]) {
            const pairs = activePairs[targetClean];
            const shuffledPairs = [...pairs].sort(() => 0.5 - Math.random());
            for (let w of shuffledPairs) {
                if (options.length >= optionsCount) break;
                if (!options.some(o => cleanWord(o).toLowerCase() === cleanWord(w).toLowerCase())) {
                    options.push(w);
                }
            }
        }

        let attempts = 0;
        while (options.length < optionsCount && attempts < 100) {
            attempts++;
            const randomSyllables = allPool[Math.floor(Math.random() * allPool.length)];
            const randomClean = cleanWord(randomSyllables);
            
            if (!options.some(o => cleanWord(o).toLowerCase() === randomClean.toLowerCase())) {
                options.push(randomSyllables);
            }
        }

        return options.sort(() => 0.5 - Math.random());
    }

    // Индекс ключей таблицы ударений без пробелов: блок со слогами убирает
    // пробелы из слова, поэтому многословные записи ("thank you",
    // "будь ласка") иначе не находились.
    const accentKeyIndex = {};

    function getPhoneticRepresentation(wordClean) {
        const key = wordClean.toLowerCase();
        const custom = getCustomAccent(key);
        if (custom) return custom;
        const table = accentFixes[currentLang];
        if (!table) return null;
        if (table[key]) return table[key];

        if (!accentKeyIndex[currentLang]) {
            const idx = {};
            Object.keys(table).forEach(k => { idx[k.replace(/\s+/g, '')] = k; });
            accentKeyIndex[currentLang] = idx;
        }
        const realKey = accentKeyIndex[currentLang][key.replace(/\s+/g, '')];
        return realKey ? table[realKey] : null;
    }

    Object.keys(emojiData).forEach(l => {
        wordEmoji[l] = {};
        emojiData[l].split(';').forEach(pair => {
            const i = pair.indexOf('=');
            if (i > 0) wordEmoji[l][pair.slice(0, i).trim()] = pair.slice(i + 1).trim();
        });
    });

    function isChecked(id) {
        const el = document.getElementById(id);
        return !!(el && el.checked);
    }

    function getWordEmoji(word) {
        if (!isChecked('emojiEnabled')) return '';
        const table = wordEmoji[currentLang] || {};
        return table[cleanWord(word).toLowerCase()] || '';
    }

    function applyAssistSettings() {
        document.body.classList.toggle('gentle-mode', isChecked('gentleMode'));
    }

    // Блоки игры: «выбор озвученного слова» и «сбор слова из букв».
    // Можно включить любой из них или оба; отключить оба нельзя —
    // последний включённый блок блокируется (disabled).
    function applyModeSettings() {
        const choiceEl = document.getElementById('modeChoice');
        const spellEl = document.getElementById('modeSpell');
        if (!choiceEl.checked && !spellEl.checked) choiceEl.checked = true;

        choiceEl.disabled = choiceEl.checked && !spellEl.checked;
        spellEl.disabled = spellEl.checked && !choiceEl.checked;

        const showChoice = choiceEl.checked;
        document.getElementById('labelInstruction').style.display = showChoice ? '' : 'none';
        document.getElementById('optionsContainer').style.display = showChoice ? '' : 'none';
        if (!spellEl.checked) document.getElementById('spellBuilderCard').classList.add('hidden');

        // Слог-подсказка настраивается только в режиме «только буквы»;
        // при включённом блоке выбора слова переключатель неактивен.
        const hintEl = document.getElementById('spellSyllableHint');
        hintEl.disabled = showChoice;
        hintEl.closest('.control-group').style.opacity = showChoice ? '0.5' : '';
    }

    function onModeSettingChange() {
        applyModeSettings();
        saveSettings();
        nextQuestion();
    }

    function onAssistSettingChange() {
        applyAssistSettings();
        saveSettings();
        // Перерисовать варианты, чтобы эмодзи сразу появились/исчезли.
        if (targetWordSyllables && !isAnswered) {
            const cur = Array.from(document.querySelectorAll('.option-row .option-btn')).map(b => b.innerText);
            const words = getAllWordsFromDictionary();
            const restored = cur.map(txt => words.find(w => cleanWord(w).toLowerCase() === txt.toLowerCase()) || txt);
            renderOptions(restored);
        }
    }

    // Общая настройка голоса/скорости для дополнительных фраз (слоги).
    function makeUtterance(text, rateMul) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = currentLang === 'uk' ? 'uk-UA' : (currentLang === 'ru' ? 'ru-RU' : 'en-US');
        const baseRate = parseFloat(document.getElementById('rateRange').value) || 0.7;
        u.rate = Math.max(0.3, Math.min(2, baseRate * (rateMul || 1)));
        const voices = window.speechSynthesis.getVoices();
        if (voices.length > 0) {
            const v = pickVoice(voices);
            if (v) u.voice = v;
        }
        return u;
    }

    let syllableSpeechToken = 0;

    // Произносит слово по слогам с паузами, затем целиком. На Android событие
    // onend срабатывает не всегда, поэтому есть запасной таймер.
    function speakSyllables(syllableWord) {
        if (screenName === 'select') return;   // на стартовом экране слова не произносятся
        if (micBusy()) return;                 // во время распознавания не говорим, чтобы микрофон не услышал озвучку
        if (!('speechSynthesis' in window) || !syllableWord) return;
        warmupSpeechSynthesis();
        window.speechSynthesis.cancel();
        const token = ++syllableSpeechToken;

        const parts = syllableWord.split('-').map(x => x.trim()).filter(Boolean);
        const clean = cleanWord(syllableWord);
        const whole = getPhoneticRepresentation(clean) || clean;
        const queue = parts.map(x => ({ text: x.toLowerCase(), mul: 0.8, pause: 350 }));
        queue.push({ text: whole, mul: 0.9, pause: 0 });

        const next = (i) => {
            if (token !== syllableSpeechToken || i >= queue.length) return;
            const item = queue[i];
            const u = makeUtterance(item.text, item.mul);
            let done = false;
            const go = () => {
                if (done) return;
                done = true;
                setTimeout(() => next(i + 1), item.pause);
            };
            u.onend = go;
            u.onerror = go;
            window.speechSynthesis.speak(u);
            setTimeout(go, Math.max(1200, item.text.length * 450));
        };
        next(0);
    }

    let hintLevel = 0;

    function resetHint() {
        hintLevel = 0;
        const box = document.getElementById('hintBox');
        if (box) { box.style.display = 'none'; box.innerHTML = ''; }
        document.querySelectorAll('.option-btn.hint-glow').forEach(b => b.classList.remove('hint-glow'));
    }

    // Подсказки по нарастающей: 1) первый слог, 2) слово по слогам, 3) правильный вариант.
    function showHint() {
        if (micBusy()) return;
        if (!targetWordSyllables) return;
        const t = i18n[currentLang];
        const box = document.getElementById('hintBox');
        const parts = targetWordSyllables.split('-');
        hintLevel = Math.min(hintLevel + 1, 3);
        box.style.display = 'block';

        if (hintLevel === 1) {
            box.innerText = t.hintStarts + parts[0] + '…';
            warmupSpeechSynthesis();
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(makeUtterance(parts[0].toLowerCase(), 0.8));
        } else if (hintLevel === 2) {
            box.innerHTML = t.hintSyllables + formatWordWithAccents(parts.join(' • '));
            speakSyllables(targetWordSyllables);
        } else {
            box.innerText = isChecked('modeChoice') ? t.hintAnswer : cleanWord(targetWordSyllables);
            const targetClean = cleanWord(targetWordSyllables).toLowerCase();
            document.querySelectorAll('.option-btn').forEach(b => {
                if (b.innerText.toLowerCase() === targetClean) b.classList.add('hint-glow');
            });
            speakWord(targetWordSyllables);
        }
    }

    function showFeedback(kind) {
        const el = document.getElementById('feedbackMsg');
        const t = i18n[currentLang];
        if (kind === 'praise') {
            const list = t.praiseMsgs;
            el.innerText = list[Math.floor(Math.random() * list.length)];
        } else {
            el.innerText = t.retryMsg;
        }
        el.className = 'feedback-msg ' + kind;
    }

    function clearFeedback() {
        const el = document.getElementById('feedbackMsg');
        if (el) { el.className = 'feedback-msg'; el.innerText = ''; }
    }

    function vibrateShort(ms) {
        try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
    }

    function updateStatsUI() {
        document.getElementById('correctCount').innerText = correctCount;
        document.getElementById('totalCount').innerText = totalCount;
    }

    // Мягкий режим: без красных «ошибок». Неверный вариант просто гаснет,
    // слово озвучивается снова, пока человек не найдёт правильный ответ.
    // Автопрокрутка: после правильного ответа подводит экран к кнопке
    // «Следующее слово», а при переходе к новому слову возвращает к карточке
    // с заданием. Прокрутка сделана вручную (через requestAnimationFrame), а
    // не через scroll-behavior: 'smooth' — в установленных на Android
    // PWA-приложениях встроенная плавная прокрутка иногда обрывается или не
    // срабатывает. Целевая позиция пересчитывается на каждом кадре, поэтому
    // сдвиги вёрстки (эмодзи, плитки букв) ей не мешают. Если человек сам
    // коснулся экрана или покрутил колесо мыши, автопрокрутка уступает.
    let autoScrollTimer = null;
    let autoScrollRaf = null;

    function currentScrollY() {
        return window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    }

    function visibleViewportHeight() {
        const vv = window.visualViewport;
        const h = Math.min(window.innerHeight || Infinity, (vv && vv.height) ? vv.height : Infinity);
        return isFinite(h) ? h : document.documentElement.clientHeight;
    }

    function cancelAutoScroll() {
        clearTimeout(autoScrollTimer);
        autoScrollTimer = null;
        if (autoScrollRaf) {
            cancelAnimationFrame(autoScrollRaf);
            autoScrollRaf = null;
        }
    }

    ['touchstart', 'wheel', 'keydown', 'mousedown'].forEach(evt => {
        window.addEventListener(evt, cancelAutoScroll, { passive: true });
    });

    function animateScrollTo(getTarget, duration) {
        if (autoScrollRaf) cancelAnimationFrame(autoScrollRaf);
        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const total = reduce ? 0 : duration;
        const startY = currentScrollY();
        const t0 = performance.now();

        const step = (now) => {
            const target = getTarget();
            if (target === null) { autoScrollRaf = null; return; }
            const p = total === 0 ? 1 : Math.min(1, (now - t0) / total);
            const eased = 1 - Math.pow(1 - p, 3);
            window.scrollTo(0, startY + (target - startY) * eased);
            autoScrollRaf = (p < 1) ? requestAnimationFrame(step) : null;
        };
        autoScrollRaf = requestAnimationFrame(step);
    }

    function nextButtonTarget() {
        const btn = document.getElementById('nextBtn');
        if (!btn) return null;
        const bottom = btn.getBoundingClientRect().bottom;
        return Math.max(0, currentScrollY() + bottom - visibleViewportHeight() + 16);
    }

    function scrollToNextButton() {
        cancelAutoScroll();
        autoScrollTimer = setTimeout(() => {
            const t = nextButtonTarget();
            if (t !== null && t > currentScrollY() + 2) animateScrollTo(nextButtonTarget, 450);
            // Проверка: если что-то помешало (вёрстка ещё менялась), пробуем один раз ещё.
            autoScrollTimer = setTimeout(() => {
                const t2 = nextButtonTarget();
                if (t2 !== null && t2 > currentScrollY() + 6) animateScrollTo(nextButtonTarget, 300);
            }, 900);
        }, 350);
    }

    // Цель прокрутки: чтобы блок сбора слова из букв был виден целиком (если он помещается).
    function spellCardTarget() {
        const card = document.getElementById('spellBuilderCard');
        if (!card || card.classList.contains('hidden')) return null;
        const r = card.getBoundingClientRect();
        const vh = visibleViewportHeight();
        if (r.height + 24 > vh) return Math.max(0, currentScrollY() + r.top - 8);
        return Math.max(0, currentScrollY() + r.bottom - vh + 16);
    }

    function scrollToSpellCard() {
        cancelAutoScroll();
        autoScrollTimer = setTimeout(() => {
            const t = spellCardTarget();
            if (t !== null && t > currentScrollY() + 2) animateScrollTo(spellCardTarget, 450);
            autoScrollTimer = setTimeout(() => {
                const t2 = spellCardTarget();
                if (t2 !== null && t2 > currentScrollY() + 6) animateScrollTo(spellCardTarget, 300);
            }, 900);
        }, 350);
    }

    // Прокрутка к блоку «Проговорить и проверить себя» (кнопка и поле результата), если он не виден целиком.
    function scrollToSpeechBlock() {
        cancelAutoScroll();
        autoScrollTimer = setTimeout(() => {
            const btn = document.getElementById('recordBtn');
            const box = document.getElementById('speechResultBox');
            if (!btn || !box) return;
            const top = btn.getBoundingClientRect().top;
            const bottom = box.getBoundingClientRect().bottom;
            if (top >= 0 && bottom <= visibleViewportHeight()) return;
            const target = Math.max(0, currentScrollY() + top - 12);
            if (Math.abs(target - currentScrollY()) > 2) animateScrollTo(() => target, 400);
        }, 60);
    }

    function taskCardTarget() {
        const card = document.querySelector('.card');
        if (!card) return null;
        return Math.max(0, currentScrollY() + card.getBoundingClientRect().top - 8);
    }

    function scrollToTaskCard() {
        cancelAutoScroll();
        const t = taskCardTarget();
        // Только вверх: при первом запуске страницы ничего не двигаем.
        if (t !== null && currentScrollY() > t + 2) animateScrollTo(taskCardTarget, 350);
    }

    function checkAnswerGentle(selectedSyllables, btnElement) {
        const selectedClean = cleanWord(selectedSyllables).toLowerCase();
        const targetClean = cleanWord(targetWordSyllables).toLowerCase();

        if (selectedClean === targetClean) {
            isAnswered = true;
            totalCount++;
            correctCount++;
            recordResult('choice', targetClean, '', true);
            btnElement.classList.add('correct');
            btnElement.classList.remove('hint-glow');
            showFeedback('praise');
            vibrateShort(60);
            updateStatsUI();
            setupSpellBuilder(targetWordSyllables);
            scrollToNextButton();
        } else {
            recordResult('choice', targetClean, selectedClean, false);
            btnElement.classList.add('eliminated');
            btnElement.disabled = true;
            showFeedback('retry');
            speakWord(targetWordSyllables);
        }
    }

    function speakWord(syllableWord) {
        if (screenName === 'select') return;   // на стартовом экране слова не произносятся
        if (micBusy()) return;                 // во время распознавания не говорим, чтобы микрофон не услышал озвучку
        if (!('speechSynthesis' in window)) {
            alert(ex().ttsNo);
            return;
        }

        warmupSpeechSynthesis();
        window.speechSynthesis.cancel();

        const wordClean = cleanWord(syllableWord);
        const phoneticText = getPhoneticRepresentation(wordClean) || wordClean;
        const utterance = new SpeechSynthesisUtterance(phoneticText);

        if (currentLang === 'uk') utterance.lang = 'uk-UA';
        else if (currentLang === 'ru') utterance.lang = 'ru-RU';
        else utterance.lang = 'en-US';

        const rate = parseFloat(document.getElementById('rateRange').value) || 0.9;
        utterance.rate = rate;

        const voices = window.speechSynthesis.getVoices();

        if (voices.length > 0) {
            const targetVoice = pickVoice(voices);
            if (targetVoice) utterance.voice = targetVoice;
        }

        window.speechSynthesis.speak(utterance);
    }

    function formatWordWithAccents(syllableWord) {
        const wordClean = syllableWord
            .replace(/-/g, '')
            .replace(/\s*•\s*/g, '')
            .replace(/\s+/g, '')
            .trim();

        const phonetic = getPhoneticRepresentation(wordClean);

        if (!phonetic) {
            return syllableWord;
        }

        let accentIdx = -1;
        let letterIdx = 0;

        for (let i = 0; i < phonetic.length; i++) {
            const char = phonetic[i];
            if (char === '\u0301') {
                accentIdx = Math.max(0, letterIdx - 1);
                break;
            }

            if (/[\p{L}\p{N}]/u.test(char)) {
                if (accentIdx === -1 && char === char.toUpperCase() && char.toLowerCase() !== char.toUpperCase()) {
                    accentIdx = letterIdx;
                }
                letterIdx++;
            }
        }

        if (accentIdx === -1) {
            return syllableWord;
        }

        let resultHTML = "";
        let cleanCounter = 0;

        for (let i = 0; i < syllableWord.length; i++) {
            const char = syllableWord[i];
            if (/[\p{L}\p{N}]/u.test(char)) {
                if (cleanCounter === accentIdx) {
                    resultHTML += `<span class="accent-char">${char}</span>`;
                } else {
                    resultHTML += char;
                }
                cleanCounter++;
            } else {
                resultHTML += char;
            }
        }

        return resultHTML;
    }

    function renderOptions(options) {
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';

        options.forEach(optSyllables => {
            const row = document.createElement('div');
            row.className = 'option-row';

            const emoji = getWordEmoji(optSyllables);
            if (emoji) {
                const emojiSpan = document.createElement('span');
                emojiSpan.className = 'opt-emoji';
                emojiSpan.innerText = emoji;
                row.appendChild(emojiSpan);
            }

            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = cleanWord(optSyllables);
            btn.onclick = () => checkAnswer(optSyllables, btn);

            const audioBtn = document.createElement('button');
            audioBtn.className = 'audio-btn';
            audioBtn.innerHTML = '🔊';
            audioBtn.title = ex().listenOpt;
            audioBtn.setAttribute('aria-label', ex().listenOpt);
            audioBtn.onclick = (e) => {
                e.stopPropagation();
                speakWord(optSyllables);
            };

            row.appendChild(btn);
            row.appendChild(audioBtn);
            container.appendChild(row);
        });
    }

    function checkAnswer(selectedSyllables, btnElement) {
        if (isAnswered) return;
        if (isChecked('gentleMode')) {
            checkAnswerGentle(selectedSyllables, btnElement);
            return;
        }
        isAnswered = true;

        totalCount++;
        const selectedClean = cleanWord(selectedSyllables).toLowerCase();
        const targetClean = cleanWord(targetWordSyllables).toLowerCase();

        if (selectedClean === targetClean) {
            correctCount++;
            recordResult('choice', targetClean, '', true);
            btnElement.classList.add('correct');
            scrollToNextButton();
        } else {
            recordResult('choice', targetClean, selectedClean, false);
            btnElement.classList.add('wrong');
            const rows = document.querySelectorAll('.option-row');
            rows.forEach(r => {
                const b = r.querySelector('.option-btn');
                if (b && b.innerText.toLowerCase() === targetClean) {
                    b.classList.add('correct');
                }
            });
        }

        document.getElementById('correctCount').innerText = correctCount;
        document.getElementById('totalCount').innerText = totalCount;

        setupSpellBuilder(targetWordSyllables);
        if (selectedClean !== targetClean) scrollToSpellCard();
    }

    function setupSpellBuilder(syllableWord) {
        if (!isChecked('modeSpell')) return;
        const card = document.getElementById('spellBuilderCard');
        card.classList.remove('hidden');

        const syllablesArr = syllableWord.split('-');
        const t = i18n[currentLang];
        const formattedSyllables = syllablesArr.join(' • ');
        const syllDisplay = document.getElementById('syllableDisplay');
        syllDisplay.innerHTML = t.syllablePrefix + formatWordWithAccents(formattedSyllables);
        // В режиме «только буквы» слоги можно скрыть до завершения сбора.
        syllDisplay.style.display = (!isChecked('modeChoice') && !isChecked('spellSyllableHint')) ? 'none' : '';
        document.getElementById('wordEmojiBig').innerText = getWordEmoji(syllableWord);

        const clean = cleanWord(syllableWord);
        const letters = clean.split('');
        const shuffledLetters = [...letters].sort(() => 0.5 - Math.random());

        selectedLetters = [];
        renderSpellTiles(shuffledLetters);
    }

    function renderSpellTiles(poolLetters) {
        const poolContainer = document.getElementById('lettersPool');
        const targetContainer = document.getElementById('lettersTarget');

        poolContainer.innerHTML = '';
        targetContainer.innerHTML = '';

        selectedLetters.forEach((char, index) => {
            const tile = document.createElement('div');
            tile.className = 'letter-tile';
            tile.innerText = char;
            tile.onclick = () => {
                const removedChar = selectedLetters.splice(index, 1)[0];
                poolLetters.push(removedChar);
                renderSpellTiles(poolLetters);
            };
            targetContainer.appendChild(tile);
        });

        poolLetters.forEach((char, index) => {
            const tile = document.createElement('div');
            tile.className = 'letter-tile';
            tile.innerText = char;
            tile.onclick = () => {
                selectedLetters.push(char);
                poolLetters.splice(index, 1);
                renderSpellTiles(poolLetters);
                checkSpellResult();
            };
            poolContainer.appendChild(tile);
        });
    }

    function checkSpellResult() {
        const assembled = selectedLetters.join('');
        if (assembled.toLowerCase() === targetWordClean.toLowerCase()) {
            speakWord(targetWordSyllables);
            document.getElementById('syllableDisplay').style.display = '';
            // Если блок выбора слова отключён, засчитываем собранное слово.
            if (!isChecked('modeChoice') && !isAnswered) {
                isAnswered = true;
                totalCount++;
                correctCount++;
                updateStatsUI();
                showFeedback('praise');
                vibrateShort(60);
                scrollToNextButton();
            }
        }
    }

    function nextQuestion() {
        isAnswered = false;
        resetHint();
        clearFeedback();
        document.getElementById('speechResultBox').className = 'speech-result-box';
        document.getElementById('speechResultBox').innerText = '';
        resetOwnVoicePanel();
        resetSpeechRequirement();
        document.getElementById('spellBuilderCard').classList.add('hidden');

        targetWordSyllables = getRandomWord();
        targetWordClean = cleanWord(targetWordSyllables);

        const options = generateOptions(targetWordSyllables);
        renderOptions(options);
        if (!isChecked('modeChoice')) setupSpellBuilder(targetWordSyllables);
        if (screenName === 'full') scrollToTaskCard();

        if (isChecked('autoSpeak') && screenName === 'full') {
            setTimeout(() => {
                if (screenName === 'full') speakWord(targetWordSyllables);
            }, 300);
        }
    }

    // ===== Дополнительные возможности (всё работает офлайн) =====

    function ex() { return extraI18n[currentLang] || extraI18n.ru; }

    function escHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Посимвольное выравнивание (расстояние Левенштейна): какие буквы отличаются.
    function diffChars(a, b) {
        const n = a.length, m = b.length;
        const d = [];
        for (let i = 0; i <= n; i++) { d[i] = new Array(m + 1).fill(0); d[i][0] = i; }
        for (let j = 0; j <= m; j++) d[0][j] = j;
        for (let i = 1; i <= n; i++) {
            for (let j = 1; j <= m; j++) {
                const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
            }
        }
        const ta = [], tb = [];
        let i = n, j = m;
        while (i > 0 || j > 0) {
            if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)) {
                const bad = a[i - 1] !== b[j - 1];
                ta.unshift({ c: a[i - 1], bad });
                tb.unshift({ c: b[j - 1], bad });
                i--; j--;
            } else if (i > 0 && d[i][j] === d[i - 1][j] + 1) {
                ta.unshift({ c: a[i - 1], bad: true });
                i--;
            } else {
                tb.unshift({ c: b[j - 1], bad: true });
                j--;
            }
        }
        return { ta, tb };
    }

    function renderDiffParts(parts) {
        return parts.map(p => p.bad ? '<mark class="diff-bad">' + escHtml(p.c) + '</mark>' : escHtml(p.c)).join('');
    }

        const r = diffChars(target, said);

               '<div class="diff-row">' + escHtml(x.said) + renderDiffParts(r.tb) + '</div>';
    }

    const STATS_KEY = 'app_stats_v1';

    function loadStats() {

    // Статистика по режимам: в каком режиме сейчас человек (полный тренажёр, слух, тест, письмо; перечисления — отдельно)
    const STAT_MODES = { full: 1, listen: 1, quiz: 1, wr: 1 };
    function statDayKey() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function statBucket(L, m) {
        L.modes = L.modes || {};
        return L.modes[m] || (L.modes[m] = { words: {}, conf: {}, days: {} });
    }
    // Попытка за день: n — попыток, k — верно (храним последние 60 дней)
    function statDay(B, ok, fix) {
        B.days = B.days || {};
        const key = statDayKey(), d = B.days[key] || (B.days[key] = { n: 0, k: 0 });
        if (fix) { if (d.k < d.n) d.k++; }
        else { d.n++; if (ok) d.k++; }
        const ks = Object.keys(B.days).sort();
        if (ks.length > 60) ks.slice(0, ks.length - 60).forEach(x => delete B.days[x]);
    }
    // Слова и путаницы: fix — «Я сказал(а) верно»: последняя ошибка становится верным ответом (без новой попытки)
    function statWord(T, tw, said, ok, fix) {
        T.words = T.words || {}; T.conf = T.conf || {};
        const w = T.words[tw] || (T.words[tw] = { ok: 0, bad: 0 });
        if (fix) { if (w.bad > 0) w.bad--; w.ok++; return; }
        if (ok) w.ok++; else w.bad++;
        if (!ok && said) {
            const sd = String(said).toLowerCase().trim().slice(0, 40);
            if (sd && sd !== tw) {
                const k = tw + '>' + sd;
                T.conf[k] = (T.conf[k] || 0) + 1;
                const keys = Object.keys(T.conf);
                if (keys.length > 400) keys.sort((p, q) => T.conf[p] - T.conf[q]).slice(0, 100).forEach(k2 => delete T.conf[k2]);
            }
        }
    }
    function recordResult(kind, target, said, ok) {
        try {
            const tw = (target || '').toLowerCase().trim();
            if (!tw) return;
            const fix = kind === 'fix';
            const s = loadStats();
            if (!s[currentLang]) s[currentLang] = { words: {}, conf: {} };
            const L = s[currentLang];
            statWord(L, tw, said, ok, fix);
            if (STAT_MODES[screenName]) {
                const B = statBucket(L, screenName);
                statWord(B, tw, said, ok, fix);
                statDay(B, ok, fix);
            }
            saveStats(s);
        } catch (e) {}
    }
    // Попытка в «Перечислениях» для статистики по дням
    function recordModeDay(mode, ok, fix) {
        try {
            const s = loadStats();
            if (!s[currentLang]) s[currentLang] = { words: {}, conf: {} };
            statDay(statBucket(s[currentLang], mode), ok, fix);
            saveStats(s);
        } catch (e) {}
    }

    // Иногда (30%) предлагает слово, в котором раньше чаще ошибались.
    function pickProblemWord(pool) {
        try {
            if (Math.random() > 0.3) return null;
            const L = ((loadStats()[currentLang]) || {}).words || {};
            const cands = [];
            let total = 0;
            pool.forEach(item => {
                const w = L[cleanWord(item).toLowerCase()];
                if (w) {
                    const sc = w.bad - 0.5 * w.ok;
                    if (sc > 0) { cands.push([item, sc]); total += sc; }
                }
            });
            if (!cands.length) return null;
            let r = Math.random() * total;
            for (const [item, sc] of cands) {
                r -= sc;
                if (r <= 0) return item;
            }
            return cands[cands.length - 1][0];
        } catch (e) { return null; }
    }

    let statsTab = 'all';

    // Таблица по дням: сегодня и последние 7 дней с занятиями
    function statDaysHtml(days) {
        const x = ex(), ks = Object.keys(days || {}).sort().reverse();

    // Трудные слова и частые путаницы
    function statWordsHtml(T) {
        const x = ex(), words = Object.entries((T && T.words) || {});
        const hard = words.filter(([, v]) => v.bad > 0)
            .sort((p, q) => (q[1].bad - 0.5 * q[1].ok) - (p[1].bad - 0.5 * p[1].ok)).slice(0, 8);
        const conf = Object.entries((T && T.conf) || {}).sort((p, q) => q[1] - p[1]).slice(0, 8);
        let h = '';
        if (!hard.length && !conf.length) return '<p>' + escHtml(x.statsEmpty) + '</p>';
        if (hard.length) {
            h += '<p><b>' + escHtml(x.statsHard) + '</b></p><table class="stats-table">';
            hard.forEach(([k, v]) => { h += '<tr><td>' + escHtml(k) + '</td><td>' + v.bad + ' ' + escHtml(x.statsOf) + ' ' + escHtml(x.statsFrom) + ' ' + (v.ok + v.bad) + '</td></tr>'; });
            h += '</table>';
        }
        if (conf.length) {
            h += '<p><b>' + escHtml(x.statsConf) + '</b></p><table class="stats-table">';
            conf.forEach(([k, n]) => { const p = k.split('>'); h += '<tr><td>' + escHtml(p[0]) + ' → ' + escHtml(p[1] || '') + '</td><td>×' + n + '</td></tr>'; });
            h += '</table>';
        }
        return h;
    }
    // Перечисления: по каждому ряду и направлению
    function statSerHtml() {
        const x = ex(), t = sT(), st = serStats();
        if (ser.loaded !== currentLang) serMyLoad();
        const all = serAll(), dirs = { fwd: t.fwd, rev: t.rev, round: t.round };
        const rows = Object.entries(st).sort((p, q) => (q[1].l || 0) - (p[1].l || 0));
        if (!rows.length) return '';

        rows.forEach(([key, v]) => {
            const i = key.lastIndexOf(':'), sid = key.slice(0, i), d = key.slice(i + 1);
            const sr = all.find(z => z.id === sid);
            const cont = d.endsWith('c'), dd = cont ? d.slice(0, -1) : d;
            const name = (sr ? sr.e + ' ' + sr.name : sid) + ' · ' + (dirs[dd] || dd) + ' · ' + (cont ? t.cont : t.whole);
            h += '<tr><td>' + escHtml(name) + '</td><td>' + v.k + ' ' + escHtml(x.stOk) + ' ' + escHtml(x.statsFrom) + ' ' + v.n + '</td></tr>';
        });
        return h + '</table>';

    function renderStatsPanel() {
        const x = ex();
        const L = (loadStats()[currentLang]) || { words: {}, conf: {} };
        const modes = L.modes || {};
        let h = '<div class="ser-seg stats-tabs">';
        STAT_TABS.forEach(tb => { h += '<button class="' + (statsTab === tb ? 'on' : '') + '" onclick="statsTab=\'' + tb + '\'; renderStatsPanel()">' + escHtml(statTabName(tb)) + '</button>'; });
        h += '</div>';
        if (statsTab === 'all') {
            // все режимы вместе (в том числе «Тест на слух»): дни суммируются
            const days = {};
            Object.values(modes).forEach(B => Object.entries(B.days || {}).forEach(([k, d]) => {
                const t = days[k] || (days[k] = { n: 0, k: 0 }); t.n += d.n; t.k += d.k;
            }));
            const attempts = Object.values(L.words || {}).reduce((n, v) => n + v.ok + v.bad, 0);
            h += '<p>' + escHtml(x.statsAttempts) + attempts + '</p>' + statDaysHtml(days) + statWordsHtml(L);
        } else {
            const B = modes[statsTab];
            const serRows = statsTab === 'ser' ? statSerHtml() : '';
            if (!B && !serRows) h += '<p>' + escHtml(x.stNoMode) + '</p>';
            else {
                if (B) h += statDaysHtml(B.days);
                h += statsTab === 'ser' ? serRows : statWordsHtml(B);
            }
        }
        h += '<div class="assist-row">' +
             '<button class="assist-btn" onclick="exportStatsCsv()">' + escHtml(x.statsExport) + '</button>' +
             '<button class="assist-btn" onclick="resetStats()">' + escHtml(statsTab === 'all' ? x.statsReset : x.stResetMode) + '</button></div>';
        document.getElementById('statsPanel').innerHTML = h;
    }

    function exportStatsCsv() {
        const s = loadStats();
        const q = v => '"' + String(v).replace(/"/g, '""') + '"';
        const rows = [['lang', 'mode', 'type', 'word_or_date', 'said', 'ok', 'errors', 'count'].join(',')];
        const put = (lang, mode, T) => {
            Object.entries(T.words || {}).forEach(([w, v]) => rows.push([q(lang), q(mode), q('word'), q(w), q(''), v.ok, v.bad, ''].join(',')));
            Object.entries(T.conf || {}).forEach(([k, n]) => { const p = k.split('>'); rows.push([q(lang), q(mode), q('confusion'), q(p[0]), q(p[1] || ''), '', '', n].join(',')); });
            Object.entries(T.days || {}).sort().forEach(([d, v]) => rows.push([q(lang), q(mode), q('day'), q(d), q(''), v.k, v.n - v.k, v.n].join(',')));
        };
        Object.keys(s).forEach(lang => {
            const L = s[lang] || {};
            put(lang, 'all', L);
            Object.entries(L.modes || {}).forEach(([m, B]) => put(lang, m, B));
            let st = {};
            try { st = JSON.parse(localStorage.getItem('sr.ser.st.' + lang)) || {}; } catch (e) {}
            Object.entries(st).forEach(([k, v]) => rows.push([q(lang), q('ser'), q('series'), q(k), q(''), v.k, v.n - v.k, v.n].join(',')));
        });
        const blob = new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'trainer-stats.csv';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    // На вкладке «Все» сбрасывается вся статистика, на вкладке режима — только этот режим (текущий язык)

        const x = ex();
        if (statsTab === 'all') {
            if (!confirm(x.statsResetConfirm)) return;
            try { localStorage.removeItem(STATS_KEY); ['ru', 'uk', 'en'].forEach(l => localStorage.removeItem('sr.ser.st.' + l)); } catch (e) {}
        } else {

        }

    // ----- запись и прослушивание своего голоса -----
    // Блок показывается только после неверно произнесённого слова. Запись начинается и
    // останавливается кнопкой внутри блока, поэтому с распознаванием речи она не конфликтует.
    let ownRec = null, ownChunks = [], ownUrl = null;
    let ownTimer = null, ownRecording = false, ownAudio = null, ownSession = 0;

    function setOwnMsg(msg) {
        document.getElementById('ownVoiceMsg').innerText = msg;
    }

    function updateOwnBtn() {
        const x = ex();
        document.getElementById('ownVoiceBtn').innerText = ownRecording ? x.ownStop : x.ownBtn;

        const has = !!ownUrl;
        document.getElementById('ownPlayMineBtn').style.display = has ? '' : 'none';

    function stopOwnRecording() {
        clearTimeout(ownTimer);
        try { if (ownRec && ownRec.state !== 'inactive') ownRec.stop(); } catch (e) {}
    }

    async function toggleOwnRecording() {
        const x = ex();
        if (ownRecording) { stopOwnRecording(); return; }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
            setOwnMsg(x.ownNoSupport);
            return;
        }
        try { if (isRecording && recognition) recognition.stop(); } catch (e) {}
        try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
        try { if (ownAudio) ownAudio.pause(); } catch (e) {}
        let stream;
        try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
            setOwnMsg(x.ownDenied);
            return;
        }
        const sessionId = ++ownSession;
        ownChunks = [];
        const rec = new MediaRecorder(stream);
        ownRec = rec;
        rec.ondataavailable = e => { if (e.data && e.data.size) ownChunks.push(e.data); };
        rec.onstop = () => {
            try { stream.getTracks().forEach(tr => tr.stop()); } catch (e) {}
            if (sessionId !== ownSession) return;
            ownRecording = false;
            updateOwnBtn();
            const blob = new Blob(ownChunks, { type: rec.mimeType || 'audio/webm' });
            if (blob.size < 800) {
                setOwnMsg(ex().ownFail);
                return;
            }
            if (ownUrl) URL.revokeObjectURL(ownUrl);
            ownUrl = URL.createObjectURL(blob);
            updateOwnPlayRow();
            setOwnMsg(ex().ownDone);
        };
        rec.start();
        ownRecording = true;
        setOwnMsg(x.ownRecording);
        updateOwnBtn();
        ownTimer = setTimeout(stopOwnRecording, 10000);
    }

    function playOwnRecording() {
        if (!ownUrl) return;
        try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
        try { if (ownAudio) ownAudio.pause(); } catch (e) {}
        ownAudio = new Audio(ownUrl);
        ownAudio.play().catch(() => {});
    }

    // Сначала эталон, затем запись пользователя.
    function playRefThenOwn() {
        if (!ownUrl) return;
        if (!('speechSynthesis' in window)) { playOwnRecording(); return; }
        warmupSpeechSynthesis();
        window.speechSynthesis.cancel();
        const wordClean = cleanWord(targetWordSyllables);
        const text = getPhoneticRepresentation(wordClean) || wordClean;
        const u = makeUtterance(text, 1);
        let done = false;
        const go = () => {
            if (done) return;
            done = true;
            setTimeout(playOwnRecording, 300);
        };
        u.onend = go;
        u.onerror = go;
